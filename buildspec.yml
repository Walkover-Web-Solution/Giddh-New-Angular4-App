version: 0.2

phases:
  pre_build:
    commands:
      - echo "Node version:" && node --version
      - echo "NPM version:" && npm --version
      - echo "Available memory:" && free -h || echo "Memory info not available"
      - echo "Configuring memory settings for Angular 21 build..."
      - node .codebuild-memory-config.js
      - rm -rf node_modules
      - npm cache clean --force
      - npm install --force
  build:
    commands:
      - echo "Starting build process for branch: $BRANCH"
      - echo "Setting AWS CodePipeline optimized environment variables..."
      - export NODE_OPTIONS="--max-old-space-size=8192"
      - export NG_CLI_ANALYTICS=false
      - export CI=true
      - export AWS_CODEBUILD=true
      - export WEBPACK_PARALLELISM=1
      - echo "AWS CodeBuild environment detected - applying EPIPE error prevention"
      - |
        if [ "${BRANCH}" = "giddh-2.0" ]; then
          echo "For giddh-2.0 branch - Angular 21 EPIPE fix with optimization disabled";
          NODE_ENV=test node --max_old_space_size=8192 scripts/build-env.js test && NODE_OPTIONS="--max-old-space-size=8192" npx ng build web-giddh --configuration=test --output-hashing=all --source-map=false --vendor-chunk=true --named-chunks=true && node scripts/inject-env-vars.js dist/apps/web-giddh/index.html && node tools/web/postbuild --path=dist/apps/web-giddh && npm run rm_bak_files
        elif [ "${BRANCH}" = "beta-stage" ]; then
          echo "For beta-stage branch - Angular 21 EPIPE fix with optimization disabled";
          NODE_ENV=staging node --max_old_space_size=8192 scripts/build-env.js stage && NODE_OPTIONS="--max-old-space-size=8192" npx ng build web-giddh --configuration=stage --output-hashing=all --source-map=false --vendor-chunk=true --named-chunks=true && node scripts/inject-env-vars.js dist/apps/web-giddh/index.html && node tools/web/postbuild --path=dist/apps/web-giddh && npm run rm_bak_files
        elif [ "${BRANCH}" = "production" ]; then
          echo "For production branch - Angular 21 EPIPE fix with optimization disabled";
          NODE_ENV=production node --max_old_space_size=8192 scripts/build-env.js prod && NODE_OPTIONS="--max-old-space-size=8192" npx ng build web-giddh --configuration=prod --output-hashing=all --source-map=false --vendor-chunk=true --named-chunks=true && node scripts/inject-env-vars.js dist/apps/web-giddh/index.html && node tools/web/postbuild --path=dist/apps/web-giddh && npm run rm_bak_files
        fi
  post_build:
    commands:
      - echo "Build process completed successfully."
      - echo "Checking if dist directory exists:"
      - ls -la dist/ || echo "dist directory not found"
      - ls -la dist/apps/ || echo "dist/apps directory not found"
      - ls -la dist/apps/web-giddh/ || echo "dist/apps/web-giddh directory not found"
      - echo "Build artifacts summary:"
      - du -sh dist/apps/web-giddh/ || echo "Could not get directory size"

artifacts:
  base-directory: dist/apps/web-giddh
  files:
    - '**/*'