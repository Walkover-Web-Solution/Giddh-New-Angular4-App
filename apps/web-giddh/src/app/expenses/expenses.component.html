<div
    appTranslate
    [file]="'expenses'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="position-relative overflow-visible">
        <hamburger-menu></hamburger-menu>
        <div class="clear-both petty-cash overflow-visible">
            <mat-tab-group
                mat-stretch-tabs="false"
                animationDuration="0ms"
                [selectedIndex]="selectedTabIndex"
                (selectedTabChange)="tabChanged($event)"
                [disableRipple]="true"
                class="table-header-sticky"
            >
                <mat-tab [label]="localeData?.pending">
                    <ng-container *ngIf="currentSelectedTab === EExpenseTabName.PENDING">
                        <div class="container-fluid mb-3 p-3" *ngIf="!isSelectedRow">
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="d-flex align-items-center column-gap-15">
                                        <div
                                            class="custom-datepicker"
                                            [matMenuTriggerFor]="universalDatepicker"
                                            #universalDatepickerTrigger="matMenuTrigger"
                                            role="button"
                                            aria-haspopup="true"
                                            aria-controls="universalDatepicker"
                                        >
                                            <input
                                                matInput
                                                type="text"
                                                name="selectedDateRange"
                                                [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                                class="giddh-datepicker date-range-picker"
                                                readonly
                                            />
                                        </div>
                                        <button
                                            *ngIf="isFilterSelected"
                                            (click)="clearFilter()"
                                            matButton="outlined"
                                            class="ml-1"
                                        >
                                            <span class="d-inline-flex align-items-center column-gap-05">
                                                <span class="icon-cross font-size-12"></span>
                                                <span>{{ commonLocaleData?.app_clear_filter }}</span>
                                            </span>
                                        </button>
                                        <mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
                                            <ng-template matMenuContent>
                                                <app-datepicker-wrapper
                                                    [inputStartDate]="selectedDateRange?.startDate"
                                                    [inputEndDate]="selectedDateRange?.endDate"
                                                    [alwaysShowCalendars]="true"
                                                    [ranges]="datePickerOptions"
                                                    [selectedRangeLabel]="selectedRangeLabel"
                                                    [showCustomRangeLabel]="true"
                                                    [showClearButton]="false"
                                                    [showCancel]="true"
                                                    [linkedCalendars]="true"
                                                    [showDropdowns]="true"
                                                    (rangeClicked)="dateSelectedCallback($event)"
                                                    (datesUpdated)="dateSelectedCallback($event)"
                                                    (closeCalender)="toggleGiddhDatepicker(false)"
                                                    [keepCalendarOpeningWithRange]="false"
                                                    [showRangeLabelOnInput]="false"
                                                ></app-datepicker-wrapper>
                                            </ng-template>
                                        </mat-menu>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="expense-head">
                            <div *ngIf="currentSelectedTab === EExpenseTabName.PENDING">
                                <app-pending-list
                                    #pendingListComponent
                                    *ngIf="!isSelectedRow"
                                    [isClearFilter]="isClearFilter"
                                    [localeData]="localeData"
                                    [commonLocaleData]="commonLocaleData"
                                    [pettyCashPendingReportResponse]="pettyCashPendingReportResponse"
                                    [isPettyCashPendingReportLoading]="isPettyCashPendingReportLoading"
                                    (isFilteredSelected)="isFilteredSelected($event)"
                                    (selectedRowToggle)="selectedRowToggle($event)"
                                    (selectedRowInput)="selectedRowInput($event)"
                                    (reportDates)="reportDates($event)"
                                    (reloadReportList)="getPettyCashPendingReports($event)"
                                    (reloadRejectReportList)="getPettyCashRejectedReports($event)"
                                ></app-pending-list>
                                <div class="main-edit-expense" *ngIf="isSelectedRow">
                                    <div class="left-expense">
                                        <app-filter-list
                                            *ngIf="localeData?.pending"
                                            [selectedRowItem]="selectedRowItem"
                                            [localeData]="localeData"
                                            [commonLocaleData]="commonLocaleData"
                                            [expensesDetailedItems]="pettyCashPendingReportResponse?.results"
                                            (selectedDetailedRowInput)="selectedDetailedRowInput($event)"
                                        ></app-filter-list>
                                    </div>
                                    <div class="main-expense-details pl-3 pr-3">
                                        <app-expense-details
                                            [selectedRowItem]="selectedRowItem"
                                            [localeData]="localeData"
                                            [commonLocaleData]="commonLocaleData"
                                            (toggleDetailsMode)="closeDetailedMode($event)"
                                            (previewNextItem)="previewNextItem($event)"
                                        ></app-expense-details>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </mat-tab>
                <mat-tab [label]="localeData?.rejected">
                    <div *ngIf="currentSelectedTab === EExpenseTabName.REJECTED">
                        <div class="container-fluid mb-3 p-3">
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="d-flex align-items-center column-gap-15">
                                        <div
                                            class="custom-datepicker"
                                            [matMenuTriggerFor]="universalDatepicker"
                                            #universalDatepickerTrigger="matMenuTrigger"
                                            role="button"
                                            aria-haspopup="true"
                                            aria-controls="universalDatepicker"
                                        >
                                            <input
                                                matInput
                                                type="text"
                                                name="selectedDateRange"
                                                [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                                class="giddh-datepicker date-range-picker"
                                                readonly
                                            />
                                        </div>
                                         <button
                                            *ngIf="isFilterSelected"
                                            (click)="clearFilter()"
                                            matButton="outlined"
                                            class="ml-1"
                                        >
                                            <span class="d-inline-flex align-items-center column-gap-05">
                                                <span class="icon-cross font-size-12"></span>
                                                <span>{{ commonLocaleData?.app_clear_filter }}</span>
                                            </span>
                                        </button>
                                        <!-- Universal Date Picker Menu -->
                                        <mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
                                            <ng-template matMenuContent>
                                                <app-datepicker-wrapper
                                                    [inputStartDate]="selectedDateRange?.startDate"
                                                    [inputEndDate]="selectedDateRange?.endDate"
                                                    [alwaysShowCalendars]="true"
                                                    [ranges]="datePickerOptions"
                                                    [selectedRangeLabel]="selectedRangeLabel"
                                                    [showCustomRangeLabel]="true"
                                                    [showClearButton]="false"
                                                    [showCancel]="true"
                                                    [linkedCalendars]="true"
                                                    [showDropdowns]="true"
                                                    (rangeClicked)="dateSelectedCallback($event)"
                                                    (datesUpdated)="dateSelectedCallback($event)"
                                                    (closeCalender)="toggleGiddhDatepicker(false)"
                                                    [keepCalendarOpeningWithRange]="false"
                                                    [showRangeLabelOnInput]="false"
                                                ></app-datepicker-wrapper>
                                            </ng-template>
                                        </mat-menu>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="expense-head overflow-visible">
                            <div *ngIf="currentSelectedTab === EExpenseTabName.REJECTED">
                                <app-rejected-list
                                    #rejectedListComponent
                                    (isFilteredSelected)="isFilteredSelected($event)"
                                    [isClearFilter]="isClearFilter"
                                    [localeData]="localeData"
                                    [commonLocaleData]="commonLocaleData"
                                    [pettyCashRejectedReportResponse]="pettyCashRejectedReportResponse"
                                    [isPettyCashRejectedReportLoading]="isPettyCashRejectedReportLoading"
                                    (reportDates)="reportDates($event)"
                                    (reloadReportList)="getPettyCashRejectedReports($event)"
                                    (reloadPendingReportList)="getPettyCashPendingReports($event)"
                                ></app-rejected-list>
                            </div>
                        </div>
                    </div>
                </mat-tab>
            </mat-tab-group>
        </div>
    </div>

</div>
