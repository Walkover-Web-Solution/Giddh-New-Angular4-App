<ng-container
    appTranslate
    [file]="'ai-ocr'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <hamburger-menu class="hamburger-menu"></hamburger-menu>
    <giddh-page-loader *ngIf="isLoading"></giddh-page-loader>
    <section class="ai-ocr container-fluid pd-15 d-flex flex-column" [hidden]="isLoading">
        <ng-container *ngIf="listCount === 0; else aiOcr">
            <ng-container *ngTemplateOutlet="fileInputTemplate"></ng-container>
            <div class="initial-screen position-absolute text-center">
                <div class="mb-5">
                    <img src="assets/images/create-discounts.png" alt="upload image" width="500px" height="auto" />
                </div>
                <button mat-raised-button color="primary" (click)="onUploadFile($event, fileInput)">
                    {{ localeData?.upload_button }}
                </button>
            </div>
        </ng-container>
        <ng-template #aiOcr>
            <div class="d-flex justify-content-between">
                <div class="custom-tab">
                    <ng-container *ngTemplateOutlet="fileInputTemplate"></ng-container>
                    <mat-button-toggle-group name="fontStyle" aria-label="Font Style">
                        <mat-button-toggle
                            [checked]="selectedToggle === ocrAction.Upload"
                            class="w125"
                            value="upload"
                            (click)="onUploadFile($event, fileInput)"
                        >
                            <giddh-progress-spinner
                                *ngIf="ocrUploadInProgress$ | async"
                                [diameter]="20"
                            ></giddh-progress-spinner>
                            <span *ngIf="!(ocrUploadInProgress$ | async)">{{ commonLocaleData?.app_upload }}</span>
                        </mat-button-toggle>
                        <mat-button-toggle
                            value="create"
                            (click)="onToggleChange(ocrAction.Create)"
                            [checked]="selectedToggle === ocrAction.Create"
                            [disabled]="buttonDisabled || countVariable === 0"
                        >
                            <span
                                >{{ commonLocaleData?.app_create }} ({{ countVariable }}
                                {{ countVariable > 1 ? localeData?.vouchers : localeData?.voucher }}
                                {{ localeData?.ready }})</span
                            >
                        </mat-button-toggle>
                        <mat-button-toggle
                            class="w125"
                            value="list"
                            [checked]="selectedToggle === ocrAction.List"
                            (click)="onToggleChange(ocrAction.List)"
                        >
                            <span>{{ localeData?.list }} ({{ listCount }})</span>
                        </mat-button-toggle>
                    </mat-button-toggle-group>
                </div>
                <div *ngIf="selectedToggle === ocrAction.Create">
                    <button mat-stroked-button color="primary" (click)="onChangeVoucher('skip')" class="mr-r15">
                        {{ commonLocaleData?.app_skip_and_next }}
                    </button>
                    <button mat-stroked-button color="primary" (click)="onChangeVoucher('save')">
                        {{ commonLocaleData?.app_save_and_next }}
                    </button>
                </div>
            </div>
            <main class="flex-grow-1 overflow-auto main-ocr">
                <ng-container [ngSwitch]="selectedToggle">
                    <ng-container *ngSwitchCase="ocrAction.Create">
                        <giddh-page-loader *ngIf="innerLoading"></giddh-page-loader>
                        <ng-container *ngIf="!innerLoading">
                            <ng-container *ngIf="ocrCurrentToken; else noDataFound">
                                <ai-ocr-create></ai-ocr-create>
                            </ng-container>
                            <ng-template #noDataFound>
                                <div class="no-data-found d-flex flex-column align-items-center justify-content-center">
                                    <h1>{{ localeData?.no_data_found }}</h1>
                                    <img
                                        class="mr-t1"
                                        height="200"
                                        src="{{ imgPath }}no-data.png"
                                        [alt]="localeData?.no_data_found"
                                    />
                                </div>
                            </ng-template>
                        </ng-container>
                    </ng-container>
                    <ng-container *ngSwitchCase="ocrAction.List">
                        <ai-ocr-list></ai-ocr-list>
                    </ng-container>
                </ng-container>
            </main>
        </ng-template>
    </section>
</ng-container>
<ng-template #fileInputTemplate>
    <input
        type="file"
        #fileInput
        accept=".png,.jpg,.jpeg,.zip,.pdf"
        style="display: none"
        (change)="onFileSelected($event)"
    />
</ng-template>
