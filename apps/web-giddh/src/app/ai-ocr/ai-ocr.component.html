<ng-container
    appTranslate
    [file]="'ai-ocr'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <hamburger-menu class="hamburger-menu"></hamburger-menu>
    <giddh-page-loader *ngIf="isLoading"></giddh-page-loader>
    <section class="ai-ocr container-fluid p-3 d-flex flex-column" *ngIf="!isLoading">
        <div class="d-flex justify-content-between">
            <div class="custom-tab d-flex align-items-center">
                <input
                    type="file"
                    #fileInput
                    accept=".png,.jpg,.jpeg,.pdf,.zip"
                    style="display: none"
                    (change)="onFileSelected($event)"
                />
                <button
                    *ngIf="listCount > 0 || showClearFilter"
                    aria-label="show"
                    mat-stroked-button
                    [disabled]="isCompany || isConsolidatedBranch"
                    class="icomoon-ico d-flex align-items-center cursor-pointer"
                    [matTooltip]="commonLocaleData?.app_upload"
                    matTooltipClass="tooltip-black"
                    [matTooltipPosition]="'above'"
                    (click)="onUploadFile($event, fileInput, false)"
                >
                    <giddh-progress-spinner
                        *ngIf="ocrUploadInProgress$ | async"
                        [diameter]="20"
                    ></giddh-progress-spinner>
                    <span *ngIf="!(ocrUploadInProgress$ | async)"> <i class="icon-upload lh-0"></i></span>
                </button>
                <mat-button-toggle-group name="fontStyle" aria-label="Font Style" class="overflow-visible">
                    <mat-button-toggle
                        [disabled]="
                            isCompany ||
                            isConsolidatedBranch ||
                            buttonDisabled ||
                            countVariable === 0 ||
                            voucherApiVersion === 1
                        "
                        value="create"
                        (click)="onToggleChange(ocrAction.Create, true)"
                        [checked]="selectedToggle === ocrAction.Create"
                    >
                        <div matBadge="{{ countVariable }}" matBadgeOverlap="true">
                            {{ commonLocaleData?.app_create }} {{ localeData?.voucher }}
                        </div>
                    </mat-button-toggle>
                    <mat-button-toggle
                        class="w125"
                        value="list"
                        [checked]="selectedToggle === ocrAction.List"
                        (click)="onToggleChange(ocrAction.List, false)"
                    >
                        <span>{{ localeData?.list }}</span>
                    </mat-button-toggle>
                </mat-button-toggle-group>
                <div
                    class="button-wrapper d-flex w-100 ml-2 align-items-baseline"
                    *ngIf="selectedToggle === ocrAction.List"
                >
                    <div class="custom-datepicker-wrapper">
                        <div
                            class="custom-datepicker"
                            [matMenuTriggerFor]="universalDatepicker"
                            #universalDatepickerTrigger="matMenuTrigger"
                            role="button"
                            aria-haspopup="true"
                            aria-controls="universalDatepicker"
                        >
                            <input
                                matInput
                                type="text"
                                name="selectedDateRange"
                                [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                class="giddh-datepicker date-range-picker"
                                readonly
                            />
                        </div>
                        <mat-menu
                            #universalDatepicker="matMenu"
                            class="universal-datepicker-menu-panel"
                            xPosition="after"
                        >
                            <ng-template matMenuContent>
                                <app-datepicker-wrapper
                                    [inputStartDate]="selectedDateRange?.startDate"
                                    [inputEndDate]="selectedDateRange?.endDate"
                                    [alwaysShowCalendars]="true"
                                    [ranges]="datePickerOptions"
                                    [selectedRangeLabel]="selectedRangeLabel"
                                    [showCustomRangeLabel]="true"
                                    [showClearButton]="false"
                                    [showCancel]="true"
                                    [linkedCalendars]="true"
                                    [showDropdowns]="true"
                                    [locale]="{ applyLabel: commonLocaleData?.app_done }"
                                    (rangeClicked)="dateSelectedCallback($event)"
                                    (datesUpdated)="dateSelectedCallback($event)"
                                    (closeCalender)="toggleGiddhDatepicker(false)"
                                    [keepCalendarOpeningWithRange]="false"
                                    [showRangeLabelOnInput]="false"
                                ></app-datepicker-wrapper>
                            </ng-template>
                        </mat-menu>
                    </div>
                    <div *ngIf="isCompany" class="ml-2">
                        <reactive-dropdown-field
                            [label]="commonLocaleData?.app_branch"
                            [options]="branches"
                            (selectedOption)="
                                ocrDocumentsRequestParams.branchUniqueName = $event?.value; selectBranch($event)
                            "
                            (onClear)="ocrDocumentsRequestParams.branchUniqueName = ''; getAllOcrDocuments(false)"
                            [labelValue]="ocrDocumentsRequestParams.branchUniqueName ? branchName : activeCompany?.name"
                            [placeholder]="commonLocaleData?.app_select_branch"
                        ></reactive-dropdown-field>
                    </div>
                    <button
                        *ngIf="showClearFilter"
                        mat-stroked-button
                        class="min-width-160 ml-2"
                        color="primary"
                        (click)="resetData()"
                    >
                        {{ commonLocaleData?.app_clear }}
                    </button>
                </div>
            </div>
            <div *ngIf="selectedToggle === ocrAction.Create">
                <button mat-raised-button color="primary" (click)="onChangeVoucher('skip')" class="mr-3">
                    {{ commonLocaleData?.app_skip_and_next }}
                </button>
                <button mat-raised-button color="primary" (click)="onChangeVoucher('save')">
                    {{ commonLocaleData?.app_save_and_next }}
                </button>
            </div>
        </div>
        <div class="mr-t1 d-flex align-items-center" *ngIf="isCompany">
            <span class="font-size-16 mr-2">{{ localeData?.create_voucher_messgae }} </span>
        </div>
        <main class="flex-grow-1 overflow-auto main-ocr">
            <ng-container [ngSwitch]="selectedToggle">
                <ng-container *ngSwitchCase="ocrAction.Create">
                    <giddh-page-loader *ngIf="innerLoading"></giddh-page-loader>
                    <ng-container *ngIf="!innerLoading">
                        <ng-container *ngIf="ocrCurrentToken; else noDataFound">
                            <ai-ocr-create></ai-ocr-create>
                        </ng-container>
                        <ng-template #noDataFound>
                            <div class="no-data-found d-flex flex-column align-items-center justify-content-center">
                                <h1>{{ localeData?.no_data_found }}</h1>
                                <img
                                    class="mt-2"
                                    height="200"
                                    src="{{ imgPath }}no-data.png"
                                    [alt]="localeData?.no_data_found"
                                />
                            </div>
                        </ng-template>
                    </ng-container>
                </ng-container>
                <ng-container *ngSwitchCase="ocrAction.List">
                    <ng-container *ngIf="listCount === 0 && !showClearFilter">
                        <input
                            type="file"
                            #fileInput
                            accept=".png,.jpg,.jpeg,.pdf,.zip"
                            style="display: none"
                            (change)="onFileSelected($event)"
                        />
                        <div class="initial-screen position-absolute text-center">
                            <div class="mb-2" [ngClass]="{ 'mb-5': !isCompany && !isConsolidatedBranch }">
                                <img src="assets/images/ai-ocr.png" alt="upload image" width="350px" height="auto" />
                            </div>
                            <button
                                mat-raised-button
                                color="primary"
                                (click)="onUploadFile($event, fileInput, true)"
                                *ngIf="!isCompany && !isConsolidatedBranch"
                            >
                                {{ localeData?.upload_button }}
                            </button>
                            <div
                                class="m-t1 d-flex justify-content-center align-items-center"
                                *ngIf="!ocrMainList?.items?.length && (isCompany || isConsolidatedBranch)"
                            >
                                <span class="font-size-24 mr-2">{{ localeData?.go_to_branch_information }} </span>
                                <button mat-raised-button color="primary" (click)="gotToBranchTab()">
                                    {{ localeData?.go_to_branch }}
                                </button>
                            </div>
                        </div>
                    </ng-container>
                    <ng-container *ngIf="listCount > 0 || showClearFilter">
                        <ai-ocr-list></ai-ocr-list>
                    </ng-container>
                </ng-container>
            </ng-container>
        </main>
    </section>
</ng-container>
