<div appTranslate [file]="'ai-ocr'" (commonLocaleData)="commonLocaleData = $event" (localeData)="localeData = $event">
    <hamburger-menu class="hamburger-menu"></hamburger-menu>
    <div class="ocr-container mx-auto p-3 overflow-visible">
        <giddh-page-loader *ngIf="ocrListInProgress$ | async"></giddh-page-loader>
        <section [hidden]="!showData || (ocrListInProgress$ | async)">
            <form
                class="table-responsive table-header-sticky overflow-visible"
                name="ocrDocumentListForm"
                [formGroup]="ocrDocumentListForm"
                novalidate
                autocomplete="off"
            >
                <table
                    mat-table
                    [dataSource]="dataSource"
                    matSort
                    (matSortChange)="sortChange($event)"
                    [matSortDirection]="ocrDocumentsRequestParams.sort"
                    [matSortActive]="ocrDocumentsRequestParams.sortBy"
                    class="giddh-table w-100"
                >
                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ commonLocaleData?.app_date }}</th>
                        <td mat-cell *matCellDef="let element">{{ element?.date }}</td>
                    </ng-container>
                    <ng-container matColumnDef="fileName">
                        <th
                            mat-header-cell
                            *matHeaderCellDef
                            class="td-search-box"
                            #searchFileNameContainer
                            (clickOutside)="handleClickOutside($event, searchFileNameContainer, 'File Name')"
                        >
                            <ng-container
                                *ngTemplateOutlet="
                                    searchTemplate;
                                    context: {
                                        $implicit: showFileName,
                                        fieldName: 'File Name',
                                        formControl: ocrDocumentListForm.controls['fileName'],
                                        title: localeData?.labels?.fileName,
                                    }
                                "
                            ></ng-container>
                        </th>
                        <td class="td-search-box" mat-cell *matCellDef="let element" width="15%">
                            {{ element?.fileName }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="uploadedBy">
                        <th
                            mat-header-cell
                            *matHeaderCellDef
                            class="td-search-box"
                            #searchUploadedByContainer
                            (clickOutside)="handleClickOutside($event, searchUploadedByContainer, 'Uploaded By')"
                        >
                            <ng-container
                                *ngTemplateOutlet="
                                    searchTemplate;
                                    context: {
                                        $implicit: showUploadedBy,
                                        fieldName: 'Uploaded By',
                                        formControl: ocrDocumentListForm.controls['uploadedBy'],
                                        title: localeData?.labels?.uploadedBy,
                                    }
                                "
                            ></ng-container>
                        </th>
                        <td mat-cell *matCellDef="let element">
                            {{ element?.user?.name }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="fileStatus">
                        <th
                            mat-header-cell
                            *matHeaderCellDef
                            class="td-search-box"
                            #searchFileStatusContainer
                            (clickOutside)="handleClickOutside($event, searchFileStatusContainer, 'File Status')"
                        >
                            <ng-container
                                *ngTemplateOutlet="
                                    searchTemplate;
                                    context: {
                                        $implicit: showStatus,
                                        fieldName: 'File Status',
                                        formControl: ocrDocumentListForm.controls['status'],
                                        title: localeData?.labels?.fileStatus,
                                    }
                                "
                            ></ng-container>
                        </th>
                        <td
                            mat-cell
                            *matCellDef="let element"
                            class="position-relative text-left"
                            matTooltipPosition="above"
                            [matTooltip]="element?.status?.toLowerCase() === 'failed' ? element?.files[0]?.error : ''"
                        >
                            <span
                                [ngClass]="{
                                    'text-green': element?.status?.toLowerCase() === 'completed',
                                    'text-danger': element?.status?.toLowerCase() === 'failed',
                                }"
                            >
                                {{ element?.status | uppercase }}
                            </span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="convertedStatus">
                        <th
                            mat-header-cell
                            *matHeaderCellDef
                            class="td-search-box"
                            #searchconvertedStatusContainer
                            (clickOutside)="handleClickOutside($event, searchconvertedStatusContainer, 'Converted Status')"
                        >
                            <ng-container
                                *ngTemplateOutlet="
                                    searchTemplate;
                                    context: {
                                        $implicit: showconvertedStatus,
                                        fieldName: 'Converted Status',
                                        formControl: ocrDocumentListForm.controls['convertedStatus'],
                                        title: localeData?.labels?.convertedStatus,
                                    }
                                "
                            ></ng-container>
                        </th>
                        <td mat-cell *matCellDef="let element" class="position-relative text-left">
                            <span
                                [ngClass]="{
                                    'text-green': element?.convertedStatus?.toLowerCase() === 'completed',
                                    'text-danger': element?.convertedStatus?.toLowerCase() === 'failed',
                                }"
                            >
                                {{ element?.convertedStatus | uppercase }}
                            </span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let element" class="position-relative">
                            <button
                                matIconButton
                                [matMenuTriggerFor]="menu"
                                aria-label="vertical dots"
                                class="action-icon"
                                *ngIf="element?.convertedStatus?.toLowerCase() !== 'completed'"
                            >
                                <span class="icon-dots-three-vertical mr-0 font-size-15 d-block"></span>
                            </button>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item *ngFor="let option of transactionOptions" (click)="selectVoucher(option, element)">
                                    {{ option.label }}
                                </button>
                            </mat-menu>
                        </td>
                    </ng-container>
                    <tr (clickOutside)="inlineSearch = null" mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr class="table-row" mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </form>
        </section>
        <div class="no-data" *ngIf="!(ocrListInProgress$ | async) && dataSource && !dataSource?.filteredData?.length">
            <no-data
                class="mt-3 d-block mb-2"
                *ngIf="
                    showClearFilter ||
                    !dataSource?.filteredData?.length ||
                    ocrDocumentListForm?.controls['user']?.value ||
                    ocrDocumentListForm?.controls['fileName']?.value ||
                    ocrDocumentListForm?.controls['status']?.value ||
                    ocrDocumentListForm?.controls['convertedStatus']?.value
                "
                [primaryMessage]="commonLocaleData?.app_no_data_found"
                [secondaryMessage]="' '"
            ></no-data>
            <div
                *ngIf="
                    isCompany &&
                    !(
                        showClearFilter ||
                        !dataSource?.filteredData?.length ||
                        ocrDocumentListForm?.controls['user']?.value ||
                        ocrDocumentListForm?.controls['fileName']?.value ||
                        ocrDocumentListForm?.controls['status']?.value ||
                        ocrDocumentListForm?.controls['convertedStatus']?.value
                    )
                "
                class="d-flex justify-content-center align-items-center"
            >
                <span class="font-size-24 mr-2">{{ localeData?.go_to_branch_information }}</span>
                <button matButton="filled" (click)="gotToBranchTab()">
                    {{ localeData?.go_to_branch }}
                </button>
            </div>
        </div>
        <mat-paginator
            *ngIf="ocrDocumentsRequestParams.totalItems > pageSizeOptions[0] && showData && !(ocrListInProgress$ | async)"
            (page)="handlePageChange($event)"
            [length]="ocrDocumentsRequestParams.totalItems"
            [pageSize]="ocrDocumentsRequestParams.count"
            [showFirstLastButtons]="true"
            [pageSizeOptions]="pageSizeOptions"
            [hidePageSize]="false"
            [pageIndex]="pageIndex"
            class="mt-3"
        ></mat-paginator>
        <section class="mb-custom-80"></section>
    </div>
</div>
<ng-template #searchTemplate let-show let-title="title" let-fieldName="fieldName" let-formControl="formControl">
    <div class="search-table">
        <div [hidden]="show">
            <span>{{ title }}</span>
            <i class="icon-search" (click)="toggleSearch(fieldName)"></i>
        </div>
        <div class="input-container" [hidden]="!show">
            <text-field
                [type]="'text'"
                [placeholder]="getSearchFieldText(fieldName)"
                [cssClass]="'form-control border'"
                [formControl]="formControl"
                [autoFocus]="show"
            ></text-field>
        </div>
    </div>
</ng-template>
