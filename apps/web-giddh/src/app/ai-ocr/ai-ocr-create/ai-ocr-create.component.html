<div appTranslate [file]="'ai-ocr'" (commonLocaleData)="commonLocaleData = $event" (localeData)="localeData = $event">
    <div class="container-fluid">
        <div class="row mx-0">
            <div class="col-4 pt-4 pb-4 pb-4">
                <giddh-page-loader *ngIf="isFileUploading"></giddh-page-loader>
                <div class="pdf-preview h-100">
                    <div *ngIf="!isFileUploading" class="error danger text-center">
                        <span>{{ localeData?.invoice_preview_unavailable }}</span>
                    </div>
                    <div class="w-100">
                        <img
                            height="100%"
                            width="100%"
                            *ngIf="!isFileUploading && imagePreviewSource"
                            [src]="imagePreviewSource"
                            alt="img"
                        />
                    </div>

                    <iframe
                        *ngIf="!isFileUploading && sanitizedPdfFileUrl"
                        #pdfContainer
                        width="100%"
                        height="100%"
                        [src]="sanitizedPdfFileUrl"
                        title="PDF"
                    ></iframe>
                </div>
            </div>
            <div class="col-8 pt-4 pb-4 pb-4">
                <create></create>
            </div>
        </div>
    </div>
</div>
