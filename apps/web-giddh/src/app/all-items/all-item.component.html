<div
    appTranslate
    [file]="'all-items'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="giddh-all-items-wrapper">
        <hamburger-menu [pageHeading]="localeData?.page_heading"></hamburger-menu>
        <div class="container-fluid pb-5">
            <div class="search-any-item">
                <div class="input-group flex-nowrap">
                    <div class="input-group-prepend">
                        <span
                            class="input-group-text d-inline-flex align-items-center only-left-radius"
                            id="addon-wrapping"
                        >
                            <i class="icon-search theme-foreground-color"></i>
                        </span>
                    </div>
                    <text-field
                        class="width-inherit"
                        [type]="'text'"
                        [cssClass]="'form-control only-right-radius'"
                        [placeholder]="commonLocaleData?.app_search"
                        [attr.aria-label]="commonLocaleData?.app_search"
                        aria-describedby="addon-wrapping"
                        #searchField
                        [(ngModel)]="search"
                        (click)="menuIndex = -1; itemIndex = -1"
                        (ngModelChange)="searchAllItems($event)"
                        [autoFocus]="true"
                    >
                    </text-field>
                </div>
            </div>
            <div class="all-item-block">
                <ng-container *ngFor="let item of filteredItems$ | async; index as filteredMenuIndex">
                    <div class="main-item" *ngIf="item?.items?.length">
                        <p *ngIf="!item?.link" class="mb-4 d-flex align-items-center">
                            <i class="{{ item?.icon }} mr-2"></i> {{ item?.label }}
                        </p>
                        <p
                            *ngIf="item?.link"
                            [routerLink]="[item?.link]"
                            class="cursor-pointer mb-4 d-flex align-items-center"
                        >
                            <i class="{{ item?.icon }} mr-2"></i> {{ item?.label }}
                        </p>
                        <div class="sub-item-block">
                            <div class="row responsive-sub-items">
                                <ng-container *ngFor="let subItem of item?.items; index as subItemIndex">
                                    <mat-card
                                        *ngIf="subItem.link"
                                        class="single-menu-item"
                                        (click)="redirectSubItemLink(subItem)"
                                        [class.active]="menuIndex === filteredMenuIndex && itemIndex === subItemIndex"
                                        [tabindex]="subItemIndex"
                                    >
                                        <mat-card-title>
                                            <p><i class="{{ subItem?.icon }} mr-2"></i> {{ subItem?.label }}</p>
                                        </mat-card-title>
                                        <mat-card-content class="p-0">
                                            <p class="font-size-12">{{ subItem?.description }}</p>
                                        </mat-card-content>
                                    </mat-card>
                                    <mat-card
                                        *ngIf="!subItem.link"
                                        class="single-menu-item"
                                        [class.active]="menuIndex === filteredMenuIndex && itemIndex === subItemIndex"
                                        (click)="handleItemClick(subItem)"
                                    >
                                        <mat-card-title>
                                            <p><i class="{{ subItem?.icon }} mr-2"></i> {{ subItem?.label }}</p>
                                        </mat-card-title>
                                        <mat-card-content class="p-0">
                                            <p class="font-size-12">{{ subItem?.description }}</p>
                                        </mat-card-content>
                                    </mat-card>
                                </ng-container>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</div>
<!--Modal for All Items -->
<ng-template #allItemModal>
    <div (click)="$event.stopPropagation()">
        <div class="dialog-header">
            <span>{{ createNewModalTitle }}</span>
            <button matIconButton aria-label="close" (click)="closeAllDialogs()">
                <i class="icon-cross"></i>
            </button>
        </div>
        <mat-dialog-content class="dialog-body">
            <div class="d-flex">
                <ng-container *ngFor="let item of subMenuItems">
                    <mat-card
                        class="single-item"
                        (click)="redirectSubItemLink(item)"
                        [queryParams]="item?.additional?.queryParams"
                    >
                        <mat-card-title>
                            <h4><i class="{{ item?.icon }} mr-2"></i> {{ item?.label }}</h4>
                        </mat-card-title>
                        <mat-card-content class="p-0">
                            <p>{{ item?.description }}</p>
                        </mat-card-content>
                    </mat-card>
                </ng-container>
            </div>
        </mat-dialog-content>
    </div>
</ng-template>
