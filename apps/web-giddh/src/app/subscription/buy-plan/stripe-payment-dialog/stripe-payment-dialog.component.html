<h2 mat-dialog-title>{{ data.localeData?.payment_details }}</h2>

<div mat-dialog-content>
    <div #stripePaymentElement id="stripe-payment-element" class="mt-2"></div>
    @if (error) {
        <div class="text-red mt-2 font-size-12" role="alert">{{ error }}</div>
    }
</div>

<div mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="null" [disabled]="paymentInProgress">
        {{ data.commonLocaleData?.app_cancel }}
    </button>
    <button matButton="filled" color="primary" class="ml-2" (click)="confirmPayment()" [disabled]="paymentInProgress">
        @if (paymentInProgress) {
            <span>{{ data.localeData?.processing }}</span>
        } @else {
            <span>{{ data.localeData?.pay_now }}</span>
        }
    </button>
</div>
