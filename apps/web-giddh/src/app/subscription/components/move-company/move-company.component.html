<div class="dialog-header">
    <span>{{ localeData?.subscription?.move_company }}</span>
    <button matIconButton aria-label="close" mat-dialog-close>
        <i class="icon-cross"></i>
    </button>
</div>
<div *ngIf="isLoading">
    <giddh-page-loader></giddh-page-loader>
</div>
<mat-dialog-content class="dialog-body">
    <div *ngIf="!isLoading">
        <div id="my-frame" class="modal-body move-company-modal-body clear-both">
            <p class="theme-foreground-color mb-3" [innerHTML]="getMovePlanText()"></p>
            <div class="row mb-3">
                <div class="col-md-12 move-wrapper">
                    <div>
                        <reactive-dropdown-field
                            [label]="localeData?.subscription?.select_plan"
                            [placeholder]="localeData?.subscription?.select_plan"
                            [name]="'availablePlans'"
                            [options]="availablePlansOption"
                            (selectedOption)="selectedPlan = $event.value"
                            [required]="true"
                            (onClear)="onSearchClear()"
                            (dynamicSearchedQuery)="onSearchQueryChange($event)"
                            [enableDynamicSearch]="true"
                        ></reactive-dropdown-field>
                    </div>
                </div>
            </div>
            <div class="clear-both">
                <button
                    matButton="filled"
                    mat-dialog-close
                    (click)="moveCompanyInNewPlan()"
                    [disabled]="!selectedPlan"
                >
                    {{ localeData?.subscription?.move }}
                </button>
            </div>
        </div>
    </div>
</mat-dialog-content>
