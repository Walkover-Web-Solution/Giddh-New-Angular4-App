<ng-container
    appTranslate
    [file]="'subscription'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>

    <div class="dialog-header d-flex align-items-center justify-content-between border-bottom p-3">
        <span>{{ localeData?.request_transfer }}</span>
    </div>
    <mat-dialog-content class="dialog-body w-100">
        <p class="mb-3 theme-foreground-color">
            {{ localeData?.request_transfer_message }}
        </p>
        <form [formGroup]="transferForm" (ngSubmit)="onSubmit()">
            <div class="d-flex column-gap-15">
                <div class="form-group w-50">
                    <input-field
                        [type]="'text'"
                        [name]="'name'"
                        [placeholder]="commonLocaleData?.app_name"
                        [required]="true"
                        formControlName="name"
                        [showError]="isFormSubmitted && !transferForm.get('name')?.value"
                    >
                    </input-field>
                </div>
                <div class="form-group w-50">
                    <input-field
                        [type]="'text'"
                        [name]="'lastname'"
                        [placeholder]="commonLocaleData?.app_last + ' ' + commonLocaleData?.app_name"
                        formControlName="lastName"
                    >
                    </input-field>
                </div>
            </div>
            <div class="form-group">
                <input-field
                    [type]="'text'"
                    [name]="'email'"
                    [placeholder]="commonLocaleData?.app_email_id"
                    [required]="true"
                    formControlName="email"
                    [showError]="isFormSubmitted && !transferForm.get('email')?.value"
                >
                </input-field>
            </div>
            <div class="d-flex column-gap-1 justify-content-end">
                <button mat-raised-button color="primary" (click)="onSubmit()">
                    {{ localeData?.request_transfer }}
                </button>
                    <button mat-stroked-button mat-dialog-close type="button">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</ng-container>
