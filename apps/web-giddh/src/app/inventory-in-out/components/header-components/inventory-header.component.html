<div class="inline pull-right">
    <div >
        <div class="pull-right">
            <div class="btn-group" dropdown>
                <button
                    id="button-basic"
                    dropdownToggle
                    type="button"
                    class="btn btn-default btn-sm dropdown-toggle"
                    aria-controls="dropdown-basic"
                >
                    New <span class="caret"></span>
                </button>
                <ul
                    id="dropdown-basic"
                    *dropdownMenu
                    class="dropdown-menu dropdown-option dropdown-menu-right"
                    role="menu"
                    aria-labelledby="button-basic"
                >
                    <li role="menuitem">
                        <a
                            class="dropdown-item"
                            href="javascript:void(0);"
                            (click)="openGroupStockAsidePaneDialog('inward')"
                            >Inward Note</a
                        >
                    </li>
                    <li role="menuitem">
                        <a
                            class="dropdown-item"
                            href="javascript:void(0);"
                            (click)="openGroupStockAsidePaneDialog('outward')"
                            >Outward Note</a
                        >
                    </li>
                    <li role="menuitem">
                        <a
                            class="dropdown-item"
                            href="javascript:void(0);"
                            (click)="openGroupStockAsidePaneDialog('transfer')"
                            >Transfer Note</a
                        >
                    </li>
                    <li role="menuitem">
                        <a
                            class="dropdown-item"
                            href="javascript:void(0);"
                            (click)="openGroupStockAsidePaneDialog('createStock')"
                            >Create Stock</a
                        >
                    </li>
                    <li role="menuitem">
                        <a
                            class="dropdown-item"
                            href="javascript:void(0);"
                            (click)="openGroupStockAsidePaneDialog('createAccount')"
                            >Create Account</a
                        >
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<ng-template #asideMenuTemplate>
    <aside-menu
        (closeAsideEvent)="asideMenuDialogRef.close()"
        [selectedAsideView]="selectedAsideView"
    ></aside-menu>
</ng-template>
