<div class="form-header">
    <h2 >Transfer Note</h2>
</div>
<div class="form-body white-bg clearfix margin-child-label">
    <div class="clearfix">
        <form [formGroup]="form" class="form-group">
            <div class="row">
                <div class="col-xs-6 form-group">
                    <label>Date <sup>*</sup></label>
                    <giddh-datepicker
                        name="entryDate"
                        formControlName="inventoryEntryDate"
                        [minDate]="today"
                        [appearance]="'outline'"
                        class="form-control"
                    ></giddh-datepicker>
                    <span
                        *ngIf="inventoryEntryDate.invalid && (inventoryEntryDate.dirty || inventoryEntryDate.touched)"
                    >
                        <span
                            *ngIf="inventoryEntryDate?.errors && inventoryEntryDate?.errors['required']"
                            class="text-danger"
                            >Please select Date.</span
                        >
                    </span>
                </div>

                <div class="col-xs-6 form-group">
                    <label>Product Name <sup>*</sup></label>
                    <reactive-dropdown-field
                        [options]="stockListOptions"
                        [placeholder]="'Select Product'"
                        (selectedOption)="stockChanged($event)"
                        formControlName="stock"
                        [required]="true"
                        [name]="'stock'"
                    ></reactive-dropdown-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xs-6 form-group">
                    <label>Sender's Name <sup>*</sup></label>
                    <reactive-dropdown-field
                        [options]="userListOptions"
                        [placeholder]="'Select Sender'"
                        formControlName="inventoryUser"
                        [name]="'inventoryUser'"
                    ></reactive-dropdown-field>
                </div>

                <div class="col-xs-6 form-group">
                    <label>Receiver's Name <sup>*</sup></label>
                    <reactive-dropdown-field
                        [options]="userListOptions"
                        [placeholder]="'Select Receiver'"
                        formControlName="senderReceiver"
                        [required]="true"
                        [name]="'senderReceiver'"
                    >
                    </reactive-dropdown-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xs-6 form-group">
                    <label>Quantity <sup>*</sup></label>
                    <input
                        name="dateRange"
                        type="text"
                        class="form-control"
                        formControlName="quantity"
                        [placeholder]="'Enter Quantity'"
                    />
                </div>

                <div class="col-xs-6 form-group">
                    <label>Unit <sup>*</sup></label>
                    <reactive-dropdown-field
                        [options]="stockUnitsOptions"
                        [placeholder]="'Choose unit'"
                        formControlName="stockUnit"
                        [required]="true"
                        [name]="'stockUnit'"
                    ></reactive-dropdown-field>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8 form-group">
                    <label class="mr-b1">Description</label>
                    <input name="dateRange" formControlName="description" type="text" class="form-control" />
                </div>
            </div>

            <div class="row">
                <div class="col-xs-12 text-left mr-t1">
                    <button mat-stroked-button (click)="onCancel.emit($event)">Cancel</button>
                    <button mat-raised-button color="primary" [ladda]="isLoading" [disabled]="form.invalid" (click)="save()">
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
