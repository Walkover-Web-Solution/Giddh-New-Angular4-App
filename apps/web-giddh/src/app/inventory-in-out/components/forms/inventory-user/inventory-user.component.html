<div class="form-header">
    <p >Create Account</p>
</div>
<div class="form-body white-bg clearfix margin-child-label">
    <div class="clearfix">
        <form [formGroup]="form" autocomplete="off" class="form-group">
            <div class="row">
                <div class="col-6">
                    <label>Name</label>
                    <input type="text" formControlName="name" class="form-control" />
                </div>
            </div>

            <div class="row">
                <div class="col-12 text-left mr-t1">
                    <button mat-stroked-button (click)="onCancel.emit($event)">Cancel</button>
                    <button mat-raised-button color="primary" [ladda]="isLoading" (click)="save()">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>
