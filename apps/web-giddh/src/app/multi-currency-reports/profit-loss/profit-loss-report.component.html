<div appTranslate [file]="'trial-profit-balance/profit-loss'" (localeData)="localeData = $event" (commonLocaleData)="commonLocaleData = $event">
    <filter-multi-currency
        #filter
        (filterValue)="searchData($event)"
        (onPropertyChanged)="filterData()"
        (searchChange)="searchChanged($event)"
        (lastSyncDate)="lastDate($event)"
        (expandAllChange)="expandAllEvent()"
        [(expandAll)]="expandAll"
    ></filter-multi-currency>
    <giddh-page-loader  *ngIf="showLoader | async" [cssClass]="'mt-0 mb-0'"></giddh-page-loader>
    <div *ngIf="data && !(showLoader | async)">
        <profit-loss-report-grid
            #plGrid
            [search]="search"
            (searchChange)="searchChanged($event)"
            [expandAll]="expandAll"
            [plData]="data"
            [cogsData]="cogsData"
            [lastSyncDate]="lastSyncDate"
        ></profit-loss-report-grid>
    </div>
    <div *ngIf="!(showLoader | async) && !data" class="no-data">
        <h2>{{ localeData?.no_data_found }}</h2>
    </div>
</div>
