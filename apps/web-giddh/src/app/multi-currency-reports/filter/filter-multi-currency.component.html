<ng-container
    appTranslate
    [file]="'trial-profit-balance'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="clear-both">
        <div class="row">
            <div class="col-xl-9 col-12">
                <form
                    [formGroup]="filterForm"
                    class="form-inline financial-select-year"
                    name="fromToDateForm"
                    novalidate
                >
                    <div class="d-flex">
                        <div class="form-group relative mr-3 datepicker-field">
                            <div
                                class="custom-datepicker"
                                [matMenuTriggerFor]="universalDatepicker"
                                #universalDatepickerTrigger="matMenuTrigger"
                                role="button"
                                aria-haspopup="true"
                                aria-controls="universalDatepicker"
                            >
                                <input
                                    matInput
                                    type="text"
                                    name="selectedDateRange"
                                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                    class="giddh-datepicker date-range-picker"
                                    readonly
                                />
                            </div>
                        </div>
                        <div class="form-group mr-3">
                            <mat-form-field
                                appearance="outline"
                                class="w-100"
                                [ngClass]="{
                                    'mat-form-field-invalid':
                                        getForm('shareCompanyList').value?.length === 0 && !isValidForm
                                }"
                            >
                                <mat-label>{{ localeData?.company_list }}</mat-label>
                                <mat-select
                                    name="company"
                                    formControlName="shareCompanyList"
                                    multiple
                                    placeholder="{{ commonLocaleData?.app_select }}"
                                    (closed)="sortSelectedCompaniesFirst()"
                                >
                                    <mat-option *ngFor="let company of companyList" [value]="company?.uniqueName">
                                        {{ company?.name }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="form-group mr-3">
                            <reactive-dropdown-field
                                [label]="localeData?.currency_list"
                                [placeholder]="commonLocaleData?.app_select"
                                [labelValue]="getForm('selectCurrency')?.value ?? activeCompany?.baseCurrency"
                                [options]="currencyList"
                                formControlName="selectCurrency"
                                (onClear)="getForm('selectCurrency')?.patchValue(null)"
                                [required]="true"
                                [showError]="
                                    !getForm('selectCurrency')?.value && !getForm('shareCompanyList').value?.length
                                "
                            >
                            </reactive-dropdown-field>
                        </div>
                        <div class="mr-3 m-1 text-primary">
                            <a
                                class="expand-icon cursor-pointer d-flex font-size-16 bgWhiteMo border"
                                (click)="emitExpand(true)"
                                [matTooltip]="commonLocaleData?.app_expand_all"
                                matTooltipPosition="above"
                                *ngIf="!expandAll"
                            >
                                <span class="icon-expandIcon d-flex justify-content-center align-items-center"> </span>
                            </a>
                            <a
                                class="expand-icon cursor-pointer d-flex font-size-16 bgWhiteMo border"
                                (click)="emitExpand(false)"
                                [matTooltip]="commonLocaleData?.app_collapse_all"
                                matTooltipPosition="above"
                                *ngIf="expandAll"
                            >
                                <span class="icon-collapse d-flex justify-content-center align-items-center"> </span>
                            </a>
                        </div>
                        <div class="form-group mr-3">
                            <button mat-raised-button color="primary" (click)="onSubmit()">
                                {{ commonLocaleData?.app_view }}
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
        <ng-template matMenuContent>
            <app-datepicker-wrapper
                [inputStartDate]="selectedDateRange?.startDate"
                [inputEndDate]="selectedDateRange?.endDate"
                [alwaysShowCalendars]="true"
                [ranges]="datePickerOptions"
                [selectedRangeLabel]="selectedRangeLabel"
                [showCustomRangeLabel]="true"
                [showClearButton]="false"
                [showCancel]="true"
                [linkedCalendars]="true"
                [showDropdowns]="true"
                (rangeClicked)="dateSelectedCallback($event)"
                (datesUpdated)="dateSelectedCallback($event)"
                [keepCalendarOpeningWithRange]="false"
                [showRangeLabelOnInput]="false"
                (closeCalender)="toggleGiddhDatepicker(false)"
            ></app-datepicker-wrapper>
        </ng-template>
    </mat-menu>
</ng-container>
