<ng-container
    appTranslate
    [file]="'trial-profit-balance'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="clearfix">
        <div class="row">
            <div class="col-xl-9 col-lg-12 col-md-12">
                <form
                    [formGroup]="filterForm"
                    (submit)="onSubmit()"
                    class="form-inline financial-select-year"
                    name="fromToDateForm"
                    novalidate
                >
                    <div class="d-flex">
                        <div
                            class="form-group relative mr-r15 datepicker-field"
                        >
                            <div class="custom-datepicker" (click)="showGiddhDatepicker($event)">
                                <input
                                    type="text"
                                    name="selectedDateRange"
                                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                    class="giddh-datepicker date-range-picker"
                                />
                            </div>
                        </div>
                        <div
                            class="form-group mr-r15 linked-entities"
                            
                        >
                            <div class="form-group">
                                <mat-form-field appearance="outline" class="custom-placeholder">
                                    <mat-label>{{ localeData?.company_list }}</mat-label>
                                    <mat-select
                                        name="company"
                                        formControlName="shareCompanyList"
                                        multiple
                                        placeholder="{{ commonLocaleData?.app_select }}"
                                    >
                                        <mat-option
                                            *ngFor="let company of companyList"
                                            [value]="company?.uniqueName"
                                        >
                                            {{ company?.name }}
                                        </mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="form-group mr-r15" >
                            <div class="form-group">
                                <reactive-dropdown-field
                                    [label]="localeData?.company_list"
                                    [placeholder]="commonLocaleData?.app_select"
                                    [labelValue]="getForm('selectCurrency')?.value"
                                    [options]="currencyList"
                                    formControlName="selectCurrency"
                                    (onClear)="getForm('selectCurrency')?.patchValue(null)"
                                    [required]="true"
                                >
                                </reactive-dropdown-field>
                            </div>
                        </div>
                        
                        <div class="form-group mr-r15" >
                            <div class="form-group">
                                <a
                                    class="cp expand-icon"
                                    (click)="emitExpand(true)"
                                    data-placement="top"
                                    tooltip="{{ commonLocaleData?.app_expand_all }}"
                                    *ngIf="!expandAll"
                                >
                                    <span class="icon-expandIcon"></span>
                                </a>
                                <a
                                    class="cp expand-icon"
                                    (click)="emitExpand(false)"
                                    data-placement="top"
                                    tooltip="{{ commonLocaleData?.app_collapse_all }}"
                                    *ngIf="expandAll"
                                >
                                    <span class="icon-collapse"></span>
                                </a>
                            </div>
                        </div>
                        <div class="form-group mr-r15" >
                            <div class="form-group">
                                <button mat-stroked-button color="primary">
                                    {{ commonLocaleData?.app_view }}
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
    <!-- for mobile view only -->

    <!-- for mobile view only -->

    <!-- end box  -->
    <!-- create tag modal -->

    <!-- create tag modal -->
    <ng-template #datepickerTemplate>
        <div class="datepicker-modal">
            <div class="modal-body">
                <app-datepicker-wrapper
                    [inputStartDate]="selectedDateRange?.startDate"
                    [inputEndDate]="selectedDateRange?.endDate"
                    [alwaysShowCalendars]="true"
                    [ranges]="datePickerOption"
                    [selectedRangeLabel]="selectedRangeLabel"
                    [showCustomRangeLabel]="true"
                    [showClearButton]="false"
                    [showCancel]="true"
                    [linkedCalendars]="true"
                    [showDropdowns]="true"
                    (rangeClicked)="dateSelectedCallback($event)"
                    (datesUpdated)="dateSelectedCallback($event)"
                    [keepCalendarOpeningWithRange]="false"
                    [showRangeLabelOnInput]="false"
                    [dateFieldPosition]="dateFieldPosition"
                ></app-datepicker-wrapper>
            </div>
        </div>
    </ng-template>
</ng-container>
