<div
    class="relative"
    appTranslate
    [file]="'trial-profit-balance'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <hamburger-menu></hamburger-menu>
    <mat-tab-group mat-stretch-tabs="false"
        mat-align-tabs="start"
        [selectedIndex]="selectedTabIndex"
        (selectedIndexChange)="tabChanged($event)"
        [disableRipple]="true"
        animationDuration="0ms"
        class="table-header-sticky" >
        <!-- Trial Balance Tab -->
        <mat-tab label="{{ localeData?.tabs?.trial_balance }}">
            <div class="container-fluid pd-t1">
                <trial-balance-report *ngIf="selectedTabIndex === 0"></trial-balance-report>
            </div>
        </mat-tab>

        <!-- Profit Loss Tab -->
        <mat-tab label="{{ localeData?.tabs?.profit_loss }}">
            <div class="container-fluid pd-t1">
                <profit-loss-report *ngIf="selectedTabIndex === 1"></profit-loss-report>
            </div>
        </mat-tab>

        <!-- Balance Sheet Tab -->
        <mat-tab label="{{ localeData?.tabs?.balance_sheet }}">
            <div class="container-fluid pd-t1">
                <balance-sheet-report *ngIf="selectedTabIndex === 2"></balance-sheet-report>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
