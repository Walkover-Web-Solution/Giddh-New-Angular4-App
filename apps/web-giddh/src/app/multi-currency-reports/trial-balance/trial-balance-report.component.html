<div
    appTranslate
    [file]="'trial-profit-balance/trial-balance'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <filter-multi-currency
        #filter
        (filterValue)="searchData($event)"
        (onPropertyChanged)="filterData()"
        (searchChange)="searchChanged($event)"
        (expandAllChange)="expandAllEvent()"
        [(expandAll)]="expandAll"
    ></filter-multi-currency>
    <giddh-page-loader *ngIf="showLoader | async" [cssClass]="'mt-0 mb-0'"></giddh-page-loader>
    <div *ngIf="(reportDataList$ | async) && !(showLoader | async)">
        <trial-balance-report-grid
            #tbGrid
            [search]="search"
            (searchChange)="searchChanged($event)"
            [expandAll]="expandAll"
            [data$]="reportDataList$ | async"
        ></trial-balance-report-grid>
    </div>
    <div *ngIf="!(showLoader | async) && !(reportDataList$ | async)" class="no-data">
        <h2>{{ localeData?.no_data_found }}</h2>
    </div>
</div>
