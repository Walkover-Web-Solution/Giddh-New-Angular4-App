<div class="multi-select">
    <input
        type="text"
        class="form-control text-right total-discount-amount"
        tabindex="0"
        cdkMonitorElementFocus
        (keydown.enter)="$event.preventDefault(); isMenuOpened ? menuTrigger.closeMenu() : menuTrigger.openMenu()"
        (keydown.space)="$event.preventDefault(); isMenuOpened ? menuTrigger.closeMenu() : menuTrigger.openMenu()"
        [matMenuTriggerFor]="discountControlMenu"
        #menuTrigger="matMenuTrigger"
        [placeholder]="currency + '0'"
        readonly
        [value]="currency + totalDiscountAmount"
        (menuOpened)="handleMenuOpened()"
    />
    <mat-menu #discountControlMenu="matMenu" [hasBackdrop]="hasBackdrop" (closed)="handleMenuClosed($event)">
        <ng-template matMenuContent>
            <div
                class="d-flex flex-column px-3 pt-2 discount-wrapper"
                (click)="$event.stopPropagation()"
                [formGroup]="discountForm"
                (keydown.tab)="$event.stopPropagation()"
                (keydown.shift.tab)="$event.stopPropagation()"
                cdkTrapFocus
                cdkTrapFocusAutoCapture
            >
                <div>
                    <input-field
                        [type]="'number'"
                        [min]="0"
                        [allowDecimalDigitsOnly]="true"
                        [label]="commonLocaleData?.app_percent"
                        [matSuffix]="'%'"
                        class="d-block"
                        [cssClass]="'text-right'"
                        formControlName="percentage"
                        [readonly]="discountForm.get('fixedValue')?.value > 0"
                        (keydown.enter)="$event.preventDefault(); menuTrigger?.closeMenu()"
                    ></input-field>
                    <input-field
                        [type]="'number'"
                        [min]="0"
                        [allowDecimalDigitsOnly]="true"
                        [label]="commonLocaleData?.app_value"
                        class="d-block mt-3"
                        [cssClass]="'text-right'"
                        formControlName="fixedValue"
                        [readonly]="discountForm.get('percentage')?.value > 0"
                        (keydown.enter)="$event.preventDefault(); menuTrigger?.closeMenu()"
                    ></input-field>
                </div>
                <div class="discount-separator position-relative text-center my-2" *ngIf="discountsList?.length">
                    <span class="discount-separator-msg">{{ commonLocaleData?.app_and }}</span>
                    <div class="discount-separator-line"></div>
                </div>
                <div class="discount-checkbox-wrapper d-flex flex-column">
                    <ng-container
                        *ngFor="let discount of discountForm.get('discounts')['controls']; let i = index"
                        formArrayName="discounts"
                    >
                        <ng-container [formGroupName]="i">
                            <mat-checkbox
                                formControlName="isActive"
                                color="primary"
                                #discountRef
                                [attr.data-index]="i"
                                tabindex="0"
                                (change)="focusNextCheckbox($event.target, i)"
                                cdkMonitorElementFocus
                                (keydown.enter)="
                                    $event.preventDefault();
                                    discountRef.toggle();
                                    focusNextCheckbox($event.target, i);
                                    menuTrigger?.closeMenu()
                                "
                                (keydown.space)="
                                    $event.preventDefault(); discountRef.toggle(); focusNextCheckbox($event.target, i)
                                "
                            >
                                <span class="font-size-15">
                                    {{ discount?.get("name")?.value }}
                                </span>
                            </mat-checkbox>
                        </ng-container>
                    </ng-container>
                </div>
                <div
                    *ngIf="showCreateNew"
                    class="create-new pt-2 my-2 text-center cursor-pointer"
                    (click)="createNew()"
                >
                    <span
                        class="text-primary"
                        tabindex="0"
                        role="button"
                        cdkMonitorElementFocus
                        [attr.aria-label]="commonLocaleData?.app_create_new"
                        (keydown.enter)="$event.preventDefault(); createNew(); menuTrigger?.closeMenu()"
                        (keydown.space)="$event.preventDefault(); createNew(); menuTrigger?.closeMenu()"
                    >
                        {{ commonLocaleData?.app_create_new }}
                    </span>
                </div>
            </div>
        </ng-template>
    </mat-menu>
</div>
