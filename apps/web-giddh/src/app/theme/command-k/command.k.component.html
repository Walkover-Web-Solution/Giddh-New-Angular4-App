<div
    appTranslate
    [file]="'command-k'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <section>
        <section #wrapper [class.isVisible]="isOpen" class="universal-data-list-wrapper">
            <!-- header -->
            <ng-container *ngTemplateOutlet="searchEleTemplate"></ng-container>
            <!-- end header -->

            <!-- Virtual Scroll List -->
            <ng-container *ngIf="searchedItems && searchedItems.length > 0 && isOpen">
                <div #mainEle tabindex="0" class="universal-list-items">
                    <cdk-virtual-scroll-viewport
                        #virtualScrollViewport
                        [itemSize]="ItemHeight"
                        [maxBufferPx]="ItemHeight * 3"
                        [minBufferPx]="ItemHeight * 2"
                        [style.height.px]="getViewportHeight()"
                        class="command-k-viewport"
                        (scrolledIndexChange)="onScrolledIndexChange($event)"
                        (scroll)="onViewportScroll($event)"
                    >
                        <div
                            *cdkVirtualFor="let item of searchedItems; let i = index; trackBy: trackByFn"
                            class="command-k-item"
                            [class.selected]="i === highlightedItem"
                            (mousemove)="onItemMouseMove(i)"
                            (click)="onItemClick(item, $event)"
                        >
                            <a
                                [attr.href]="getItemHref(item)"
                                class="item-link"
                                tabindex="-1"
                            >
                                <!-- Item Icon -->
                                <div class="item-icon">
                                    <span
                                        class="icon"
                                        [ngClass]="getItemIconClass(item.type)"
                                    ></span>
                                </div>

                                <!-- Item Content -->
                                <div class="item-content">
                                    <div class="item-main column-gap-1">
                                        <div class="item-info word-wrap-anywhere">
                                            <p class="item-name" [id]="getItemId(item)">
                                                {{ item.name }}
                                            </p>

                                            <small *ngIf="item.type === 'MENU'" class="item-type">
                                                {{ localeData?.menu }}
                                            </small>

                                            <div *ngIf="item?.parentGroups" class="item-breadcrumb">
                                                <small>
                                                    <span *ngFor="let parent of item.parentGroups; let idx = index">
                                                        <span *ngIf="idx > 0">&nbsp;❯&nbsp;</span>{{ parent.name }}
                                                    </span>
                                                </small>
                                            </div>
                                        </div>

                                        <div *ngIf="item.type === 'ACCOUNT'" class="item-unique-name">
                                            <span class="font-size-14">{{ item?.uniqueName }}</span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </cdk-virtual-scroll-viewport>
                </div>
            </ng-container>

            <!-- No Results -->
            <ng-container *ngIf="noResultsFound && !dontShowNoResultMsg">
                <div class="no-results">
                    <div class="no-results-content" [class.text-center]="showChannelCreateBtn">
                        <p class="no-results-message">{{ localeData?.no_records_found }}</p>

                        <div *ngIf="showChannelCreateBtn" class="no-results-actions">
                            <button
                                matButton="filled"
                                (click)="triggerAddManage('group')"
                                mat-dialog-close
                            >
                                {{ commonLocaleData?.app_create_group }}
                            </button>
                            <button
                                matButton="filled"
                                (click)="triggerAddManage('account')"
                                mat-dialog-close
                            >
                                {{ commonLocaleData?.app_create_account }}
                            </button>
                        </div>
                    </div>
                </div>
            </ng-container>
        </section>
        <!-- end main section -->
    </section>
    <!-- input box template -->
    <ng-template #searchEleTemplate>
        <div class="d-flex border-bottom">
            <div #searchWrapEle class="search-wrapper" (click)="focusInSearchBox($event)">
                <span class="icon-search-icon"><i class="icon-search"></i></span>
                <span *ngFor="let item of listOfSelectedGroups; let idx = index">
                    <div class="vR">
                        <div class="vN">
                            <div class="vT">{{ item.name }}</div>
                            <span>&nbsp;❯&nbsp;</span>
                        </div>
                    </div>
                </span>
                <input
                    class="search-element"
                    #searchEle
                    type="text"
                    [placeholder]="commonLocaleData?.app_search"
                    (focus)="handleFocus()"
                    (keydown)="handleKeydown($event)"
                    (keyup)="initSearch($event, $event.target?.value)"
                    (paste)="onPasteInSearch()"
                />
            </div>
            <i mat-dialog-close class="icon-cross close-navigation"></i>
        </div>
    </ng-template>
</div>
