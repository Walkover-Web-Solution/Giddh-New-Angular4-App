<div class="text-field-container" [ngClass]="{ 'readonly-field': readonly || disabled }">
    <mat-form-field
        [ngClass]="{ 'mat-form-field-invalid': showError, 'prefix-icon-field': matPrefixIcon }"
        [appearance]="appearance"
        [floatLabel]="floatLabel"
    >
        <mat-label>
            {{ label || placeholder }}
            <i *ngIf="showLabelIcon" [class]="labelIconClass" [matTooltip]="labelIconTooltip" matTooltipPosition="above"></i>
        </mat-label>
        <input
            matInput
            [name]="name"
            [type]="type"
            [id]="id"
            [class]="cssClass"
            [placeholder]="placeholder"
            [ngModelOptions]="{ standalone: true }"
            (paste)="handlePaste($event)"
            (focus)="handleFocus($event)"
            [(ngModel)]="ngModel"
            (ngModelChange)="handleChange()"
            (input)="handleInput($event)"
            [maxlength]="maxlength"
            [minlength]="minlength"
            [readonly]="readonly"
            [disabled]="disabled"
            [attr.pattern]="pattern"
            [required]="required"
            [attr.min]="min"
            [attr.max]="max"
            *ngIf="!allowDecimalDigitsOnly && !useMask"
            #textField
            (keydown.enter)="handleEnterKey($event)"
            [autocomplete]="autocomplete"
            (blur)="emitBlurEvent($event)"
            [ngClass]="{ 'error-box': showError }"
        />
        <input
            matInput
            [name]="name"
            [type]="type"
            [id]="id"
            [class]="cssClass"
            [placeholder]="placeholder"
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="ngModel"
            (ngModelChange)="handleChange()"
            (input)="handleInput($event)"
            [readonly]="readonly"
            [disabled]="disabled"
            [attr.pattern]="pattern"
            [required]="required"
            [attr.min]="min"
            [attr.max]="max"
            *ngIf="allowDecimalDigitsOnly && !useMask"
            (paste)="handlePaste($event)"
            (focus)="handleFocus($event)"
            [customDecimalPlaces]="customDecimalPlaces"
            decimalDigitsDirective
            #textField
            (keydown.enter)="handleEnterKey($event)"
            [autocomplete]="autocomplete"
            (blur)="emitBlurEvent($event)"
            [ngClass]="{ 'error-box': showError }"
        />
        <input
            matInput
            [name]="name"
            [type]="type"
            [id]="id"
            [class]="cssClass"
            [placeholder]="placeholder"
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="ngModel"
            (ngModelChange)="handleChange()"
            (input)="handleInput($event)"
            [readonly]="readonly"
            [disabled]="disabled"
            [attr.pattern]="pattern"
            [required]="required"
            [prefix]="prefix"
            [suffix]="suffix"
            [mask]="mask"
            [allowUnsupportedPrefix]="allowUnsupportedPrefix"
            (paste)="handlePaste($event)"
            (focus)="handleFocus($event)"
            [validation]="false"
            *ngIf="useMask"
            [customDecimalPlaces]="customDecimalPlaces"
            #textField
            (keydown.enter)="handleEnterKey($event)"
            [autocomplete]="autocomplete"
            (blur)="emitBlurEvent($event)"
            [ngClass]="{ 'error-box': showError }"
        />
        <span matPrefix *ngIf="matPrefix">{{ matPrefix }}</span>
        <i matPrefixIcon *ngIf="matPrefixIcon" [ngClass]="matPrefixIcon" class="position-absolute icon-prefix"></i>

        <span matSuffix *ngIf="matSuffix" [ngClass]="matSuffixCssClass" (click)="handleSuffixClick()">{{ matSuffix }}</span>
        <i
            matSuffix
            *ngIf="matSuffixIcon"
            [ngClass]="matSuffixIcon"
            (click)="handleSuffixClick()"
            [matTooltip]="suffixTooltipText ?? ''"
            matTooltipPosition="above"
            role="button"
            [attr.aria-label]="label || placeholder"
        ></i>
    </mat-form-field>
</div>
