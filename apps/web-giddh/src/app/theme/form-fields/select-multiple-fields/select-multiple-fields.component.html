<div [ngClass]="{'custom-input-field': !appearance }">
    <mat-form-field [floatLabel]="!appearance ? 'never' : null" class="w-100 initial-height" [appearance]="appearance" (click)="!readonly ? trigger?.openPanel() : trigger?.closePanel()">
    <mat-label *ngIf="showMatLabel">{{ label ? label : placeholder }}</mat-label>
    <mat-chip-grid #matChipList [required]="required">
        <mat-chip-row
            *ngFor="let chip of chipList; let indx = index"
            [selectable]="true"
            [removable]="true"
            (removed)="removeOption(indx)"
            role="option"
        >
            <span class="word-break">{{chip}}</span>
            <span matChipRemove>
                <i class="icon-cross"></i>
            </span>
        </mat-chip-row>
        <input
            type="text"
            matInput
            [formControl]="searchFormControl"
            [placeholder]="placeholder"
            [matAutocomplete]="auto"
            [matChipInputFor]="matChipList"
            [matChipInputAddOnBlur]="!auto.isOpen"
            (matChipInputTokenEnd)="addChip($event)"
            [ngClass]="{ 'chiplist-error': showError }"
            #trigger="matAutocompleteTrigger"
            [name]="name"
            #selectField
            [autocomplete]="'off'"
            matAutocompletePosition="auto"
            class="select-multiple-field-input"
            [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
            (clickOutside)="closeDropdownPanel($event)"
            [readonly]="readonly"
            [disabled]="disabled"
        />
    </mat-chip-grid>
    <mat-autocomplete
        #auto="matAutocomplete"
        multiple
        optionsScroll
        autoActiveFirstOption
        (opened)="panelOpened()"
        (closed)="panelClosed()"
        [enableDynamicSearch]="enableDynamicSearch"
        (optionsScroll)="onScroll()"
        (optionSelected)="selectOption($event); selectField.value = ''"
        class="py-0"
    >
        <span (click)="$event.stopPropagation()">
            <mat-option [class]="optionClass" [ngClass]="{'po-options-line': isPurchaseOrder }"
            *ngFor="let option of fieldFilteredOptions$ | async" [value]="option">
                <ng-container *ngIf="!isPurchaseOrder">{{ option.label }}</ng-container>
                <ng-container *ngIf="isPurchaseOrder">
                    <span class="po-option-label"> {{ option?.label }}</span>
                    <span class="po-option-value" *ngIf="option?.additional?.pending">
                        {{ localeData?.pending }}: {{ option?.additional?.pending }}</span
                    >
                    <span class="po-option-value" *ngIf="option.additional?.grandTotal">
                        {{ commonLocaleData?.app_amount }}:
                        {{ option?.additional?.grandTotal }}</span
                    >
                </ng-container>
            </mat-option>
            <mat-option disabled *ngIf="!(fieldFilteredOptions$ | async)?.length" [class]="optionClass">
                {{ commonLocaleData?.app_no_result_found }}
            </mat-option>
        </span>
    </mat-autocomplete>
</mat-form-field>
</div>
