<div class="text-field-container">
    <input
        matInput
        cdkMonitorElementFocus
        [name]="name"
        [type]="type"
        [id]="id"
        [class]="cssClass"
        [placeholder]="placeholder"
        [ngModelOptions]="{ standalone: true }"
        [(ngModel)]="ngModel"
        (ngModelChange)="handleChange()"
        (input)="handleInput()"
        (focus)="handleFocus($event)"
        (blur)="handleBlur($event)"
        [maxlength]="maxlength"
        [readonly]="readonly"
        [ngClass]="{ 'error-box': showError }"
        [attr.pattern]="pattern"
        [required]="required"
        [attr.min]="min"
        [attr.max]="max"
        [customDecimalPlaces]="customDecimalPlaces"
        *ngIf="!allowDecimalDigitsOnly && !useMask"
        #textField
        (keydown.enter)="$event.preventDefault()"
        [autocomplete]="autocomplete"
        [attr.lang]="lang"
        [attr.dir]="direction"
    />
    <input
        matInput
        cdkMonitorElementFocus
        [name]="name"
        type="number"
        [id]="id"
        [class]="cssClass"
        [placeholder]="placeholder"
        [ngModelOptions]="{ standalone: true }"
        [(ngModel)]="ngModel"
        (ngModelChange)="handleChange()"
        (input)="handleInput()"
        (focus)="handleFocus($event)"
        (blur)="handleBlur($event)"
        [readonly]="readonly"
        [ngClass]="{ 'error-box': showError }"
        [attr.pattern]="pattern"
        [required]="required"
        [attr.min]="min"
        [attr.max]="max"
        *ngIf="allowDecimalDigitsOnly && !useMask"
        [customDecimalPlaces]="customDecimalPlaces"
        decimalDigitsDirective
        #textField
        (keydown.enter)="$event.preventDefault()"
        [autocomplete]="autocomplete"
        [attr.lang]="lang"
        [attr.dir]="direction"
    />
    <input
        matInput
        cdkMonitorElementFocus
        [name]="name"
        [type]="type"
        [id]="id"
        [class]="cssClass"
        [placeholder]="placeholder"
        [ngModelOptions]="{ standalone: true }"
        [(ngModel)]="ngModel"
        (ngModelChange)="handleChange()"
        (input)="handleInput()"
        (focus)="handleFocus($event)"
        (blur)="handleBlur($event)"
        [readonly]="readonly"
        [ngClass]="{ 'error-box': showError }"
        [attr.pattern]="pattern"
        [required]="required"
        [prefix]="prefix"
        [suffix]="suffix"
        [mask]="mask"
        *ngIf="useMask"
        [customDecimalPlaces]="customDecimalPlaces"
        #textField
        (keydown.enter)="$event.preventDefault()"
        [autocomplete]="autocomplete"
        [attr.lang]="lang"
        [attr.dir]="direction"
    />
    <span matSuffix *ngIf="matSuffix">{{ matSuffix }}</span>
</div>
