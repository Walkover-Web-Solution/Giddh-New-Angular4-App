<div
    appTranslate
    [file]="'watch-video'"
    (localeData)="localeData = $event"
    (translationComplete)="translationComplete($event)"
>
    <span *ngIf="translatedText">
        <div *ngIf="showIcon">
            <i class="icon-info1" (click)="openVideoTutorialDialog()" [ngClass]="iconCssClass"  [matTooltip]="translatedText" matTooltipPosition="above"></i>
        </div>
        <span *ngIf="!showIcon" (click)="openVideoTutorialDialog()" [ngClass]="iconCssClass">
            {{ translatedText }}
        </span>
    </span>
</div>

<ng-template #videoTutorial>
    <div class="video-wrapper">
        <iframe
            title="Video Link"
            width="100%"
            height="100%"
            [src]="videoLink"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
        ></iframe>
    </div>
</ng-template>
