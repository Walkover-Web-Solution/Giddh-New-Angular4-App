<div>
    <div class="dialog-header">
        <span>{{ title }}</span>
        <button mat-icon-button aria-label="close" (click)="onCancel($event)">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body">
        {{ body }}
        <p class="font-size-15 mr-t05">{{ permanentlyDeleteMessage }}</p>
        <div class="d-flex column-gap-1 justify-content-end mt-3">
            <button aria-label="yes" mat-raised-button color="primary" (click)="onSuccess($event)">{{ ok }}</button>
            <button aria-label="no" mat-stroked-button (click)="onCancel($event)">{{ cancel }}</button>
        </div>
    </mat-dialog-content>
</div>
