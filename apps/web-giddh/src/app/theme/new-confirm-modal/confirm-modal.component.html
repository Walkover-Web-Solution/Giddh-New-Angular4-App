<div>
    <div class="dialog-header">
        <span>{{ inputData?.title }}</span>
    </div>
    <mat-dialog-content class="dialog-body">
        <p [innerHTML]="inputData?.body"></p>
        <p class="text-light font-size-15 mt-1" *ngIf="inputData?.permanentlyDeleteMessage">
            {{ inputData?.permanentlyDeleteMessage }}
        </p>
        <div class="d-flex column-gap-1 mt-3 justify-content-end">
            <button matButton="filled" (click)="sendResponse(true)">{{ inputData?.ok }}</button>
            <button matButton="outlined" (click)="sendResponse(false)">{{ inputData?.cancel }}</button>
        </div>
    </mat-dialog-content>
</div>
