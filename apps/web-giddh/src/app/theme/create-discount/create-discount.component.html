<div
    appTranslate
    [file]="'settings/discount'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div
        class="aside-dialog-wrapper"
        [keyboardShortcut]="'esc'"
        [config]="{ dialogMode: true }"
        (onShortcutPress)="cancelDiscount()"
    >
        <div class="dialog-header">
            <span class="font-size-16">{{ localeData?.tab_heading }}</span>
        </div>
        <div mat-dialog-content class="create-discount-aside dialog-body">
            <div *ngIf="isLoading">
                <giddh-page-loader></giddh-page-loader>
            </div>
            <ng-container *ngIf="!isLoading">
                <form autocomplete="off" novalidate name="createDiscountForm" [formGroup]="createDiscountForm">
                    <div class="row row-gap-15 mt-2">
                        <div class="col-6">
                            <span class="custom-mat-form-field">
                                <reactive-dropdown-field
                                    [options]="discountTypeOptions"
                                    [label]="localeData?.discount_type"
                                    [appearance]="'outline'"
                                    formControlName="type"
                                    [openDropdown]="true"
                                >
                                </reactive-dropdown-field>
                            </span>
                        </div>
                        <div class="col-6">
                            <input-field
                                [type]="'text'"
                                [showError]="isFormSubmitted && !createDiscountForm.get('name')?.value"
                                [name]="'discount-name'"
                                formControlName="name"
                                [placeholder]="commonLocaleData?.app_name_placeholder"
                                [label]="commonLocaleData?.app_name"
                            ></input-field>
                        </div>
                        <div class="col-6">
                            <input-field
                                [type]="'number'"
                                [showError]="isFormSubmitted && !createDiscountForm.get('discountValue')?.value"
                                [name]="'discountValue'"
                                formControlName="discountValue"
                                [placeholder]="localeData?.discount_value_placeholder"
                                [label]="commonLocaleData?.app_value"
                            ></input-field>
                        </div>
                        <div class="col-6">
                            <reactive-dropdown-field
                                [label]="localeData?.linked_accounts_label"
                                [placeholder]="localeData?.linked_accounts_placeholder"
                                formControlName="accountUniqueName"
                                [name]="'accountUniqueName'"
                                [options]="discountsAccountList$ | async"
                                [showError]="isFormSubmitted && !createDiscountForm.get('accountUniqueName')?.value"
                                [labelValue]="createDiscountForm.get('accountName')?.value"
                                (selectedOption)="selectDiscount($event)"
                                (onClear)="clearAccount()"
                            >
                            </reactive-dropdown-field>
                        </div>
                    </div>
                </form>
                <div class="row mt-4" *ngIf="voucherApiVersion === 2">
                    <div class="col-12 d-flex column-gap-1">
                        <button
                            *ngIf="!isUpdateMode"
                            matButton="filled"
                            (click)="saveDiscount()"
                            [ladda]="createDiscountInProgress$ | async"
                        >
                            {{ commonLocaleData?.app_save }}
                        </button>
                        <button
                            *ngIf="isUpdateMode"
                            matButton="filled"
                            (click)="updateDiscount()"
                            [ladda]="createDiscountInProgress$ | async"
                        >
                            {{ commonLocaleData?.app_update }}
                        </button>
                        <button matButton="elevated" (click)="cancelDiscount()">
                            {{ commonLocaleData?.app_cancel }}
                        </button>
                        <button *ngIf="!isUpdateMode" matButton="elevated" (click)="clearDiscount()">
                            {{ commonLocaleData?.app_clear }}
                        </button>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
