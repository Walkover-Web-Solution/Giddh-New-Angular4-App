<div class="custom-confirmation-modal">
    <div class="dialog-header">
        <span [ngClass]="inputData?.configuration?.headerCssClass">
            {{ inputData?.configuration?.headerText }}
        </span>
    </div>
    <mat-dialog-content class="dialog-body font-size-15">
        <p
            [ngClass]="inputData?.configuration?.messageCssClass"
            [innerHTML]="inputData?.configuration?.messageText"
        ></p>
        <p [ngClass]="inputData?.configuration?.footerCssClass">{{ inputData?.configuration?.footerText }}</p>
        <div class="d-flex column-gap-15 mt-4 justify-content-end">
            <ng-container *ngFor="let button of inputData?.configuration?.buttons">
                <ng-container *ngIf="button?.color === 'primary'; else elseBlock">
                    <button
                        *ngIf="!inputData?.configuration?.disableRipple"
                        mat-raised-button
                        class="confirmation-buttons"
                        (click)="sendResponse(button?.text)"
                        [ngClass]="button?.cssClass"
                        [color]="button?.color"
                    >
                        {{ button?.text }}
                    </button>
                    <button
                        *ngIf="inputData?.configuration?.disableRipple"
                        [disableRipple]="true"
                        mat-button
                        class="confirmation-buttons"
                        (click)="sendResponse(button?.text)"
                        [ngClass]="button?.cssClass"
                        [color]="button?.color"
                    >
                        {{ button?.text }}
                    </button>
                </ng-container>
                <ng-template #elseBlock>
                    <button
                        *ngIf="!inputData?.configuration?.disableRipple"
                        matButton="elevated"
                        class="confirmation-buttons"
                        (click)="sendResponse(button?.text)"
                        [ngClass]="button?.cssClass"
                        [color]="button?.color"
                    >
                        {{ button?.text }}
                    </button>
                    <button
                        *ngIf="inputData?.configuration?.disableRipple"
                        [disableRipple]="true"
                        matButton="elevated"
                        class="confirmation-buttons"
                        (click)="sendResponse(button?.text)"
                        [ngClass]="button?.cssClass"
                        [color]="button?.color"
                    >
                        {{ button?.text }}
                    </button>
                </ng-template>
            </ng-container>
        </div>
    </mat-dialog-content>
</div>
