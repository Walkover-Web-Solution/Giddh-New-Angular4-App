<div class="aside-pane mat-app-background mat-app-background">
    <button matIconButton aria-label="close" (click)="closeAsidePane($event)">
        <i class="icon-cross"></i>
    </button>
    <div class="aside-body row">
        <inventory-custom-stock
            #customStock
            [isAsideClose]="asideClose"
            [isAsideOpen]="menuState"
            (closeAsideEvent)="closeAsidePane($event)"
        ></inventory-custom-stock>
    </div>
</div>
