<div class="form-header">
    <p >Create Account</p>
</div>
<div class="form-body clear-both margin-child-label">
    <div class="clear-both">
        <form [formGroup]="form" autocomplete="off" class="form-group">
            <div class="row">
                <div class="col-6">
                    <label>Name</label>
                    <input type="text" formControlName="name" class="form-control" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 text-left mt-2">
                    <button matButton="outlined" (click)="onCancel.emit($event)">Cancel</button>
                    <button matButton="filled" [ladda]="isLoading" (click)="save()">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>
