<div class="col-md-12 text-center inventory-welcome">
    <div class="illustration-box">
        <img src="assets/images/new/Inventory_welcome.svg" />
        <p class="mt-2 font-size-16"><strong>Manage your Inventory!</strong></p>
        <p class="mt-2">Add & Manage product in the inventory</p>
        <button matButton="filled" class="mt-4" (click)="openAsidePaneDialog()">Start</button>
    </div>
</div>

<!-- aside menu section -->
<ng-template #asideMenuTemplate>
    <aside-pane
        [keyboardShortcut]="'esc'"
        (onShortcutPress)="asideMenuDialogRef?.close()"
        (closeAsideEvent)="asideMenuDialogRef?.close()"
    ></aside-pane>
</ng-template>
