<div class="aside-pane mat-app-background mat-app-background">
    <div class="form-header" *ngIf="selectedAsideView == 'mainview'">
        <p>Create</p>
    </div>
    <button matButton="outlined" (click)="closeAsidePane($event)" *ngIf="selectedAsideView == 'mainview'">
        <i class="icon-cross"></i>
    </button>
    <button matButton="outlined" id="back" (click)="backButtonPressed()" *ngIf="selectedAsideView != 'mainview'">Back</button>
    <div [ngSwitch]="selectedAsideView">
        <ng-container *ngSwitchCase="'inward'">
            <transfer-inward-note
                [stockList]="stockList$ | async"
                [userList]="userList$ | async"
                [stockUnits]="stockUnits$ | async"
                [isLoading]="isLoading"
                (onSave)="onSave($event)"
                (onCancel)="onCancel()"
            >
            </transfer-inward-note>
        </ng-container>
        <ng-container *ngSwitchCase="'outward'">
            <transfer-outward-note
                [stockList]="stockList$ | async"
                [userList]="userList$ | async"
                [stockUnits]="stockUnits$ | async"
                [isLoading]="isLoading"
                (onSave)="onSave($event)"
                (onCancel)="onCancel()"
            >
            </transfer-outward-note>
        </ng-container>
        <ng-container *ngSwitchCase="'transfer'">
            <transfer-notes
                [stockList]="stockList$ | async"
                [userList]="userList$ | async"
                [stockUnits]="stockUnits$ | async"
                [isLoading]="isLoading"
                (onSave)="onSave($event.entry, $event.user)"
                (onCancel)="onCancel()"
            >
            </transfer-notes>
        </ng-container>
        <ng-container *ngSwitchCase="'createStock'">
            <div class="pt-2">
                <inventory-add-stock [addStock]="true" (closeAsideEvent)="onCancel()"></inventory-add-stock>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="'createAccount'">
            <transfer-inventory-user (onSave)="createAccount($event)" (onCancel)="onCancel()"></transfer-inventory-user>
        </ng-container>
        <ng-container *ngSwitchDefault>
            <div class="aside-body flexy-child vertical-align-middle aside-panel-ledger" vr-item>
                <div class="p-2 text-center">
                    <button matButton="filled" type="button" (click)="selectView('inward')">
                        Inward Note
                    </button>
                </div>
                <div class="p-2 text-center">
                    <button matButton="filled" type="button" (click)="selectView('outward')">
                        Outward Note
                    </button>
                </div>
                <div class="p-2 text-center">
                    <button matButton="filled" type="button" (click)="selectView('createStock')">
                        Create Stock
                    </button>
                </div>
                <div class="p-2 text-center">
                    <button matButton="filled" type="button" (click)="selectView('createAccount')">
                        Create Account
                    </button>
                </div>
            </div>
        </ng-container>
    </div>
</div>
