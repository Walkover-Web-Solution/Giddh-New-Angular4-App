<div class="aside-pane mat-app-background mat-app-background">
    <div class="branch-modal-wrap">
        <div class="dialog-header">
            <span>Transfer</span>
            <button matIconButton aria-label="close" (click)="closeAsidePane($event)">
                <i class="icon-cross"></i>
            </button>
        </div>
        <div class="form-body clear-both margin-child-label modal-height">
            <div class="branch-transfer">
                <button matButton="filled" (click)="openBranchTransferPopup('receiptnote')">Receipt Note</button>
                <button matButton="filled" (click)="openBranchTransferPopup('deliverynote')">Delivery Challan</button>
            </div>
        </div>
    </div>
</div>
