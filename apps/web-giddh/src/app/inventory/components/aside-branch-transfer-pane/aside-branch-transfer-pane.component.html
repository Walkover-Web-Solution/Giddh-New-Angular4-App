<div class="aside-pane">
    <button mat-stroked-button id="close" (click)="closeAsidePane($event)"><i class="icon-cross"></i></button>
    <div class="branch-modal-wrap">
        <ng-container>
            <div class="form-header">
                <div>
                    <h3>
                        <span>Transfer</span>
                    </h3>
                </div>
            </div>
            <div class="form-body white-bg clearfix margin-child-label modal-height">
                <div class="branch-transfer">
                    <button mat-stroked-button (click)="openBranchTransferPopup('receiptnote')">
                        Receipt Note
                    </button>
                    <button mat-stroked-button (click)="openBranchTransferPopup('deliverynote')">
                        Delivery Challan
                    </button>
                </div>
            </div>
        </ng-container>
    </div>
</div>
