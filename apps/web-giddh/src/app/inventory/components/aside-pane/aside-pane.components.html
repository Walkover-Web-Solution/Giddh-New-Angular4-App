<div class="dialog-header" *ngIf="!hideFirstScreen">
    <span>Create</span>
    <button mat-icon-button aria-label="close" (click)="closeAsidePane()">
        <i class="icon-cross"></i>
    </button>
</div>
<button mat-raised-button class="back-button position-absolute" (click)="backButtonPressed()" *ngIf="hideFirstScreen">Back</button>

<div class="dialog-body d-flex flex-column justify-content-center align-items-center" *ngIf="!hideFirstScreen">
    <div class="pb-3 text-center">
        <button mat-raised-button color="primary" (click)="toggleStockPane()">Create Stock</button>
    </div>
    <div class="pb-3 text-center">
        <button mat-raised-button color="primary" (click)="toggleGroupPane()">Create Group</button>
    </div>
    <div class="pb-3 text-center">
        <button mat-raised-button color="primary" (click)="toggleUnitPane()">Create Unit</button>
    </div>
</div>

<inventory-add-stock
    *ngIf="isAddStockOpen"
    [autoFocusInChild]="autoFocusOnChild"
    [addStock]="true"
    (closeAsideEvent)="closeAsidePane($event)"
></inventory-add-stock>
<inventory-add-group
    *ngIf="isAddGroupOpen"
    [addGroup]="true"
    (closeAsideEvent)="closeAsidePane($event)"
></inventory-add-group>
<inventory-custom-stock
    *ngIf="isAddUnitOpen"
    [isAsideClose]="asideClose"
    [isAsideOpen]="isAddUnitOpen"
    (closeAsideEvent)="closeAsidePane($event)"
>
</inventory-custom-stock>
