<!-- Write dialog code here -->
<ng-container
    appTranslate
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>

    <div class="dialog-asidepan">
        <div class="dialog-header">
            <span mat-dialog-title class="font-16">Create</span>
            <button aria-hidden="true" class="close" mat-dialog-close (click)="closeDialog()">×</button>
        </div>
        <div class="dialog-body pd-3">
            <div *ngIf="isLoading">
                <giddh-page-loader></giddh-page-loader>
            </div>
            <ng-container>
                <div class="col-8">
                    <input-field 
                        [type]="'text'"
                        [name]="'discountValue'" 
                        [placeholder]="'Enter Project Name'"
                        [label]="'Project'">
                    </input-field>
                </div>
                <div class="col-12 d-flex column-gap1 mr-t2">
                    <button mat-raised-button color="primary">{{ commonLocaleData?.app_save }}</button>
                    <button mat-raised-button color="primary">{{ commonLocaleData?.app_cancel }}</button>
                </div>
            </ng-container>
        </div>
    </div>
</ng-container>
