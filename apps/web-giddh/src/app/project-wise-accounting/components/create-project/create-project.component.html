<!-- Write dialog code here -->
<ng-container>

    <div class="dialog-asidepan">
        <div class="dialog-header">
            <span mat-dialog-title class="font-16">Create</span>
            <button class="close" mat-dialog-close>×</button>
        </div>
        <div class="dialog-body pd-3">
            <div *ngIf="isLoading">
                <giddh-page-loader></giddh-page-loader>
            </div>
            <ng-container>
                <div class="col-8">
                    <input-field 
                        [type]="'text'"
                        [name]="'discountValue'" 
                        [placeholder]=""
                        [label]="">
                    </input-field>
                </div>
                <div class="col-12 d-flex column-gap1 mr-t2">
                    <button mat-raised-button color="primary">save</button>
                    <button mat-raised-button color="primary">cencle</button>
                </div>
            </ng-container>
        </div>
    </div>
</ng-container>
