<!-- Write dialog code here -->
<ng-container
    appTranslate
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>

    <div>
        <div class="dialog-header">
            <span mat-dialog-title class="font-16">Create</span>
            <i mat-dialog-close class="icon-cross"></i>
        </div>
        <div class="dialog-body pd-3">
            <div *ngIf="isLoading">
                <giddh-page-loader></giddh-page-loader>
            </div>
            <form [formGroup]="createProjectForm" novalidate (ngSubmit)="createProject()" autocomplete="off">
                <div class="col-8">
                    <input-field 
                        [type]="'text'"
                        [name]="'discountValue'" 
                        [placeholder]="'Enter Project Name'"
                        [label]="'Project'"
                        formControlName="companyName"
                    >
                    </input-field>
                    <div *ngIf="companyName?.invalid && companyName?.touched">
                        <small class="danger" *ngIf="companyName?.hasError('required')">Company Name is required.</small>
                        <small class="danger" *ngIf="companyName?.hasError('minlength')">Company Name must be at least 3 characters.</small>
                    </div>
                </div>
                <div class="col-12 d-flex column-gap1 mr-t2">
                    <button mat-raised-button color="primary" [disabled]="(isSavingProject$ | async)">{{ commonLocaleData?.app_save }}</button>
                    <button mat-raised-button color="primary">{{ commonLocaleData?.app_cancel }}</button>
                </div>
            </form>
        </div>
    </div>
</ng-container>
