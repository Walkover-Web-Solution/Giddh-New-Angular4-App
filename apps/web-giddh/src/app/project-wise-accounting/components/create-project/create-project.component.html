<div
    appTranslate
    [file]="'project-wise-account'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div>
        <!-- Dialog Header -->
        <div class="dialog-header">
            <span class="font-size-16">{{
                inputData?.isCreateFlow ? localeData?.create_project : localeData?.update_project
            }}</span>
        </div>

        <!-- Dialog Body -->
        <div class="dialog-body pt-3">
            <div *ngIf="isSavingProject$ | async">
                <giddh-page-loader></giddh-page-loader>
            </div>

            <!-- Project Form -->
            <form
                [formGroup]="createProjectForm"
                novalidate
                (ngSubmit)="createProjectForm?.valid && createProject()"
                autocomplete="off"
                *ngIf="!(isSavingProject$ | async)"
            >
                <div class="col-8">
                    <input-field
                        [type]="'text'"
                        [name]="'projectName'"
                        [placeholder]="localeData.enter_project_name"
                        [label]="localeData.project_name"
                        formControlName="projectName"
                        [required]="true"
                    ></input-field>
                </div>

                <!-- Form Buttons -->
                <div class="col-12 d-flex column-gap-1 mt-4">
                    <button mat-raised-button color="primary" type="submit" [disabled]="isSavingProject$ | async">
                        {{ inputData.isCreateFlow ? commonLocaleData?.app_save : commonLocaleData?.app_update }}
                    </button>
                    <button mat-stroked-button mat-dialog-close>
                        {{ commonLocaleData?.app_cancel }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
