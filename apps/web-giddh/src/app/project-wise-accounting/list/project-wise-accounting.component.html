<ng-container
  appTranslate
  (localeData)="localeData = $event"
  (commonLocaleData)="commonLocaleData = $event">

   <div class="project clearfix section-center position-relative overflow-visible pd-2">
      <div *ngIf="(isFetchingProjects$ | async)">
          <giddh-page-loader></giddh-page-loader>
      </div>
      <div class="min-height d-flex align-items-center justify-content-center" *ngIf="!(isFetchingProjects$ | async) && !dataSource?.length">
        <button mat-raised-button color="primary" (click)="openCreateProjectDialog()">+ Create project</button>
      </div>
      <div class="pull-right" *ngIf="dataSource?.length && !isLoading">
          <button mat-raised-button color="primary" (click)="openCreateProjectDialog()">+ Create project</button>
      </div>
      <div class="mr-t5 overflow-visible table-header-sticky" *ngIf="!(isFetchingProjects$ | async) && dataSource?.length">
        <table
                mat-table
                matSort
                [dataSource]="dataSource"
                [matSortActive]="projectListRequest.sortBy"
                [matSortDirection]="projectListRequest.sort"
                class="giddh-table basic w-100"
         >
          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}.</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th
                mat-header-cell
                *matHeaderCellDef
                mat-sort-header
                class="max-width-150 td-search-box"
                (clickOutside)="showProductSearchBox(false)"
            >
                <div [hidden]="showProductSearch">
                    <span>Product Name</span>
                    <i class="icon-search" (click)="showProductSearchBox(true)"></i>
                </div>

                <div class="input-container" [hidden]="!showProductSearch">
                    <input
                        *ngIf="showProductSearch"
                        [type]="'text'"
                        [name]="'Product Name'"
                        [placeholder]="'Search Product'"
                        [label]="'Search'"
                        #productSearch
                         [formControl]="name"
                    />
                </div>
            </th>
            <td mat-cell *matCellDef="let element">
              <a [routerLink]="['/pages/project-wise-accounting/revenue/list']">{{element.name}}</a></td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">{{element.status}}</td>
          </ng-container>

            <!-- Archived Column -->
          <ng-container matColumnDef="archived">
            <th mat-header-cell *matHeaderCellDef>Archived</th>
            <td mat-cell *matCellDef="let element">{{element.archiveStatus}}</td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef>Profit and Loss</th>
            <td mat-cell *matCellDef="let element">
              <button mat-stroked-button>{{ commonLocaleData?.app_show }}</button>
            </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
            <td mat-cell *matCellDef="let element" class="text-center">
              <span><i class="icon-edit mr-r2"></i></span>
              <span><i class="icon-trash"></i></span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [length]="100"
            [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]"
            aria-label="Select page">
        </mat-paginator>
      </div>
   </div>

</ng-container>
