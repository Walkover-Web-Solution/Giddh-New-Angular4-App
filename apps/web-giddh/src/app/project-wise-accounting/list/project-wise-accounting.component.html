<ng-container
  appTranslate
  (localeData)="localeData = $event"
  (commonLocaleData)="commonLocaleData = $event">

   <div class="project clearfix section-center position-relative overflow-visible pd-2">
      <div *ngIf="isLoading">
          <giddh-page-loader></giddh-page-loader>
      </div>
      <div class="min-height d-flex align-items-center justify-content-center" *ngIf="!dataSource?.length && !isLoading">
        <button mat-raised-button color="primary" (click)="openCreateProjectDialog()">+ Create project</button>
      </div>
      <div class="pull-right" *ngIf="dataSource?.length && !isLoading">
          <button mat-raised-button color="primary" (click)="openCreateProjectDialog()">+ Create project</button>
      </div>

      <div class="mr-t5 overflow-visible table-header-sticky" *ngIf="dataSource?.length && !isLoading">
        <table mat-table [dataSource]="dataSource" class="giddh-table basic w-100">
          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element">{{element.position}}</td>
          </ng-container>
        
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Project&nbsp;<i class="icon-search"></i></th>
            <td mat-cell *matCellDef="let element">
              <a [routerLink]="['/pages/project-wise-accounting/revenue/list']">{{element.name}}</a></td>
          </ng-container>
        
          <!-- Weight Column -->
          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">{{element.status}}</td>
          </ng-container>
        
          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef>Profit and Loss</th>
            <td mat-cell *matCellDef="let element">
              <button mat-stroked-button>{{ commonLocaleData?.app_show }}</button>
            </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
            <td mat-cell *matCellDef="let element" class="text-center">
              <span><i class="icon-edit mr-r2"></i></span>
              <span><i class="icon-trash"></i></span>
            </td>
          </ng-container>
        
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [length]="100"
            [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]"
            aria-label="Select page">
        </mat-paginator>
      </div>  
   </div>

</ng-container>
