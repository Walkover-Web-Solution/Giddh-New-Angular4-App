<ng-container
  appTranslate
  (localeData)="localeData = $event"
  (commonLocaleData)="commonLocaleData = $event">


  <div *ngIf="(isFetchingProjects$ | async)">
    <giddh-page-loader></giddh-page-loader>
  </div>
   <div *ngIf="!(isFetchingProjects$ | async)" class="project clearfix section-center position-relative overflow-visible pd-2">
      <div class="d-flex align-items-center justify-content-space-between section-center">
        <div *ngIf="dataSource.length" class="custom-datepicker" (click)="showGiddhDatepicker($event)">
            <input
              matInput
              type="text"
              name="selectedDateRange"
              [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
              class="giddh-datepicker date-range-picker"
            />
        </div>
        <div class="min-height d-flex align-items-center justify-content-center" *ngIf="!(isFetchingProjects$ | async) && !dataSource?.length">
          <button mat-raised-button color="primary" (click)="openCreateProjectDialog(true)">+ Create project</button>
        </div>
        <div class="pull-right" *ngIf="dataSource?.length">
            <button mat-raised-button color="primary" (click)="openCreateProjectDialog(true)">+ Create project</button>
        </div>
      </div>
      <div class="mr-t5 overflow-visible table-header-sticky">
        <table
          mat-table
          matSort
          [dataSource]="dataSource"
          (matSortChange)="sortChange($event)"
          class="giddh-table basic w-100"
         >
          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}.</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th
                mat-header-cell
                *matHeaderCellDef
                mat-sort-header
                class="max-width-150 td-search-box"
                (clickOutside)="showProductSearchBox(false)"
            >
                <div [hidden]="showProductSearch">
                    <span>Product Name</span>
                    <i class="icon-search" (click)="showProductSearchBox(true)"></i>
                </div>

                <div class="input-container" [hidden]="!showProductSearch">
                    <input
                        *ngIf="showProductSearch"
                        [type]="'text'"
                        [name]="'Product Name'"
                        [placeholder]="'Search Product'"
                        [label]="'Search'"
                        #productSearch
                        [formControl]="name"
                    />
                </div>
            </th>
            <td mat-cell *matCellDef="let element">
              <a [routerLink]="['/pages/project-wise-accounting', 'revenue', 'list', element.uniqueName]">{{element.name}}</a></td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell mat-sort-header *matHeaderCellDef class="sortable-header-justify-center">Status</th>
            <td mat-cell *matCellDef="let element">{{element.status}}</td>
          </ng-container>

            <!-- Archived Column -->
          <ng-container matColumnDef="archive_status">
            <th mat-header-cell mat-sort-header *matHeaderCellDef>Archived</th>
            <td mat-cell *matCellDef="let element">{{element.archiveStatus}}</td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef>Profit and Loss</th>
            <td mat-cell *matCellDef="let element">
              <button mat-stroked-button *ngIf="element.profitAndLoss === -1" (click)="getProfitLoss(element)" >{{ commonLocaleData?.app_show }}</button>
              <span *ngIf="element.profitAndLoss > -1" >{{ element.profitAndLoss }}</span>
            </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
            <td mat-cell *matCellDef="let element" class="text-center">
              <span (click)="openCreateProjectDialog(false, element)" ><i class="icon-edit mr-r2"></i></span>
              <span><i (click)="openDeleteProjectDialog(element)" class="icon-trash"></i></span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator
            *ngIf="!(isFetchingProjects$ | async) && totalResults > pageSizeOptions[0]"
            class="mt-3"
            (page)="handlePageChange($event)"
            [length]="totalResults"
            [pageSize]="projectListRequest.count"
            [showFirstLastButtons]="true"
            [pageSizeOptions]="pageSizeOptions"
            [hidePageSize]="false"
            [pageIndex]="projectListRequest.page - 1"
        ></mat-paginator>
      </div>
   </div>
</ng-container>


<!-- Date Picker  -->
<ng-template #datepickerTemplate>
  <div class="datepicker-modal">
      <div class="modal-body">
          <app-datepicker-wrapper
              [inputStartDate]="selectedDateRange?.startDate"
              [inputEndDate]="selectedDateRange?.endDate"
              [alwaysShowCalendars]="true"
              [ranges]="datePickerOption"
              [selectedRangeLabel]="selectedRangeLabel"
              [showCustomRangeLabel]="true"
              [showClearButton]="false"
              [showCancel]="true"
              [linkedCalendars]="true"
              [showDropdowns]="true"
              (rangeClicked)="dateSelectedCallback($event)"
              (datesUpdated)="dateSelectedCallback($event)"
              [keepCalendarOpeningWithRange]="false"
              [showRangeLabelOnInput]="false"
              [dateFieldPosition]="dateFieldPosition"
          >
          </app-datepicker-wrapper>
      </div>
  </div>
</ng-template>
