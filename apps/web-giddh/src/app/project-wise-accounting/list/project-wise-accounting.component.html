<ng-container
  appTranslate
  [file]="'project-wise-account'"
  (localeData)="localeData = $event"
  (commonLocaleData)="commonLocaleData = $event"
>

 <hamburger-menu></hamburger-menu>
  <div *ngIf="(isFetchingProjects$ | async) && !totalResults && !isSearch && !(isShowSearchBox.name || isShowSearchBox.status)">
    <giddh-page-loader></giddh-page-loader>
  </div>
   <div class="project clearfix section-center position-relative overflow-visible pd-2">
      <div class="d-flex align-items-center justify-content-space-between section-center" *ngIf="totalResults || isSearch || isShowSearchBox.name || isShowSearchBox.status">
        <div class="d-flex flex-row justify-content-center align-items-center">
          <div class="custom-datepicker" (click)="showGiddhDatepicker($event)">
              <input
                matInput
                type="text"
                name="selectedDateRange"
                aria-label="Select date range"
                [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                class="giddh-datepicker date-range-picker"
              />
          </div>
          <div *ngIf="isCompany" class="mr-l1">
              <reactive-dropdown-field
                  [label]="commonLocaleData?.app_branch"
                  [options]="branches"
                  (selectedOption)="projectListRequest.branchUniqueName = $event?.value; isSearch = true; getAllProjectList()"
                  (onClear)="projectListRequest.branchUniqueName = ''; isSearch = false; getAllProjectList()"
                  [labelValue]="activeCompany?.name"
                  [placeholder]="commonLocaleData?.app_select_branch"
              ></reactive-dropdown-field>
          </div>
          <button *ngIf="(projectName.value?.length || projectStatus.value?.length)" mat-stroked-button class="min-width-100 mr-l1" (click)="resetFilter()">
              <span class="icon-cross icon-font-14"></span> {{ commonLocaleData?.app_clear_filter }}
          </button>
        </div>
        <div *ngIf="!isCompany" class="pull-right">
          <button mat-raised-button color="primary" (click)="openCreateProjectDialog(true)">+ {{ localeData?.create_project }}</button>
        </div>
      </div>
      <div *ngIf="!(isFetchingProjects$ | async) && !(totalResults || isSearch)" class="min-height d-flex align-items-center justify-content-center">
        <button *ngIf="!isCompany" mat-raised-button color="primary" (click)="openCreateProjectDialog(true)">+ {{ localeData?.create_project }}</button>
        <div class="d-flex justify-content-center align-items-center" *ngIf="isCompany">
            <span class="font-24 mr-r1">{{ localeData?.go_to_branch_information }} </span>
            <button
                mat-stroked-button
                color="primary"
                (click)="gotToBranchTab()"
            >
              {{ localeData?.go_to_branch }}
            </button>
        </div>
      </div>
      <div class="mr-t5 overflow-visible table-header-sticky" *ngIf="totalResults || isSearch || isShowSearchBox.name || isShowSearchBox.status">
        <table
          *ngIf="(!isCompany || totalResults || projectName.value?.length || projectStatus.value?.length || isShowSearchBox.name || isShowSearchBox.status)"
          mat-table
          matSort
          [dataSource]="dataSource"
          [matSortActive]="projectListRequest.sortBy"
          [matSortDirection]="projectListRequest.sort"
          (matSortChange)="sortChange($event)"
          class="giddh-table w-100"
        >
          <!-- Position Column -->
          <ng-container matColumnDef="sno">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}.</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th
                mat-header-cell
                *matHeaderCellDef
                mat-sort-header
                class="max-width-150 "
                #searchName
                (clickOutside)="handleClickOutside($event, searchName, 'name')"
            >
              <div (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
                <ng-container
                    *ngTemplateOutlet="
                        searchTemplate;
                        context: {
                            $implicit: isShowSearchBox.name,
                            fieldName: 'name',
                            formControl: projectName,
                            title: localeData?.project_name
                        }
                    "
                ></ng-container>
              </div>
            </th>
            <td mat-cell *matCellDef="let element">
              <a [routerLink]="['/pages/project-wise-accounting', 'income', 'list', element.uniqueName]">{{element.name}}</a></td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell
                mat-sort-header
                *matHeaderCellDef
                class="max-width-150"
                #searchStatus
                (clickOutside)="handleClickOutside($event, searchStatus, 'status')"
            >
              <div (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
                  <ng-container
                      *ngTemplateOutlet="
                          searchTemplate;
                          context: {
                              $implicit: isShowSearchBox.status,
                              fieldName: 'status',
                              formControl: projectStatus,
                              title: commonLocaleData?.app_status
                          }
                      "
                  ></ng-container>
              </div>
            </th>
            <td mat-cell *matCellDef="let element">{{element.status}}</td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef class="text-center">{{ localeData?.profit_and_loss}}</th>
            <td mat-cell *matCellDef="let element" class="text-center">
              <mat-spinner *ngIf="element.profitAndLoss === -2" class="ml-auto mr-auto" [diameter]="30"></mat-spinner>
              <button mat-stroked-button class="z-index-0" *ngIf="element.profitAndLoss === -1" (click)="getProfitLoss(element)" aria-label="Show profit and loss" >{{ commonLocaleData?.app_show }}</button>
              <span *ngIf="element.profitAndLoss > -1">{{ element.profitAndLoss }}</span>
            </td>
          </ng-container>

          <!-- Action Column -->
          <ng-container *ngIf="!isCompany" matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="text-right">{{ commonLocaleData?.app_action }}</th>
            <td mat-cell *matCellDef="let element" class="text-right">
              <span [matMenuTriggerFor]="menu" class="cursor-pointer">
                  <i class="icon-dots-three-vertical"></i>
              </span>
              <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="openCreateProjectDialog(false, element)">
                      {{ commonLocaleData?.app_edit }}
                  </button>
                  <button mat-menu-item (click)="openDeleteProjectDialog(element)">
                      {{ commonLocaleData?.app_delete }}
                  </button>
                  <button mat-menu-item (click)="convertToClosedOrInProgress(element)">
                      {{ element.status === projectStatusType.Closed ? commonLocaleData?.app_payment_status?.open : commonLocaleData?.app_close }}
                  </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div class="no-data" *ngIf="!(isFetchingProjects$ | async) && !totalResults">
          <no-data *ngIf="(projectName.value?.length || projectStatus.value?.length)" [primaryMessage]="commonLocaleData?.app_no_data_found" [secondaryMessage]="' '"></no-data>
          <div *ngIf="!(projectName.value?.length || projectStatus.value?.length) && !(isShowSearchBox.name || isShowSearchBox.status)" class="d-flex justify-content-center align-items-center">
            <span class="font-24 mr-r1">{{ localeData?.go_to_branch_information }} </span>
            <button
                mat-stroked-button
                color="primary"
                (click)="gotToBranchTab()"
            >
                {{ localeData?.go_to_branch }}
            </button>
          </div>
        </div>
        <mat-paginator
            *ngIf="totalResults > pageSizeOptions[0]"
            class="mt-3"
            (page)="handlePageChange($event)"
            [length]="totalResults"
            [pageSize]="projectListRequest.count"
            [showFirstLastButtons]="true"
            [pageSizeOptions]="pageSizeOptions"
            [hidePageSize]="false"
            [pageIndex]="projectListRequest.page - 1"
        ></mat-paginator>
      </div>
   </div>
</ng-container>


<!-- Date Picker  -->
<ng-template #datepickerTemplate>
  <div class="datepicker-modal">
      <div class="modal-body">
          <app-datepicker-wrapper
              [inputStartDate]="selectedDateRange?.startDate"
              [inputEndDate]="selectedDateRange?.endDate"
              [alwaysShowCalendars]="true"
              [ranges]="datePickerOption"
              [selectedRangeLabel]="selectedRangeLabel"
              [showCustomRangeLabel]="true"
              [showClearButton]="false"
              [showCancel]="true"
              [linkedCalendars]="true"
              [showDropdowns]="true"
              (rangeClicked)="dateSelectedCallback($event)"
              (datesUpdated)="dateSelectedCallback($event)"
              [keepCalendarOpeningWithRange]="false"
              [showRangeLabelOnInput]="false"
              [dateFieldPosition]="dateFieldPosition"
          >
          </app-datepicker-wrapper>
      </div>
  </div>
</ng-template>
<ng-template
  #searchTemplate
  let-show
  let-title="title"
  let-placeholder="placeholder"
  let-fieldName="fieldName"
  let-formControl="formControl"
>
  <div class="align-items-center d-flex column-gap5" [hidden]="show">
      <button
          mat-icon-button
          aria-label="search"
          (click)="toggleSearch(fieldName)"
          class="project-search-icon font-16"
      >
          <span class="icon-search"></span>
      </button>
      <span> {{ title }}</span>
  </div>
  <div class="align-items-center d-flex" [hidden]="!show">
      <text-field
          [type]="'text'"
          [placeholder]="getSearchFieldText(fieldName)"
          [cssClass]="'form-control search-table'"
          [formControl]="formControl"
          [autoFocus]="show"
      ></text-field>
  </div>
</ng-template>
