<ng-container
  appTranslate
  [file]="'project-wise-account'"
  (localeData)="localeData = $event"
  (commonLocaleData)="commonLocaleData = $event">


  <div *ngIf="(isFetchingProjects$ | async) && !totalResults">
    <giddh-page-loader></giddh-page-loader>
  </div>
   <div class="project clearfix section-center position-relative overflow-visible pd-2">
      <div class="d-flex align-items-center justify-content-space-between section-center" *ngIf="totalResults">
        <div class="custom-datepicker" (click)="showGiddhDatepicker($event)">
            <input
              matInput
              type="text"
              name="selectedDateRange"
              aria-label="Select date range"
              [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
              class="giddh-datepicker date-range-picker"
            />
        </div>
        <div class="pull-right">
          <button mat-raised-button color="primary" (click)="openCreateProjectDialog(true)">{{ localeData?.create_project }}</button>
        </div>
      </div>
      <div class="min-height d-flex align-items-center justify-content-center" *ngIf="!(isFetchingProjects$ | async) && !totalResults">
        <button mat-raised-button color="primary" (click)="openCreateProjectDialog(true)">{{ localeData?.create_project }}</button>
      </div>
      <div class="mr-t5 overflow-visible table-header-sticky" *ngIf="totalResults">
        <table
          mat-table
          matSort
          [dataSource]="dataSource"
          [matSortActive]="projectListRequest.sortBy"
          [matSortDirection]="projectListRequest.sort"
          (matSortChange)="sortChange($event)"
          class="giddh-table basic w-100"
        >
          <!-- Position Column -->
          <ng-container matColumnDef="Sno">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}.</td>
          </ng-container>

          <!-- Name Column -->
           
          <ng-container matColumnDef="Name">
            <th
                mat-header-cell
                *matHeaderCellDef
                mat-sort-header
                class="max-width-150 td-search-box"
                (clickOutside)="showProductSearchBox(false)"
            >
                <div [hidden]="showProductSearch">
                    <span>{{ localeData?.product_name }}</span>
                    <i class="icon-search" (click)="$event.stopPropagation(); showProductSearchBox(true)"></i>
                </div>

                <div class="mr-t1" [hidden]="!showProductSearch" (click)="$event.stopPropagation()">
                    <input-field
                        [type]="'text'"
                        [name]="'Product Name'"
                        [placeholder]="commonLocaleData?.app_select"
                        [label]="localeData?.search_product"
                        #productSearch
                        [formControl]="projectName"
                    >
                    </input-field>
                </div>
            </th>
            <td mat-cell *matCellDef="let element">
              <a [routerLink]="['/pages/project-wise-accounting', 'revenue', 'list', element.uniqueName]">{{element.name}}</a></td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="Status">
            <th mat-header-cell mat-sort-header *matHeaderCellDef class="sortable-header-justify-center">{{ commonLocaleData?.app_status }}</th>
            <td mat-cell *matCellDef="let element">{{element.status}}</td>
          </ng-container>

            <!-- Archived Column -->
          <ng-container matColumnDef="Archive Status">
            <th mat-header-cell mat-sort-header *matHeaderCellDef>{{ commonLocaleData?.app_archived }}</th>
            <td mat-cell *matCellDef="let element">{{element.archiveStatus}}</td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="Symbol">
            <th mat-header-cell *matHeaderCellDef>{{ localeData?.profit_and_loss}}</th>
            <td mat-cell *matCellDef="let element">
              <button mat-stroked-button *ngIf="element.profitAndLoss === -1" (click)="getProfitLoss(element)" aria-label="Show profit and loss" >{{ commonLocaleData?.app_show }}</button>
              <span *ngIf="element.profitAndLoss > -1" >{{ element.profitAndLoss }}</span>
            </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="Action">
            <th mat-header-cell *matHeaderCellDef class="text-center">{{ commonLocaleData?.app_archived }}</th>
            <td mat-cell *matCellDef="let element" class="text-center cursor-pointer">
              <span (click)="openCreateProjectDialog(false, element)" ><i class="icon-edit mr-r2"></i></span>
              <span><i (click)="openDeleteProjectDialog(element)" class="icon-trash"></i></span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator
            *ngIf="totalResults > pageSizeOptions[0]"
            class="mt-3"
            (page)="handlePageChange($event)"
            [length]="totalResults"
            [pageSize]="projectListRequest.count"
            [showFirstLastButtons]="true"
            [pageSizeOptions]="pageSizeOptions"
            [hidePageSize]="false"
            [pageIndex]="projectListRequest.page - 1"
        ></mat-paginator>
      </div>
   </div>
</ng-container>


<!-- Date Picker  -->
<ng-template #datepickerTemplate>
  <div class="datepicker-modal">
      <div class="modal-body">
          <app-datepicker-wrapper
              [inputStartDate]="selectedDateRange?.startDate"
              [inputEndDate]="selectedDateRange?.endDate"
              [alwaysShowCalendars]="true"
              [ranges]="datePickerOption"
              [selectedRangeLabel]="selectedRangeLabel"
              [showCustomRangeLabel]="true"
              [showClearButton]="false"
              [showCancel]="true"
              [linkedCalendars]="true"
              [showDropdowns]="true"
              (rangeClicked)="dateSelectedCallback($event)"
              (datesUpdated)="dateSelectedCallback($event)"
              [keepCalendarOpeningWithRange]="false"
              [showRangeLabelOnInput]="false"
              [dateFieldPosition]="dateFieldPosition"
          >
          </app-datepicker-wrapper>
      </div>
  </div>
</ng-template>
