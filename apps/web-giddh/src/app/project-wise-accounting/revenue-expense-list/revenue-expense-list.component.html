<ng-container 
    appTranslate 
    [file]="'project-wise-account'"
    (localeData)="localeData = $event" 
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="project-wise-accounting">
        <mat-tab-group 
            mat-stretch-tabs="false" 
            mat-align-tabs="start" 
            class="w-100"
            [selectedIndex]="selectedTabIndex"
            (selectedTabChange)="tabChanged($event)"
        >
            <mat-tab [label]="localeData?.revenue">
                <ng-container *ngTemplateOutlet="commonTemplateForIncomeAndExpense"></ng-container>
            </mat-tab>
            <mat-tab [label]="localeData?.expense"> 
                <ng-container *ngTemplateOutlet="commonTemplateForIncomeAndExpense"></ng-container>
            </mat-tab>
            <mat-tab [label]="localeData?.profit_and_loss">
                <div class="pd-15" *ngIf="defaultParamsValue?.projectUniqueName">
                    <profit-loss [projectUniqueName]="defaultParamsValue.projectUniqueName" [selectedCompany]="activeCompany"></profit-loss>
                </div>
            </mat-tab>
        </mat-tab-group>
    </div>
</ng-container>

<ng-template #commonTemplateForIncomeAndExpense>
    <div class="section-center pd-15">
       <header class="d-flex align-items-center justify-content-space-between">
            <div class="custom-datepicker" (click)="showGiddhDatepicker($event)">
                <input 
                    type="text" 
                    name="selectedDateRange"
                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                    class="giddh-datepicker date-range-picker" 
                />
            </div>
            <div>
                <span>{{ localeData?.total_revenue }} : {{ totalResults }}</span>&nbsp;&nbsp;
                <button [routerLink]="'/pages/project-wise-accounting/list'" mat-stroked-button>
                    {{ commonLocaleData?.app_back }}
                </button>
            </div>
       </header>
        <giddh-page-loader *ngIf="(isFetchingProjects$ | async)">
        </giddh-page-loader>
        <div class="table-responsive mt-5" *ngIf="!(isFetchingProjects$ | async)">
            <table class="table entry-table editable-table">
                <thead>
                    <tr>
                        <th class="text-left">{{ commonLocaleData?.app_select_account }}</th>
                        <th class="text-left">{{ localeData?.select_entry }}</th>
                        <th class="text-left">{{ commonLocaleData?.app_select_method }}</th>
                        <th class="text-left">{{ commonLocaleData?.app_amount }}</th>
                        <th class="text-left">{{ commonLocaleData?.app_action }}</th>
                    </tr>
                    <tr [formGroup]="createAccountEntryForm">
                        <td>
                            <reactive-dropdown-field 
                                [label]="commonLocaleData?.app_select_account" 
                                [placeholder]="commonLocaleData?.app_select"
                                [options]="accountSearchResponse"
                                [labelValue]="createAccountEntryForm.get('account')?.value"
                                formControlName="accountUniqueName"
                                [enableDynamicSearch]="true"
                                [isPaginationEnabled]="true" 
                                (scrollEnd)="handleSearchAccountScrollEnd()"
                                (dynamicSearchedQuery)="searchAccount($event)"
                                (selectedOption)="selectAccount($event.value); ($event.label != createAccountEntryForm.get('account')?.value) && (createAccountEntryForm.get('entryUniqueName')?.patchValue(null) || createAccountEntryForm.get('entry')?.patchValue(null)); createAccountEntryForm.get('account')?.patchValue($event.label)"
                                (onClear)="createAccountEntryForm.get('account')?.patchValue(null); createAccountEntryForm.get('accountUniqueName')?.patchValue(null)"
                                [showError]="!isCreateAccountValidForm && !createAccountEntryForm.get('accountUniqueName')?.value"
                            >
                            </reactive-dropdown-field>
                        </td>
                        <td>
                            <reactive-dropdown-field 
                                (click)="currentEntry(createAccountEntryForm.get('accountUniqueName')?.value)"
                                [label]="localeData?.select_entry" 
                                [placeholder]="commonLocaleData?.app_select"
                                [options]="accountAndEntryList[createAccountEntryForm.get('accountUniqueName')?.value]?.data"
                                [labelValue]="createAccountEntryForm.get('entry')?.value" 
                                formControlName="entryUniqueName"
                                [enableDynamicSearch]="true" 
                                [isPaginationEnabled]="true"
                                (scrollEnd)="handleSearchEntryScrollEnd(createAccountEntryForm.get('accountUniqueName')?.value)"
                                (dynamicSearchedQuery)="searchEntry($event, 1, createAccountEntryForm.get('accountUniqueName')?.value)"
                                (selectedOption)="createAccountEntryForm.get('entry')?.patchValue($event.label)"
                                (onClear)="createAccountEntryForm.get('entry')?.patchValue(null); createAccountEntryForm.get('entryUniqueName')?.patchValue(null)"
                                [showError]="!isCreateAccountValidForm && !createAccountEntryForm.get('entryUniqueName')?.value"
                            >
                            </reactive-dropdown-field>
                        </td>
    
                        <td>
                            <reactive-dropdown-field 
                                [label]="commonLocaleData?.app_select_method" 
                                [placeholder]="commonLocaleData?.app_select"
                                [options]="selectMethod" 
                                [labelValue]="createAccountEntryForm.get('calculationMethod')?.value"
                                formControlName="calculationMethod"
                                (onClear)="createAccountEntryForm.get('calculationMethod')?.patchValue(null);"
                                [showError]="!isCreateAccountValidForm && !createAccountEntryForm.get('calculationMethod')?.value"
                            >
                            </reactive-dropdown-field>
                        </td>
                        <td>
                            <input-field 
                                [name]="'amount'" 
                                [type]="'number'" 
                                [label]="commonLocaleData?.app_amount"
                                [placeholder]="localeData?.enter_amount" 
                                formControlName="value"
                                [showError]="!isCreateAccountValidForm && !createAccountEntryForm.get('value')?.value"
                            >
                            </input-field>
                        </td>
                        <td class="text-center">
                            <button 
                                mat-stroked-button 
                                color="primary" 
                                (click)="createEntry()"
                            >
                            {{ commonLocaleData?.app_save }}</button>
                        </td>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <ng-container *ngIf="totalResults" [formGroup]="accountEntryListForm" >
                        <ng-container formArrayName="entryList">
                            <ng-container
                                *ngFor="let entry of accountEntryListForm.get('entryList')['controls']; let i = index">
                                <tr [formGroupName]="i" [ngClass]="{'active-row' : activeRowIndex === i}" (mouseenter)="activeRowIndex = i" (mouseleave)="activeRowIndex = -1">
                                    <td>
                                        <reactive-dropdown-field 
                                            [label]="commonLocaleData?.app_select_account" 
                                            [placeholder]="commonLocaleData?.app_select"
                                            [labelValue]="entry?.get('account')?.value"
                                            [options]="accountSearchResponse"
                                            formControlName="accountUniqueName" 
                                            [enableDynamicSearch]="true"
                                            [isPaginationEnabled]="true" 
                                            (scrollEnd)="handleSearchAccountScrollEnd()"
                                            (dynamicSearchedQuery)="searchAccount($event)"
                                            (onClear)="entry?.get('accountUniqueName')?.patchValue(null); entry?.get('entryUniqueName')?.patchValue(null) ; entry?.get('entry')?.patchValue(null)"
                                            (selectedOption)="selectAccount($event.value); ($event.label != entry?.get('account')?.value) && (entry?.get('entryUniqueName')?.patchValue(null) || entry?.get('entry')?.patchValue(null)); entry?.get('account')?.patchValue($event.label)"
                                            [showError]="!entry?.get('accountUniqueName')?.value"
                                        >
                                        </reactive-dropdown-field>
                                    </td>
                                    <td>
                                        <reactive-dropdown-field 
                                            (click)="currentEntry(entry?.get('accountUniqueName')?.value)"
                                            [label]="localeData?.select_entry" 
                                            [placeholder]="commonLocaleData?.app_select"
                                            [labelValue]="entry?.get('entry')?.value" 
                                            [options]="accountAndEntryList[entry?.get('accountUniqueName')?.value]?.data"
                                            formControlName="entryUniqueName" 
                                            [enableDynamicSearch]="true"
                                            [isPaginationEnabled]="true"
                                            (scrollEnd)="handleSearchEntryScrollEnd(entry?.get('accountUniqueName')?.value)"
                                            (selectedOption)="entry?.get('entry')?.patchValue($event.label)"
                                            (onClear)="entry?.get('entryUniqueName')?.patchValue(null)"
                                            (dynamicSearchedQuery)="searchEntry($event, 1, entry?.get('accountUniqueName')?.value)"
                                            [showError]="!entry?.get('entryUniqueName')?.value"
                                        >
                                        </reactive-dropdown-field>
                                    </td>
    
                                    <td>
                                        <reactive-dropdown-field 
                                            [label]="commonLocaleData?.app_select_method" 
                                            [placeholder]="commonLocaleData?.app_select"
                                            [labelValue]="entry?.get('calculationMethod')?.value" 
                                            [options]="selectMethod"
                                            formControlName="calculationMethod"
                                            (onClear)="entry?.get('calculationMethod')?.patchValue(null)"
                                            [showError]="!entry?.get('calculationMethod')?.value"
                                        >
                                        </reactive-dropdown-field>
                                    </td>
                                    <td>
                                        <input-field 
                                            [name]="'amount'" 
                                            [type]="'number'" 
                                            [label]="commonLocaleData?.app_amount"
                                            [placeholder]="localeData?.enter_amount" 
                                            formControlName="value"
                                            [min]="1"
                                        >
                                        </input-field>
                                    </td>
                                    <td class="position-relative text-center">
                                        <span class="editable-table-hide-element">
                                            <button mat-stroked-button color="primary" (click)="entry?.valid && updateSingleEntry(i)">{{ commonLocaleData?.app_update }}</button>
                                            <i (click)="deleteEntry(i)" color="primary" class="cursor-pointer icon-trash font-16 position-absolute"></i>
                                        </span>
                                    </td>
                                </tr>
                            </ng-container>
                        </ng-container>
                    </ng-container>
                    <tr>
                        <td colspan="100%">
                            <div class="no-data" *ngIf="!totalResults">
                                <no-data [primaryMessage]="commonLocaleData?.app_no_data_found" [secondaryMessage]="' '"></no-data>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
           
            <mat-paginator
                *ngIf="totalResults > pageSizeOptions[0] && !(isFetchingProjects$ | async)"
                class="mt-3"
                (page)="handlePageChange($event)"
                [length]="totalResults"
                [pageSize]="getProjectEntryListRequest.count"
                [showFirstLastButtons]="true"
                [pageSizeOptions]="pageSizeOptions"
                [hidePageSize]="false"
                [pageIndex]="getProjectEntryListRequest.page - 1"
            ></mat-paginator>
        </div>
    </div>
</ng-template>

<!-- Date Picker  -->
<ng-template #datepickerTemplate>
    <div class="datepicker-modal">
        <div class="modal-body">
            <app-datepicker-wrapper 
            [inputStartDate]="selectedDateRange?.startDate"
            [inputEndDate]="selectedDateRange?.endDate" 
            [alwaysShowCalendars]="true" 
            [ranges]="datePickerOption"
            [selectedRangeLabel]="selectedRangeLabel" 
            [showCustomRangeLabel]="true" 
            [showClearButton]="false"
            [showCancel]="true" 
            [linkedCalendars]="true" 
            [showDropdowns]="true"
            (rangeClicked)="dateSelectedCallback($event)" 
            (datesUpdated)="dateSelectedCallback($event)"
            [keepCalendarOpeningWithRange]="false" 
            [showRangeLabelOnInput]="false"
            [dateFieldPosition]="dateFieldPosition">
            </app-datepicker-wrapper>
        </div>
    </div>
</ng-template>
