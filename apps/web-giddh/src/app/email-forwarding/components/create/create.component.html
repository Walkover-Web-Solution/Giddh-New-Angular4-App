<ng-container
    appTranslate
    [file]="'email-forwarding'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <hamburger-menu></hamburger-menu>
    <div class="container-fluid p-3">
        <!-- Loading Spinner -->
        <div *ngIf="isLoading && isEditMode" class="min-h-400 p-4 d-flex justify-content-center align-items-center">
            <giddh-page-loader></giddh-page-loader>
        </div>

        <!-- Stepper Form -->
        <div [hidden]="isLoading && isEditMode" class="row">
            <div class="col-12">
                <mat-card class="overflow-hidden">
                    <mat-card-content class="p-4">
                        <mat-stepper #stepper orientation="horizontal" linear class="max-w-1000 mx-auto">
                            <!-- Step 1: Create Email -->
                            <mat-step [stepControl]="emailForwardingForm" [label]="localeData?.create_email">
                                <form [formGroup]="emailForwardingForm" class="min-h-400">
                                    <div class="row min-h-150">
                                        <div class="col-12">
                                            <!-- Display Mode -->
                                            <div *ngIf="!isEditingEmail" class="text-center w-fit-content mx-auto">
                                                <div class="email-display p-3 border rounded mb-3">
                                                    <p class="mb-0 font-size-16 font-weight-medium">
                                                        {{ getCompleteEmail() }}
                                                    </p>
                                                </div>
                                                <p class="mb-3">
                                                    <a
                                                        href="{{ bankStatementHelpDocUrl }}"
                                                        class="text-underline"
                                                        target="_blank"
                                                        >{{ localeData?.how_to_setup }}</a
                                                    >
                                                </p>
                                                <div class="d-flex justify-content-center gap-2">
                                                    <button
                                                        mat-stroked-button
                                                        (click)="copyEmail()"
                                                        ngxClipboard
                                                        [cbContent]="getCompleteEmail()"
                                                        class="mr-2"
                                                    >
                                                        <i class="icon-copy mr-1"></i>
                                                        {{ isCopied ? localeData?.copied : commonLocaleData?.app_copy }}
                                                    </button>
                                                    <button mat-stroked-button (click)="toggleEmailEdit()">
                                                        <i class="icon-edit mr-1"></i>
                                                        {{ commonLocaleData?.app_edit }}
                                                    </button>
                                                </div>
                                            </div>

                                            <!-- Edit Mode -->
                                            <div *ngIf="isEditingEmail" class="text-center w-fit-content mx-auto">
                                                <input-field
                                                    class="d-block mb-3"
                                                    [label]="localeData?.forwarded_mail"
                                                    [cssClass]="'text-right'"
                                                    formControlName="forwardedMail"
                                                    [matSuffix]="forwardedMailDomain"
                                                    [required]="true"
                                                ></input-field>
                                                <div class="d-flex justify-content-center gap-2">
                                                    <button
                                                        mat-raised-button
                                                        color="primary"
                                                        (click)="toggleEmailEdit(); replaceUrlEmail()"
                                                        class="mr-2"
                                                    >
                                                        {{ commonLocaleData?.app_save }}
                                                    </button>
                                                    <button mat-stroked-button (click)="toggleEmailEdit(true)">
                                                        {{ commonLocaleData?.app_cancel }}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-4"></div>
                                    </div>

                                    <div class="d-flex justify-content-center mt-4">
                                        <button
                                            mat-raised-button
                                            color="primary"
                                            (click)="nextStep(stepper, emailForwardingForm, 1)"
                                        >
                                            {{ commonLocaleData?.app_next }}
                                            <i class="icon-arrow-right ml-2"></i>
                                        </button>
                                    </div>
                                </form>
                            </mat-step>

                            <!-- Step 2: Email Verification -->
                            <mat-step [stepControl]="emailForwardingForm" [label]="localeData?.email_verification">
                                <form [formGroup]="emailForwardingForm" class="min-h-400">
                                    <div class="row min-h-150">
                                        <div class="col-12 text-center">
                                            <!-- Waiting State -->
                                            <div class="w-fit-content mx-auto" *ngIf="!emailForwardingResponse">
                                                <ng-container *ngTemplateOutlet="emailDisplayTemplate"></ng-container>

                                                <h2
                                                    class="border border-dashed d-flex flex-column align-items-center font-size-18 justify-content-center border-radius-12 p-4 min-h-150"
                                                >
                                                    <span>{{ localeData?.waiting_verification }}</span>
                                                    <mat-spinner diameter="20"></mat-spinner>
                                                </h2>
                                            </div>

                                            <!-- Verification State -->
                                            <div class="w-fit-content mx-auto" *ngIf="emailForwardingResponse">
                                                <ng-container *ngTemplateOutlet="emailDisplayTemplate"></ng-container>

                                                <div class="d-flex flex-column align-items-center gap-3 p-4">
                                                    <div class="d-flex column-gap-1">
                                                        <button
                                                            mat-raised-button
                                                            color="primary"
                                                            (click)="handleVerifyAndNext()"
                                                        >
                                                            {{ localeData?.verify_and_next }}
                                                        </button>
                                                        <button
                                                            mat-stroked-button
                                                            color="warn"
                                                            (click)="handleCancel()"
                                                        >
                                                            {{ commonLocaleData?.app_cancel }}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </mat-step>

                            <!-- Step 3: Bank Account Details -->
                            <mat-step [stepControl]="emailForwardingForm" [label]="localeData?.account_details">
                                <form [formGroup]="emailForwardingForm" class="min-h-400">
                                    <div class="row min-h-150">
                                        <div class="col-12 mb-4">
                                            <div
                                                class="max-w-500 mx-auto d-flex flex-column row-gap-1 align-items-center"
                                            >
                                                {{ emailForwardingForm.get("accountUniqueName")?.value }}
                                                <reactive-dropdown-field
                                                    class="d-block w-75"
                                                    [label]="commonLocaleData?.app_account"
                                                    [placeholder]="commonLocaleData?.app_select_account"
                                                    [options]="accountSearchResponse$ | async"
                                                    formControlName="accountUniqueName"
                                                    [required]="true"
                                                    [showError]="
                                                        isFormSubmitted &&
                                                        emailForwardingForm.get('accountUniqueName')?.invalid
                                                    "
                                                >
                                                </reactive-dropdown-field>
                                                <input-field
                                                    class="d-block w-75"
                                                    [label]="localeData?.original_email"
                                                    formControlName="originalEmail"
                                                    [showError]="
                                                        emailForwardingForm.get('originalEmail')?.value &&
                                                        emailForwardingForm.get('originalEmail')?.invalid
                                                    "
                                                ></input-field>
                                                <input-field
                                                    class="d-block w-75"
                                                    [label]="commonLocaleData?.app_password"
                                                    [type]="'password'"
                                                    formControlName="password"
                                                ></input-field>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center mt-4">
                                        <button
                                            mat-raised-button
                                            color="primary"
                                            (click)="submitForm()"
                                            [disabled]="isLoading"
                                        >
                                            <mat-spinner *ngIf="isLoading" diameter="20" class="mr-2"></mat-spinner>
                                            {{ isEditMode ? commonLocaleData?.app_update : commonLocaleData?.app_done }}
                                        </button>
                                    </div>
                                </form>
                            </mat-step>
                        </mat-stepper>
                    </mat-card-content>
                </mat-card>
            </div>
        </div>
    </div>

    <!-- Common Email Display Template -->
    <ng-template #emailDisplayTemplate>
        <p class="mb-3 text-light d-inline-flex align-items-center column-gap-05">
            {{ localeData?.forwarded_to }}
            <span class="text-green">{{ getCompleteEmail() }}</span>
            <i
                class="icon-copy cursor-pointer"
                [matTooltip]="commonLocaleData?.app_copy"
                matTooltipPosition="after"
                (click)="copyEmail()"
                ngxClipboard
                [cbContent]="getCompleteEmail()"
            ></i>
            <span *ngIf="isCopied" class="text-green">{{ localeData?.copied }}</span>
        </p>
    </ng-template>
</ng-container>
