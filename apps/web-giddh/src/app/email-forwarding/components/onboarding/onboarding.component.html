<ng-container
    appTranslate
    [file]="'email-forwarding'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <hamburger-menu></hamburger-menu>
    <div class="container-fluid h-100 onboarding p-3">
        <!-- Loading State -->
        <div *ngIf="isCheckingExistingData" class="row justify-content-center align-items-center h-100">
            <div class="col-12 text-center">
                <giddh-page-loader></giddh-page-loader>
            </div>
        </div>

        <!-- Main Content -->
        <div *ngIf="!isCheckingExistingData" class="row justify-content-center align-items-center h-100">
            <div class="col-md-8 col-lg-6">
                <div class="d-flex align-items-center justify-content-center my-5 column-gap-2">
                    <div
                        class="onboarding-steps text-center d-flex align-items-center justify-content-center flex-column row-gap-1"
                    >
                        <i class="font-size-32 icon-mail"></i>
                        <p class="font-size-14 font-weight-medium">{{ localeData?.create_email }}</p>
                    </div>
                    <mat-divider class="width-100"></mat-divider>
                    <div
                        class="onboarding-steps text-center d-flex align-items-center justify-content-center flex-column row-gap-1"
                    >
                        <i class="font-size-32 icon-branch-alice"></i>
                        <p class="font-size-14 font-weight-medium">
                            {{ localeData?.email_forwarding }}
                        </p>
                    </div>
                    <mat-divider class="width-100"></mat-divider>
                    <div
                        class="onboarding-steps text-center d-flex align-items-center justify-content-center flex-column row-gap-1"
                    >
                        <i class="font-size-32 icon-subscription2"></i>
                        <p class="font-size-14 font-weight-medium">{{ localeData?.verify_start }}</p>
                    </div>
                </div>
                <div class="text-center">
                    <button mat-raised-button color="primary" (click)="getEmail()" class="mb-5">
                        {{ commonLocaleData?.app_start }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</ng-container>
