<form
    name="permissionForm"
    [formGroup]="permissionForm"
    [ngClass]="{ 'permission-form': isHorizntl }"
    (ngSubmit)="submitPermissionForm()"
    autocomplete="off"
>
    <div class="d-flex align-items-center justify-content-between form-wrapper">
        <div
            class="field-wrapper d-flex align-items-center column-gap-15 row-gap-15"
            [ngClass]="{ 'flex-wrap w-100 permission-update-mode': isUpdtCase }"
        >
            <div>
                <input-field
                    [label]="isLblShow ? localeData?.unique_name_email_label : ''"
                    [type]="'text'"
                    [name]="'emailId'"
                    formControlName="emailId"
                    [pattern]="giddhEmailRegex"
                    [placeholder]="localeData?.unique_name_email_placeholder"
                    [readonly]="userdata?.uniqueName"
                    [disabled]="isUserRestricted"
                    [required]="true"
                    [showError]="isFormInvalid && permissionForm?.get('emailId').invalid"
                ></input-field>
            </div>
            <div>
                <reactive-dropdown-field
                    [label]="isUserRestricted ? '' : isLblShow ? localeData?.role_name_label : ''"
                    [name]="'roles'"
                    [placeholder]="localeData?.role_name_placeholder"
                    [options]="allRoles"
                    formControlName="roleUniqueName"
                    [required]="true"
                    [readonly]="isUserRestricted"
                    [disabled]="isUserRestricted"
                    [showError]="isFormInvalid && permissionForm?.get('roleUniqueName').invalid"
                ></reactive-dropdown-field>
            </div>
            <!-- time span -->
            <div [exclude]="'.time-span-dropdown'" [attachOutsideOnClick]="true" (clickOutside)="methodForToggleSection('timeSpanSection')">
                <button
                    matButton="outlined"
                    [matMenuTriggerFor]="menu"
                    (click)="showTimeSpan = !showTimeSpan"
                    type="button"
                    class="mat-select-btn border border-radius-4 custom-mat-form-field-height justify-content-between p-3 text-left w-100"
                    [disabled]="isUserRestricted"
                >
                    <span class="d-flex w-100 font-weight-regular">
                        {{ selectedTimeSpan }}
                        <span class="ml-auto"><span class="fa fa-caret-down font-size-15 mr-2"></span></span>
                    </span>
                </button>
                <mat-menu #menu="matMenu">
                    <section class="mb-2 time-span-dropdown max-w-300" (click)="$event.stopPropagation()">
                        <div class="p-3">
                            <mat-radio-group formControlName="periodOptions" class="d-flex flex-column">
                                <mat-radio-button
                                    value="daterange"
                                    id="dateRange"
                                    color="primary"
                                    (click)="isOpenedInModal ? handleTimeSpanChange('daterange') : ''"
                                    class="w-100 mr-0 mb-1"
                                >
                                    {{ commonLocaleData?.app_date_range }}
                                </mat-radio-button>
                                <mat-radio-button
                                    value="pastperiod"
                                    id="pastPeriod"
                                    color="primary"
                                    (click)="isOpenedInModal ? handleTimeSpanChange('pastperiod') : ''"
                                    class="w-100 mr-0 mt-2"
                                >
                                    {{ localeData?.past_period }}
                                </mat-radio-button>
                            </mat-radio-group>
                        </div>

                        <section
                            class="periods container-fluid mb-2 mt-3"
                            *ngIf="permissionForm.get('periodOptions')?.value === 'daterange'"
                        >
                            <div>
                                <div>
                                    <div class="date-range-wrapper">
                                        <mat-form-field
                                            [matDatepickerToggleIcon]="false"
                                            appearance="outline"
                                            (click)="picker?.open()"
                                            class="initial-height w-100"
                                        >
                                            <mat-label>{{ localeData?.from_to_label }}</mat-label>
                                            <mat-date-range-input [rangePicker]="picker">
                                                <input
                                                    matStartDate
                                                    [placeholder]="commonLocaleData?.app_start_date"
                                                    formControlName="from"
                                                />
                                                <input matEndDate [placeholder]="commonLocaleData?.app_end_date" formControlName="to" />
                                            </mat-date-range-input>
                                            <mat-date-range-picker #picker></mat-date-range-picker>
                                        </mat-form-field>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section
                            class="periods container-fluid mb-2 mt-2"
                            *ngIf="permissionForm.get('periodOptions')?.value === 'pastperiod'"
                        >
                            <div>
                                <div>
                                    <div class="date-range-wrapper">
                                        <input-field
                                            [label]="localeData?.select_past_period_label"
                                            [name]="'duration'"
                                            [allowDecimalDigitsOnly]="true"
                                            formControlName="duration"
                                            [type]="'number'"
                                            [placeholder]="localeData?.select_past_period_placeholder"
                                        ></input-field>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </section>
                </mat-menu>
            </div>
            <!-- time span end -->
            <div>
                <div
                    [exclude]="'.ip-addresses-dropdown'"
                    [attachOutsideOnClick]="true"
                    (clickOutside)="methodForToggleSection('rangeSpanSection')"
                >
                    <button
                        matButton="outlined"
                        [matMenuTriggerFor]="menurange"
                        (click)="showIPWrap = !showIPWrap"
                        type="button"
                        class="mat-select-btn border border-radius-4 custom-mat-form-field-height justify-content-between p-3 text-left w-100"
                        [disabled]="isUserRestricted"
                    >
                        <span class="font-weight-regular">{{ selectedIPRange }}</span>
                        <span class="pull-right"><span class="fa fa-caret-down font-size-15 mr-2"></span></span>
                    </button>
                    <mat-menu #menurange="matMenu">
                        <section class="ip-addresses-dropdown" role="menu" (click)="$event.stopPropagation()">
                            <div class="p-3">
                                <mat-radio-group formControlName="ipOptions" class="d-flex flex-column">
                                    <mat-radio-button
                                        value="cidr_range"
                                        id="cidrRange"
                                        color="primary"
                                        (click)="isOpenedInModal ? handleIpAddressChange('cidr_range') : ''"
                                        class="w-100 mr-0"
                                    >
                                        {{ localeData?.cidr_range }}
                                    </mat-radio-button>
                                    <mat-radio-button
                                        value="ip_address"
                                        id="address"
                                        color="primary"
                                        (click)="isOpenedInModal ? handleIpAddressChange('ip_address') : ''"
                                        class="w-100 mr-0 mt-2"
                                    >
                                        {{ commonLocaleData?.app_address }}
                                    </mat-radio-button>
                                </mat-radio-group>
                            </div>

                            <section
                                formArrayName="allowedCidrs"
                                class="ip-range container-fluid mt-2"
                                *ngIf="permissionForm.get('ipOptions')?.value === 'cidr_range'"
                            >
                                <div
                                    class="d-flex column-gap-1 align-items-center mb-2"
                                    *ngFor="let item of permissionForm.get('allowedCidrs')['controls']; let i = index; let l = last"
                                    [formGroupName]="i"
                                >
                                    <div class="w-100">
                                        <input
                                            class="form-control"
                                            name="item_{{ i }}"
                                            formControlName="range"
                                            type="text"
                                            [placeholder]="localeData?.cidr_example"
                                        />
                                    </div>
                                    <div class="pull-left lh-34">
                                        <i *ngIf="!l" (click)="delRow('allowedCidrs', i, $event)" class="icon-trash cursor-pointer"></i>
                                        <i *ngIf="l" (click)="addNewRow('allowedCidrs', item, $event)" class="icon-plus cursor-pointer"></i>
                                    </div>
                                </div>
                            </section>

                            <section
                                formArrayName="allowedIps"
                                class="ip-range container-fluid mt-2"
                                *ngIf="permissionForm.get('ipOptions')?.value === 'ip_address'"
                            >
                                <div
                                    class="d-flex column-gap-1 align-items-center mb-2"
                                    *ngFor="let item of permissionForm.get('allowedIps')['controls']; let i = index; let l = last"
                                    [formGroupName]="i"
                                >
                                    <div class="w-100">
                                        <input
                                            class="form-control"
                                            (keypress)="allowOnlyNumbersAndDot($event)"
                                            name="item_{{ i }}"
                                            formControlName="range"
                                            type="text"
                                            [placeholder]="localeData?.ip_example"
                                        />
                                    </div>
                                    <div class="pull-left lh-34">
                                        <i *ngIf="!l" (click)="delRow('allowedIps', i, $event)" class="icon-trash cursor-pointer"></i>
                                        <i *ngIf="l" (click)="addNewRow('allowedIps', item, $event)" class="icon-plus cursor-pointer"></i>
                                    </div>
                                </div>
                            </section>
                        </section>
                    </mat-menu>
                </div>
            </div>
            <div class="action-button" [ngClass]="{ 'text-xl-right': isUpdtCase }">
                <button matButton="filled" [ladda]="createPermissionInProcess$ | async" [disabled]="isUserRestricted" class="mr-2">
                    <span *ngIf="!isUpdtCase">{{ commonLocaleData?.app_add }}</span>
                    <span *ngIf="isUpdtCase">{{ commonLocaleData?.app_update }}</span>
                </button>
                <button *ngIf="isUpdtCase" (click)="closeDialog.emit(false)" matButton="outlined" type="button">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </div>
        <div class="ml-auto" *ngIf="isSuperAdminCompany">
            <button
                matButton="filled"
                type="button"
                color="primary"
                *ngIf="!isUpdtCase"
                class="pull-right create-btn mr-0 w125"
                [routerLink]="['/pages/permissions/list']"
                [queryParams]="{ tab: 'settings' }"
            >
                {{ localeData?.add_custom_role }}
            </button>
        </div>
    </div>
    <restricted-module-message
        [restrictedModule]="restrictedModules.Users"
        [isUserRestricted]="isUserRestricted"
        [useRouterLink]="true"
    ></restricted-module-message>
</form>
