<div appTranslate [file]="'settings/company-auth-key'" (localeData)="localeData = $event" (commonLocaleData)="commonLocaleData = $event">
    <div class="company-auth-key p-3 clear-both section-center position-relative overflow-visible">
        <div *ngIf="isLoading" class="mt-5">
            <giddh-page-loader></giddh-page-loader>
        </div>
        <div class="initial-screen position-absolute text-center" *ngIf="!companyAuthKeyList?.length && !isLoading">
            <button matButton="filled" *ngIf="voucherApiVersion === 2" (click)="openCreateEditCompanyAuthKeyAsidePane()">
                {{ localeData?.tab_heading }}
            </button>
        </div>
        <button
            *ngIf="companyAuthKeyList?.length && !isLoading && voucherApiVersion === 2"
            matButton="filled"
            (click)="openCreateEditCompanyAuthKeyAsidePane()"
        >
            {{ localeData?.tab_heading }}
        </button>

        <div class="mt-4 overflow-visible table-header-sticky" *ngIf="companyAuthKeyList?.length && !isLoading">
            <table mat-table [dataSource]="companyAuthKeyList" class="border table basic mb-1 on-mobile-view w-100">
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef class="serial-no-column">#</th>
                    <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
                </ng-container>
                <ng-container matColumnDef="userName">
                    <th mat-header-cell *matHeaderCellDef>{{ localeData?.user_role_name_label }}</th>
                    <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
                </ng-container>
                <ng-container matColumnDef="authKey">
                    <th mat-header-cell *matHeaderCellDef>{{ localeData?.auth_key_column_label }}</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.authKey ?? '**********' }}
                        <span class="input-group-btn ml-1 cursor-pointer">
                            <i class="icon-copy-file" (click)="copyAuthKey(element)" [matTooltip]="commonLocaleData?.app_copy"></i>
                        </span>
                    </td>
                </ng-container>
                <ng-container matColumnDef="roleName">
                    <th mat-header-cell *matHeaderCellDef>{{ localeData?.role_name_label }}</th>
                    <td mat-cell *matCellDef="let element">{{ element.roleName }}</td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th class="text-right" mat-header-cell *matHeaderCellDef>{{ commonLocaleData?.app_action }}</th>
                    <td mat-cell *matCellDef="let element" class="icon-btn text-right">
                        <button
                            matButton="outlined"
                            (click)="openCreateEditCompanyAuthKeyAsidePane(element)"
                            class="p-0 mr-3 action-btn"
                        >
                            <i class="icon-edit-pencil"></i>
                        </button>
                        <button
                            matButton="outlined"
                            (click)="showDeleteAuthKeyDialog(element?.uniqueName)"
                            class="p-0 action-btn"
                        >
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
    </div>
</div>

<!-- open account aside -->
<ng-template #createNew>
    <create-company-auth-key
        (closeAsideEvent)="createNewCompanyAuthKeyDialogRef?.close()"
        [commonLocaleData]="commonLocaleData"
        [localeData]="localeData"
    ></create-company-auth-key>
</ng-template>
