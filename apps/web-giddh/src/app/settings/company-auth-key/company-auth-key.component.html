<ng-container
    appTranslate
    [file]="'settings/company-auth-key'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="discount p-3 clear-both section-center position-relative overflow-visible">
        <div *ngIf="isLoading" class="mt-5">
            <giddh-page-loader></giddh-page-loader>
        </div>
        <div class="initial-screen position-absolute text-center" *ngIf="!companyAuthKeyList?.length && !isLoading">
            <button mat-raised-button color="primary" *ngIf="voucherApiVersion === 2" (click)="openCreateEditCompanyAuthKeyAsidePane()"> {{ localeData?.tab_heading }}</button>
        </div>
        <button *ngIf="companyAuthKeyList?.length && !isLoading && voucherApiVersion === 2" mat-raised-button color="primary" (click)="openCreateEditCompanyAuthKeyAsidePane()">{{ localeData?.tab_heading }}</button>

        <div class="mt-4 overflow-visible table-header-sticky" *ngIf="companyAuthKeyList?.length && !isLoading">
            <table mat-table [dataSource]="companyAuthKeyList" class="border table basic mb-1 on-mobile-view w-100">
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef class="serial-no-column">#</th>
                    <td mat-cell *matCellDef="let element;let i = index">{{ i + 1 }}</td>
                </ng-container>
                <ng-container matColumnDef="authKey">
                    <th mat-header-cell *matHeaderCellDef>Auth Key</th>
                    <td mat-cell *matCellDef="let element">{{ element.authKey }}</td>
                </ng-container>
                <ng-container matColumnDef="userName">
                    <th mat-header-cell *matHeaderCellDef>User Name</th>
                    <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
                </ng-container>
                <ng-container matColumnDef="roleName">
                    <th mat-header-cell *matHeaderCellDef>Role Name</th>
                    <td mat-cell *matCellDef="let element">{{ element.roleName }}</td>
                </ng-container>
                <ng-container matColumnDef="emailId">
                    <th mat-header-cell *matHeaderCellDef>Email ID</th>
                    <td mat-cell *matCellDef="let element">{{ element.emailId }}</td>
                </ng-container>
                <ng-container matColumnDef="from">
                    <th mat-header-cell *matHeaderCellDef>From</th>
                    <td mat-cell *matCellDef="let element">{{ element.from }}</td>
                </ng-container>
                <ng-container matColumnDef="to">
                    <th mat-header-cell *matHeaderCellDef>To</th>
                    <td mat-cell *matCellDef="let element">{{ element.to }}</td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th class="text-right" mat-header-cell *matHeaderCellDef>{{ commonLocaleData?.app_action }}</th>
                    <td mat-cell *matCellDef="let element" class="icon-btn text-right">
                        <button mat-stroked-button *ngIf="voucherApiVersion === 2" (click)="openCreateEditCompanyAuthKeyAsidePane(element)" class="p-0 mr-3 action-btn">
                            <i class="icon-edit-pencil"></i>
                        </button>
                        <button mat-stroked-button *ngIf="voucherApiVersion === 2" (click)="showDeleteAuthKeyDialog(element?.uniqueName)" class="p-0 action-btn">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true;"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
    </div>
</ng-container>

<!-- open account aside -->
<ng-template #createNew>
    <create-company-auth-key
        (closeAsideEvent)="createNewCompanyAuthKeyDialogRef?.close()"
        [commonLocaleData]="commonLocaleData"
        [localeData]="localeData"
    ></create-company-auth-key>
</ng-template>

<!--delete discount confirmation model -->
<ng-template #companyAuthKeyConfirmationDialog>
    <div class="modal-md">
        <div class="modal-content">
            <confirm-modal
                [body]="localeData?.delete_discount"
                (successCallBack)="deleteDiscount()"
                (cancelCallBack)="hideDeleteDiscountModal()"
            ></confirm-modal>
        </div>
    </div>
</ng-template>
