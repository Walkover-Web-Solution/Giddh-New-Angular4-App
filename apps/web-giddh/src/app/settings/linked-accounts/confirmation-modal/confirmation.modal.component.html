<div>
    <div class="dialog-header">
        <span id="modal-title">{{ commonLocaleData?.app_confirmation }}</span>
        <button matIconButton aria-label="close" mat-dialog-close (click)="onCancel()">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <div>
                <p>{{ message }}</p>
            </div>
        </form>
        <div class="d-flex justify-content-end column-gap-1 mt-3">
            <button matButton="filled" type="submit" (click)="onConfirmation()">
                {{ commonLocaleData?.app_yes }}
            </button>
            <button matButton="outlined" type="submit" (click)="onCancel()">{{ commonLocaleData?.app_no }}</button>
        </div>
    </mat-dialog-content>
</div>
