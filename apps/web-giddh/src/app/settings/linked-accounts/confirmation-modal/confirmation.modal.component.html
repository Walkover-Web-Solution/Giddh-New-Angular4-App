<div>
    <div class="modal-header">
        <h3 id="modal-title">{{ commonLocaleData?.app_confirmation }}</h3>
        <button mat-stroked-button aria-hidden="true" class="close" data-dismiss="modal" (click)="onCancel()">×</button>
    </div>
    <div class="modal-body clearfix" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <div>
                <h3>{{ message }}</h3>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button mat-raised-button color="primary" type="submit" (click)="onConfirmation()">
            {{ commonLocaleData?.app_yes }}
        </button>
        <button mat-stroked-button type="submit" (click)="onCancel()">{{ commonLocaleData?.app_no }}</button>
    </div>
</div>
