<div>
    <div class="dialog-header">
        <span mat-dialog-title id="modal-title">{{ commonLocaleData?.app_confirmation }}</span>
        <button mat-icon-button aria-label="close" mat-dialog-close (click)="onCancel()">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <div>
                <h3>{{ message }}</h3>
            </div>
        </form>
        <div class="d-flex justify-content-end column-gap1 mt-3">
            <button mat-raised-button color="primary" type="submit" (click)="onConfirmation()">
                {{ commonLocaleData?.app_yes }}
            </button>
            <button mat-stroked-button type="submit" (click)="onCancel()">{{ commonLocaleData?.app_no }}</button>
        </div>
    </mat-dialog-content>
</div>
