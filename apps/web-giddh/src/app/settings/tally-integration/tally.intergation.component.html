<ng-container
    appTranslate
    [file]="'settings/integration'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="box clearfix mb-2">
        <div class="row pd-b1 mt-3">
            <div class="col-lg-3 col-md-6 col-sm-12 col-lg-3 col-xl-1 col-xxl-2 d-flex align-items-center">
                <label class="font-15 bold">{{ localeData?.tally?.api_url }}</label>
            </div>
            <div class="col-md-6 col-sm-12 col-lg-3 col-xl-3 col-xxl-2 d-flex justify-content-start">
                <div class="form-group mb-0">
                    <div class="d-flex align-items-center justify-content-end">
                        <a class="tally-url" [href]="apiUrl" target="_blank"
                            >{{ apiUrl }}
                        </a>
                        <span class="input-group-btn mr-l05 cursor-pointer">
                            <i class="icon-copy-file" (click)="copyUrl()" [matTooltip]="commonLocaleData?.app_copy"></i>
                        </span>
                        <span class="success copied-url copy-text-position" *ngIf="isCopied">{{
                            commonLocaleData?.app_copied
                        }}</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div class="form-group magic-link-container col-md-9 col-lg-7 d-flex align-items-center">
            <label class="bold">{{ localeData?.tally?.api_url }}</label>
            <mat-form-field appearance="fill" class="w-100">
                <input
                    #apiUrlInput
                    matInput
                    class="dashed tally-url"
                    [readonly]="true"
                    type="text"
                    [(ngModel)]="apiUrl"
                />
            </mat-form-field>
            <span class="input-group-btn">
                <i
                    class="icon-copy-file"
                    (click)="copyUrl()"
                    [ngxClipboard]="apiUrlInput"
                    [matTooltip]="commonLocaleData?.app_copy"
                    [matTooltipPosition]="'above'"
                ></i>
            </span>
            <span class="success copied-url" *ngIf="isCopied">{{ localeData?.tally?.copied }}</span>
        </div> -->
        <div class="form-group clearfix mb-0 doc-link mr-l15">
            <ul>
                <li>
                    <a target="_blank" class="btn link-color" [routerLink]="['/pages/user-details/auth-key']">{{
                        localeData?.email?.auth_key_label
                    }}</a>
                </li>
                <li>
                    <a target="_blank" class="btn link-color" [href]="syncWithTallyHelpDocUrl">{{
                        localeData?.tally?.help_documentation
                    }}</a>
                </li>
            </ul>
        </div>
    </div>
</ng-container>
