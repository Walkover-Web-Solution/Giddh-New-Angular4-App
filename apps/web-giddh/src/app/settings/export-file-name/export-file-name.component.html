<ng-container *ngIf="moduleExportSettingArray?.length">
  <div class="pd-t1 pd-l15">
    <h2>{{ localeData?.file_name_export_setting }}</h2>
  </div>
  <div class="settings-profile-tabs row col-lg-7 col-md-12 pd-t2" [formGroup]="exportModuleSettingForm">
    <ng-container formArrayName="moduleExportSetting">
      <ng-container *ngFor="let module of moduleExportSettingArray.controls; let i = index">
        <div [formGroupName]="i" class="d-flex flex-column col-6 pd-b2">
          <mat-form-field appearance="outline">
            <mat-label>
              <span class="text-capitalize">
                {{ (module.get('exportName')?.value | replaceAll: '_' : ' ' | titlecase) }}
                <i class="icon-info" [matTooltip]="localeData?.module_file_format?.replace('[module_name]', (module.get('exportName')?.value | replaceAll: '_' : ' ' | titlecase)).replace('[file_format]', module.get('suggestedFileFormat')?.value || 'walkover_123')"
                matTooltipPosition="right" ></i>
              </span>
            </mat-label>
            <input
              matInput
              #tribute="appTributeMention"
              (click)="tribute?.open()"
              formControlName="format"
              [placeholder]="commonLocaleData?.app_variable_search_hint"
              (ngModelChange)="getFileFormat(module)"
              [appTributeMention]="tributeConfig"
              [appTributeMentionValues]="module.get('supportedVariableList')?.value || []"
            />
          </mat-form-field>
          <div class="font-12 word-break pd-t05 pd-b05 text-gray">
            {{ module.get('suggestedFileFormat')?.value }}
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
  <button
    mat-raised-button
    color="primary"
    class="mr-l15"
    (click)="updateModuleExportSetting()"
    [disabled]="exportModuleSettingForm.invalid"
  >
    {{ commonLocaleData?.app_save }}
  </button>
</ng-container>
<giddh-page-loader *ngIf="!moduleExportSettingArray?.length"></giddh-page-loader>
