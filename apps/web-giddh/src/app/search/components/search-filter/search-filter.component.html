<section class="mt-3 mb-3">
    <div class="d-flex column-gap-15">
        <button type="button" matButton="filled" [matMenuTriggerFor]="filterByAccountMenu" #filterMenu="matMenuTrigger">
            {{ localeData?.filter_by_account }}
            <span class="caret"></span>
        </button>
        <mat-menu #filterByAccountMenu="matMenu">
            <form
                [formGroup]="searchQueryForm"
                novalidate
                name="searchQueryForm"
                id="searchQueryForm"
                class="form-inline flex-row flex-wrap p-2"
                (click)="$event.stopPropagation()"
            >
                <!-- repeater -->
                <div
                    class="position-relative query-list query-list d-flex"
                    [ngClass]="{ 'mt-4': i !== 0 }"
                    formArrayName="searchQuery"
                    *ngFor="let item of searchQueryForm.get('searchQuery')['controls']; let i = index; let l = last"
                >
                    <div [formGroupName]="i" class="d-flex">
                        <reactive-dropdown-field
                            class="width-query-types mr-3"
                            [options]="queryTypes"
                            [required]="true"
                            (selectedOption)="item?.get('queryType').patchValue($event.value)"
                            [labelValue]="resetValues ? (item?.get('queryType').value === 'closingBalance' ? 'Closing Balance' : '') : ''"
                            [placeholder]="commonLocaleData?.app_select_type"
                            [label]="localeData?.whose"
                        ></reactive-dropdown-field>
                        <reactive-dropdown-field
                            class="width-query-differs mr-3"
                            [options]="queryDiffers"
                            (selectedOption)="item?.get('queryDiffer').patchValue($event.value)"
                            [labelValue]="resetValues ? item?.get('queryDiffer').value : ''"
                            [required]="true"
                            [placeholder]="localeData?.select_query"
                            [label]="localeData?.is"
                        ></reactive-dropdown-field>
                        <input-field
                            class="width-query-differs mr-3"
                            *ngIf="item?.value.queryDiffer === 'Less' || item?.value.queryDiffer === 'Greater' || !item?.value.queryDiffer"
                            [type]="'text'"
                            formControlName="amount"
                            [required]="true"
                            [allowDecimalDigitsOnly]="true"
                            [customDecimalPlaces]="2"
                            [placeholder]="commonLocaleData?.app_amount"
                            [label]="localeData?.than"
                        ></input-field>

                        <input-field
                            class="width-query-differs mr-3"
                            *ngIf="item?.value.queryDiffer === 'Equals'"
                            [type]="'text'"
                            formControlName="amount"
                            [required]="true"
                            [allowDecimalDigitsOnly]="true"
                            [customDecimalPlaces]="2"
                            [placeholder]="commonLocaleData?.app_amount"
                            [label]="localeData?.to"
                        ></input-field>

                        <!--By and To: Not required in paginated API -->
                        <span class="position-relative form-group option-value-field" *ngIf="item?.value.queryType === 'openingBalance'">
                            <select-field
                                [closeOnFocusOut]="true"
                                class="width-balance-type"
                                [options]="balType"
                                (selectedOption)="item?.get('openingBalanceType').patchValue($event.value)"
                                [defaultValue]="
                                    item.get('queryType')?.value === 'openingBalance' || item.get('queryType')?.value === 'closingBalance'
                                        ? 'DR'
                                        : ''
                                "
                            ></select-field>
                        </span>
                        <span class="position-relative form-group option-value-field" *ngIf="item?.value.queryType === 'closingBalance'">
                            <select-field
                                [closeOnFocusOut]="true"
                                class="width-balance-type"
                                [options]="balType"
                                (selectedOption)="item?.get('closingBalanceType').patchValue($event.value)"
                                [defaultValue]="
                                    item.get('queryType')?.value === 'openingBalance' || item.get('queryType')?.value === 'closingBalance'
                                        ? 'DR'
                                        : ''
                                "
                            ></select-field>
                        </span>
                        <label *ngIf="searchDataSet?.controls?.length > 1 && !l" class="condition_tag">{{ localeData?.and }}</label>
                    </div>
                </div>
                <!--end of clear-both first row -->
                <!-- end repeater -->
                <div class="clear-both mt-5 d-flex column-gap-15">
                    <button
                        [disabled]="searchQueryForm.invalid"
                        matButton="filled"
                        class="pull-right"
                        (click)="filterData(); filterMenu?.closeMenu()"
                    >
                        {{ commonLocaleData?.app_search }}
                    </button>
                    <button matButton="elevated" (click)="addSearchRow()">
                        {{ localeData?.add_new_query }}
                    </button>
                    <button
                        matButton="elevated"
                        *ngIf="searchDataSet?.controls?.length > 1"
                        matButton="elevated"
                        class="mr-2"
                        (click)="removeSearchRow()"
                    >
                        {{ localeData?.delete_row }}
                    </button>
                </div>
                <!-- end of second row -->
            </form>
        </mat-menu>
        <button *ngIf="isFiltered | async" (click)="resetQuery()" matButton="elevated">
            <i class="icon-refresh"></i>
            {{ commonLocaleData?.app_reset }}
        </button>
        <button class="ml-auto" type="button" matButton="filled" *ngIf="showDownloadCsv" (click)="createCSV()">
            {{ commonLocaleData?.app_download_csv }}
        </button>
    </div>
</section>
