<div>
    <div class="modal-header theme-bg pd-2 pl-2 pr-2 clearfix">
        <h3 class="modal-title bg" id="modal-title">{{ commonLocaleData?.app_advance_search }}</h3>
        <i class="icon-cross text-right close-modal" (click)="onCancel()"></i>
    </div>
    <div class="modal-body pd-l2 pd-r2 clearfix" id="export-body">
        <form name="purchaseOrderAdvanceSearch" novalidate autocomplete="off">
            <div class="modal-wrap mr-b2">
                <div class="row">
                    <div class="col-sm-4 col-12">
                        <label>{{ localeData?.expected_delivery_date }}</label>
                    </div>
                    <div class="col-sm-8 col-12 mr-b15">
                        <div>
                            <div
                                [matMenuTriggerFor]="universalDatepicker"
                                #universalDatepickerTrigger="matMenuTrigger"
                                role="button"
                                aria-haspopup="true"
                                aria-controls="universalDatepicker"
                            >
                                <input
                                    matInput
                                    type="text"
                                    class="form-control"
                                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                    readonly
                                />
                            </div>
                            <mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
                                <ng-template matMenuContent>
                                    <app-datepicker-wrapper
                                        [inputStartDate]="selectedDateRange?.startDate"
                                        [inputEndDate]="selectedDateRange?.endDate"
                                        [alwaysShowCalendars]="true"
                                        [ranges]="datePickerOptions"
                                        [selectedRangeLabel]="selectedRangeLabel"
                                        [showCustomRangeLabel]="true"
                                        [showClearButton]="false"
                                        [showCancel]="true"
                                        [linkedCalendars]="true"
                                        [showDropdowns]="true"
                                        (rangeClicked)="dateSelectedCallback($event)"
                                        (datesUpdated)="dateSelectedCallback($event)"
                                        (closeCalender)="toggleGiddhDatepicker(false)"
                                    ></app-datepicker-wrapper>
                                </ng-template>
                            </mat-menu>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-4 col-12">
                        <label>{{ localeData?.total_amount }}</label>
                    </div>
                    <div class="col-sm-8 col-12">
                        <div class="total-amount row">
                            <div class="col-sm-8 col-12 mr-b15">
                                <sh-select
                                    [placeholder]="commonLocaleData?.app_select_range"
                                    name="grandTotal"
                                    [options]="filtersForAmount"
                                    [(ngModel)]="purchaseOrderPostRequest.grandTotalOperation"
                                    [ItemHeight]="33"
                                    [defaultValue]="selectedGrandTotalOperator"
                                >
                                </sh-select>
                            </div>
                            <div class="col-sm-4 col-12 mr-b15">
                                <input
                                    class="form-control"
                                    placeholder="00"
                                    type="tel"
                                    name="grandTotal"
                                    [(ngModel)]="purchaseOrderPostRequest.grandTotal"
                                    decimalDigitsDirective
                                    [DecimalPlaces]="4"
                                />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-4 col-12">
                        <label>{{ localeData?.select_status }}</label>
                    </div>
                    <div class="col-sm-8 col-12">
                        <sh-select
                            [placeholder]="localeData?.select_status"
                            name="statuses"
                            [options]="filtersForStatus"
                            [multiple]="true"
                            [(ngModel)]="purchaseOrderPostRequest.statuses"
                            [ItemHeight]="33"
                        >
                        </sh-select>
                    </div>
                </div>
            </div>
            <div class="pull-right">
                <button type="submit" mat-raised-button color="primary" (click)="onSearch()">
                    {{ commonLocaleData?.app_search }}
                </button>
                <button type="submit" mat-stroked-button (click)="onCancel()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </div>
</div>
