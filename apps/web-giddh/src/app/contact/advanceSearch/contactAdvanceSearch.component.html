<div>
    <div class="dialog-header">
        <span>{{ commonLocaleData?.app_advance_search }}</span>
        <button mat-icon-button aria-label="close" (click)="onCancel()">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <!--region invoice-->
            <div class="modal-wrap mb-4">
                <div class="row mt-2 mb-2">
                    <div class="col-xs-12 col-sm-4">
                        <label>{{ commonLocaleData?.app_select_category }}</label>
                    </div>
                    <div class="col-xs-12 col-sm-8">
                        <reactive-dropdown-field
                            [placeholder]="commonLocaleData?.app_select"
                            [name]="'entryCategory'"
                            [options]="categoryOptions"
                            [(ngModel)]="request.category"
                        ></reactive-dropdown-field>
                    </div>
                </div>
                <div class="row mt-2 mb-2">
                    <div class="col-xs-12 col-sm-4">
                        <label>{{ commonLocaleData?.app_amount }}</label>
                    </div>
                    <div class="col-xs-12 col-sm-8">
                        <div class="row">
                            <div class="col-sm-8 col-xs-6 mb-2">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select"
                                    [name]="'entryTotalBy'"
                                    [options]="filtersForEntryTotal"
                                    [(ngModel)]="request.amountType"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-sm-4 col-xs-6">
                                <input-field
                                    [cssClass]="'form-control border'"
                                    [type]="'text'"
                                    [placeholder]="
                                        commonLocaleData?.app_numbers?.zero + '' + commonLocaleData?.app_numbers?.zero
                                    "
                                    [allowDigitsOnly]="true"
                                    [label]="commonLocaleData?.app_amount"
                                    [name]="'total'"
                                    [(ngModel)]="request.amount"
                                ></input-field>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--endregion-->
            <div class="pull-right">
                <button mat-raised-button color="primary" type="submit" class="mr-2" (click)="save()">
                    {{ commonLocaleData?.app_search }}
                </button>
                <button mat-stroked-button type="submit" (click)="onCancel()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</div>
