<div>
    <div class="clear-both" id="export-body">
        <form name="esignature" id="eSignForm" #eSign autocomplete="off" action="" target="_blank" method="post">
            <input
                id="AadhaarNumber"
                [placeholder]="localeData?.your_aadhar_no"
                name="AadhaarNumber"
                type="text"
                class="form-control"
                [(ngModel)]="eSignModel.AadhaarNumber"
            />

            <p class="mt-2" [innerHTML]="localeData?.aadhar_required_note"></p>
            <div class="pull-left mt-2">
                <button type="submit" matButton="filled" (click)="onConfirmation(eSign)">
                    {{ localeData?.go }}
                </button>
            </div>
        </form>
    </div>
</div>
