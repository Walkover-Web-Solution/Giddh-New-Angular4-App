<div>
    <div class="dialog-header">
        <span mat-dialog-title>{{ commonLocaleData?.app_advance_search }}</span>
        <button mat-icon-button aria-label="close" (click)="onCancel()">
            <i class="icon-cross"></i>
        </button>
    </div>

    <mat-dialog-content class="dialog-body" id="dialogdesc">
        <form name="newRole" novalidate autocomplete="off">
            <!--region invoice-->
            <div class="modal-wrap mr-b2" *ngIf="type === 'invoice'">
                <div class="row">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.invoice_date_range }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="row">
                            <div class="col-md-6 col-sm-6 col-12 mr-b1">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="dateOptions"
                                    (selectedOption)="dateChanged($event, 'invoice')">
                                </reactive-dropdown-field>
                            </div>

                            <div class="col-md-6 col-sm-6 col-12 custom-input-field search-datepicker">
                                <giddh-datepicker
                                    name="invoiceDateRange"
                                    [(ngModel)]="request.invoiceDate"
                                    [placeholder]="commonLocaleData?.app_select_date"
                                    [showToggleIcon]="false"
                                >
                                </giddh-datepicker>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-2 mb-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.invoice_total_amount }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="total-amount row">
                            <div class="col-md-8 col-sm-6 col-6">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select"
                                    [name]="'entryTotalBy'"
                                    [options]="filtersForEntryTotal"
                                    (selectedOption)="invoiceTotalRangeChanged($event)">
                                </reactive-dropdown-field>
                            </div>

                            <div class="col-md-4 col-sm-6 col-6 pl-0">
                                <input
                                    class="form-control"
                                    type="tel"
                                    placeholder="00"
                                    name="total"
                                    [(ngModel)]="request.total"
                                />
                            </div>
                        </div>
                    </div>
                </div>

                <hr />

                <div class="row mt-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.due_date_range }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="row">
                            <div class="col-md-4 col-sm-6 col-6">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="dateOptions"
                                    (selectedOption)="dateOptionSelected($event, 'dueDate')"
                                    [labelValue]="selectedDueDateOption?.label">
                                </reactive-dropdown-field>
                            </div>
                            <div class="col-md-8 col-sm-6 col-6 pl-0 custom-input-field search-datepicker">
                                <giddh-datepicker
                                    name="invoiceDueDateRange"
                                    [(ngModel)]="request.dueDate"
                                    [placeholder]="commonLocaleData?.app_select_date"
                                    [showToggleIcon]="false"
                                >
                                </giddh-datepicker>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ commonLocaleData?.app_due_amount }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="due-amount row">
                            <div class="col-md-8 col-sm-6 col-6">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_range"
                                    [options]="filtersForEntryTotal"
                                    [(ngModel)]="request.totalBy"
                                    [labelValue]="request.totalBy?.label">
                                </reactive-dropdown-field>
                            </div>
                            <div class="col-md-4 col-sm-6 col-6 pl-0">
                                <input
                                    class="form-control"
                                    type="tel"
                                    placeholder="00"
                                    name="balanceDue"
                                    [(ngModel)]="request.balanceDue"
                                />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ commonLocaleData?.app_status }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="status-description row">
                            <div class="col-md-8 col-sm-12">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="statusDropdownOptions"
                                    [(ngModel)]="request.statuses">
                                </reactive-dropdown-field>
                            </div>

                            <div class="col-sm-4 col-md-4 pl-0"></div>
                        </div>
                    </div>
                </div>
                <div *ngIf="isEInvoiceEnabled" class="row mt-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.e_invoice_status }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="status-description row">
                            <div class="col-md-8 col-sm-12">
                                <reactive-dropdown-field
                                    *ngIf="voucherApiVersion === 2"
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="eInvoiceStatusDropdownOptions"
                                    [name]="'eInvoiceStatus'"
                                    [(ngModel)]="request.eInvoiceStatus"
                                ></reactive-dropdown-field>
                                <reactive-dropdown-field
                                    *ngIf="voucherApiVersion !== 2"
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="eInvoiceStatusDropdownOptions"
                                    [name]="'eInvoiceStatus'"
                                    [(ngModel)]="request.status"
                                ></reactive-dropdown-field>
                            </div>

                            <div class="col-sm-4 col-md-4 pl-0"></div>
                        </div>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ commonLocaleData?.app_description }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="status-description row">
                            <div class="col-md-8 col-sm-12">
                                <textarea
                                    class="form-control"
                                    name="description"
                                    [(ngModel)]="request.description"
                                ></textarea>
                            </div>

                            <div class="col-sm-4 col-md-4 pl-0"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!--endregion-->

            <!--region drcr || receipt-->
            <div class="modal-wrap mr-b2" *ngIf="type === 'drcr' || type === 'receipt'">
                <div class="row">
                    <div class="col-sm-4 col-md-4">
                        <label>{{ commonLocaleData?.app_date_range }}</label>
                    </div>

                    <div class="col-sm-8 col-md-8">
                        <div class="row">
                            <div class="col-sm-4 col-md-4">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="dateOptions"
                                    (selectedOption)="dateChanged($event, 'invoice')">
                                </reactive-dropdown-field>
                            </div>

                            <div class="col-sm-8 col-md-8 pl-0">
                                <giddh-datepicker
                                    name="invoiceDate"
                                    [(ngModel)]="request.invoiceDate"
                                    [appearance]="'outline'"
                                    class="w-100"
                                ></giddh-datepicker>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-2 mb-2">
                    <div class="col-sm-4 col-md-4">
                        <label>{{ localeData?.invoice_total_amount }}</label>
                    </div>

                    <div class="col-sm-8 col-md-8">
                        <div class="total-amount row">
                            <div class="col-md-6 col-sm-6 col-6">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_range"
                                    [options]="filtersForEntryTotal"
                                    (selectedOption)="invoiceTotalRangeChanged($event)">
                                </reactive-dropdown-field>
                            </div>

                            <div class="col-md-6 col-sm-6 col-6 pl-0">
                                <input
                                    class="form-control"
                                    placeholder="00"
                                    name="total"
                                    [(ngModel)]="request.total"
                                    type="tel"
                                />
                            </div>
                        </div>
                    </div>
                </div>
                <div *ngIf="type === 'drcr' && isEInvoiceEnabled" class="row mt-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.e_invoice_status }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="status-description row">
                            <div class="col-md-8 col-sm-12">
                                <reactive-dropdown-field
                                    *ngIf="voucherApiVersion === 2"
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="eInvoiceStatusDropdownOptions"
                                    [name]="'eInvoiceStatus'"
                                    [(ngModel)]="request.eInvoiceStatus"
                                ></reactive-dropdown-field>
                                <reactive-dropdown-field
                                    *ngIf="voucherApiVersion !== 2"
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="eInvoiceStatusDropdownOptions"
                                    [name]="'eInvoiceStatus'"
                                    [(ngModel)]="request.status"
                                ></reactive-dropdown-field>
                            </div>

                            <div class="col-sm-4 col-md-4 pl-0"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!--endregion-->

            <!-- region proforma || estimates-->
            <div class="modal-wrap mr-b2" *ngIf="type === 'proforma'">
                <div class="row">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.expiry_date }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div>
                            <div 
                                class="custom-datepicker" 
                                [matMenuTriggerFor]="universalDatepicker" 
                                #universalDatepickerTrigger="matMenuTrigger" 
                                role="button" aria-haspopup="true" 
                                aria-controls="universalDatepicker"
                            >
                                <input
                                    matInput
                                    type="text"
                                    name="selectedDateRange"
                                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                    class="giddh-datepicker date-range-picker"
                                    readonly
                                />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-2 mb-2">
                    <div class="col-md-4 col-sm-12">
                        <label>{{ localeData?.total_amt }}</label>
                    </div>

                    <div class="col-md-8 col-sm-12">
                        <div class="total-amount row">
                            <div class="col-md-7 col-sm-6 col-6 pr-0">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select_range"
                                    [name]="'amountFieldSelector'"
                                    [options]="filtersForAmount"
                                    [(ngModel)]="request.amountFieldSelector"
                                    (selectedOption)="amountRangeChanged($event)"
                                >
                                </reactive-dropdown-field>
                            </div>

                            <div class="col-md-4 col-sm-6 col-6">
                                <input
                                    class="form-control"
                                    placeholder="00"
                                    name="total"
                                    [(ngModel)]="request.amount"
                                    type="tel"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- endregion -->

            <!-- Purchases region -->
            <div class="modal-wrap mr-b2" *ngIf="type === 'purchase'">
                <div class="row">
                    <div class="col-sm-3 col-12">
                        <label>{{ commonLocaleData?.app_date_range }}</label>
                    </div>
                    <div class="col-sm-9 col-12">
                        <div class="row">
                            <div class="col-sm-5 col-12">
                                <reactive-dropdown-field
                                    class="select-action mr-b15"
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="dateOptions"
                                    (selectedOption)="dateChanged($event, 'invoice')"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-sm-7 col-12 pl-0">
                                <giddh-datepicker
                                    name="invoiceDate"
                                    [(ngModel)]="request.invoiceDate"
                                    [appearance]="'outline'"
                                    class="w-100 mr-b15"
                                ></giddh-datepicker>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-2 mb-2">
                    <div class="col-sm-3 col-12">
                        <label>{{ localeData?.invoice_total_amount }}</label>
                    </div>
                    <div class="col-sm-9 col-12">
                        <div class="status-description row">
                            <div class="col-md-5 col-sm-12">
                                <reactive-dropdown-field
                                    class="mr-b15"
                                    [placeholder]="commonLocaleData?.app_select_range"
                                    [options]="filtersForEntryTotal"
                                    (selectedOption)="invoiceTotalRangeChanged($event)"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-md-7 col-sm-12 pl-0">
                                <input
                                    class="form-control mr-b15"
                                    placeholder="00"
                                    name="total"
                                    [(ngModel)]="request.total"
                                    type="tel"
                                />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-sm-3 col-12">
                        <label>{{ localeData?.due_date_range }}</label>
                    </div>
                    <div class="col-sm-9 col-12">
                        <div class="status-description row">
                            <div class="col-sm-5 col-12">
                                <reactive-dropdown-field
                                    class="mr-b15"
                                    [placeholder]="commonLocaleData?.app_select_action"
                                    [options]="dateOptions"
                                    (selectedOption)="dateChanged($event, 'due')"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-sm-7 col-12 pl-0">
                                <giddh-datepicker
                                    name="dueDate"
                                    [(ngModel)]="request.dueDate"
                                    [appearance]="'outline'"
                                    class="w-100 mr-b15"
                                ></giddh-datepicker>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pull-right">
                <button type="submit" mat-raised-button color="primary" class="mr-r1" (click)="save()">
                    {{ commonLocaleData?.app_search }}
                </button>
                <button type="submit" mat-stroked-button class="mr-0" (click)="onCancel()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</div>
<mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
    <ng-template matMenuContent>
        <app-datepicker-wrapper
            [inputStartDate]="selectedDateRange?.startDate"
            [inputEndDate]="selectedDateRange?.endDate"
            [alwaysShowCalendars]="true"
            [ranges]="datePickerOptions"
            [selectedRangeLabel]="selectedRangeLabel"
            [showCustomRangeLabel]="true"
            [showClearButton]="false"
            [showCancel]="true"
            [linkedCalendars]="true"
            [showDropdowns]="true"
            (rangeClicked)="dateSelectedCallback($event)"
            (datesUpdated)="dateSelectedCallback($event)"
            (closeCalender)="toggleGiddhDatepicker(false)"
            [keepCalendarOpeningWithRange]="false"
            [showRangeLabelOnInput]="false"
        ></app-datepicker-wrapper>
    </ng-template>
</mat-menu>
