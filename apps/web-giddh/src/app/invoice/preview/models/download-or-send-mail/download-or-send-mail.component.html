<div
    class="h-100"
    appTranslate
    [file]="'invoice/download-or-send-mail'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="h-100">
        <div class="dialog-header">
            <span>
                <ng-container *ngIf="showPdfWrap">
                    <button type="button" matButton="filled" class="mr-2 bg-white text-black" *ngIf="showEditButton" (click)="editVoucher()">
                        {{ commonLocaleData?.app_edit }}
                    </button>
                    <button type="button" matButton="filled" class="mr-2 bg-white text-black" [matMenuTriggerFor]="showMoreOptions" (click)="showEsign = false">
                        {{ commonLocaleData?.app_more }}
                        <span class="caret"></span>
                    </button>
                </ng-container>
            </span>
            <button matIconButton aria-label="Close" (click)="onCancel('closed')">
                <i class="icon-cross"></i>
            </button>

            <!-- drop down for Esignature area -->
            <div class="dropdown-menu ml-5" [ngClass]="{ open: showEsign }">
                <div class="form-group">
                    <e-sign-modal-component [localeData]="localeData"></e-sign-modal-component>
                </div>
            </div>

            <!-- drop down for invoice copies -->
            <mat-menu #showMoreOptions="matMenu">
                <div class="more-options" (click)="$event.stopPropagation()">
                    <mat-tab-group
                        mat-stretch-tabs="false"
                        mat-align-tabs="start"
                        [selectedIndex]="selectedTabIndex"
                        (selectedIndexChange)="tabChanged($event)"
                    >
                        <mat-tab [label]="commonLocaleData?.app_send_email">
                            <div class="p-2">
                                <textarea
                                    matInput
                                    class="form-control"
                                    #emailList
                                    [placeholder]="localeData?.enter_email_addresses"
                                ></textarea>
                                <div class="mt-3">
                                    <button
                                        [disabled]="!emailList?.value || (currentVoucherFilter === invoicesEnum && !invoiceType?.length)"
                                        type="button"
                                        matButton="filled"
                                        (click)="onSendInvoiceOnMail(emailList?.value)"
                                    >
                                        {{ commonLocaleData?.app_send }}
                                    </button>
                                </div>
                            </div>
                        </mat-tab>
                        <mat-tab [label]="commonLocaleData?.app_download">
                            <div class="p-2">
                                <ng-template [ngIf]="currentVoucherFilter === invoicesEnum && voucherApiVersion === 2">
                                    <ng-container *ngTemplateOutlet="invoiceCopyOptions"></ng-container>
                                </ng-template>
                                <div [ngClass]="{ 'mt-3': currentVoucherFilter === invoicesEnum && voucherApiVersion === 2 }">
                                    <button
                                        type="button"
                                        matButton="filled"
                                        (click)="downloadInvoice()"
                                        [disabled]="!invoiceType?.length && !isAttachment && currentVoucherFilter === invoicesEnum"
                                    >
                                        {{ localeData?.download_invoice }}
                                    </button>
                                </div>
                            </div>
                        </mat-tab>
                        <mat-tab [label]="commonLocaleData?.app_send_sms" *ngIf="isSendSmsEnabled">
                            <div class="p-2 text-right">
                                <textarea matInput class="form-control" #smsList [placeholder]="localeData?.enter_mobile_no"></textarea>

                                <div class="mt-3">
                                    <button type="button" matButton="filled" (click)="onSendInvoiceOnSms(smsList?.value)">
                                        {{ commonLocaleData?.app_send }}
                                    </button>
                                </div>
                            </div>
                        </mat-tab>
                    </mat-tab-group>
                </div>
            </mat-menu>
        </div>
        <mat-dialog-content class="dialog-body">
            <div *ngIf="isErrOccured$ | async">
                <p class="lead text-center">{{ commonLocaleData?.app_oops_something_went_wrong }}</p>
            </div>
            <div class="mt-5" *ngIf="!showPdfWrap">
                <giddh-page-loader [cssClass]="'mt-0 mb-0'"></giddh-page-loader>
            </div>
            <div id="pdf-wrapper" *ngIf="showPdfWrap" class="w-100 h-100">
                <iframe
                    #pdfContainer
                    *ngIf="sanitizedPdfFileUrl"
                    title="Invoice PDF Preview"
                    width="100%"
                    height="100%"
                    [src]="sanitizedPdfFileUrl"
                ></iframe>
            </div>
        </mat-dialog-content>
    </div>
</div>

<!-- Invoice Copy Options (checkbox) -->
<ng-template #invoiceCopyOptions>
    <div>
        <p class="font-size-15 mb-3">{{ localeData?.invoice_copy }}</p>
        <mat-divider></mat-divider>
        <div>
            <mat-checkbox color="primary" value="Original" checked (change)="onSelectInvoiceCopy($event)">
                {{ localeData?.original }}
            </mat-checkbox>
        </div>
        <div>
            <mat-checkbox color="primary" value="Transport" (change)="onSelectInvoiceCopy($event)">
                {{ localeData?.transport }}
            </mat-checkbox>
        </div>
        <div>
            <mat-checkbox color="primary" value="Customer" (change)="onSelectInvoiceCopy($event)">
                {{ commonLocaleData?.app_customer }}
            </mat-checkbox>
        </div>
        <div *ngIf="voucherHasAttachments && selectedTabIndex === 1">
            <mat-checkbox color="primary" name="attachment" value="Attachment" [(ngModel)]="isAttachment">
                {{ localeData?.attachment }}
            </mat-checkbox>
        </div>
    </div>
</ng-template>
