<div class="modal-header theme-bg pd-2 pd-l2 pd-r2 clearfix dark-grey-bg">
    <h3 class="modal-title bg" id="modal-title">{{ localeData?.download_voucher }}</h3>
    <i aria-hidden="true" class="icon-cross text-right close-modal" (click)="cancel()"></i>
</div>

<div class="modal-body">
    <ng-template>
        <div class="clearfix font-15">
            <div class="mb-5">
                <p class="mr-b1">{{ localeData?.tax_invoice_copies }}</p>
                <p class="mr-b1">
                    <label class="pointer">
                        <mat-checkbox [checked]="true" color="primary">
                            <strong>{{ localeData?.original_copy }}:</strong>
                            {{ localeData?.buyer_copy }}
                        </mat-checkbox>
                    </label>
                </p>
                <p class="mr-b1">
                    <label class="pointer">
                        <mat-checkbox [checked]="true" color="primary">
                            <strong>{{ localeData?.duplicate_copy }}:</strong>
                            {{ localeData?.transporter_copy }}
                        </mat-checkbox>
                    </label>
                </p>
                <p class="mr-b1">
                    <label class="pointer">
                        <mat-checkbox [checked]="true" color="primary">
                            <strong>{{ localeData?.triplicate_copy }}:</strong>
                            {{ localeData?.supplier_copy }}
                        </mat-checkbox>
                    </label>
                </p>
            </div>

            <div class="mr-b05">
                <p class="mr-b1">
                    {{ localeData?.export_multicurrency }}
                    <a class="text-gray d-inline-block middle" [matTooltip]="localeData?.test" href="javascript:void(0)"
                        ><i class="icon-info"></i
                    ></a>
                </p>
                <p class="mr-b1">
                    <label class="pointer">
                        <mat-checkbox [checked]="true" color="primary">
                            <strong>{{ commonLocaleData?.app_account_currency }} </strong> {{ localeData?.usd }}
                        </mat-checkbox>
                    </label>
                </p>
                <p class="mr-b1">
                    <label class="pointer">
                        <mat-checkbox [checked]="true" color="primary">
                            <strong>{{ commonLocaleData?.app_company_currency }} </strong> {{ localeData?.inr }}
                        </mat-checkbox>
                    </label>
                </p>
                <p class="mr-b1">
                    <label class="pointer">
                        <mat-checkbox [checked]="true" color="primary">
                            <strong>{{ localeData?.both_currency }}</strong>
                            {{ localeData?.usd_conversion_inr }}
                        </mat-checkbox>
                    </label>
                </p>
            </div>
        </div>

        <div class="bd-rt pt-2 pb-1">
            <div class="btn-group">
                <button type="button" mat-raised-button color="primary">{{ commonLocaleData?.app_yes }}</button>
                <button type="button" mat-stroked-button>{{ commonLocaleData?.app_no }}</button>
            </div>
        </div>
    </ng-template>

    <div class="clearfix">
        <ng-container *ngIf="selectedItem?.voucherType === 'sales'">
            <h3 class="font-16 mr-b05">{{ localeData?.invoice_copy }}</h3>
            <hr />
        </ng-container>

        <div class="checkbox pt-1" *ngIf="voucherApiVersion === 2">
            <label>
                <mat-checkbox
                    name="originalCopy"
                    value="Original"
                    [checked]="true"
                    [(ngModel)]="isOriginal"
                    color="primary"
                    (change)="invoiceTypeChanged($event)"
                />
                {{
                    selectedItem?.voucherType === "purchase"
                        ? commonLocaleData?.app_purchase_bill
                        : localeData?.invoice_copy_options?.original
                }}
            </label>
        </div>
        <div class="checkbox pt-1" *ngIf="selectedItem?.voucherType === 'sales'">
            <label>
                <mat-checkbox
                    value="Transport"
                    (change)="invoiceTypeChanged($event)"
                    [(ngModel)]="isTransport"
                    color="primary"
                />
                {{ localeData?.transport }}
            </label>
        </div>

        <div class="checkbox pt-1" *ngIf="selectedItem?.voucherType === 'sales'">
            <label>
                <mat-checkbox
                    value="Customer"
                    (change)="invoiceTypeChanged($event)"
                    [(ngModel)]="isCustomer"
                    color="primary"
                />
                {{ commonLocaleData?.app_customer }}
            </label>
        </div>
        <div class="checkbox pt-1" *ngIf="voucherApiVersion === 2 && selectedItem?.hasAttachment">
            <label>
                <mat-checkbox name="attachment" value="Attachment" [(ngModel)]="isAttachment" color="primary"></mat-checkbox>
                {{ localeData?.invoice_copy_options?.attachment }}
            </label>
        </div>
    </div>

    <!-- region buttons -->
    <div class="row mr-t2 mr-b1">
        <div class="col-sm-12">
            <div class="btn-group" role="group">
                <button
                    [disabled]="voucherApiVersion === 2 && !isOriginal && !isTransport && !isCustomer && !isAttachment"
                    type="button"
                    mat-raised-button color="primary"
                    (click)="onDownloadInvoiceEvent()"
                >
                    {{ commonLocaleData?.app_download }}
                </button>

                <button type="button" mat-stroked-button (click)="cancel()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </div>
    </div>
    <!-- endregion -->
</div>
