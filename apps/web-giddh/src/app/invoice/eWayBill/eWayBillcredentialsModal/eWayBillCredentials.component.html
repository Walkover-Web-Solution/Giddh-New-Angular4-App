<ng-container
    appTranslate
    [file]="'invoice/ewaybill'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div>
        <div class="dialog-header">
            <span>{{ localeData?.enter_ewaybill_credentials }}</span>
            <button mat-icon-button aria-label="close" (click)="onCancel()">
                <i class="icon-cross"></i>
            </button>
        </div>

        <mat-dialog-content class="dialog-body" id="export-body">
            <form #ewayBillform="ngForm" autocomplete="off">
                <div class="d-flex">
                    <div class="user-fill">
                        <div class="mr-b1">
                            <label for="userName">{{ localeData?.username }}</label>
                            <input
                                type="text"
                                name="userName"
                                required
                                autocomplete="false"
                                [(ngModel)]="ewayBillLogForm.userName"
                                class="form-control"
                            />
                        </div>
                        <div class="mr-b1 position-relative">
                            <label for="password">{{ localeData?.password }}</label>
                            <input
                                id="password"
                                [type]="togglePassword ? 'password' : 'text'"
                                name="password"
                                autocomplete="false"
                                required
                                [(ngModel)]="ewayBillLogForm.password"
                                class="form-control pd-r3"
                            />
                            <img
                                class="text-light-2 cursor-pointer"
                                (click)="showPassword()"
                                src="assets/icon/pass.svg"
                            />
                        </div>
                        <div class="mr-b1">
                            <label for="gstIn">{{ commonLocaleData?.app_gstin }}</label>
                            <input
                                type="text"
                                class="form-control"
                                autocomplete="false"
                                required
                                maxlength="15"
                                minlength="15"
                                name="gstIn"
                                [(ngModel)]="ewayBillLogForm.gstIn"
                            />
                        </div>
                    </div>
                </div>

                <div class="d-flex column-gap1 justify-content-end">
                    <button
                        mat-raised-button color="primary"
                        type="submit"
                        [ladda]="isUserAdeedInProcess$ | async"
                        (click)="onSubmit(ewayBillform)"
                        [disabled]="ewayBillform.invalid"
                    >
                        {{ localeData?.save_validate }}
                    </button>
                    <button mat-stroked-button (click)="onCancel()">{{ commonLocaleData?.app_cancel }}</button>
                </div>
            </form>
        </mat-dialog-content>
    </div>
</ng-container>
