<div
    class="pl-grid-row row"
    [financial-accordion]="groupDetail"
    *ngIf="groupDetail.groupName && (groupDetail.isVisible || groupDetail.isCreated)"
    [ngClass]="{ 'isHidden': !groupDetail.isVisible }"
>
    <div
        class="col-4 group pl-sticky-group"
        [innerHTML]="groupDetail.groupName | highlight : search"
        [ngStyle]="{ 'padding-left': padding + 'px' }"
    ></div>
    <div class="col group p-0">
        <span class="row">
            <ng-container *ngIf="!groupDetail.level1; else elseBlock">
                <ng-container *ngFor="let key of getKeys(groupDetail.closingBalance) ">
                    <span
                        class="col text-right py-2 px-0 pd-r15 bd-rl row-height"
                    >
                            <span
                                *ngIf="
                                    groupDetail.category === 'income' &&
                                    groupDetail.closingBalance[key].type === 'DEBIT' &&
                                    groupDetail.closingBalance[key].amount !== 0
                                "
                                >-</span
                            >
                            <span
                                *ngIf="
                                    groupDetail.category === 'expenses' &&
                                    groupDetail.closingBalance[key].type === 'CREDIT' &&
                                    groupDetail.closingBalance[key].amount !== 0
                                "
                                >-</span
                            >
                            <span class="d-inline-flex">
                                <amount-field
                                    [amount]="groupDetail.closingBalance[key].amount"
                                    [currencySymbol]="false"
                                    [currencyCode]="false"
                                >
                                </amount-field>
                            </span>
                        </span>
                    </ng-container>
                </ng-container>
            <ng-template #elseBlock>
                <ng-container *ngFor="let key of plHeaders">
                    <span class="col py-2 px-0 bd-rl row-height">&nbsp;</span>
                </ng-container>
            </ng-template>
        </span>
    </div>
</div>
<cdk-virtual-scroll-viewport
    *ngIf="
        (groupDetail?.isOpen || (search && !isExpandToggledDuringSearch)) &&
        (groupDetail?.accounts | accountsFilter : !groupDetail?.isOpen && search)?.length >= minimumViewportLimit
    "
    [itemSize]="35"
    minBufferPx="500"
    maxBufferPx="1000"
    class="trial-balance-viewport"
>
    <ng-container *cdkVirtualFor="let account of groupDetail?.accounts | accountsFilter; trackBy: trackByFn">
        <ng-container *ngTemplateOutlet="templateSection; context: { $implicit: account }"></ng-container>
    </ng-container>
</cdk-virtual-scroll-viewport>
<ng-container
    *ngIf="
        (groupDetail?.isOpen || (search && !isExpandToggledDuringSearch)) &&
        (groupDetail?.accounts | accountsFilter)?.length < minimumViewportLimit
    "
>
    <ng-container *ngFor="let account of groupDetail?.accounts | accountsFilter; trackBy: trackByFn">
        <ng-container *ngTemplateOutlet="templateSection; context: { $implicit: account }"></ng-container>
    </ng-container>
</ng-container>
<ng-content></ng-content>
<ng-template #templateSection let-account>
    <section class="row-2 account" [ngClass]="{ 'isHidden': !account.isVisible }" (dblclick)="entryClicked(account)">
        <div class="pl-grid-row row">
            <div class="col-4 pl-sticky-group" [ngStyle]="{ 'padding-left': padding + 20 + 'px' }">
                <p class="account-name" [innerHTML]="account.name | lowercase | highlight : search"></p>
            </div>
            <ng-container *ngFor="let key of getKeys(account.closingBalance)">
                <div class="col bd-rl text-right px-0 pd-r15">
                    <span
                        *ngIf="
                            account.category === 'income' &&
                            account.closingBalance[key].type === 'DEBIT' &&
                            account.closingBalance[key].amount !== 0
                        "
                        >-</span
                    >
                    <span
                        *ngIf="
                            account.category === 'expenses' &&
                            account.closingBalance[key].type === 'CREDIT' &&
                            account.closingBalance[key].amount !== 0
                        "
                        >-</span
                    >
                    <span class="d-inline-flex">
                        <amount-field
                            [amount]="account.closingBalance[key].amount"
                            [currencySymbol]="false"
                            [currencyCode]="false"
                        >
                        </amount-field>
                    </span>
                </div>
            </ng-container>
        </div>
    </section>
</ng-template>
