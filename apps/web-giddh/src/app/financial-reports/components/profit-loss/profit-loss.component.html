<div
    appTranslate
    [file]="'trial-profit-balance/profit-loss'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <financial-filter
        #filter
        [selectedCompany]="selectedCompany"
        (onPropertyChanged)="filterData($event)"
        [showLoader]="(showLoader | async) || (isFetchingProfitAndLoss$ | async)"
        (seachChange)="searchChanged($event)"
        (expandAllChange)="expandAllEvent()"
        [(expandAll)]="expandAll"
        [tbExportCsv]="false"
        [tbExportXLS]="false"
        [plBsExportXLS]="projectUniqueName ? false : true"
        [showLabels]="true"
        [isProjectWiseAccounting]="projectUniqueName ? true : false"
        (showReportTally)="showReportTallyOption = $event"
    ></financial-filter>
    <div *ngIf="(showLoader | async) || (isFetchingProfitAndLoss$ | async)">
        <giddh-page-loader [cssClass]="'mt-0 mb-0'"></giddh-page-loader>
    </div>
    <div *ngIf="!(showLoader | async) && !(isFetchingProfitAndLoss$ | async) && data">
        <profit-loss-grid
            [ngClass]="{ 'show-tailed-checkbox': showReportTallyOption }"
            #plGrid
            [search]="search"
            [from]="from"
            [to]="to"
            (searchChange)="searchChanged($event)"
            (refresh)="handleRefresh()"
            [expandAll]="expandAll"
            [plData]="data"
            [cogsData]="cogsData"
        ></profit-loss-grid>
    </div>
    <div *ngIf="!(showLoader | async) && !(isFetchingProfitAndLoss$ | async) && !data" class="d-flex align-items-center justify-content-center tb-pl-bs-data">
        <div class="d-flex">
            <p>{{ localeData?.no_data_found }}</p>
        </div>
    </div>
</div>
