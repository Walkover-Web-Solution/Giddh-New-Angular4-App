<div
    appTranslate
    [file]="'trial-profit-balance/filter'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="clear-both">
        <div class="row">
            <div class="col-12 d-flex justify-content-between align-items-start column-gap-15">
                <form
                    [formGroup]="filterForm"
                    (submit)="filterData()"
                    class="form-inline financial-select-year column-gap-15 row-gap-15"
                    name="fromToDateForm"
                    novalidate
                >
                    <div
                        class="linked-entities"
                        *ngIf="
                            showLabels &&
                            !isProjectWiseAccounting &&
                            currentCompanyBranches?.length > 2 &&
                            (currentOrganizationType === 'COMPANY' || isConsolidatedBranch)
                        "
                    >
                        <reactive-dropdown-field
                            [options]="currentCompanyBranches"
                            formControlName="branchUniqueName"
                            class="company-branch-dropdown"
                            (selectedOption)="handleBranchChange($event)"
                            [placeholder]="commonLocaleData?.app_select_entity"
                            [labelValue]="currentBranch?.name"
                        ></reactive-dropdown-field>
                    </div>
                    <div *ngIf="showLabels">
                        <reactive-dropdown-field
                            [options]="dateOptions"
                            (selectedOption)="dateOptionIsSelected($event)"
                            class="company-branch-dropdown"
                            [placeholder]="commonLocaleData?.app_select_option"
                            [labelValue]="selectedDateOption?.label ?? ''"
                            formControlName="selectedDateOption"
                        ></reactive-dropdown-field>
                    </div>
                    <div *ngIf="filterForm.get('selectedDateOption')?.value == '0'">
                        <reactive-dropdown-field
                            [options]="financialOptions"
                            formControlName="selectedFinancialYearOption"
                            (selectedOption)="selectFinancialYearOption($event)"
                            class="company-branch-dropdown"
                            [label]="commonLocaleData?.app_financial_year"
                            [placeholder]="commonLocaleData?.app_datepicker?.select_financial_year"
                        ></reactive-dropdown-field>
                    </div>
                    <div *ngIf="filterForm.get('selectedDateOption')?.value == '1'">
                        <div
                            class="custom-datepicker"
                            [matMenuTriggerFor]="universalDatepicker"
                            #universalDatepickerTrigger="matMenuTrigger"
                            role="button"
                            aria-haspopup="true"
                            aria-controls="universalDatepicker"
                        >
                            <input
                                matInput
                                type="text"
                                name="selectedDateRange"
                                [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                class="giddh-datepicker date-range-picker"
                                readonly
                            />
                        </div>
                        <mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
                            <ng-template matMenuContent>
                                <app-datepicker-wrapper
                                    [inputStartDate]="selectedDateRange?.startDate"
                                    [inputEndDate]="selectedDateRange?.endDate"
                                    [alwaysShowCalendars]="true"
                                    [ranges]="datePickerOptions"
                                    [selectedRangeLabel]="selectedRangeLabel"
                                    [showCustomRangeLabel]="true"
                                    [showClearButton]="false"
                                    [showCancel]="true"
                                    [linkedCalendars]="true"
                                    [showDropdowns]="true"
                                    (rangeClicked)="dateSelectedCallback($event)"
                                    (datesUpdated)="dateSelectedCallback($event)"
                                    (closeCalender)="toggleGiddhDatepicker(false)"
                                    [keepCalendarOpeningWithRange]="false"
                                    [showRangeLabelOnInput]="false"
                                    [showConfirmationOnChange]="showConfirmationOnDateChange"
                                    [confirmationMessage]="localeData?.reconcile_mode_turned_off_message"
                                ></app-datepicker-wrapper>
                            </ng-template>
                        </mat-menu>
                    </div>
                    <div *ngIf="plBsExportXLS">
                        <giddh-compare-with-date-range-picker
                            [endDate]="toDate"
                            [startDate]="fromDate"
                            [universalDateRangeLabel]="selectedRangeLabel"
                            (onChange)="handleCompareWithEvent($event)"
                        ></giddh-compare-with-date-range-picker>
                    </div>
                    <ng-container *ngIf="!showLoader">
                        <div class="pull-left mr-3 d-inline-flex position-relative" *ngIf="!isProjectWiseAccounting && tags?.length">
                            <i class="glyphicon glyphicon-triangle-bottom"></i>
                            <reactive-dropdown-field
                                [options]="tags"
                                [name]="'selectedTag'"
                                formControlName="tagName"
                                (selectedOption)="onTagSelected($event)"
                                [label]="commonLocaleData?.app_tag"
                                [placeholder]="commonLocaleData?.app_select_tag"
                            ></reactive-dropdown-field>
                        </div>
                        <!-- Filter by Tag -->
                        <button
                            matButton="elevated"
                            class="btn-stroked-icon"
                            (click)="emitExpand(!expandAll)"
                            type="button"
                            [matTooltip]="expandAll ? commonLocaleData?.app_collapse_all : commonLocaleData?.app_expand_all"
                            matTooltipPosition="above"
                        >
                            <i [ngClass]="expandAll ? 'icon-collapse' : 'icon-expandIcon'"></i>
                        </button>
                    </ng-container>
                    <button matButton="filled" type="submit">
                        {{ commonLocaleData?.app_search }}
                    </button>
                </form>
                <div class="d-flex align-items-center column-gap-1 download-data-icon">
                    <ng-container *ngIf="isReconciled !== null && !isProjectWiseAccounting">
                        <p *ngIf="isReconcileModeDateRange" class="text-light nowrap">{{ isReconcileModeDateRange }}</p>
                        <ng-container *ngIf="showReconcileOptions">
                            <button
                                *ngIf="!isReconciled"
                                aria-label="show reconcile options"
                                matButton="elevated"
                                type="button"
                                (click)="showTallyReportOptions()"
                                [disabled]="voucherApiVersion === 1"
                            >
                                <span class="d-inline-block nowrap">{{ localeData?.reconcile_mode }}</span>
                            </button>
                            <button
                                *ngIf="isReconciled"
                                aria-label="show reconcile options"
                                matButton="filled"
                                type="button"
                                (click)="showTallyReportOptions()"
                                [disabled]="voucherApiVersion === 1"
                            >
                                <span class="d-inline-block nowrap">{{ localeData?.reconcile_mode }}</span>
                            </button>
                        </ng-container>

                        <button
                            *ngIf="isReconcileModeDateRange && !showReconcileOptions"
                            aria-label="show reconcile options"
                            matButton="filled"
                            type="button"
                            (click)="goToReconcileDateRange()"
                        >
                            <span class="d-inline-block nowrap">{{ localeData?.switch_back_to_reconcile_mode }}</span>
                        </button>
                    </ng-container>
                    <button
                        matButton="elevated"
                        class="btn-stroked-icon"
                        (click)="refreshData()"
                        [matTooltip]="localeData?.reload_data"
                        matTooltipPosition="above"
                    >
                        <i class="icon-refresh"></i>
                    </button>
                    <button
                        class="ml-1"
                        *ngIf="isProjectWiseAccounting"
                        [routerLink]="'/pages/project-wise-accounting/list'"
                        matButton="elevated"
                    >
                        {{ commonLocaleData?.app_back }}
                    </button>
                    <div class="d-flex column-gap-1">
                        <trial-balance-export-csv
                            *ngIf="tbExportCsv"
                            [trialBalanceRequest]="filterForm?.value"
                            [selectedCompany]="selectedCompany"
                            (tbExportCsvEvent)="tbExportCsvEvent.emit($event)"
                            class="pull-right"
                        ></trial-balance-export-csv>
                        <trial-balance-export-xls
                            *ngIf="tbExportXLS"
                            [trialBalanceRequest]="filterForm?.value"
                            class="pull-right mr-1"
                        ></trial-balance-export-xls>
                        <profit-loss-export-xls
                            *ngIf="plBsExportXLS"
                            [fy]="filterForm.controls['fy']?.value"
                            [filters]="filterForm?.value"
                            class="pull-right"
                        ></profit-loss-export-xls>
                        <balance-sheet-export-xls
                            *ngIf="BsExportXLS"
                            [fy]="filterForm.controls['fy']?.value"
                            [filters]="filterForm?.value"
                            class="pull-right"
                        ></balance-sheet-export-xls>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
