<div [keyboardShortcut]="'esc'" [config]="{ dialogMode: true }" (onShortcutPress)="closeTaxesModal()">
    <div class="dialog-header">
        <span>{{ commonLocaleData?.app_tax_applicable }}</span>
        <button matIconButton aria-label="close" (click)="closeTaxesModal()">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body">
        <div class="container-fluid px-0">
            <div class="row">
                <div class="col-sm-12 mb-2">
                    <span> {{ defaultOtherTaxesModal?.itemLabel }} </span>
                </div>
                <div class="col-sm-6 col-xs-12">
                    <div class="select-tax-dropdown d-flex flex-column">
                        <reactive-dropdown-field
                            class="w-100"
                            [name]="'selectTax'"
                            [placeholder]="commonLocaleData?.app_select_tax"
                            [(ngModel)]="selectedTaxUniqueName"
                            [options]="taxesOptions"
                            [required]="true"
                            [labelValue]="defaultOtherTaxesModal?.appliedOtherTax?.name"
                            [showClearIcon]="true"
                            (onClear)="selectedTaxUniqueName = null; defaultOtherTaxesModal.appliedOtherTax = null"
                            (selectedOption)="applyTax($event)"
                        >
                        </reactive-dropdown-field>

                        <label class="label-select-tax" *ngIf="defaultOtherTaxesModal?.appliedOtherTax?.name">
                            {{ defaultOtherTaxesModal?.appliedOtherTax?.name | uppercase}}
                        </label>
                    </div>
                </div>
                <div class="col-sm-6 col-xs-12">
                    <reactive-dropdown-field
                        class="w-100"
                        [name]="'tcsCalculationMethod'"
                        [label]="commonLocaleData?.app_calculation_method"
                        [placeholder]="commonLocaleData?.app_select_method"
                        [(ngModel)]="defaultOtherTaxesModal.tcsCalculationMethod"
                        [options]="calculationMethodOptions"
                        [labelValue]="calculationMethodLabel"
                        [required]="true"
                    >
                    </reactive-dropdown-field>
                </div>
            </div>
            <div class="mt-2">
                <button
                    matButton="filled"
                    type="button"
                    [disabled]="!defaultOtherTaxesModal?.tcsCalculationMethod"
                    (click)="saveTaxes()"
                >
                    {{commonLocaleData?.app_apply}}
                </button>
            </div>
        </div>
    </mat-dialog-content>
</div>
