<ng-container appTranslate (commonLocaleData)="commonLocaleData = $event">
    <div class="download-list-container">
        <div class="dialog-header">
            <span>{{ commonLocaleData?.app_filter }}</span>
            <button mat-icon-button aria-label="close" mat-dialog-close>
                <i class="icon-cross"></i>
            </button>
        </div>
        <mat-dialog-content class="dialog-body w-100">
            <div class="json-preview" #jsonData></div>
        </mat-dialog-content>
    </div>
</ng-container>
