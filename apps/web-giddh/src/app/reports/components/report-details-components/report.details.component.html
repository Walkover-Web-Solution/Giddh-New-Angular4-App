<ng-container
    appTranslate
    [file]="'reports/sales-register'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="relative">
        <hamburger-menu [pageHeading]="isMobileScreen ? localeData?.page_heading_single : ''"></hamburger-menu>
        <div class="report-breadcrum d-md-none d-lg-none">
            <ul class="list-inline d-inline-block middle nav-report">
                <li class="active" id="giddh-page-heading-link">
                    <a href="javascript:void(0);" aria-label="report" (click)="goToDashboard()">{{
                        commonLocaleData?.app_report
                    }}</a>
                    <span class="d-inline-block pl-1"> ></span>
                </li>
                <li>
                    <a href="javascript:void(0);" aria-label="heading">{{ localeData?.page_heading }}</a>
                </li>
            </ul>
        </div>
    </div>
    <div class="container-fluid font-15 mr-t1">
        <div class="d-flex justify-content-between">
            <div class="d-flex mr-b15 custom-mat-form-field">
                <div
                    *ngIf="currentCompanyBranches?.length > 2 && (currentOrganizationType === 'COMPANY' || isConsolidatedBranch)"
                    class="mr-r15"
                >
                    <dropdown-field
                        [name]="'branches'"
                        [label]="commonLocaleData?.app_company_name"
                        [placeholder]="commonLocaleData?.app_select_entity"
                        [options]="currentCompanyBranches"
                        (selectedOption)="currentBranch.uniqueName =  $event?.value; handleBranchChange($event)"
                        [defaultValue]="currentBranch?.name"
                        [required]="true"
                    >
                    </dropdown-field>
                </div>
                <div class="mr-r15">
                    <dropdown-field
                        [name]="'country'"
                        [label]="commonLocaleData?.app_financial_year"
                        [placeholder]="activeFinacialYr?.uniqueName"
                        [options]="financialOptions"
                        (selectedOption)="currentActiveFinacialYear.value =  $event?.value; selectFinancialYearOption($event)"
                        [defaultValue]="activeFinacialYr?.uniqueName"
                        [required]="true"
                    >
                    </dropdown-field>
                </div>
                <div class="mr-r15">
                    <mat-form-field appearance="outline" class="duration-dropdown">
                        <mat-label>{{ commonLocaleData?.app_duration?.duration }}</mat-label>
                        <mat-select [value]="getSelectedDuration()">
                            <mat-option (click)="populateRecords('monthly')" [value]="commonLocaleData?.app_duration?.monthly">
                                {{ commonLocaleData?.app_duration?.monthly }}
                            </mat-option>
                            <mat-option (click)="populateRecords('quarterly')" [value]="commonLocaleData?.app_duration?.quarterly">
                                {{ commonLocaleData?.app_duration?.quarterly }}
                            </mat-option>
                            <mat-option [value]="commonLocaleData?.app_duration?.weekly">
                                <span 
                                    class="w-100 d-flex justify-content-between"
                                    [matMenuTriggerFor]="monthMenu"
                                    (click)="$event.stopPropagation()"
                                >
                                    <div class="w-50">
                                        {{ commonLocaleData?.app_duration?.weekly }}
                                    </div>
                                    <div class="w-50 pd-l4">
                                        <i class="icon-dots-three-vertical"></i>
                                    </div>
                                </span>
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-menu #monthMenu="matMenu" xPosition="after" yPosition="below">
                        <div class="grid-columns-3 d-grid column-gap5 pd-1">
                          <button 
                            mat-menu-item 
                            *ngFor="let month of monthNames" 
                            (click)="populateRecords('weekly', month)"
                            aria-label="Select month"
                          >
                            {{ month | slice: 0:3 }}
                          </button>
                        </div>
                    </mat-menu>
                </div>
            </div>
            <button
                mat-stroked-button
                (click)="export()"
                color="primary"
                [matTooltip]="commonLocaleData?.app_export"
                [matTooltipPosition]="'above'"
            >
                {{ commonLocaleData?.app_export }}
            </button>
        </div>
        <giddh-table
            *ngIf="localeData"
            [localeData]="localeData"
            [commonLocaleData]="commonLocaleData"
            [tableDataSource]="reportRespone"
            [columnDefinitions]="columnDefinitions"
            [tableSecondaryHeader]="salesRegisterTotal"
            (clickOnItemEvent)="$event && goToDetailedSales($event.item)"
        ></giddh-table>
    </div>
</ng-container>
