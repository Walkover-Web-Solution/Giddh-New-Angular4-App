<div class="dialog-header">
    <span mat-dialog-title>{{ localeData?.print_voucher }}</span>
    <button mat-icon-button aria-label="close" (click)="cancelEvent.emit()">
        <i class="icon-cross"></i>
    </button>
</div>

<mat-dialog-content class="dialog-body">
    <div class="invoice-image-section">
        <giddh-page-loader *ngIf="isVoucherDownloading"></giddh-page-loader>

        <div *ngIf="isVoucherDownloadError && !isVoucherDownloading" class="error">
            <span>
                {{ localeData?.invoice_preview_unavailable }}
            </span>
        </div>

        <iframe
            #pdfContainer
            *ngIf="sanitizedPdfFileUrl && !isVoucherDownloading"
            width="100%"
            height="100%"
            [src]="sanitizedPdfFileUrl"
        ></iframe>
    </div>
</mat-dialog-content>
