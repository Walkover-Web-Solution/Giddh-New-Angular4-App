<ng-container appTranslate [file]="'ocr-voucher'" (commonLocaleData)="commonLocaleData = $event"
    (localeData)="localeData = $event" (translationComplete)="translationComplete($event)">
    <hamburger-menu class="hamburger-menu"></hamburger-menu>
    <div class="ocr-container mx-auto pd-15 overflow-visible">
        <div class="button-wrapper d-flex w-100 align-items-baseline pd-t1">
            <div class="custom-datepicker-wrapper">
                <div class="custom-datepicker" (click)="showGiddhDatepicker($event)">
                    <input type="text" name="selectedDateRange" [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                        class="giddh-datepicker date-range-picker" />
                </div>
            </div>
            <button *ngIf="
                    showClearFilter ||
                    ocrDocumentListForm?.controls['user']?.value ||
                    ocrDocumentListForm?.controls['fileName']?.value ||
                    ocrDocumentListForm?.controls['status']?.value ||
                    ocrDocumentListForm?.controls['convertedStatus']?.value
                " mat-stroked-button class="min160 mr-l1" color="primary" (click)="clearFilter()">
                {{ commonLocaleData?.app_clear }}
            </button>
        </div>
        <giddh-page-loader *ngIf="ocrListInProgress$ | async"></giddh-page-loader>
        <section [hidden]="!showData || (ocrListInProgress$ | async)" class="mt-4">
            <form class="table-responsive table-header-sticky overflow-visible" name="ocrDocumentListForm"
                [formGroup]="ocrDocumentListForm" novalidate autocomplete="off">

                <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortChange($event)"
                    multiTemplateDataRows class="giddh-table w-100">
                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ commonLocaleData?.app_date }}</th>
                        <td mat-cell *matCellDef="let element">{{ element?.date }}</td>
                    </ng-container>
                    <ng-container matColumnDef="fileName">
                        <th mat-header-cell *matHeaderCellDef class="td-search-box" #searchFileNameContainer
                            (clickOutside)="handleClickOutside($event, searchFileNameContainer, 'File Name')">
                            <ng-container *ngTemplateOutlet="
                                    searchTemplate;
                                    context: {
                                        $implicit: showFileName,
                                        fieldName: 'File Name',
                                        formControl: ocrDocumentListForm.controls['fileName'],
                                        title: 'File Name'
                                    }
                                "></ng-container>
                        </th>
                        <td class="td-search-box" mat-cell *matCellDef="let element" width="15%">
                            {{ element?.fileName }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="uploadedBy">
                        <th mat-header-cell *matHeaderCellDef class="td-search-box" #searchUploadedByContainer
                            (clickOutside)="
                                handleClickOutside($event, searchUploadedByContainer, 'Uploaded By')
                            ">
                            <ng-container *ngTemplateOutlet="
                                    searchTemplate;
                                    context: {
                                        $implicit: showUploadedBy,
                                        fieldName: 'Uploaded By',
                                        formControl: ocrDocumentListForm.controls['uploadedBy'],
                                        title: 'Uploaded By'
                                    }
                                "></ng-container>
                        </th>
                        <td class="subscription-td" mat-cell *matCellDef="let element">
                            {{ element?.user?.name }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="fileStatus">
                        <th mat-header-cell *matHeaderCellDef class="td-search-box" #searchFileStatusContainer
                            (clickOutside)="handleClickOutside($event, searchFileStatusContainer, 'File Status')">
                            <ng-container *ngTemplateOutlet="
                                searchTemplate;
                                context: {
                                    $implicit: showFileStatus,
                                    fieldName: 'File Status',
                                    formControl: ocrDocumentListForm.controls['status'],
                                    title: 'File Status'
                                }
                            "></ng-container>
                        </th>
                        <td mat-cell *matCellDef="let element" class="position-relative text-left">
                            <span [ngClass]="{ 
                                'text-success': element?.status?.toLowerCase() === 'completed', 
                                'text-danger': element?.status?.toLowerCase() === 'failed' 
                              }">{{
                                element?.status | uppercase
                                }}</span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="convertedStatus">
                        <th mat-header-cell *matHeaderCellDef class="td-search-box" #searchconvertedStatusContainer
                            (clickOutside)="handleClickOutside($event, searchconvertedStatusContainer, 'Converted Status')">
                            <ng-container *ngTemplateOutlet="
                                searchTemplate;
                                context: {
                                    $implicit: showconvertedStatus,
                                    fieldName: 'Converted Status',
                                    formControl: ocrDocumentListForm.controls['convertedStatus'],
                                    title: 'Converted Status'
                                }
                            "></ng-container>
                        </th>
                        <td mat-cell *matCellDef="let element" class="position-relative text-left">
                            <span [ngClass]="{ 
                                'text-success': element?.convertedStatus?.toLowerCase() === 'completed', 
                                'text-danger': element?.convertedStatus?.toLowerCase() === 'failed' 
                              }">{{
                                element?.convertedStatus | uppercase
                                }}</span>
                        </td>
                    </ng-container>
                    <tr (clickOutside)="inlineSearch = null" mat-header-row
                        *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr class="table-row" mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </form>
        </section>
        <div class="no-data" *ngIf="!dataSource?.filteredData?.length && !(ocrListInProgress$ | async)">
            <h1>{{ commonLocaleData?.app_no_data_found }}</h1>
        </div>
        <div class="pagination-wrapper justify-content-end" *ngIf="
                ocrDocumentsRequestParams.totalItems > pageSizeOptions[0] &&
                showData &&
                !(ocrListInProgress$ | async)
            ">
            <mat-paginator (page)="handlePageChange($event)" [length]="ocrDocumentsRequestParams.totalItems"
                [pageSize]="ocrDocumentsRequestParams.count" [showFirstLastButtons]="true"
                [pageSizeOptions]="pageSizeOptions" [hidePageSize]="false" [pageIndex]="pageIndex" class="mt-15">
            </mat-paginator>
        </div>
    </div>
</ng-container>
<ng-template #searchTemplate let-show let-title="title" let-fieldName="fieldName" let-formControl="formControl">
    <div class="search-table">
        <div [hidden]="show">
            <span> {{ title }}</span>
            <i class="icon-search" (click)="toggleSearch(fieldName)"></i>
        </div>
        <div class="input-container" [hidden]="!show">
            <text-field [type]="'text'" [placeholder]="getSearchFieldText(fieldName)"
                [cssClass]="'form-control mat-field-border'" [formControl]="formControl"
                [autoFocus]="show"></text-field>
        </div>
    </div>
</ng-template>
<ng-template #datepickerTemplate>
    <div class="datepicker-modal">
        <div class="modal-body">
            <app-datepicker-wrapper [inputStartDate]="selectedDateRange?.startDate"
                [inputEndDate]="selectedDateRange?.endDate" [alwaysShowCalendars]="true" [ranges]="datePickerOptions"
                [selectedRangeLabel]="selectedRangeLabel" [showCustomRangeLabel]="true" [showClearButton]="false"
                [showCancel]="true" [linkedCalendars]="true" [showDropdowns]="true"
                [locale]="{ applyLabel: commonLocaleData?.app_done }" (rangeClicked)="dateSelectedCallback($event)"
                (datesUpdated)="dateSelectedCallback($event)" [keepCalendarOpeningWithRange]="false"
                [showRangeLabelOnInput]="false" [dateFieldPosition]="dateFieldPosition"></app-datepicker-wrapper>
        </div>
    </div>
</ng-template>
