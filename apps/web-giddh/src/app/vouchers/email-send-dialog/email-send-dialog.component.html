<div
    appTranslate
    [file]="'invoice/download-or-send-mail'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="dialog-header">
        <span>{{ commonLocaleData?.app_send_email }}</span>
    </div>
    <mat-dialog-content class="dialog-body">
        <giddh-page-loader *ngIf="sendEmailInProgress$ | async"></giddh-page-loader>
        <form
            autocomplete="off"
            [style.display]="(sendEmailInProgress$ | async) ? 'none' : 'block'"
            novalidate
            name="sendEmailForm"
            [formGroup]="sendEmailForm"
            (ngSubmit)="sendEmail()"
        >
            <div class="w-100 option-value-field" formGroupName="email">
                <text-field
                    [name]="'email'"
                    [placeholder]="localeData?.enter_email_addresses"
                    [cssClass]="'w-100'"
                    formControlName="to"
                    [type]="'text'"
                ></text-field>
            </div>
            <div class="my-3" *ngIf="invoiceType.isSalesInvoice">
                <p class="mb-1">{{ localeData?.invoice_copy }}</p>
                <mat-checkbox
                    color="primary"
                    class="d-block font-size-15"
                    (change)="onCopyTypeChange($event, 'Original')"
                    formControlName="copyTypeOriginal"
                >
                    {{ localeData?.original }}
                </mat-checkbox>
                <mat-checkbox
                    color="primary"
                    class="d-block font-size-15"
                    (change)="onCopyTypeChange($event, 'Transport')"
                    formControlName="copyTypeCustomer"
                >
                    {{ localeData?.transport }}
                </mat-checkbox>
                <mat-checkbox
                    color="primary"
                    class="d-block font-size-15"
                    (change)="onCopyTypeChange($event, 'Customer')"
                    formControlName="copyTypeTransport"
                >
                    {{ commonLocaleData?.app_customer }}
                </mat-checkbox>
            </div>
            <div
                class="d-flex column-gap-1"
                [ngClass]="{
                    'mt-2':
                        invoiceType?.isEstimateInvoice ||
                        invoiceType?.isProformaInvoice ||
                        invoiceType?.isDebitNote ||
                        invoiceType?.isCreditNote ||
                        invoiceType?.isReceiptInvoice ||
                        invoiceType?.isPaymentInvoice ||
                        invoiceType.isPurchaseOrder ||
                        invoiceType.isPurchaseInvoice
                }"
            >
                <button mat-raised-button color="primary" type="submit">{{ commonLocaleData?.app_send }}</button>
                <button mat-stroked-button mat-dialog-close role="button">{{ commonLocaleData?.app_cancel }}</button>
            </div>
        </form>
    </mat-dialog-content>
</div>
