<link

<div class="pdf-preview h-100">
    <iframe
        *ngIf="!isFileUploading && sanitizedPdfFileUrl"
        #pdfContainer
        width="100%"
        height="100%"
        [src]="sanitizedPdfFileUrl"
        title="PDF"
    ></iframe>
</div>
