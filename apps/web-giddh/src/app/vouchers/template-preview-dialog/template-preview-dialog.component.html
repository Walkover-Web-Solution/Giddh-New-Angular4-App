<div cdkFocusInitial class="dialog-header">
    <span>{{ templatePreviewTitle }}</span>
    <button matIconButton aria-label="close" mat-dialog-close>
        <i class="icon-cross"></i>
    </button>
</div>
<mat-dialog-content class="dialog-body">
    <div class="container h-100">
        <giddh-page-loader *ngIf="isFileUploading"></giddh-page-loader>
        <div class="pdf-preview h-100">
            <div *ngIf="!isFileUploading && !sanitizedPdfFileUrl" class="error danger text-center">
                <span>{{ localeData?.invoice_preview_unavailable }}</span>
            </div>
            <iframe
                *ngIf="!isFileUploading && sanitizedPdfFileUrl"
                width="100%"
                height="100%"
                #pdfContainer
                [src]="sanitizedPdfFileUrl"
                title="PDF"
            ></iframe>
        </div>
    </div>
</mat-dialog-content>
