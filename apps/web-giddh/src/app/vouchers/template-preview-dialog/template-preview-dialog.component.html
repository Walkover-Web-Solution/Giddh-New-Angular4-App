<div class="dialog-header">
    <h3 class="modal-title">Invoice template preview</h3>
    <i mat-dialog-close aria-label="close icon" class="icon-cross"></i>
</div>
<mat-dialog-content class="dialog-body">
    <div class="container h-100">
        <giddh-page-loader *ngIf="isFileUploading"></giddh-page-loader>
        <div class="pdf-preview h-100">
            <div *ngIf="!isFileUploading" class="error danger text-center">
                <span>{{ localeData?.invoice_preview_unavailable }}</span>
            </div>
            <iframe
                *ngIf="!isFileUploading && sanitizedPdfFileUrl"
                width="100%"
                height="100%"
                #pdfContainer
                [src]="sanitizedPdfFileUrl"
                title="PDF"
            ></iframe>
        </div>
    </div>
</mat-dialog-content>
