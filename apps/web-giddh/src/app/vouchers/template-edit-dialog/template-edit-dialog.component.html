<ng-container>
    <div class="create-discount-aside p-3">
        <div class="d-flex column-gap1">
            <div class="template-left-side">
                <template-edit-filter [dialogData]="templateData"></template-edit-filter>
            </div>
            <div class="template-right-side">
                <all-templates></all-templates>
            </div>
        </div>
        <div class="d-flex column-gap1 justify-content-end mt-3">
            <button
                mat-stroked-button
                color="primary"
                (click)="templateData?.mode === templateModeEnum.Create ? createTemplate() : updateTemplate()"
            >
                {{ templateData?.mode === templateModeEnum.Create ? localeData?.create_template : localeData?.update_template }}
            </button>
            <button mat-stroked-button (click)="closeDialog()">{{ commonLocaleData?.app_close }}</button>
        </div>
    </div>
</ng-container>
