<div class="dialog-header">
    <span class="font-size-16">{{ commonLocaleData?.app_advance_search }}</span>
</div>
<div mat-dialog-content class="dialog-body" [formGroup]="searchForm">
    <!-- invoice-search-start -->
    <ng-container *ngIf="type === 'invoice'">
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'invoice_date_range'"
                [label]="localeData?.invoice_date_range"
                [placeholder]="commonLocaleData?.app_select_action"
                [options]="dateOptions"
                class="w-50"
                (selectedOption)="dateChanged($event, 'invoice')"
                formControlName="invoiceDateRange"
                [labelValue]="fieldLabelValues.invoiceDateRange"
            ></reactive-dropdown-field>
            <giddh-datepicker
                (keydown.enter)="$event.preventDefault()"
                [label]="commonLocaleData?.app_select_date"
                [placeholder]="commonLocaleData?.app_select_date"
                name="voucherDate"
                [showToggleIcon]="false"
                [appearance]="'outline'"
                class="w-50"
                formControlName="voucherDate"
            ></giddh-datepicker>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'invoice_total_amount'"
                [label]="localeData?.invoice_total_amount"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="invoiceTotalRangeChanged($event)"
                formControlName="invoiceTotalAmount"
                [labelValue]="fieldLabelValues.invoiceTotalAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [label]="commonLocaleData?.app_amount"
                [placeholder]="'00'"
                class="w-50"
                name="total"
                formControlName="total"
            ></input-field>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'due_date_range'"
                [label]="localeData?.due_date_range"
                [placeholder]="commonLocaleData?.app_select_action"
                [options]="dateOptions"
                class="w-50"
                (selectedOption)="dateChanged($event, 'due')"
                formControlName="dueDateRange"
                [labelValue]="fieldLabelValues.dueDateRange"
            ></reactive-dropdown-field>
            <giddh-datepicker
                (keydown.enter)="$event.preventDefault()"
                [label]="commonLocaleData?.app_select_date"
                [placeholder]="commonLocaleData?.app_select_date"
                name="dueDateRange"
                [showToggleIcon]="false"
                [appearance]="'outline'"
                class="w-50"
                formControlName="dueDate"
            ></giddh-datepicker>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'app_due_amount'"
                [label]="commonLocaleData?.app_due_amount"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="dueTotalRangeChanged($event)"
                formControlName="dueAmount"
                [labelValue]="fieldLabelValues.dueAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [placeholder]="'00'"
                [label]="commonLocaleData?.app_amount"
                class="w-50"
                name="balanceDue"
                formControlName="balanceDue"
            ></input-field>
        </div>
        <div>
            <multi-select-dropdown
                class="mb-3"
                [name]="'balanceStatus'"
                [label]="commonLocaleData?.app_status"
                [options]="paymentStatusOptions"
                [showAllOption]="true"
                formControlName="balanceStatus"
            ></multi-select-dropdown>
        </div>
        <div *ngIf="isEInvoiceEnabled">
            <multi-select-dropdown
                class="mb-3"
                [name]="'eInvoiceStatus'"
                [label]="localeData?.e_invoice_status"
                [options]="eInvoiceStatusDropdownOptions"
                [showAllOption]="true"
                formControlName="eInvoiceStatus"
            ></multi-select-dropdown>
        </div>
        <mat-form-field appearance="outline" class="initial-height w-100">
            <mat-label>{{ commonLocaleData?.app_description }}</mat-label>
            <textarea matInput rows="2" [placeholder]="commonLocaleData?.app_description" formControlName="description"></textarea>
        </mat-form-field>
    </ng-container>
    <!-- invoice-search-end -->

    <ng-container *ngIf="type === 'drcr'">
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'app_date_range'"
                [label]="commonLocaleData?.app_date_range"
                [placeholder]="commonLocaleData?.app_select_action"
                [options]="dateOptions"
                class="w-50"
                (selectedOption)="dateChanged($event, 'invoice')"
                formControlName="dateRange"
                [labelValue]="fieldLabelValues.dateRange"
            ></reactive-dropdown-field>
            <giddh-datepicker
                (keydown.enter)="$event.preventDefault()"
                [label]="commonLocaleData?.app_select_date"
                [placeholder]="commonLocaleData?.app_select_date"
                name="voucherDate"
                [showToggleIcon]="false"
                [appearance]="'outline'"
                class="w-50"
                formControlName="voucherDate"
            ></giddh-datepicker>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'invoice_total_amount'"
                [label]="localeData?.invoice_total_amount"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="invoiceTotalRangeChanged($event)"
                formControlName="invoiceTotalAmount"
                [labelValue]="fieldLabelValues.invoiceTotalAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [label]="commonLocaleData?.app_amount"
                [placeholder]="'00'"
                class="w-50"
                name="total"
                formControlName="total"
            ></input-field>
        </div>
        <div *ngIf="isEInvoiceEnabled">
            <multi-select-dropdown
                class="mb-3"
                [name]="'eInvoiceStatus'"
                [label]="localeData?.e_invoice_status"
                [options]="eInvoiceStatusDropdownOptions"
                [showAllOption]="true"
                formControlName="eInvoiceStatus"
            ></multi-select-dropdown>
        </div>
    </ng-container>

    <ng-container *ngIf="type === 'receipt' || type === 'payment'">
        <div class="d-flex column-gap-1 mb-3 w-100" *ngIf="type === 'receipt'">
            <reactive-dropdown-field
                [name]="'adjustment_voucher'"
                [label]="localeData?.adjustment_voucher_label"
                [placeholder]="commonLocaleData?.app_select"
                [options]="adjustmentVoucherOptions"
                class="w-50"
                [labelValue]="fieldLabelValues.adjustmentVoucherOptions"
                formControlName="receiptType"
            ></reactive-dropdown-field>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'invoice_total_amount'"
                [label]="localeData?.total_amt"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="invoiceTotalRangeChanged($event)"
                formControlName="invoiceTotalAmount"
                [labelValue]="fieldLabelValues.invoiceTotalAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [placeholder]="'00'"
                [label]="commonLocaleData?.app_amount"
                class="w-50"
                name="total"
                formControlName="total"
            ></input-field>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100" *ngIf="searchForm?.get('receiptType')?.value !== 'NORMAL_RECEIPT'">
            <reactive-dropdown-field
                [name]="'grandTotalOperation'"
                [label]="localeData?.unused_amount"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="dueTotalRangeChanged($event)"
                formControlName="grandTotalOperation"
                [labelValue]="fieldLabelValues.dueAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [placeholder]="'00'"
                [label]="commonLocaleData?.app_amount"
                class="w-50"
                name="balanceDue"
                formControlName="balanceDue"
            ></input-field>
        </div>
    </ng-container>

    <ng-container *ngIf="type === 'proforma'">
        <div class="mt-3">
            <div class="d-flex column-gap-1">
                <div>
                    <div class="date-range-wrapper">
                        <mat-form-field
                            [matDatepickerToggleIcon]="false"
                            appearance="outline"
                            (click)="picker?.open()"
                            class="initial-height w-100"
                        >
                            <mat-label>{{ localeData?.expiry_date }}</mat-label>
                            <mat-date-range-input [rangePicker]="picker">
                                <input
                                    matStartDate
                                    [placeholder]="commonLocaleData?.app_start_date"
                                    formControlName="expireFrom"
                                    (dateChange)="expiryDateChanges()"
                                />
                                <input
                                    matEndDate
                                    [placeholder]="commonLocaleData?.app_end_date"
                                    formControlName="expireTo"
                                    (dateChange)="expiryDateChanges()"
                                />
                            </mat-date-range-input>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                        </mat-form-field>
                    </div>
                </div>
                <reactive-dropdown-field
                    [name]="'total_amt'"
                    [label]="localeData?.total_amt"
                    [placeholder]="commonLocaleData?.app_select_range"
                    [options]="filtersForAmount"
                    class="w-50"
                    (selectedOption)="estimateProformaAmountRangeChanged($event)"
                    formControlName="amountFieldSelector"
                    [labelValue]="fieldLabelValues.amountFieldSelector"
                ></reactive-dropdown-field>
                <input-field
                    [type]="'number'"
                    [allowDecimalDigitsOnly]="true"
                    [placeholder]="'00'"
                    [label]="commonLocaleData?.app_amount"
                    class="w-50"
                    name="amount"
                    formControlName="amount"
                ></input-field>
            </div>
        </div>
    </ng-container>

    <ng-container *ngIf="type === 'purchase'">
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'app_date_range'"
                [label]="commonLocaleData?.app_date_range"
                [placeholder]="commonLocaleData?.app_select_action"
                [options]="dateOptions"
                class="w-50"
                (selectedOption)="dateChanged($event, 'invoice')"
                formControlName="dateRange"
                [labelValue]="fieldLabelValues.dateRange"
            ></reactive-dropdown-field>
            <giddh-datepicker
                (keydown.enter)="$event.preventDefault()"
                [label]="commonLocaleData?.app_select_date"
                [placeholder]="commonLocaleData?.app_select_date"
                name="voucherDate"
                [showToggleIcon]="false"
                [appearance]="'outline'"
                class="w-50"
                formControlName="voucherDate"
            ></giddh-datepicker>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'invoice_total_amount'"
                [label]="localeData?.invoice_total_amount"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="invoiceTotalRangeChanged($event)"
                formControlName="invoiceTotalAmount"
                [labelValue]="fieldLabelValues.invoiceTotalAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [label]="commonLocaleData?.app_amount"
                [placeholder]="'00'"
                class="w-50"
                name="total"
                formControlName="total"
            ></input-field>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'due_date_range'"
                [label]="localeData?.due_date_range"
                [placeholder]="commonLocaleData?.app_select_action"
                [options]="dateOptions"
                class="w-50"
                (selectedOption)="dateChanged($event, 'due')"
                formControlName="dueDateRange"
                [labelValue]="fieldLabelValues.dueDateRange"
            ></reactive-dropdown-field>
            <giddh-datepicker
                (keydown.enter)="$event.preventDefault()"
                [label]="commonLocaleData?.app_select_date"
                [placeholder]="commonLocaleData?.app_select_date"
                name="dueDateRange"
                [showToggleIcon]="false"
                [appearance]="'outline'"
                class="w-50"
                formControlName="dueDate"
            ></giddh-datepicker>
        </div>
    </ng-container>

    <ng-container *ngIf="type === 'purchase-order'">
        <div class="d-flex column-gap-1 mb-3 w-100">
            <div class="w-50">
                <div class="date-range-wrapper">
                    <mat-form-field
                        [matDatepickerToggleIcon]="false"
                        appearance="outline"
                        (click)="picker?.open()"
                        class="initial-height w-100"
                    >
                        <mat-label>{{ localeData?.expected_delivery_date }}</mat-label>
                        <mat-date-range-input [rangePicker]="picker">
                            <input
                                matStartDate
                                [placeholder]="commonLocaleData?.app_start_date"
                                formControlName="dueFrom"
                                (dateChange)="expiryDateChanges()"
                            />
                            <input
                                matEndDate
                                [placeholder]="commonLocaleData?.app_end_date"
                                formControlName="dueTo"
                                (dateChange)="expiryDateChanges()"
                            />
                        </mat-date-range-input>
                        <mat-date-range-picker #picker></mat-date-range-picker>
                    </mat-form-field>
                </div>
            </div>
            <div class="w-50">
                <multi-select-dropdown
                    class="mb-3"
                    [name]="'statuses'"
                    [label]="commonLocaleData?.app_status"
                    [options]="purchaseOrderStatusOptions"
                    [showAllOption]="true"
                    formControlName="statuses"
                ></multi-select-dropdown>
            </div>
        </div>
        <div class="d-flex column-gap-1 mb-3 w-100">
            <reactive-dropdown-field
                [name]="'grandTotalOperation'"
                [label]="commonLocaleData?.app_total_amount"
                [placeholder]="commonLocaleData?.app_select"
                [options]="filtersForEntryTotal"
                class="w-50"
                (selectedOption)="dueTotalRangeChanged($event)"
                formControlName="grandTotalOperation"
                [labelValue]="fieldLabelValues.dueAmount"
            ></reactive-dropdown-field>
            <input-field
                [type]="'number'"
                [allowDecimalDigitsOnly]="true"
                [placeholder]="'00'"
                [label]="commonLocaleData?.app_amount"
                class="w-50"
                name="grandTotal"
                formControlName="grandTotal"
            ></input-field>
        </div>
    </ng-container>

    <!-- Sales Person -->
    <div class="mt-3" *ngIf="(salesPersonList$ | async)?.length">
        <multi-select-dropdown
            [name]="'salesPerson'"
            [label]="commonLocaleData?.app_sales_person"
            [options]="salesPersonList$ | async"
            [showAllOption]="true"
            [formControl]="searchForm?.controls?.salesPersonUniqueNames"
        ></multi-select-dropdown>
    </div>

    <div class="d-flex justify-content-end column-gap-1 mt-3">
        <button matButton="filled" (click)="search()">{{ commonLocaleData?.app_search }}</button>
        <button cdkFocusInitial matButton="outlined" (click)="onCancel()">{{ commonLocaleData?.app_cancel }}</button>
    </div>
</div>
