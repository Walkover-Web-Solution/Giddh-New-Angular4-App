<div appTranslate [file]="'inventory'" (commonLocaleData)="commonLocaleData = $event" (localeData)="localeData = $event">
    <div class="inventory-advance-search">
        <div class="dialog-header">
            <span>{{ localeData?.advance_search_filter?.advance_search }}</span>
        </div>
        <mat-dialog-content class="dialog-body">
            <form>
                <div class="row">
                    <div class="col-lg-12">
                        <div class="row">
                            <div class="col-lg-6 col-sm-6 col-12 mb-3 pr-2">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select"
                                    [options]="advanceSearchFilterBy"
                                    (selectedOption)="selectCategory($event)"
                                    [labelValue]="advanceSearchFormObj.filterBy.label"
                                    (onClear)="advanceSearchFormObj.filterBy = ''"
                                    [label]="localeData?.advance_search_filter?.filter_by"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-lg-6 col-sm-6 col-12 mb-3 pl-2">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select"
                                    [options]="advanceSearchFilterByOptions"
                                    (selectedOption)="selectCategoryType($event)"
                                    [labelValue]="advanceSearchFormObj.type.label"
                                    (onClear)="
                                        advanceSearchFormObj.type.value = {
                                            label: commonLocaleData?.app_rate,
                                            value: 'rate',
                                        }
                                    "
                                    [label]="localeData?.advance_search_filter?.type"
                                ></reactive-dropdown-field>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <div class="row">
                            <div class="col-lg-6 col-sm-6 mb-3 pr-2">
                                <reactive-dropdown-field
                                    [placeholder]="commonLocaleData?.app_select"
                                    [options]="advanceSearchExpression"
                                    (selectedOption)="selectValueExpression($event)"
                                    [labelValue]="advanceSearchFormObj.expression.label"
                                    (onClear)="advanceSearchFormObj.expression = ''"
                                    [label]="localeData?.advance_search_filter?.expression"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-lg-6 col-sm-6 mb-3 pl-2">
                                <input-field
                                    [type]="'number'"
                                    [placeholder]="localeData?.advance_search_filter?.enter_amount"
                                    [name]="'amount'"
                                    [(ngModel)]="advanceSearchFormObj.amount"
                                    [allowDecimalDigitsOnly]="true"
                                    (onClear)="advanceSearchFormObj.amount = ''"
                                    [autocomplete]="'off'"
                                    [label]="localeData?.advance_search_filter?.amount"
                                ></input-field>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-12">
                        <div class="button-group d-flex justify-content-end column-gap-1">
                            <button
                                id="search-btn"
                                matButton="filled"
                                (click)="advanceSearchAction()"
                                [disabled]="
                                    !advanceSearchFormObj.filterBy ||
                                    !advanceSearchFormObj.type ||
                                    !advanceSearchFormObj.expression ||
                                    !advanceSearchFormObj.amount
                                "
                            >
                                {{ commonLocaleData?.app_search }}
                            </button>
                            <button matButton="elevated" (click)="initializeForm()">
                                {{ commonLocaleData?.app_reset }}
                            </button>
                            <button matButton="elevated" type="button" (click)="advanceFilterClose()">
                                {{ commonLocaleData?.app_cancel }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </mat-dialog-content>
    </div>
</div>
