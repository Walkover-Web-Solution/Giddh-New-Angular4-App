<ng-container
    appTranslate
    [file]="'inventory/group'"
    (commonLocaleData)="commonLocaleData = $event"
    (localeData)="localeData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="relative">
        <giddh-page-loader *ngIf="showLoader"></giddh-page-loader>
        <hamburger-menu *ngIf="!addGroup"></hamburger-menu>

        <ng-container *ngIf="!showLoader">
            <form autocomplete="off" novalidate name="groupForm" [formGroup]="groupForm" class="new-account-form">
                <div class="container-fluid">
                    <div class="row mt-3">
                        <div class="col-12 text-right">
                            <span *ngIf="!showLoader && !addGroup" class="mt-3 mr-2">
                                <button
                                    *ngIf="groupUniqueName"
                                    (click)="backClicked()"
                                    class="mr-0"
                                    mat-raised-button
                                    color="primary"
                                >
                                    <i class="icon-left back-left"></i>
                                    {{ commonLocaleData?.app_back }}
                                </button>
                            </span>
                            <span class="mt-3">
                                <watch-video
                                    [cssClass]="'text-primary pt-1'"
                                    [moduleName]="'INVENTORY_MASTER_GROUP'"
                                ></watch-video>
                            </span>
                        </div>
                        <div class="col-12">
                            <div class="create-group-page">
                                <div class="row row-gap-15">
                                    <div class="col-sm-12 col-lg-6 ml-lg-2">
                                        <input-field
                                            class="input-width"
                                            [name]="'name'"
                                            [placeholder]="localeData?.enter_group"
                                            [type]="'text'"
                                            formControlName="name"
                                            (change)="!groupUniqueName ? generateUniqueName() : ''"
                                            [showError]="isFormSubmitted && !groupForm.get('name')?.value"
                                            [autoFocus]="addGroup && !groupUniqueName"
                                        >
                                        </input-field>
                                    </div>
                                    <div class="col-sm-12 col-lg-6 ml-lg-2">
                                        <input-field
                                            class="input-width"
                                            [name]="'uniqueName'"
                                            [placeholder]="commonLocaleData?.app_unique_name_placeholder"
                                            formControlName="uniqueName"
                                            [type]="'text'"
                                            [showError]="isFormSubmitted && !groupForm.get('uniqueName')?.value"
                                        >
                                        </input-field>
                                    </div>
                                    <div class="col-sm-12 col-lg-6 ml-lg-2">
                                        <div
                                            class="inline-multiple-input-width d-flex align-items-center justify-content-between"
                                        >
                                            <div>
                                                <mat-radio-group
                                                    color="primary"
                                                    name="showCodeType"
                                                    formControlName="showCodeType"
                                                    (change)="onChangeHsnSacType()"
                                                    class="d-flex column-gap-15"
                                                >
                                                    <mat-radio-button id="hsn" [value]="'hsn'">{{
                                                        commonLocaleData?.app_hsn_code
                                                    }}</mat-radio-button>
                                                    <mat-radio-button id="sac" [value]="'sac'">{{
                                                        commonLocaleData?.app_sac_code
                                                    }}</mat-radio-button>
                                                </mat-radio-group>
                                            </div>
                                            <div class="input-min-width">
                                                <div
                                                    class="hsnsac-field"
                                                    *ngIf="groupForm.get('showCodeType')?.value === 'hsn'"
                                                >
                                                    <input-field
                                                        [name]="'hsnCode'"
                                                        [placeholder]="localeData?.enter_hsn"
                                                        [type]="'number'"
                                                        formControlName="hsnNumber"
                                                        [maxlength]="10"
                                                        [allowDecimalDigitsOnly]="true"
                                                    >
                                                    </input-field>
                                                </div>
                                                <div
                                                    class="hsnsac-field"
                                                    *ngIf="groupForm.get('showCodeType')?.value === 'sac'"
                                                >
                                                    <input-field
                                                        [name]="'sacCode'"
                                                        [placeholder]="localeData?.enter_sac"
                                                        [type]="'number'"
                                                        formControlName="sacNumber"
                                                        [maxlength]="10"
                                                        [allowDecimalDigitsOnly]="true"
                                                    >
                                                    </input-field>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-12 col-lg-6 ml-lg-2" *ngIf="showTaxField">
                                        <mat-form-field class="input-width" appearance="outline">
                                            <mat-label>{{ commonLocaleData?.app_tax }}</mat-label>
                                            <mat-select
                                                name="taxes"
                                                [placeholder]="commonLocaleData?.app_select_tax"
                                                formControlName="taxes"
                                                multiple
                                                (openedChange)="openedSelectTax($event)"
                                            >
                                                <mat-option
                                                    *ngFor="let tax of taxes"
                                                    [value]="tax?.uniqueName"
                                                    [disabled]="tax.isDisabled"
                                                    [selected]="tax.isChecked"
                                                    (onSelectionChange)="!tax.isDisabled ? selectTax(tax) : ''"
                                                    >{{ tax.name }}</mat-option
                                                >
                                                <mat-option
                                                    class="create-update-no-data"
                                                    [disabled]="true"
                                                    *ngIf="!taxes?.length"
                                                    >{{ commonLocaleData?.app_no_result_found }}</mat-option
                                                >
                                            </mat-select>
                                        </mat-form-field>
                                    </div>
                                    <div class="col-sm-12 col-lg-6 ml-lg-2">
                                        <reactive-dropdown-field
                                            class="input-width"
                                            [name]="'discounts'"
                                            [placeholder]="localeData?.select_discounts"
                                            [label]="commonLocaleData?.app_discount"
                                            [labelValue]="groupForm?.get('discountLabel')?.value ?? ''"
                                            (onClear)="groupForm.get('discounts')?.patchValue(null)"
                                            [options]="discountsList$ | async"
                                            (selectedOption)="groupForm.get('discountLabel')?.patchValue($event?.label)"
                                            formControlName="discounts"
                                        >
                                        </reactive-dropdown-field>
                                    </div>
                                </div>
                                <div class="row mt-3">
                                    <div class="col-sm-12 col-lg-6 ml-lg-2">
                                        <div class="inline-multiple-input-width d-flex align-items-start flex-column">
                                            <div class="d-flex justify-content-between w-100">
                                                <div class="d-flex toggle-childgroup">
                                                    <mat-slide-toggle
                                                        class="mt-1"
                                                        color="primary"
                                                        name="isSubGroup"
                                                        formControlName="isSubGroup"
                                                        aria-label="child group"
                                                    >
                                                    </mat-slide-toggle>
                                                    <label>{{ localeData?.is_it_childgroup }}</label>
                                                </div>
                                                <div class="input-min-width" *ngIf="groupForm.get('isSubGroup')?.value">
                                                    <reactive-dropdown-field
                                                        [name]="'parentStockGroupUniqueName'"
                                                        [placeholder]="commonLocaleData?.app_select_parent_group"
                                                        [options]="stockGroups"
                                                        (selectedOption)="
                                                            stockGroupUniqueName = $event?.value;
                                                            stockGroupName = $event?.label
                                                        "
                                                        [labelValue]="stockGroupName"
                                                    ></reactive-dropdown-field>
                                                </div>
                                            </div>
                                            <div class="d-flex toggle-childgroup pt-1 mt-1">
                                                <mat-slide-toggle
                                                    color="primary"
                                                    name="runtimeManufacturing"
                                                    formControlName="runtimeManufacturing"
                                                    aria-label="runtime manufacturing"
                                                >
                                                </mat-slide-toggle>
                                                <span>{{
                                                    commonLocaleData?.app_allow_manufacturing_sales_transactions
                                                }}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row footer-wrapper">
                                <div class="col-sm-12 col-lg-12 ml-lg-2">
                                    <div class="d-flex align-items-center w-100">
                                        <div>
                                            <button mat-raised-button color="primary" (click)="saveGroup()">
                                                {{
                                                    groupUniqueName
                                                        ? commonLocaleData?.app_update
                                                        : commonLocaleData?.app_create
                                                }}
                                            </button>
                                        </div>
                                        <div class="ml-auto right-aligned-buttons d-flex column-gap-15">
                                            <button
                                                *ngIf="!groupUniqueName"
                                                mat-stroked-button
                                                (click)="resetGroupForm()"
                                                type="button"
                                            >
                                                {{ commonLocaleData?.app_clear }}
                                            </button>

                                            <button
                                                *ngIf="groupUniqueName && !addGroup"
                                                mat-stroked-button
                                                class="min-width-100"
                                                (click)="cancelEdit()"
                                            >
                                                {{ commonLocaleData?.app_close }}
                                            </button>
                                            <button
                                                *ngIf="groupUniqueName"
                                                mat-stroked-button
                                                class="min-width-100"
                                                (click)="deleteGroup()"
                                            >
                                                {{ commonLocaleData?.app_delete }}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </ng-container>
    </div>
</ng-container>
