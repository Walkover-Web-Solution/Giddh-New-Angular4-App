<div appTranslate [file]="'inventory/branch-transfer'" (commonLocaleData)="commonLocaleData = $event" (localeData)="localeData = $event">
    <section class="aside-dialog-wrapper">
        <div class="dialog-header">
            <span>{{ commonLocaleData?.app_manage_transporter }}</span>
        </div>
        <mat-dialog-content class="dialog-body">
            <div class="create-group-aside-body">
                <div class="aside-pane-form">
                    <form
                        class="row form-gap"
                        autocomplete="off"
                        novalidate
                        name="transportedCreateEditForm"
                        [formGroup]="transportedCreateEditForm"
                    >
                        <div class="col-lg-12">
                            <text-field
                                [type]="'text'"
                                [cssClass]="'form-control border'"
                                [placeholder]="commonLocaleData?.app_transporter_name"
                                [name]="'transporterName'"
                                formControlName="transporterName"
                                [showError]="!isValidForm && !transportedCreateEditForm?.get('transporterName')?.value"
                                [required]="true"
                                [minlength]="5"
                                [pattern]="'[a-zA-Z0-9^ .&]{5,100}'"
                            ></text-field>
                            <small *ngIf="transportedCreateEditForm.get('transporterName').hasError('minlength')" class="text-danger">
                                {{ commonLocaleData?.app_invalid_transporter_name_message }}
                            </small>
                        </div>
                        <div class="col-lg-12">
                            <text-field
                                [type]="'text'"
                                [cssClass]="'form-control border'"
                                [placeholder]="commonLocaleData?.app_transporter_id"
                                [name]="'transporterId'"
                                formControlName="transporterId"
                                [showError]="!isValidForm && !transportedCreateEditForm?.get('transporterId')?.value"
                                [required]="true"
                                [maxlength]="15"
                            ></text-field>
                        </div>
                        <div class="col-lg-12">
                            <div class="d-flex column-gap-1">
                                <button
                                    *ngIf="!transportEditMode"
                                    matButton="filled"
                                    (click)="generateTransporter(transportedCreateEditForm.value)"
                                >
                                    {{ commonLocaleData?.app_save }}
                                </button>
                                <button
                                    matButton="filled"
                                    *ngIf="transportEditMode"
                                    (click)="updateTransporter(transportedCreateEditForm.value)"
                                >
                                    {{ commonLocaleData?.app_update }}
                                </button>
                                <button matButton="elevated" (click)="clearTransportForm()">
                                    {{ commonLocaleData?.app_clear }}
                                </button>
                                <button matButton="elevated" mat-dialog-close role="button">
                                    {{ commonLocaleData?.app_cancel }}
                                </button>
                            </div>
                        </div>
                    </form>
                    <div *ngIf="isLoading">
                        <giddh-page-loader></giddh-page-loader>
                    </div>
                    <div class="table-responsive manage-table mt-3" *ngIf="!isLoading">
                        <table mat-table [dataSource]="transporterListDetails">
                            <!-- Name Column -->
                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef class="mat-table-name">{{ commonLocaleData?.app_name }}</th>
                                <td mat-cell *matCellDef="let element">{{ element.transporterName }}</td>
                            </ng-container>
                            <!-- Weight Column -->
                            <div matColumnDef="transporterId">
                                <th mat-header-cell *matHeaderCellDef class="mat-table-id">{{ commonLocaleData?.app_transporter_id }}</th>
                                <td mat-cell *matCellDef="let element">{{ element.transporterId }}</td>
                            </div>
                            <!-- Symbol Column -->
                            <ng-container matColumnDef="action">
                                <th mat-header-cell *matHeaderCellDef class="text-right mat-table-action">
                                    {{ commonLocaleData?.app_actions }}
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="d-flex column-gap-05 justify-content-end edit-delete-btn">
                                        <button matButton="elevated" (click)="editTransporter(element)">
                                            <i class="icon-edit"></i>
                                        </button>
                                        <button matButton="elevated" (click)="deleteTransporter(element)">
                                            <i class="icon-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                        </table>
                    </div>
                    <div *ngIf="transporterObj?.totalItems > pageSizeOptions[0] && !isLoading">
                        <mat-paginator
                            [length]="transporterObj?.totalItems"
                            [pageSize]="transporterObj.count"
                            [pageIndex]="transporterObj.page - 1"
                            [pageSizeOptions]="pageSizeOptions"
                            [showFirstLastButtons]="true"
                            [hidePageSize]="false"
                            (page)="handlePageEvent($event)"
                        ></mat-paginator>
                        <section class="mb-custom-80"></section>
                    </div>
                </div>
            </div>
        </mat-dialog-content>
    </section>
</div>
