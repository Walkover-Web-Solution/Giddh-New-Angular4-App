<div class="inventory-filter-bar d-flex top-main-bar align-items-center">
    <div class="back-btnn" *ngIf="reportUniqueName">
        <button matButton="outlined" class="report-back-button" (click)="backToPreviousPage()">
            {{ commonLocaleData?.app_back }}
        </button>
    </div>
    <div class="custom-datepicker-wrapper">
        <div
            class="custom-datepicker"
            [matMenuTriggerFor]="universalDatepicker"
            #universalDatepickerTrigger="matMenuTrigger"
            role="button"
            aria-haspopup="true"
            aria-controls="universalDatepicker"
        >
            <input
                matInput
                type="text"
                name="selectedDateRange"
                [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                class="giddh-datepicker date-range-picker"
                readonly
            />
        </div>
    </div>
    <div class="pl-1 filter-dropdown-branch" *ngIf="(isCompany || isConsolidatedBranch) && allBranches?.length > 1">
        <multi-select-dropdown
            [name]="'selectedBranch'"
            [showAllOption]="true"
            [label]="localeData?.header?.select_branch"
            [noEntriesFoundLabel]="localeData?.header?.no_result_found"
            [options]="allBranches"
            [optionValue]="'uniqueName'"
            [optionLabel]="'name'"
            [(ngModel)]="selectedBranch"
            (selectionChange)="resetWarehouse(); getBranches()"
        ></multi-select-dropdown>
    </div>
    <div class="pl-1 filter-dropdown-warehouse" *ngIf="currentWarehouses?.length > 1">
        <multi-select-dropdown
            [name]="'selectedWarehouse'"
            [showAllOption]="true"
            [label]="localeData?.header?.select_warehouse"
            [noEntriesFoundLabel]="localeData?.header?.no_result_found"
            [options]="currentWarehouses"
            [optionValue]="'uniqueName'"
            [optionLabel]="'name'"
            [(ngModel)]="selectedWarehouse"
            (selectionChange)="getWarehouses()"
        ></multi-select-dropdown>
    </div>
    <div class="clear-filter d-flex" *ngIf="showClearFilter">
        <button matButton="outlined" class="create-btn-inventory ml-3 mr-0" (click)="resetFilter()">
            <span class="icon-cross"></span>
            {{ commonLocaleData?.app_clear_filter }}
        </button>
    </div>
    <div class="ml-auto d-flex align-items-center">
        <div
            class="clear-filter"
            *ngIf="
                (stockReportRequest.stockGroupUniqueNames?.length ||
                    stockReportRequest.stockUniqueNames?.length ||
                    stockReportRequest.variantUniqueNames?.length) &&
                searchPage === 'TRANSACTION'
            "
        >
            <span
                class="edit-btn-inventory ml-3 mr-0"
                (click)="editInventory()"
                *ngIf="filtersChipList?.length === 1 && !isVariantSelected"
            >
                <i class="icon-edit-pencil text-primary font-size-16 cursor-pointer"></i>
            </span>
        </div>
        <!-- Video Links -->
        <div *ngIf="moduleName === 'GROUP_WISE_REPORT'">
            <watch-video [cssClass]="'text-primary pr-3'" [moduleName]="'INVENTORY_REPORT_GROUPWISE'"></watch-video>
        </div>
        <div *ngIf="moduleName === 'ITEM_WISE_REPORT'">
            <watch-video [cssClass]="'text-primary pr-3'" [moduleName]="'INVENTORY_REPORT_ITEMWISE'"></watch-video>
        </div>
        <div *ngIf="moduleName === 'VARIANT_WISE_REPORT'">
            <watch-video [cssClass]="'text-primary pr-3'" [moduleName]="'INVENTORY_REPORT_VARIANTWISE'"></watch-video>
        </div>
    </div>
</div>
<div class="inventory-filter-bar d-flex">
    <div class="search-control w-100 d-flex align-items-center mat-form-field-clean">
        <mat-form-field floatLabel="never" class="initial-height d-block flex-grow-1 select-multiple-chiplist-inventory">
            <mat-chip-grid #matChipList>
                <mat-chip-row
                    *ngFor="let chip of filtersChipList; let indx = index"
                    [selectable]="true"
                    [removable]="true"
                    (removed)="removeOption(chip, indx)"
                    class="mr-2"
                >
                    {{ chip?.name }}
                    <span matChipRemove>
                        <i class="icon-cross font-size-12"></i>
                    </span>
                </mat-chip-row>
                <input
                    type="text"
                    matInput
                    [formControl]="searchFilters"
                    [placeholder]="localeData?.header?.search_bar"
                    [matAutocomplete]="auto"
                    [matChipInputFor]="matChipList"
                    #trigger="matAutocompleteTrigger"
                    [name]="'q'"
                    #selectField
                    autocomplete="off"
                    matAutocompletePosition="auto"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                />
            </mat-chip-grid>
            <mat-autocomplete
                class="inventory-autocomplete"
                #auto="matAutocomplete"
                (optionSelected)="selectChiplistValue($event); selectField.value = ''"
            >
                <div *ngIf="fieldFilteredOptions?.length <= 5; else searchedData">
                    <mat-option *ngFor="let option of fieldFilteredOptions" [value]="option">
                        {{ option?.name }} ( {{ option?.type }} )
                    </mat-option>
                    <mat-option disabled *ngIf="fieldFilteredOptions?.length === 0">{{ localeData?.header?.no_result_found }}</mat-option>
                </div>
                <ng-template #searchedData>
                    <app-cdk-scroll (fetchNextPage)="searchInventory(false, true)" [scrollableElementId]="'stock-transaction'">
                        <cdk-virtual-scroll-viewport
                            class="virtual-group-list overflow-x-hidden"
                            [itemSize]="33"
                            [id]="'stock-transaction'"
                        >
                            <mat-option class="item-height" *ngFor="let option of fieldFilteredOptions" [value]="option">
                                {{ option?.name }} ( {{ option?.type }} )
                            </mat-option>
                            <mat-option class="item-height" disabled *ngIf="fieldFilteredOptions?.length === 0">
                                {{ localeData?.header?.no_result_found }}
                            </mat-option>
                        </cdk-virtual-scroll-viewport>
                    </app-cdk-scroll>
                </ng-template>
            </mat-autocomplete>

            <i class="icon-search search-icon ml-2 mr-2" matIconPrefix *ngIf="!filtersChipList?.length"></i>
        </mat-form-field>
        <div class="menu-btn-control d-flex justify-content-end align-items-center">
            <button
                matButton="outlined"
                aria-hidden="true"
                class="advance-filter-button font-size-14 box-shadow-none"
                (click)="exportReport()"
                [disabled]="isLoading$ | async"
            >
                <i class="icon-download-circle mr-1"></i>
                {{ commonLocaleData?.app_export }}
            </button>
            <button matButton="outlined" (click)="openModal()" class="advance-filter-button box-shadow-none">
                <i class="icon-advance-filter mr-1"></i>
                {{ localeData?.header?.advance_filter }}
            </button>
            <select-table-column
                [moduleType]="moduleName"
                [customiseColumns]="customiseColumns"
                (isLoading)="isLoading = $event"
                (selectedColumns)="setDisplayColumns($event)"
                (selectedDynamicColumns)="setDisplayDynamicColumns($event)"
                [localeData]="localeData"
                [commonLocaleData]="commonLocaleData"
                [iconClass]="'icon-options'"
                [cssClass]="'border-none border-radius-0 h-100 w-100 font-size-15 box-shadow-none'"
                [buttonText]="localeData?.header?.customise"
                class="customise-width d-inline-block h-100 border-left"
            ></select-table-column>
        </div>
    </div>
</div>
<mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
    <ng-template matMenuContent>
        <app-datepicker-wrapper
            [inputStartDate]="selectedDateRange?.startDate"
            [inputEndDate]="selectedDateRange?.endDate"
            [alwaysShowCalendars]="true"
            [ranges]="datePickerOptions"
            [selectedRangeLabel]="selectedRangeLabel"
            [showCustomRangeLabel]="true"
            [showClearButton]="false"
            [showCancel]="true"
            [linkedCalendars]="true"
            [showDropdowns]="true"
            [locale]="{ applyLabel: commonLocaleData?.app_done }"
            (rangeClicked)="dateSelectedCallback($event)"
            (datesUpdated)="dateSelectedCallback($event)"
            (closeCalender)="toggleGiddhDatepicker(false)"
            [keepCalendarOpeningWithRange]="false"
            [showRangeLabelOnInput]="false"
        ></app-datepicker-wrapper>
    </ng-template>
</mat-menu>
