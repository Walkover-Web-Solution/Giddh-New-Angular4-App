<div class="selling-product-block mr-t15">
    <div class="box">
        <div class="top-selling-heading d-flex justify-content-between">
            <div>
                <button
                    type="button"
                    class="btn font-15 top-selling-btn no-btn p-0 mr-0"
                    [matMenuTriggerFor]="topSellingMenu"
                >
                    Top 5 Selling <i class="caret"></i>
                </button>
                <mat-menu #topSellingMenu="matMenu">
                    <button mat-menu-item>Top 10 Selling</button>
                    <button mat-menu-item>Top 15 Selling</button>
                    <button mat-menu-item>Top 50 Selling</button>
                    <button mat-menu-item>Top 100 Selling</button>
                </mat-menu>
            </div>
            <div class="d-flex align-items-center">
                <span>
                    <div>
                        <button
                            type="button"
                            class="btn font-15 no-btn p-0 text-primary"
                            [matMenuTriggerFor]="monthMenu"
                        >
                            This Month <i class="caret"></i>
                        </button>
                        <mat-menu #monthMenu="matMenu">
                            <button mat-menu-item>This Week</button>
                            <button mat-menu-item>Last Month</button>
                        </mat-menu>
                    </div>
                </span>
                <span
                    class="expand-selling-icon text-gray d-flex cursor-pointer"
                    [routerLink]="['/pages/inventory/v2/top-selling-report']"
                    ><i class="icon-expand"></i
                ></span>
            </div>
        </div>
        <div class="selling-container">
            <mat-tab-group 
                class="custom-tabs location-data-tabs"
                mat-stretch-tabs="false"
                mat-align-tabs="start">
                <mat-tab>
                    <ng-template mat-tab-label>
                        <span>Location</span>
                    </ng-template>
                    <div class="pd-t15 pd-b15">
                    <!-- div will show if no any data on list -->
                    <div class="no-data-contain" hidden>
                        <img src="{{ imgPath }}error.svg" />
                        <p class="text-gray mr-t15">No items were invoiced in this time frame</p>
                    </div>
                    <div class="location-data">
                        <div class="state-location-data d-flex">
                            <label>Madhya Pradesh</label>
                            <span class="progress-bar"></span> ₹15,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Uttar Pradesh</label>
                            <span class="progress-bar"></span> ₹12,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Tamilnadu</label>
                            <span class="progress-bar"></span> ₹6,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Karnataka</label>
                            <span class="progress-bar"></span> ₹9,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Maharashtra</label>
                            <span class="progress-bar"></span> ₹7,20,000
                        </div>
                    </div>
                    </div>
                </mat-tab>
                <mat-tab>
                    <ng-template mat-tab-label>
                        <span>Product</span>
                    </ng-template>
                    <div class="pd-t15 pd-b15">
                    <div class="location-data">
                        <div class="state-location-data d-flex">
                            <label>Madhya Pradesh</label>
                            <span class="progress-bar"></span> ₹15,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Uttar Pradesh</label>
                            <span class="progress-bar"></span> ₹12,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Tamilnadu</label>
                            <span class="progress-bar"></span> ₹6,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Karnataka</label>
                            <span class="progress-bar"></span> ₹9,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Maharashtra</label>
                            <span class="progress-bar"></span> ₹7,20,000
                        </div>
                    </div>
                    </div>
                </mat-tab>
                <mat-tab>
                    <ng-template mat-tab-label>
                        <span>Service</span>
                    </ng-template>
                    <div class="pd-t15 pd-b15">
                    <div class="location-data">
                        <div class="state-location-data d-flex">
                            <label>Madhya Pradesh</label>
                            <span class="progress-bar"></span> ₹15,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Uttar Pradesh</label>
                            <span class="progress-bar"></span> ₹12,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Tamilnadu</label>
                            <span class="progress-bar"></span> ₹6,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Karnataka</label>
                            <span class="progress-bar"></span> ₹9,00,000
                        </div>
                        <div class="state-location-data d-flex">
                            <label>Maharashtra</label>
                            <span class="progress-bar"></span> ₹7,20,000
                        </div>
                    </div>
                    </div>
                </mat-tab>
            </mat-tab-group>
        </div>
    </div>
</div>
