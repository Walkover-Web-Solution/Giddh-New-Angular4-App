<div class="purchase-report-block mr-t15">
    <div class="box">
        <div class="purchase-report-head d-flex justify-content-between flex-sm-row flex-column">
            <h4>Purchase Report</h4>
            <div class="custom-datepicker" [matMenuTriggerFor]="universalDatepicker" #universalDatepickerTrigger="matMenuTrigger" role="button" aria-haspopup="true" aria-controls="universalDatepicker">
                <input
                    matInput
                    type="text"
                    name="selectedDateRange"
                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                    class="giddh-datepicker date-range-picker"
                    readonly
                    placeholder="Enter Date"
                />
            </div>
        </div>
        <!-- div will show if no any data on list -->
        <div class="no-data-contain" hidden>
            <img src="{{ imgPath }}error.svg" />
            <p class="text-gray mr-t15">No items were invoiced in this time frame</p>
        </div>
        <div class="purchase-report-container d-flex justify-content-between mr-t15">
            <div class="purchase-summary-wrapper">
                <div class="purchase-summary">
                    <div class="about-purchase-report">
                        <div class="mt-4 purchase-qty">
                            <h4 class="font-15 pb-1">Quantity Ordered</h4>
                            <p class="text-blue">23</p>
                        </div>
                        <div class="mt-4 purchase-qty">
                            <h4 class="font-15 pb-1">Yet to Receive</h4>
                            <p class="text-blue">23</p>
                        </div>
                        <div class="mt-4 purchase-qty">
                            <h4 class="font-15 pb-1">Amt to be paid</h4>
                            <p class="text-blue">₹12,000</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="table-wrapper">
                <div class="table-responsive">
                    <!-- Mat Table for purchase report -->
                    <table mat-table [dataSource]="dataSource" class="table giddh-table purchase-report-table on-mobile-view">
                        <!-- Date Column -->
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef>Date</th>
                            <td mat-cell *matCellDef="let element" data-title="Date">{{ element.date }}</td>
                        </ng-container>

                        <!-- Bill Column -->
                        <ng-container matColumnDef="bill">
                            <th mat-header-cell *matHeaderCellDef>Bill#</th>
                            <td mat-cell *matCellDef="let element" data-title="Bill">{{ element.bill }}</td>
                        </ng-container>

                        <!-- Vendor Column -->
                        <ng-container matColumnDef="vendor">
                            <th mat-header-cell *matHeaderCellDef>Vendor</th>
                            <td mat-cell *matCellDef="let element" data-title="Vendor">{{ element.vendor }}</td>
                        </ng-container>

                        <!-- Expected Delivery Column -->
                        <ng-container matColumnDef="expectedDelivery">
                            <th mat-header-cell *matHeaderCellDef>Expected Delivery</th>
                            <td mat-cell *matCellDef="let element" data-title="Expected Delivery">{{ element.expectedDelivery }}</td>
                        </ng-container>

                        <!-- Total Amount Column -->
                        <ng-container matColumnDef="totalAmount">
                            <th mat-header-cell *matHeaderCellDef>Total Amt.</th>
                            <td mat-cell *matCellDef="let element" data-title="Total Amount">{{ element.totalAmount }}</td>
                        </ng-container>

                        <!-- Received Column -->
                        <ng-container matColumnDef="received">
                            <th mat-header-cell *matHeaderCellDef>Received</th>
                            <td mat-cell *matCellDef="let element" data-title="Received">
                                <mat-checkbox [id]="'received-checkbox-' + element.id" [(ngModel)]="element.received" color="primary"></mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Header and Row Definitions -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- datepicker menu -->
<mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
    <ng-template matMenuContent>
        <app-datepicker-wrapper
            [inputStartDate]="selectedDateRange?.startDate"
            [inputEndDate]="selectedDateRange?.endDate"
            [alwaysShowCalendars]="true"
            [ranges]="datePickerOptions"
            [selectedRangeLabel]="selectedRangeLabel"
            [showCustomRangeLabel]="true"
            [showClearButton]="false"
            [showCancel]="true"
            [linkedCalendars]="true"
            [showDropdowns]="true"
            (rangeClicked)="dateSelectedCallback($event)"
            (datesUpdated)="dateSelectedCallback($event)"
            (closeCalender)="toggleGiddhDatepicker(false)"
            [keepCalendarOpeningWithRange]="false"
            [showRangeLabelOnInput]="false"
        ></app-datepicker-wrapper>
    </ng-template>
</mat-menu>
