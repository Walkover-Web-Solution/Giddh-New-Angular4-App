<div class="selling-report-page">
    <div class="container-fluid">
        <div class="box mr-t15">
            <div class="top-selling-header d-flex">
                <div class="date-wrapper">
                    <div class="custom-datepicker" [matMenuTriggerFor]="universalDatepicker" #universalDatepickerTrigger="matMenuTrigger" role="button" aria-haspopup="true" aria-controls="universalDatepicker">
                        <input
                            matInput
                            type="text"
                            name="selectedDateRange"
                            [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                            class="giddh-datepicker date-range-picker"
                            readonly
                            placeholder="Enter Date"
                        />
                    </div>
                </div>
                <div class="select-top-selling">
                    <div class="btn-group">
                        <button
                            type="button"
                            class="btn font-15 top-selling-btn no-btn p-0 mr-0"
                            [matMenuTriggerFor]="topSellingMenu"
                        >
                            Top 5 Selling <i class="caret"></i>
                        </button>
                        <mat-menu #topSellingMenu="matMenu">
                            <a mat-menu-item href="#">Top 5 Selling</a>
                            <a mat-menu-item href="#">Top 10 Selling</a>
                            <a mat-menu-item href="#">Top 5 Purchase</a>
                            <a mat-menu-item href="#">Top 10 Purchase</a>
                        </mat-menu>
                    </div>
                </div>
                <div
                    class="close-selling-report cursor-pointer"
                    [routerLink]="['/pages/inventory/v2/inventory-dashboard']"
                >
                    <i class="icon-cross pd"></i>
                </div>
            </div>
        </div>
        <div class="box mr-t15">
            <div class="filter-top-selling d-flex flex-column flex-sm-row justify-content-between">
                <div class="select-by-radio font-15">
                    <mat-radio-group name="selectOption" class="d-flex">
                        <mat-radio-button color="primary" value="location" class="mr-3">
                            Location wise
                        </mat-radio-button>
                        <mat-radio-button color="primary" value="product" class="mr-3">
                            Product wise
                        </mat-radio-button>
                        <mat-radio-button color="primary" value="service" class="mr-3">
                            Service wise
                        </mat-radio-button>
                    </mat-radio-group>
                </div>
                <div class="select-by-week">
                    <div>
                        <div class="total-sales-tabs">
                            <a class="active-graph">Daily</a>| <a>Weekly</a>|
                            <a>Monthly</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="highchart-of-sale">
                <!-- selling graph will be here -->
            </div>
            <div class="top-sale-data d-flex flex-column flex-sm-row mt-5">
                <div class="highest-data pr-5">
                    <p class="font-15">Total Sales (Sep 19)</p>
                    <h3 class="text-blue">10,10,900.00</h3>
                </div>
                <div class="highest-data top-high-sale pl-3">
                    <p class="font-15">Total Sales (Sep 19)</p>
                    <h3 class="text-blue">10,10,900.00</h3>
                    <p class="text-blue highest-sale-date font-15">(12 Sep 19)</p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- datepicker menu -->
<mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
    <ng-template matMenuContent>
        <app-datepicker-wrapper
            [inputStartDate]="selectedDateRange?.startDate"
            [inputEndDate]="selectedDateRange?.endDate"
            [alwaysShowCalendars]="true"
            [ranges]="datePickerOptions"
            [selectedRangeLabel]="selectedRangeLabel"
            [showCustomRangeLabel]="true"
            [showClearButton]="false"
            [showCancel]="true"
            [linkedCalendars]="true"
            [showDropdowns]="true"
            (rangeClicked)="dateSelectedCallback($event)"
            (datesUpdated)="dateSelectedCallback($event)"
            (closeCalender)="toggleGiddhDatepicker(false)"
            [keepCalendarOpeningWithRange]="false"
            [showRangeLabelOnInput]="false"
        ></app-datepicker-wrapper>
    </ng-template>
</mat-menu>
