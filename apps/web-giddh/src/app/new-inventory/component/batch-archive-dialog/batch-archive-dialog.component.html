<div class="advance-search-dialog">
    <div cdkFocusInitial class="dialog-header">
        <span>{{ localeData?.archive_batch }}</span>
        <button matIconButton mat-dialog-close aria-label="cross icon">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body">
        <p>{{ localeData?.archive_batch_message }}</p>
        <div class="mt-3">
            @if (hasLoadedBatches) {
                <reactive-dropdown-field
                    [label]="localeData?.select_batch"
                    [placeholder]="localeData?.select_batch"
                    [options]="batchOptions"
                    [labelValue]="selectedBatchLabel"
                    [formControl]="selectedBatch"
                    (selectedOption)="selectBatch($event)"
                    (onClear)="selectBatch({ label: commonLocaleData?.app_unassigned, value: unassignedAction })"
                    [required]="true"
                ></reactive-dropdown-field>
            }
        </div>
        <div class="d-flex column-gap-1 mt-4">
            <button type="button" matButton="filled" [disabled]="isLoading" (click)="submit()">
                {{ localeData?.transfer_and_archive }}
            </button>
            <button type="button" matButton="outlined" (click)="closeDialog()">
                {{ commonLocaleData?.app_cancel }}
            </button>
        </div>
    </mat-dialog-content>
</div>
