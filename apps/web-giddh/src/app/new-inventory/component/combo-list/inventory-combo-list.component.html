<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="top-content">
                <div class="d-flex w-100 justify-content-between overflow-x-auto">
                    <div class="total-details-box mr-r05 border-none opening-box">
                        <h5>
                            Group Count
                            <div>
                                <span class="d-inline-flex number-total"> 23 </span>
                            </div>
                        </h5>
                    </div>
                    <div class="total-details-box border-none due-box">
                        <h5>
                            Item Count
                            <div>
                                <span class="d-inline-flex number-total"> 23 </span>
                            </div>
                        </h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="product-list-container">
                <div class="table-responsive">
                    <!-- Mat Table for inventory combo list -->
                    <table mat-table [dataSource]="dataSource" class="table giddh-table on-mobile-view">
                        <!-- Select Column -->
                        <ng-container matColumnDef="select">
                            <th mat-header-cell *matHeaderCellDef width="3%">&nbsp;</th>
                            <td mat-cell *matCellDef="let element" width="3%" data-title="Select">
                                <div class="d-block text-center text-left-sm">
                                    <mat-checkbox [id]="'select-group-' + element.id" [(ngModel)]="element.selected" color="primary"></mat-checkbox>
                                </div>
                            </td>
                        </ng-container>

                        <!-- Stock Name Column -->
                        <ng-container matColumnDef="stockName">
                            <th mat-header-cell *matHeaderCellDef>Stock Name</th>
                            <td mat-cell *matCellDef="let element" data-title="Stock Name">
                                <div class="product-name-image d-flex">
                                    <div>
                                        <img [src]="imgPath + 'add-image.svg'" />
                                    </div>
                                    <div class="cursor-pointer mx-2">
                                        <a
                                            href="javascript:void(0)"
                                            [routerLink]="['/pages/inventory/v2/about-group-detail']"
                                        >
                                            <p>{{ element.stockName }}</p>
                                            <p class="text-gray">({{ element.itemCount }})</p>
                                        </a>
                                    </div>
                                </div>
                            </td>
                        </ng-container>

                        <!-- Unit Column -->
                        <ng-container matColumnDef="unit">
                            <th mat-header-cell *matHeaderCellDef>Unit</th>
                            <td mat-cell *matCellDef="let element" data-title="Unit">{{ element.unit }}</td>
                        </ng-container>

                        <!-- Qty Column -->
                        <ng-container matColumnDef="qty">
                            <th mat-header-cell *matHeaderCellDef>Qty</th>
                            <td mat-cell *matCellDef="let element" data-title="Qty">{{ element.qty }}</td>
                        </ng-container>

                        <!-- Selling Price Column -->
                        <ng-container matColumnDef="sellingPrice">
                            <th mat-header-cell *matHeaderCellDef>Selling Price</th>
                            <td mat-cell *matCellDef="let element" data-title="Selling Price">{{ element.sellingPrice }}</td>
                        </ng-container>

                        <!-- Purchase Price Column -->
                        <ng-container matColumnDef="purchasePrice">
                            <th mat-header-cell *matHeaderCellDef>Purchase Price</th>
                            <td mat-cell *matCellDef="let element" data-title="Purchase Price">{{ element.purchasePrice }}</td>
                        </ng-container>

                        <!-- Header and Row Definitions -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
