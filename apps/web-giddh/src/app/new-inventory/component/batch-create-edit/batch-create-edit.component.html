<div
    appTranslate
    [file]="'inventory/batch'"
    (commonLocaleData)="commonLocaleData.set($event)"
    (localeData)="localeData.set($event)"
>
    <div cdkFocusInitial class="dialog-header">
        <span>{{ isUpdateMode() ? localeData()?.edit_batch : localeData()?.create_batch }}</span>
        <button matIconButton mat-dialog-close aria-label="cross icon">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body">
        @if (isLoading()) {
            <giddh-page-loader></giddh-page-loader>
        }
        <form
            [class.d-none]="isLoading()"
            autocomplete="off"
            novalidate
            name="batchForm"
            [formGroup]="batchForm"
        >
            <div class="row">
                <div class="col-12 mt-3">
                    <input-field
                        [name]="'batchNumber'"
                        [label]="localeData()?.batch_number"
                        [placeholder]="localeData()?.enter_batch_number"
                        [type]="'text'"
                        formControlName="batchNumber"
                        [required]="true"
                        [showError]="isFormSubmitted() && batchForm.get('batchNumber')?.invalid"
                    ></input-field>
                </div>
                <div class="col-12 mt-3">
                    <input-field
                        [name]="'name'"
                        [label]="commonLocaleData()?.app_name"
                        [placeholder]="commonLocaleData()?.app_name_placeholder"
                        [type]="'text'"
                        formControlName="name"
                        [required]="true"
                        [showError]="isFormSubmitted() && batchForm.get('name')?.invalid"
                    ></input-field>
                </div>
                <div class="col-12 mt-3">
                    <reactive-dropdown-field
                        [label]="commonLocaleData()?.app_stock"
                        [placeholder]="commonLocaleData()?.app_select_stock"
                        [options]="stocks()"
                        [labelValue]="stockLabel()"
                        formControlName="stockUniqueName"
                        [enableDynamicSearch]="!isUpdateMode()"
                        [readonly]="isUpdateMode()"
                        (dynamicSearchedQuery)="loadStocks($event)"
                        (selectedOption)="selectStock($event)"
                        (onClear)="selectStock(null)"
                        [required]="true"
                        [showError]="isFormSubmitted() && !batchForm.get('stockUniqueName')?.value"
                    ></reactive-dropdown-field>
                </div>
                <div class="col-12 mt-3">
                    <reactive-dropdown-field
                        [label]="localeData()?.variant"
                        [placeholder]="localeData()?.select_variant"
                        [options]="variants()"
                        [labelValue]="variantLabel()"
                        formControlName="variantUniqueName"
                        [enableDynamicSearch]="true"
                        (dynamicSearchedQuery)="loadVariants($event)"
                        (selectedOption)="selectVariant($event)"
                        (onClear)="selectVariant(null)"
                        [required]="true"
                        [showError]="isFormSubmitted() && !batchForm.get('variantUniqueName')?.value"
                    ></reactive-dropdown-field>
                </div>
                <div class="col-12 mt-3">
                    <reactive-dropdown-field
                        [label]="commonLocaleData()?.app_warehouse"
                        [placeholder]="commonLocaleData()?.app_select_warehouse"
                        [options]="warehouses()"
                        [labelValue]="warehouseLabel()"
                        formControlName="warehouseUniqueName"
                        (selectedOption)="selectWarehouse($event)"
                        (onClear)="selectWarehouse(null)"
                        [required]="true"
                        [showError]="isFormSubmitted() && !batchForm.get('warehouseUniqueName')?.value"
                    ></reactive-dropdown-field>
                </div>
                <div class="col-12 mt-3">
                    <input-field
                        [name]="'openingQuantity'"
                        [label]="localeData()?.opening_quantity"
                        [placeholder]="localeData()?.enter_opening_quantity"
                        [type]="'number'"
                        [allowDecimalDigitsOnly]="true"
                        formControlName="openingQuantity"
                        [required]="true"
                        [showError]="isFormSubmitted() && batchForm.get('openingQuantity')?.invalid"
                    ></input-field>
                </div>
                <div class="col-12 mt-3">
                    <input-field
                        [name]="'rate'"
                        [label]="commonLocaleData()?.app_rate"
                        [placeholder]="localeData()?.enter_rate"
                        [type]="'number'"
                        [allowDecimalDigitsOnly]="true"
                        formControlName="rate"
                        [required]="true"
                        [showError]="isFormSubmitted() && batchForm.get('rate')?.invalid"
                    ></input-field>
                </div>
                <div class="col-12 mt-3">
                    <giddh-datepicker
                        [label]="localeData()?.manufacturing_date"
                        [placeholder]="localeData()?.manufacturing_date"
                        name="manufacturingDate"
                        [showToggleIcon]="false"
                        [appearance]="'outline'"
                        formControlName="manufacturingDate"
                        [showError]="isDateRangeInvalid()"
                    ></giddh-datepicker>
                </div>
                <div class="col-12 mt-3">
                    <giddh-datepicker
                        [label]="localeData()?.expiry_date"
                        [placeholder]="localeData()?.expiry_date"
                        name="expiryDate"
                        [showToggleIcon]="false"
                        [appearance]="'outline'"
                        formControlName="expiryDate"
                        [minDate]="expiryMinDate()"
                        [showError]="isDateRangeInvalid()"
                    ></giddh-datepicker>
                    @if (isDateRangeInvalid()) {
                        <p class="text-danger font-size-12 mt-1">{{ localeData()?.invalid_date_range }}</p>
                    }
                </div>
            </div>
            <div class="d-flex column-gap-1 mt-4">
                <button matButton="filled" type="button" [disabled]="isLoading()" (click)="save()">
                    {{ isUpdateMode() ? commonLocaleData()?.app_update : commonLocaleData()?.app_save }}
                </button>
                <button matButton="outlined" type="button" (click)="closeDialog()">
                    {{ commonLocaleData()?.app_cancel }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</div>
