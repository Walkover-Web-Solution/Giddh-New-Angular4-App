<ng-container appTranslate (commonLocaleData)="commonLocaleData = $event">
    <section class="aside-dialog-wrapper">
        <div class="header-create-unit dialog-header">
            <span>{{ commonLocaleData?.app_create_unit }}</span>
        </div>
        <mat-dialog-content class="dialog-body">
            <create-unit [unitGroupDetails]="unitGroupDetails" (closeAsideEvent)="closeAsidePane($event)"></create-unit>
        </mat-dialog-content>
    </section>
</ng-container>
