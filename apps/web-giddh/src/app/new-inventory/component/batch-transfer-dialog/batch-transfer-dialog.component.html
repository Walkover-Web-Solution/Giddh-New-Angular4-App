<div class="advance-search-dialog">
    <div cdkFocusInitial class="dialog-header">
        <span>{{ localeData?.transfer_batch }}</span>
    </div>
    <mat-dialog-content class="dialog-body">
        @if (hasLoadedBatches && hasNoTargetBatches) {
            <p>{{ localeData?.no_target_batch_message }}</p>
            <div class="d-flex column-gap-1 mt-3 justify-content-end">
                <button type="button" matButton="filled" (click)="openCreateBatch()">
                    {{ localeData?.create_batch }}
                </button>
                <button type="button" matButton="outlined" (click)="closeDialog()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        } @else {
            <form autocomplete="off" novalidate [formGroup]="transferForm">
                <div class="row">
                    <div class="col-12 mt-3">
                        @if (hasLoadedBatches) {
                            <reactive-dropdown-field
                                [label]="localeData?.select_batch"
                                [placeholder]="localeData?.select_batch"
                                [options]="batchOptions"
                                [labelValue]="batchLabel"
                                formControlName="toBatchUniqueName"
                                (selectedOption)="selectBatch($event)"
                                (onClear)="selectBatch(null)"
                                [showCreateNew]="true"
                                [createNewText]="localeData?.create_batch"
                                (createOption)="openCreateBatch()"
                                [required]="true"
                                [showError]="isFormSubmitted && !transferForm.get('toBatchUniqueName')?.value"
                            ></reactive-dropdown-field>
                        }
                    </div>
                    <div class="col-12 mt-3">
                        <input-field
                            [name]="'warehouse'"
                            [type]="'text'"
                            [label]="commonLocaleData?.app_warehouse"
                            [placeholder]="commonLocaleData?.app_select_warehouse"
                            [ngModel]="warehouseLabel"
                            [ngModelOptions]="{standalone: true}"
                            [readonly]="true"
                            [required]="true"
                            [showError]="isFormSubmitted && !transferForm.get('warehouseUniqueName')?.value"
                        ></input-field>
                    </div>
                    <div class="col-12 mt-3">
                        <input-field
                            [name]="'quantity'"
                            [type]="'number'"
                            [label]="commonLocaleData?.app_quantity"
                            [placeholder]="localeData?.enter_quantity"
                            [allowDecimalDigitsOnly]="true"
                            formControlName="quantity"
                            [required]="true"
                            [showError]="isFormSubmitted && transferForm.get('quantity')?.invalid"
                        ></input-field>
                        @if (isQuantityExceedsMax) {
                            <p class="text-danger font-size-12 mt-1">
                                {{ quantityExceedsMessage }}
                            </p>
                        }
                    </div>
                </div>
                <div class="d-flex column-gap-1 mt-3 justify-content-end">
                    <button type="button" matButton="filled" [disabled]="isLoading" (click)="submit()">
                        {{ localeData?.transfer }}
                    </button>
                    <button type="button" matButton="outlined" (click)="closeDialog()">
                        {{ commonLocaleData?.app_cancel }}
                    </button>
                </div>
            </form>
        }
    </mat-dialog-content>
</div>
