<div
    appTranslate
    [file]="'inventory/adjustment'"
    (commonLocaleData)="commonLocaleData = $event"
    (localeData)="localeData = $event"
>
    <div class="dialog-header">
        <span>{{ localeData?.create_reason }}</span>
    </div>
    <mat-dialog-content class="dialog-body">
        <giddh-page-loader *ngIf="createReasonInProgress$ | async"></giddh-page-loader>
        <div *ngIf="!(createReasonInProgress$ | async)">
            <form autocomplete="off" novalidate name="reasonForm" [formGroup]="reasonForm">
                <div class="row mb-3">
                    <div class="col-xl-5 col-lg-5 col-sm-5">
                        <input-field
                            [name]="'code'"
                            [type]="'text'"
                            [label]="localeData?.reason"
                            [placeholder]="localeData?.enter_reason"
                            formControlName="reason"
                            [showError]="!isValidForm && !reasonForm?.get('reason')?.value"
                        >
                        </input-field>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-sm-4 pr-0">
                        <div class="d-flex column-gap-1">
                            <button
                                aria-label="save"
                                matButton="filled"
                                type="button"
                                (click)="saveReason()"
                            >
                                {{ commonLocaleData?.app_save }}
                            </button>
                            <button aria-label="cancel" matButton="elevated" type="button" mat-dialog-close>
                                {{ commonLocaleData?.app_cancel }}
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="pull-right d-flex column-gap-15">
                            <button
                                aria-label="clear"
                                matButton="elevated"
                                type="button"
                                class="btn-sm mr-0"
                                (click)="resetForm()"
                            >
                                {{ commonLocaleData?.app_clear }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </mat-dialog-content>
</div>
