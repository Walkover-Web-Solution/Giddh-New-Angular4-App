<div
    appTranslate
    [file]="'inventory'"
    (commonLocaleData)="commonLocaleData = $event"
    (localeData)="localeData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="inventory-advance-search">
        <div cdkFocusInitial class="dialog-header">
            <span>{{ localeData?.advance_search_filter?.advance_search }}</span>
        </div>
        <mat-dialog-content class="dialog-body">
            <form>
                <div class="row mb-3">
                    <div class="col-lg-12">
                        <div class="form-group date-advance-search">
                            <div
                                class="custom-datepicker w-100"
                                [matMenuTriggerFor]="universalDatepicker"
                                #universalDatepickerTrigger="matMenuTrigger"
                                role="button"
                                aria-haspopup="true"
                                aria-controls="universalDatepicker"
                            >
                                <input
                                    matInput
                                    type="text"
                                    name="selectedDateRange"
                                    [value]="selectedDateRangeUi ? selectedDateRangeUi : ''"
                                    class="giddh-datepicker date-range-picker"
                                    placeholder="Enter Date"
                                    readonly
                                />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <div class="row">
                            <div class="col-lg-6 col-sm-6 col-12 mb-3 pr-2">
                                <div *ngIf="reportType === 'TRANSACTION'">
                                    <reactive-dropdown-field
                                        [placeholder]="localeData?.advance_search_filter?.select_category"
                                        [options]="advanceSearchCategoryTransaction"
                                        (selectedOption)="selectCategory($event?.value)"
                                        [labelValue]="advanceSearchFormObj.param1 ?? ''"
                                        (onClear)="advanceSearchFormObj.param1 = ''"
                                        [label]="localeData?.advance_search_filter?.category"
                                    ></reactive-dropdown-field>
                                </div>
                                <div *ngIf="reportType !== 'TRANSACTION'">
                                    <reactive-dropdown-field
                                        [placeholder]="localeData?.advance_search_filter?.select_category"
                                        [options]="advanceSearchCategory"
                                        (selectedOption)="selectCategory($event?.value)"
                                        [labelValue]="advanceSearchFormObj.param1 ?? ''"
                                        (onClear)="advanceSearchFormObj.param1 = ''"
                                        [label]="localeData?.advance_search_filter?.category"
                                    ></reactive-dropdown-field>
                                </div>
                            </div>
                            <div class="col-lg-6 col-sm-6 col-12 mb-3 pl-2">
                                <reactive-dropdown-field
                                    [placeholder]="localeData?.advance_search_filter?.select_type"
                                    [options]="advanceSearchCategoryOptions"
                                    (selectedOption)="selectCategoryOptions($event?.value)"
                                    [labelValue]="advanceSearchFormObj.param2 ?? ''"
                                    (onClear)="advanceSearchFormObj.param2 = ''"
                                    [label]="localeData?.advance_search_filter?.type"
                                ></reactive-dropdown-field>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <div class="row">
                            <div class="col-lg-6 col-sm-6 mb-3 pr-2">
                                <reactive-dropdown-field
                                    [placeholder]="localeData?.advance_search_filter?.select_value"
                                    [options]="advanceSearchValue"
                                    (selectedOption)="selectValueType($event?.value)"
                                    [labelValue]="advanceSearchFormObj.expression ?? ''"
                                    (onClear)="advanceSearchFormObj.expression = ''"
                                    [label]="localeData?.advance_search_filter?.value"
                                ></reactive-dropdown-field>
                            </div>
                            <div class="col-lg-6 col-sm-6 mb-3 pl-2">
                                <input-field
                                    [type]="'number'"
                                    [placeholder]="localeData?.advance_search_filter?.enter_amount"
                                    [name]="'amount'"
                                    [(ngModel)]="advanceSearchFormObj.val"
                                    [allowDecimalDigitsOnly]="true"
                                    (onClear)="advanceSearchFormObj.val = ''"
                                    [autocomplete]="'off'"
                                    [label]="localeData?.advance_search_filter?.amount"
                                ></input-field>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-sm-12">
                        <div class="button-group d-flex justify-content-end column-gap-1">
                            <button
                                id="search-btn"
                                matButton="filled"
                                (click)="advanceSearchAction('search')"
                                [disabled]="
                                    !advanceSearchFormObj.param1 ||
                                    !advanceSearchFormObj.param2 ||
                                    !advanceSearchFormObj.expression ||
                                    !advanceSearchFormObj.val
                                "
                            >
                                {{ commonLocaleData?.app_search }}
                            </button>
                            <button matButton="outlined" class="mr-0" (click)="advanceSearchAction('clear')">
                                {{ commonLocaleData?.app_reset }}
                            </button>
                            <button matButton="outlined" aria-label="close" (click)="advanceSearchAction('cancel')">
                                {{ commonLocaleData?.app_cancel }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </mat-dialog-content>
    </div>
    <!-- Angular Material datepicker menu -->
    <mat-menu #universalDatepicker="matMenu" class="universal-datepicker-menu-panel" xPosition="after">
        <ng-template matMenuContent>
            <app-datepicker-wrapper
                [inputStartDate]="selectedDateRange?.startDate"
                [inputEndDate]="selectedDateRange?.endDate"
                [alwaysShowCalendars]="true"
                [ranges]="datePickerOptions"
                [selectedRangeLabel]="selectedRangeLabel"
                [showCustomRangeLabel]="true"
                [showClearButton]="false"
                [showCancel]="true"
                [linkedCalendars]="true"
                [showDropdowns]="true"
                (rangeClicked)="dateSelectedCallback($event)"
                (datesUpdated)="dateSelectedCallback($event)"
                (closeCalender)="toggleGiddhDatepicker(false)"
                [keepCalendarOpeningWithRange]="false"
                [showRangeLabelOnInput]="false"
            ></app-datepicker-wrapper>
        </ng-template>
    </mat-menu>
</div>
