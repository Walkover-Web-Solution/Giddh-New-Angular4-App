<ng-container appTranslate (commonLocaleData)="commonLocaleData = $event">
    <div>
        <div class="header-create-unit dialog-header">
            <span mat-dialog-title>{{ commonLocaleData?.app_create_group }}</span>
            <button mat-icon-button aria-label="close" mat-dialog-close>
                <i class="icon-cross"></i>
            </button>
        </div>
        <mat-dialog-content class="dialog-body">
            <div class="aside-body create-group-aside-body">
                <div class="aside-pane-form">
                    <create-unit-group (closeAsideEvent)="closeAsidePane($event)"></create-unit-group>
                </div>
            </div>
        </mat-dialog-content>
    </div>
</ng-container>
