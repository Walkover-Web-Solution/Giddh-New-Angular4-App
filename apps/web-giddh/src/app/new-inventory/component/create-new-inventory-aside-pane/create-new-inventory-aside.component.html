<div
    appTranslate
    [file]="'inventory'"
    (commonLocaleData)="commonLocaleData = $event"
    (localeData)="localeData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="aside-dialog-wrapper">
        <div cdkFocusInitial class="dialog-header">
            <span>{{ commonLocaleData?.app_create_new }}</span>
            <button matIconButton aria-label="close" (click)="closeAsidePane($event)">
                <i class="icon-cross"></i>
            </button>
        </div>
        <mat-dialog-content class="dialog-body d-flex flex-column justify-content-center align-items-center">
            <div *ngIf="moduleType === 'branch-transfer'">
                <div class="pb-3">
                    <button matButton="filled" (click)="openCreateBranchTransfer('receipt-note')" class="w150">
                        {{ commonLocaleData?.app_receipt_note }}
                    </button>
                </div>
                <div>
                    <button matButton="filled" (click)="openCreateBranchTransfer('delivery-challan')" class="w150">
                        {{ commonLocaleData?.app_delivery_challan }}
                    </button>
                </div>
            </div>
            <div *ngIf="moduleType !== 'branch-transfer' && moduleType !== 'inventory-adjustment'">
                <div class="pb-3">
                    <button matButton="filled" (click)="createNewByAsidePanel('stock')" class="w150">
                        {{ commonLocaleData?.app_create_stock }}
                    </button>
                </div>
                <div>
                    <button matButton="filled" (click)="createNewByAsidePanel('group')" class="w150">
                        {{ commonLocaleData?.app_create_group }}
                    </button>
                </div>
            </div>
            <div *ngIf="moduleType === 'inventory-adjustment'">
                <div class="pb-3">
                    <button
                        matButton="filled"
                        (click)="closeAsidePane()"
                        [routerLink]="['/pages/inventory/v2/adjust-product-and-service']"
                        class="w150"
                    >
                        Adjust Group
                    </button>
                </div>
                <div>
                    <button
                        matButton="filled"
                        (click)="closeAsidePane()"
                        [routerLink]="['/pages/inventory/v2/adjust-product-and-service']"
                        class="w150"
                    >
                        Adjust Stock
                    </button>
                </div>
            </div>
        </mat-dialog-content>
    </div>
</div>
