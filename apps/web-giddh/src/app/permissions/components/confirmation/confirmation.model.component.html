<div>
    <div class="dialog-header">
        <span mat-dialog-title>{{ commonLocaleData?.app_confirmation }}</span>
        <button mat-icon-button aria-label="close" (click)="onCancel()">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <h3 [innerHTML]="confirmationMessage"></h3>
            <div class="text-right mr-t4 clearfix">
                <button mat-raised-button color="primary" class="mr-r1" (click)="onConfirmation()">
                    {{ commonLocaleData?.app_yes }}
                </button>
                <button mat-stroked-button (click)="onCancel()">
                    {{ commonLocaleData?.app_no }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</div>
