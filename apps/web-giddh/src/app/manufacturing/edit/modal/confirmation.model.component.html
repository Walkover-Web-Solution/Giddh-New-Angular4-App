<div>
    <div class="dialog-header">
        <span>Confirmation</span>
        <button mat-icon-button aria-label="close" (click)="onCancel()">
            <i class="icon-cross"></i>
        </button>
    </div>
    <mat-dialog-content class="dialog-body" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <div class="modal-wrap mr-b2">
                <p>Are you sure you want to delete this manufacturing entry?</p>
                <div class="pull-right mr-t5">
                    <button mat-raised-button color="primary" type="submit" class="mr-r1" (click)="onConfirmation()">Yes</button>
                    <button mat-stroked-button type="submit" (click)="onCancel()">No</button>
                </div>
            </div>
        </form>
    </mat-dialog-content>
</div>
