<div>
    <div class="dialog-header">
        <span>Confirmation</span>
    </div>
    <mat-dialog-content class="dialog-body" id="export-body">
        <form name="newRole" novalidate autocomplete="off">
            <div class="modal-wrap mb-4">
                <p>Are you sure you want to delete this manufacturing entry?</p>
                <div class="pull-right mt-5">
                    <button mat-raised-button color="primary" type="submit" class="mr-2" (click)="onConfirmation()">
                        Yes
                    </button>
                    <button mat-stroked-button type="submit" (click)="onCancel()">No</button>
                </div>
            </div>
        </form>
    </mat-dialog-content>
</div>
