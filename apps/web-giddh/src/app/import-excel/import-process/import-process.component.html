<!-- Review Field start-->
<div class="review-data">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <div class="pd-b2 clearfix">
                <label class="import-field-label align-bottom">{{ localeData?.header_provided }}</label>
                <mat-slide-toggle color="primary" name="isHeaderProvided" [(ngModel)]="importData.isHeaderProvided">
                    <span class="pull-left" *ngIf="importData?.isHeaderProvided">{{
                        commonLocaleData?.app_yes
                    }}</span>
                    <span class="pull-right" *ngIf="!importData?.isHeaderProvided">{{
                        commonLocaleData?.app_no
                    }}</span>
                </mat-slide-toggle>
            </div>
            <div class="clearfix">
                <label class="import-field-label align-bottom">{{
                    localeData?.same_debit_credit_column
                }}</label>
                <mat-slide-toggle
                    color="primary"
                    name="sameDebitCreditAmountColumn"
                    [(ngModel)]="importData.sameDebitCreditAmountColumn"
                >
                    <span class="pull-left" *ngIf="importData?.sameDebitCreditAmountColumn">{{
                        commonLocaleData?.app_yes
                    }}</span>
                    <span class="pull-right" *ngIf="!importData?.sameDebitCreditAmountColumn">{{
                        commonLocaleData?.app_no
                    }}</span>
                </mat-slide-toggle>
            </div>
        </div>
        <div class="action-btn">
            <button class="btn btn-default" (click)="onBack.emit()">{{ commonLocaleData?.app_back }}</button>
            <button class="btn btn-success" [disabled]="!importDisable" [ladda]="isLoading" (click)="save()">
                {{ commonLocaleData?.app_import }}
            </button>
        </div>
    </div>
    <cdk-virtual-scroll-viewport [itemSize]="100">
        <div class="table-responsive">
            <table class="table basic table-bordered mr-t1">
                <thead>
                    <tr>
                        <th *ngFor="let col of sheetHeaders; let i = index">
                            <sh-select
                                [options]="giddhHeaders"
                                name="giddhHeaders_{{ i }}"
                                [defaultValue]="mappings[i]?.mappedColumn || unmapHeader"
                                [(ngModel)]="mappings[i].mappedColumn"
                            >
                            </sh-select>
                        </th>
                    </tr>
                    <tr>
                        <th *ngFor="let col of sheetHeaders; let i = index">
                            {{ col }}
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of importData.data.items">
                        <td *ngFor="let row of item.row">
                            <div class="text-ellipsis" container="body" [tooltip]="row.columnValue">
                                {{ row.columnValue }}
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </cdk-virtual-scroll-viewport>
</div>
<!-- Review Field end-->
