<div appTranslate [file]="'import-data'" (localeData)="localeData = $event" (commonLocaleData)="commonLocaleData = $event">
    <hamburger-menu [pageHeading]="localeData?.page_heading"></hamburger-menu>
    <div *ngIf="entity === 'stock'">
        <span class="pull-right mt-2">
            <watch-video [cssClass]="'text-primary pr-3'" [moduleName]="'IMPORT_INVENTORY'"></watch-video>
        </span>
    </div>
    <div *ngIf="entity === 'master'">
        <span class="pull-right mt-2">
            <watch-video [cssClass]="'text-primary pr-3'" [moduleName]="'IMPORT_MASTER'"></watch-video>
        </span>
    </div>
    <div *ngIf="entity === 'entries'">
        <span class="pull-right mt-2">
            <watch-video [cssClass]="'text-primary pr-3'" [moduleName]="'IMPORT_ENTRIES'"></watch-video>
        </span>
    </div>
    <div class="container-fluid clear-both">
        <div class="top-bar" *ngIf="step <= 3">
            <p class="section-title" *ngIf="step === 1"></p>
            <p class="section-title" *ngIf="step === 2">{{ localeData?.map_fields }}</p>
            <p class="section-title" *ngIf="step === 3">{{ localeData?.import_data }}</p>
        </div>
    </div>

    <div class="clear-both col-xs-12 col-sm-12" *ngIf="localeData?.page_heading">
        <div class="col-xs-12 col-sm-12 p-0">
            <div class="clear-both">
                <div [ngSwitch]="step">
                    <div *ngSwitchCase="1">
                        <upload-file
                            [isLoading]="isUploadInProgress"
                            [entity]="entity"
                            [localeData]="localeData"
                            [commonLocaleData]="commonLocaleData"
                            (onFileUpload)="onFileUpload($event)"
                        ></upload-file>
                    </div>

                    <div *ngSwitchCase="2">
                        <import-process
                            [entity]="entity"
                            [isLoading]="excelState?.requestState === 4"
                            [importData]="mappedData"
                            [localeData]="localeData"
                            [commonLocaleData]="commonLocaleData"
                            (onSubmit)="onSubmit($event)"
                            (onBack)="onBack()"
                        ></import-process>
                    </div>

                    <div *ngSwitchCase="4">
                        <upload-success
                            [localeData]="localeData"
                            [commonLocaleData]="commonLocaleData"
                            (onContinueUpload)="onContinueUpload($event)"
                            (onShowReport)="showReport()"
                            [UploadExceltableResponse]="UploadExceltableResponse"
                        ></upload-success>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
