<div appTranslate [file]="'import-data'" (localeData)="localeData = $event" (commonLocaleData)="commonLocaleData = $event">
    <hamburger-menu [pageHeading]="localeData?.page_heading"></hamburger-menu>
    <div class="p-3">
        <div class="d-flex flex-column">
            <div class="text-right">
                <button matButton="filled" (click)="importFiles()">{{ localeData?.import_files }}</button>
            </div>
            <div class="mt-3 import-data-table" *ngIf="!isLoading">
                <div class="no-data h-100" *ngIf="!importStatusResponse?.results?.length">
                    <h2>{{ localeData?.import_status_unavailable }}</h2>
                </div>
                <div class="row import-data-row">
                    <div class="col-lg-6 col-md-12 mb-3" *ngFor="let item of importStatusResponse?.results">
                        <div class="import-card">
                            <i class="hover-orange" (click)="downloadItem(item)">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="13.333"
                                    height="15"
                                    viewBox="0 0 13.333 15"
                                    class="download-import"
                                >
                                    <path
                                        d="M77.9,363.333H91.233V365H77.9Zm10-5-3.333,3.333-3.333-3.333h2.5V350H85.4v8.333Z"
                                        transform="translate(-77.9 -350)"
                                    />
                                </svg>
                            </i>
                            <div class="row">
                                <div class="col-3 col-sm-3">
                                    <label class="text-light">{{ localeData?.file_name }}</label>
                                </div>
                                <div class="col-9 col-sm-9">{{ item?.fileName }}</div>
                            </div>
                            <div class="row mt-1">
                                <div class="col-3 col-sm-3">
                                    <label class="text-light">{{ localeData?.status }}</label>
                                </div>
                                <div class="col-9 col-sm-9">
                                    <span class="text-or">{{ item?.status }}</span>
                                </div>
                            </div>
                            <div class="row mt-1">
                                <div class="col-3 col-sm-3">
                                    <label class="text-light">{{ localeData?.dated }}</label>
                                </div>
                                <div class="col-9 col-sm-9">{{ item?.processDate }}</div>
                            </div>
                            <div class="row mt-1">
                                <div class="col-3 col-sm-3">
                                    <label class="text-light">{{ localeData?.submitted_by }}</label>
                                </div>
                                <div class="col-9 col-sm-9">{{ item?.submittedBy }}</div>
                            </div>
                            <div class="row mt-1">
                                <div class="col-3 col-sm-3">
                                    <label class="text-light">
                                        {{ item?.entity === 'entries' ? commonLocaleData?.app_branch : commonLocaleData?.app_company }}:
                                    </label>
                                </div>
                                <div class="col-9 col-sm-9">
                                    {{ item?.entity === 'entries' ? item?.branch?.name || '-' : activeCompany?.name }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <mat-paginator
                *ngIf="importStatusResponse?.totalItems > pageSizeOptions[0]"
                [length]="importStatusResponse?.totalItems"
                [pageSize]="importPaginatedRequest.count || importStatusResponse?.count"
                [pageIndex]="importPaginatedRequest.page - 1"
                [pageSizeOptions]="pageSizeOptions"
                [showFirstLastButtons]="true"
                [hidePageSize]="false"
                (page)="handlePageEvent($event)"
            ></mat-paginator>
            <section class="mb-custom-80"></section>
            <giddh-page-loader *ngIf="isLoading" [cssClass]="'mt-0 mb-0'"></giddh-page-loader>
        </div>
    </div>
</div>
