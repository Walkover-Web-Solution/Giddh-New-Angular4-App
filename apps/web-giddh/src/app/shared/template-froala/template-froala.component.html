<ng-container
    appTranslate
    [file]="'template-froala'"
    (commonLocaleData)="commonLocaleData = $event"
    (localeData)="localeData = $event"
>
    <div class="dialog-header d-flex align-items-center form-header position-sticky top-0">
        <h3>{{ commonLocaleData?.app_custom_email_template }}</h3>
        <span mat-dialog-close aria-label="close icon"><i class="icon-cross"></i></span>
    </div>

    <mat-dialog-content class="dialog-body d-flex flex-column h-100">
        <div class="overflow-auto">
            <form [formGroup]="emailForm" class="d-flex flex-column flex-grow-1">
                
                <div class="chip-gap" (clickOutside)="clickedOutsideEmail()" (click)="clickedInsideEmail()">
                    <div class="form-group position-relative">
                        <div class="d-flex" (click)="$event.stopPropagation(); clickedInsideEmail()">
                        <label *ngIf="clickedInsideEmailSection" class="mr-r1">{{localeData?.to}}</label>
                        <select-multiple-fields
                            [placeholder]="!(selectedToEmails.length || selectedCcEmails.length || selectedBccEmails.length || clickedInsideEmailSection) ? localeData.recipients : '' "
                            [options]="toEmails"
                            (selectedOption)="selectedToEmails = $event"
                            [selectedValues]="selectedToEmails"
                            [validations]="['email']"
                            [name]="'to'"
                            class="select-multiple-chiplist mb-3 w-100"
                            *ngIf="!(selectedToEmails.length || selectedCcEmails.length || selectedBccEmails.length || clickedInsideEmailSection) || clickedInsideEmailSection"
                        ></select-multiple-fields>
                        </div>
                        
                        <div>
                            {{allStaticEmails}}
                            <span class="suffixEmails" *ngIf="isHiddenEmails.length" (click)="$event.stopPropagation(); clickedInsideEmail() ">{{isHiddenEmails}}</span>
                        </div>
                       
                        <div *ngIf="clickedInsideEmailSection && !showCc && !showBcc" class="d-flex column-gap1 position-absolute chiplist-section">
                            <a class="btn-link under" href="javascript:;" (click)="toggleBccCc('cc'); $event.stopPropagation()">{{
                                localeData?.cc
                            }}</a>
                            <a class="btn-link" href="javascript:;" (click)="toggleBccCc('bcc'); $event.stopPropagation()">{{
                                localeData?.bcc
                            }}</a>
                        </div>
                    </div>
                    <div class="form-group position-relative" *ngIf="showCc && clickedInsideEmailSection">
                        <div class="d-flex">
                        <label class="mr-r1">{{localeData?.cc}}</label>
                        <select-multiple-fields
                            [options]="ccEmails"
                            (selectedOption)="selectedCcEmails = $event"
                            [selectedValues]="selectedCcEmails"
                            [validations]="['email']"
                            [name]="'cc'"
                            class="select-multiple-chiplist mb-3 w-100"
                        ></select-multiple-fields>
                        </div>
                        <div class="d-flex column-gap1 position-absolute chiplist-section">
                            <a *ngIf="!showBcc" class="btn-link" href="javascript:;" (click)="toggleBccCc('bcc'); $event.stopPropagation() ">{{
                                localeData?.bcc
                            }}</a>
                        </div>
                    </div>
                    <div class="form-group position-relative" *ngIf="showBcc && clickedInsideEmailSection">
                        <div class="d-flex">
                        <label class="mr-r1">{{localeData?.bcc}}</label>
                        <select-multiple-fields
                            [options]="bccEmails"
                            (selectedOption)="selectedBccEmails = $event"
                            [selectedValues]="selectedBccEmails"
                            [validations]="['email']"
                            [name]="'bcc'"
                            class="select-multiple-chiplist mb-3 w-100"
                        ></select-multiple-fields>
                        </div>
                        <div  class="d-flex column-gap1 position-absolute chiplist-section">
                            <a *ngIf="!showCc" class="btn-link under" href="javascript:;" (click)="toggleBccCc('cc'); $event.stopPropagation()">{{
                                localeData?.cc
                            }}</a>
                        </div>
                    </div>
                    <div class="form-group">
                        <input
                            type="text"
                            #subjectInputField
                            name="emailSubject"
                            matInput
                            formControlName="emailSubject"
                            class="form-control border-bottom border-left-0 border-right-0 border-top-0"
                            [placeholder]="localeData?.subject"
                        />
                    </div>
                </div>
                <div class="form-group editor-container">
                    <textarea [froalaEditor]="froalaOptions" formControlName="html"></textarea>
                </div>
            </form>
        </div>
        <div class="row position-sticky mt-1">
            <div class="col-sm-4 pr-0">
                <button aria-label="save" mat-stroked-button color="primary" type="button" (click)="onSubmit()">
                    {{ commonLocaleData?.app_save }}
                </button>
            </div>
        </div>
    </mat-dialog-content>
</ng-container>
