<ng-container
    appTranslate
    [file]="'invoice/ewaybill'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="dialog-header">
        <h3 mat-dialog-title class="modal-title bg" id="modal-title">
            {{ localeData?.enter_ewaybill_credentials }}
        </h3>
        <i mat-dialog-close class="icon-cross"></i>
    </div>
    <div mat-dialog-content class="dialog-body">
        <form autocomplete="off" name="eWayBillCredentialsForm" [formGroup]="eWayBillCredentialsForm">
            <div class="row mr-t1">
                <div class="col-6">
                    <input-field
                        [type]="'text'"
                        [name]="'userName'"
                        [required]="true"
                        [autocomplete]="false"
                        formControlName="userName"
                        [cssClass]="'form-control'"
                        [placeholder]="localeData?.username"
                        [label]="localeData?.username"
                    >
                    </input-field>
                </div>
                <div class="col-6">
                    <input-field
                        [id]="'password'"
                        [type]="togglePassword ? 'password' : 'text'"
                        [name]="'password'"
                        [autocomplete]="'new-password'"
                        [required]="true"
                        formControlName="password"
                        [cssClass]="'form-control pd-r3'"
                        [placeholder]="localeData?.password"
                        [label]="localeData?.password"
                        [matSuffixIcon]="togglePassword ? 'fa fa-eye font-16' : 'fa fa-eye-slash font-16'"
                        (clickOnSuffix)="showPassword()"
                    >
                    </input-field>
                </div>
            </div>
            <div class="row mr-t1">
                <div class="col-6">
                    <input-field
                        [type]="'text'"
                        [autocomplete]="false"
                        [required]="true"
                        [maxlength]="15"
                        [minlength]="15"
                        [name]="'gstIn'"
                        formControlName="gstIn"
                        [cssClass]="'form-control'"
                        [placeholder]="commonLocaleData?.app_gstin"
                        [label]="commonLocaleData?.app_gstin"
                    >
                    </input-field>
                </div>
            </div>
            <div class="modal-footer d-flex justify-content-end">
                <button
                    mat-stroked-button
                    color="primary"
                    type="submit"
                    [ladda]="isUserAddedInProcess$ | async"
                    (click)="onSubmit()"
                    [disabled]="eWayBillCredentialsForm.invalid"
                >
                    {{ localeData?.save_validate }}
                </button>
                <button 
                    mat-stroked-button 
                    color="primary" 
                    (click)="onCancel()"
                >
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </div>
</ng-container>
