<div
    *ngIf="selectedBatches.length"
    class="d-flex align-items-start text-left"
    [class.batch-chip-list-compact]="compact"
    [class.flex-column]="!compact"
    [class.row-gap-05]="!compact"
    (click)="$event.stopPropagation()"
>
    <div
        class="d-flex align-items-center column-gap-05"
        [class.flex-wrap]="!compact"
        [class.row-gap-05]="!compact"
        [class.flex-nowrap]="compact"
    >
        <span
            *ngIf="selectedBatches.length > 1"
            class="status-chip status-chip-primary d-inline-flex align-items-center column-gap-05 border-radius-8 font-size-12 font-weight-medium white-space-nowrap theme-primary-light text-primary"
        >
            <i class="icon-tick font-size-12"></i>
            {{ countLabel }}
        </span>
        <span
            *ngIf="negativeCount > 0"
            class="status-chip status-chip-warning d-inline-flex align-items-center border-radius-8 font-size-12 font-weight-medium white-space-nowrap bg-warning text-orange"
        >
            {{ negativeLabel }}
        </span>
        <ng-container *ngIf="!compact || selectedBatches.length === 1">
            <span
                *ngFor="let batch of selectedBatches"
                class="status-chip status-chip-primary d-inline-flex align-items-center border-radius-8 font-size-12 font-weight-medium white-space-nowrap theme-primary-light text-primary"
            >
                {{ (batch?.batchNumber || batch?.name) + " · " + batch?.quantity }}
            </span>
        </ng-container>
        <button
            *ngIf="showEdit"
            type="button"
            class="bg-transparent border-none p-0 d-inline-flex align-items-center column-gap-05 text-primary font-size-12 cursor-pointer"
            (click)="edit.emit($event)"
            (keydown.enter)="$event.preventDefault(); edit.emit($event)"
        >
            <i class="icon-edit font-size-12"></i>
            {{ commonLocaleData?.app_edit }}
        </button>
    </div>
</div>
