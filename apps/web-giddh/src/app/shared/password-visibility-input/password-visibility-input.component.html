<div class="position-relative password-visibility-input">
    <input
        class="pr-5"
        [class]="inputClass()"
        [id]="inputId() ?? null"
        [type]="masked() ? 'password' : 'text'"
        [placeholder]="placeholder()"
        [attr.autocomplete]="autocomplete() ?? null"
        [attr.name]="name() ?? null"
        [attr.minlength]="minLength() ?? null"
        [attr.maxlength]="maxLength() ?? null"
        [disabled]="disabled()"
        [value]="value()"
        (input)="onInput($event)"
        (blur)="handleBlur()"
    />
    <button
        type="button"
        class="password-visibility-toggle cursor-pointer"
        [attr.aria-label]="visibilityLabel()"
        [attr.aria-pressed]="!masked()"
        (click)="toggleVisibility($event)"
    >
        <img src="assets/images/icon/pass.svg" alt="" width="18" height="15" />
    </button>
</div>
