<ng-container
    [keyboardShortcut]="'esc'"
    (onShortcutPress)="dialogRef.close()"
>
    <div class="dialog-header">
        <h3 mat-dialog-title>
            {{ inputData?.title }}
        </h3>
    </div>
    <mat-dialog-content class="dialog-body" [formGroup]="archiveForm">
        <p [innerHTML]="inputData?.message"></p>

        <reactive-dropdown-field
            class="d-block w-50 mt-3"
            (onClear)="handleClear()"
            [name]="'sales-person'"
            [label]="inputData?.commonLocaleData?.app_sales_person"
            [labelValue]="'Unassigned'"
            [placeholder]="inputData?.commonLocaleData?.app_sales_person_placeholder" 
            [options]="salesPersonList"
            formControlName="uniqueName"
        ></reactive-dropdown-field>

        <div class="d-flex column-gap15 mt-4 justify-content-end">
            <button mat-raised-button color="primary" (click)="submit()">{{ inputData?.button?.primaryText }}</button>
            <button mat-stroked-button mat-dialog-close>{{ inputData?.button?.secondaryText }}</button>
        </div>
    </mat-dialog-content>
</ng-container>
