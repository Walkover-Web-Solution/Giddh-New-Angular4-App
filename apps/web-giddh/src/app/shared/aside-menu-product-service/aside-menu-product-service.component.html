<ng-container appTranslate (commonLocaleData)="commonLocaleData = $event">
    <section class="aside-dialog-wrapper">
        <button mat-raised-button *ngIf="hideFirstStep" (click)="backButtonPressed()" class="back-button position-absolute">
            {{ commonLocaleData?.app_back }}
        </button>
        <div class="dialog-header">
            <span mat-dialog-title>
                {{ commonLocaleData?.app_add }}
                <span *ngIf="voucherApiVersion === 2">{{
                    stockType !== "fixed_assets" ? (stockType | titlecase) : "Fixed Assets"
                }}</span>
            </span>
            <button mat-icon-button aria-label="close" (click)="closeAsidePane()">
                <i class="icon-cross"></i>
            </button>
        </div>
        <div class="aside-body flexy-child vertical-align-middle aside-panel-ledger px-0" *ngIf="!hideFirstStep">
            <div class="pb-3 text-center">
                <div class="d-inline-grid">
                    <ng-container *ngIf="inputData !== 'receipt-note' && inputData !== 'delivery-challan'">
                        <button mat-raised-button color="primary" class="mb-2" (click)="toggleAccountPane()">
                            {{ commonLocaleData?.app_add_account }}
                        </button>
                    </ng-container>
                    <button
                        *ngIf="voucherApiVersion === 2"
                        mat-raised-button
                        color="primary"
                        class="mb-2"
                        (click)="toggleStockPane('product')"
                    >
                        {{ commonLocaleData?.app_add_product }}
                    </button>
                    <button
                        *ngIf="voucherApiVersion === 2"
                        mat-raised-button
                        color="primary"
                        class="mb-2"
                        (click)="toggleStockPane('service')"
                    >
                        {{ commonLocaleData?.app_add_service }}
                    </button>
                    <button
                        *ngIf="voucherApiVersion === 2"
                        mat-raised-button
                        color="primary"
                        class="mb-2"
                        (click)="toggleStockPane('fixed_assets')"
                    >
                        {{ commonLocaleData?.app_add_fixedassets }}
                    </button>
                </div>
            </div>
        </div>


        <div class="dialog-body" *ngIf="isAddStockOpen && voucherApiVersion === 2">
            <stock-create-edit
                [addStock]="true"
                [stockType]="stockType"
                (closeAsideEvent)="closeAsidePane($event)"
            ></stock-create-edit>
        </div>

        <div class="w-100 position-absolute top-0 right-0" *ngIf="isAddServiceOpen">
            <generic-aside-menu-account
                (closeAsideEvent)="closeAsidePane($event)"
                [selectedGroupUniqueName]="selectedVoucherType"
                [isDebtorCreditor]="false"
                [isBankAccount]="false"
                [includeSearchedGroup]="includeSearchedGroup"
                [keyboardShortcut]="{ 'esc': !hasUnsavedChanges }"
                (addEvent)="addNewServiceAccount($event)"
            ></generic-aside-menu-account>
        </div>
    </section>
</ng-container>
