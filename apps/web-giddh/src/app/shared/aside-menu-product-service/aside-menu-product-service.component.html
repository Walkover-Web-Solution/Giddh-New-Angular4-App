<div appTranslate (commonLocaleData)="commonLocaleData = $event">
    <section class="aside-dialog-wrapper" [keyboardShortcut]="'esc'" [config]="{ dialogMode: true }" (onShortcutPress)="closeAsidePane()">
        <div cdkFocusInitial class="dialog-header">
            <span>
                {{ commonLocaleData?.app_add }}
                <span *ngIf="voucherApiVersion === 2">{{ stockType !== 'fixed_assets' ? (stockType | titlecase) : 'Fixed Assets' }}</span>
            </span>
            <div class="d-flex align-items-center column-gap-15">
                <button matButton="filled" *ngIf="hideFirstStep && !isAddServiceOpen" (click)="backButtonPressed()">
                    {{ commonLocaleData?.app_back }}
                </button>
                <button matIconButton aria-label="close" (click)="closeAsidePane()">
                    <i class="icon-cross"></i>
                </button>
            </div>
        </div>
        <mat-dialog-content class="dialog-body">
            <div class="aside-panel-ledger" *ngIf="!hideFirstStep">
                <div class="d-inline-grid">
                    <ng-container *ngIf="inputData !== 'receipt-note' && inputData !== 'delivery-challan'">
                        <button matButton="filled" class="mb-2" (click)="toggleAccountPane()">
                            {{ commonLocaleData?.app_add_account }}
                        </button>
                    </ng-container>
                    <button *ngIf="voucherApiVersion === 2" matButton="filled" class="mb-2" (click)="toggleStockPane('product')">
                        {{ commonLocaleData?.app_add_product }}
                    </button>
                    <button *ngIf="voucherApiVersion === 2" matButton="filled" class="mb-2" (click)="toggleStockPane('service')">
                        {{ commonLocaleData?.app_add_service }}
                    </button>
                    <button *ngIf="voucherApiVersion === 2" matButton="filled" class="mb-2" (click)="toggleStockPane('fixed_assets')">
                        {{ commonLocaleData?.app_add_fixedassets }}
                    </button>
                </div>
            </div>

            <stock-create-edit
                *ngIf="isAddStockOpen && voucherApiVersion === 2"
                [addStock]="true"
                [stockType]="stockType"
                (closeAsideEvent)="closeAsidePane($event)"
            ></stock-create-edit>
        </mat-dialog-content>
    </section>
</div>

<ng-template #accountTemplate>
    <generic-aside-menu-account
        (closeAsideEvent)="closeAsidePane($event)"
        [backButtonVisible]="hideFirstStep"
        (backButtonPressedEvent)="backButtonPressed()"
        [selectedGroupUniqueName]="selectedVoucherType"
        [isDebtorCreditor]="false"
        [isBankAccount]="false"
        [includeSearchedGroup]="includeSearchedGroup"
        (addEvent)="addNewServiceAccount($event)"
    ></generic-aside-menu-account>
</ng-template>
