<div
    appTranslate
    [file]="'settings/taxes'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="dialog-header" [keyboardShortcut]="'esc'" [config]="{ dialogMode: true }" (onShortcutPress)="closeEvent?.emit()">
        <span>
            {{ tax && tax?.uniqueName ? localeData?.update_tax : localeData?.create_new_tax }}
        </span>
    </div>
    <mat-dialog-content class="dialog-body">
        <!-- Loader -->
        <giddh-page-loader *ngIf="isTaxAuthoritiesLoading$ | async"></giddh-page-loader>

        <form (ngSubmit)="onSubmit()" *ngIf="!(isTaxAuthoritiesLoading$ | async) && taxForm" [formGroup]="taxForm">
            <div class="row" *ngIf="isUSCompany">
                <div class="mb-3 col-sm-6 col-xs-12" formGroupName="taxAuthorityRequest">
                    <reactive-dropdown-field
                        appEnterNext
                        [label]="commonLocaleData?.app_tax_authority"
                        [options]="taxAuthorityList"
                        [name]="'taxAuthority'"
                        [labelValue]="selectedTaxAuthority"
                        [placeholder]="commonLocaleData?.app_select + ' ' + commonLocaleData?.app_tax_authority"
                        [required]="true"
                        formControlName="uniqueName"
                        [showError]="!isValidForm && taxForm?.get('taxAuthorityRequest')?.invalid"
                    ></reactive-dropdown-field>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-6 col-xs-12">
                    <reactive-dropdown-field
                        appEnterNext
                        [label]="localeData?.select_tax"
                        [options]="taxListSource$ | async"
                        [name]="'taxType'"
                        [labelValue]="selectedTax"
                        [placeholder]="localeData?.select_tax"
                        [required]="true"
                        [readonly]="tax && tax?.uniqueName"
                        [disabled]="tax && tax?.uniqueName"
                        formControlName="taxType"
                        [showError]="!isValidForm && !taxForm?.get('taxType')?.value"
                        (selectedOption)="selectTax($event)"
                        (onClear)="taxForm?.get('taxType')?.patchValue('')"
                        #dropdownRef
                    ></reactive-dropdown-field>
                </div>

                <div class="col-sm-6 col-xs-12">
                    <input-field
                        appEnterNext
                        [label]="localeData?.tax_percent"
                        [type]="'number'"
                        [name]="'taxValue'"
                        (onChange)="taxForm?.get('taxValue').patchValue(+$event)"
                        [required]="true"
                        [showError]="!isValidForm && taxForm?.get('taxValue')?.invalid"
                        formControlName="taxValue"
                    ></input-field>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6 col-xs-12">
                    <input-field
                        appEnterNext
                        [type]="'text'"
                        [name]="'name'"
                        [label]="commonLocaleData?.app_name"
                        [placeholder]="commonLocaleData?.app_name"
                        formControlName="name"
                        [showError]="!isValidForm && taxForm?.get('name')?.invalid"
                        [required]="true"
                        (ngModelChange)="generateUniqueName()"
                    ></input-field>
                </div>

                <div class="form-group col-sm-6 col-xs-12" *ngIf="tax && tax?.uniqueName">
                    <input-field
                        appEnterNext
                        [type]="'text'"
                        [name]="'taxNumber'"
                        [label]="commonLocaleData?.app_unique_name"
                        [placeholder]="commonLocaleData?.app_unique_name"
                        formControlName="uniqueName"
                        [disabled]="true"
                    ></input-field>
                </div>

                <div
                    class="col-sm-6 col-xs-12"
                    *ngIf="taxForm?.get('taxType')?.value === 'tds' || taxForm?.get('taxType')?.value === 'tcs'"
                >
                    <reactive-dropdown-field
                        appEnterNext
                        [options]="taxNameTypesMapping[taxForm?.get('taxType')?.value]"
                        [name]="'tdsTcsTaxSubTypes'"
                        [label]="commonLocaleData?.app_type"
                        [placeholder]="selectedTaxType ? selectedTaxType : commonLocaleData?.app_select_type"
                        [labelValue]="selectedTaxType"
                        [required]="true"
                        [readonly]="checkIfTdsOrTcs"
                        [disabled]="checkIfTdsOrTcs"
                        formControlName="tdsTcsTaxSubTypes"
                        [showError]="!isValidForm && taxForm?.get('tdsTcsTaxSubTypes')?.invalid"
                    ></reactive-dropdown-field>
                </div>
            </div>

            <div
                class="row my-3"
                *ngIf="taxForm?.get('taxType')?.value === 'cess' || (taxForm?.get('taxType')?.value === 'others' && !tax)"
            >
                <div class="col-sm-6 col-xs-12" *ngIf="taxForm?.get('taxType')?.value === 'cess'">
                    <reactive-dropdown-field
                        appEnterNext
                        [options]="allTaxes"
                        [name]="'linkTax'"
                        [placeholder]="localeData?.link_tax"
                    ></reactive-dropdown-field>
                </div>

                <div class="col-sm-6 col-xs-12" *ngIf="taxForm?.get('taxType')?.value === 'others' && !tax">
                    <reactive-dropdown-field
                        appEnterNext
                        [label]="localeData?.linked_account"
                        [placeholder]="commonLocaleData?.app_select_account"
                        [name]="'account'"
                        [options]="linkedAccountsOption"
                        formControlName="account"
                        [showError]="!isValidForm && taxForm?.get('account')?.invalid"
                        [required]="true"
                    ></reactive-dropdown-field>
                </div>
            </div>

            <div *ngIf="tax" class="row">
                <div class="col-sm-12">
                    {{ localeData?.linked_account }}
                    <div class="custom-tags" *ngIf="taxForm?.get('accounts')?.value?.length">
                        <span *ngFor="let account of taxForm.get('accounts').value">
                            {{ account.name }}
                        </span>
                    </div>
                </div>
            </div>

            <div class="row mt-3">
                <div class="form-group col-sm-4 col-xs-12">
                    <giddh-datepicker
                        appEnterNext
                        (dateSelected)="selectDate($event)"
                        name="date"
                        [cssClass]="'w-100'"
                        formControlName="date"
                        [showError]="!isValidForm && taxForm?.get('date')?.invalid"
                        [showToggleIcon]="false"
                        [appearance]="'outline'"
                        [placeholder]="localeData?.apply_tax_from"
                        [closeDatepickerOnFocus]="true"
                        [required]="true"
                    ></giddh-datepicker>
                </div>

                <div class="form-group col-sm-4 col-xs-12">
                    <reactive-dropdown-field
                        appEnterNext
                        [label]="localeData?.tax_duration"
                        formControlName="duration"
                        [showError]="!isValidForm && taxForm?.get('duration')?.invalid"
                        [options]="duration"
                        [name]="'duration'"
                        [labelValue]="selectedDuration"
                        [placeholder]="localeData?.select_duration"
                        [required]="true"
                    ></reactive-dropdown-field>
                </div>

                <div class="form-group col-sm-4 col-xs-12">
                    <reactive-dropdown-field
                        appEnterNext
                        [label]="localeData?.filing_date"
                        [placeholder]="commonLocaleData?.app_select_date"
                        formControlName="taxFileDate"
                        [showError]="!isValidForm && taxForm?.get('taxFileDate')?.invalid"
                        [labelValue]="selectedTaxFileDate"
                        [name]="'taxFileDate'"
                        [required]="true"
                        [options]="days"
                        (selectedOption)="taxForm.get('taxFileDate').patchValue($event.value)"
                    ></reactive-dropdown-field>
                </div>
            </div>

            <div class="d-flex column-gap-1 align-items-center">
                <button matButton="filled" aria-label="create" type="submit" *ngIf="!tax">
                    <ng-container *ngIf="!isTaxCreateInProcess; else showSpinner">
                        {{ commonLocaleData?.app_create }}
                    </ng-container>
                </button>

                <button matButton="filled" aria-label="cancel" type="submit" *ngIf="tax && tax?.uniqueName">
                    <ng-container *ngIf="!isUpdateTaxInProcess; else showSpinner">
                        {{ commonLocaleData?.app_update }}
                    </ng-container>
                </button>

                <button matButton="outlined" type="button" (click)="closeEvent?.emit()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</div>

<!-- Mat Spinner -->
<ng-template #showSpinner>
    <giddh-progress-spinner></giddh-progress-spinner>
</ng-template>
