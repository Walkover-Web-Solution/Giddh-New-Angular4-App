<ng-container
    appTranslate
    [file]="'settings/taxes'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div class="dialog-header theme-bg d-flex justify-content-between">
        <h3 class="modal-title bg" id="modal-title" mat-dialog-title>
            {{ tax && tax?.uniqueName ? localeData?.update_tax : localeData?.create_new_tax }}
        </h3>
        <i mat-dialog-close (click)="closeEvent?.emit()" aria-label="close icon" class="icon-cross"></i>
    </div>
    <mat-dialog-content class="dialog-body">
        <!-- Loader -->
        <giddh-page-loader *ngIf="isTaxAuthoritiesLoading$ | async"></giddh-page-loader>

        <form #taxForm="ngForm" (ngSubmit)="onSubmit()" *ngIf="!(isTaxAuthoritiesLoading$ | async)">
            <div class="row" *ngIf="isUSCompany">
                <div class="mb-3 col-sm-6 col-xs-12">
                    <dropdown-field
                        [label]="commonLocaleData?.app_tax_authority"
                        [options]="taxAuthorityList"
                        [name]="'taxAuthority'"
                        [defaultValue]="selectedTaxAuthority"
                        [placeholder]="commonLocaleData?.app_select + ' ' + commonLocaleData?.app_tax_authority"
                        [required]="true"
                        (selectedOption)="newTaxObj.taxAuthorityRequest.uniqueName = $event.value"
                    ></dropdown-field>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-6 col-xs-12">
                    <dropdown-field
                        [label]="localeData?.select_tax"
                        [options]="taxListSource$ | async"
                        [name]="'taxType'"
                        [defaultValue]="selectedTax"
                        [placeholder]="localeData?.select_tax"
                        [required]="true"
                        (selectedOption)="selectTax($event)"
                    ></dropdown-field>
                </div>

                <div class="col-sm-6 col-xs-12">
                    <input-field
                        [label]="localeData?.tax_percent"
                        [type]="'number'"
                        [name]="'taxValue'"
                        [required]="true"
                        [max]="100"
                        [min]="0"
                        [allowDecimalDigitsOnly]="true"
                        [(ngModel)]="newTaxObj.taxValue"
                    ></input-field>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-6 col-xs-12">
                    <input-field
                        [type]="'text'"
                        [name]="'name'"
                        [label]="commonLocaleData?.app_name"
                        [placeholder]="commonLocaleData?.app_name"
                        [(ngModel)]="newTaxObj.name"
                        [required]="true"
                        (ngModelChange)="generateUniqueName()"
                    ></input-field>
                </div>

                <div class="form-group col-sm-6 col-xs-12" *ngIf="tax && tax?.uniqueName">
                    <input-field
                        [type]="'text'"
                        [name]="'taxNumber'"
                        [label]="commonLocaleData?.app_unique_name"
                        [placeholder]="commonLocaleData?.app_unique_name"
                        [(ngModel)]="newTaxObj.uniqueName"
                        [disabled]="true"
                    ></input-field>
                </div>

                <div class="col-sm-6 col-xs-12" *ngIf="newTaxObj.taxType === 'tds' || newTaxObj.taxType === 'tcs'">
                    <dropdown-field
                        [options]="taxNameTypesMapping[newTaxObj.taxType]"
                        [name]="'tdsTcsTaxSubTypes'"
                        [label]="commonLocaleData?.app_select_type"
                        [placeholder]="selectedTaxType ? selectedTaxType : commonLocaleData?.app_select_type"
                        [defaultValue]="selectedTaxType"
                        [required]="true"
                        [readonly]="checkIfTdsOrTcs"
                        (selectedOption)="newTaxObj.tdsTcsTaxSubTypes = $event.value"
                    ></dropdown-field>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-6 col-xs-12" *ngIf="newTaxObj.taxType === 'cess'">
                    <dropdown-field
                        [options]="allTaxes"
                        [name]="'linkTax'"
                        [placeholder]="localeData?.link_tax"
                        (selectedOption)="newTaxObj.taxType = $event.value"
                    ></dropdown-field>
                </div>

                <div class="col-sm-6 col-xs-12" *ngIf="newTaxObj.taxType === 'others' && !tax">
                    <dropdown-field
                        [label]="localeData?.linked_account"
                        [placeholder]="commonLocaleData?.app_select_account"
                        [name]="'account'"
                        [options]="linkedAccountsOption"
                        (selectedOption)="newTaxObj.account = $event.value"
                        [required]="true"
                    ></dropdown-field>
                </div>
            </div>

            <div *ngIf="tax" class="row mb-3">
                <div class="col-sm-12">
                    {{ localeData?.linked_account }}
                    <div class="custom-tags" *ngIf="newTaxObj.accounts?.length">
                        <span *ngFor="let account of newTaxObj.accounts">
                            {{ account.name }}
                        </span>
                    </div>
                </div>
            </div>

            <div class="row mt-3">
                <div class="form-group col-sm-4 col-xs-12">
                    <giddh-datepicker
                        (dateSelected)="selectDate($event)"
                        name="date"
                        [cssClass]="'w-100'"
                        [(ngModel)]="newTaxObj.date"
                        [showToggleIcon]="false"
                        [appearance]="'outline'"
                        [placeholder]="localeData?.apply_tax_from"
                        [required]="true"
                    >
                    </giddh-datepicker>
                </div>

                <div class="form-group col-sm-4 col-xs-12">
                    <dropdown-field
                        [label]="localeData?.tax_duration"
                        [placeholder]="localeData?.select_duration"
                        (selectedOption)="newTaxObj.duration = $event.value"
                        [name]="'duration'"
                        [required]="true"
                        [options]="duration"
                    ></dropdown-field>
                </div>

                <div class="form-group col-sm-4 col-xs-12">
                    <dropdown-field
                        [label]="localeData?.filing_date"
                        [placeholder]="commonLocaleData?.app_select_date"
                        (selectedOption)="newTaxObj.taxFileDate = +$event.value"
                        [name]="'taxFileDate'"
                        [required]="true"
                        [options]="days"
                    ></dropdown-field>
                </div>
            </div>

            <div class="d-flex column-gap1 align-items-center">
                <button
                    mat-stroked-button
                    color="primary"
                    aria-label="create"
                    type="submit"
                    *ngIf="!tax"
                    [disabled]="taxForm.invalid"
                >
                    <ng-container *ngIf="!isTaxCreateInProcess; else showSpinner">
                       {{ commonLocaleData?.app_create }}
                    </ng-container>
                </button>

                <button
                    mat-stroked-button
                    color="primary"
                    aria-label="cancel"
                    type="submit"
                    *ngIf="tax && tax?.uniqueName"
                    [disabled]="taxForm.invalid"
                >
                    <ng-container *ngIf="!isUpdateTaxInProcess; else showSpinner">
                        {{ commonLocaleData?.app_update }}
                    </ng-container>
                </button>

                <button mat-stroked-button (click)="closeEvent?.emit()">
                    {{ commonLocaleData?.app_cancel }}
                </button>
            </div>
        </form>
    </mat-dialog-content>
</ng-container>

<!-- Mat Spinner -->
<ng-template #showSpinner>
    <giddh-progress-spinner></giddh-progress-spinner>
</ng-template>
