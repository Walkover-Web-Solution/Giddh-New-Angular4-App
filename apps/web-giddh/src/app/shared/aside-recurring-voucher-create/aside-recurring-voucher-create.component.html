<div [formGroup]="recurrenceForm" class="recurring-wrapper">
    <!-- =======================
         START DATE
    ======================= -->
    <mat-form-field appearance="outline">
        <mat-label>Start on</mat-label>
        <input
            matInput
            [matDatepicker]="startPicker"
            formControlName="startDate"
            [min]="minStartDate"
            (dateChange)="onStartDateChange($event.value)"
        />
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <!-- =======================
         REPEAT OPTIONS
    ======================= -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Repeat</mat-label>
        <mat-select [value]="selectedRepeatOption" (selectionChange)="selectRepeatOption($event.value)">
            <mat-option *ngFor="let opt of repeatOptions" [value]="opt.value">
                {{ opt.label }}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <!-- =======================
         CUSTOM CONFIG
    ======================= -->
    <ng-container *ngIf="showCustom">
        <!-- REPEAT EVERY -->
        <div class="row" formGroupName="frequency">
            <mat-form-field appearance="outline">
                <mat-label>Repeat every</mat-label>
                <input matInput type="number" min="1" formControlName="interval" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-select formControlName="unit" (selectionChange)="onRepeatUnitChange($event.value)">
                    <mat-option value="DAY">Day</mat-option>
                    <mat-option value="WEEK">Week</mat-option>
                    <mat-option value="MONTH">Month</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <!-- =======================
           WEEKLY
      ======================= -->
        <ng-container *ngIf="showWeekdayToggle">
            <div class="weekday-toggle">
                <button
                    mat-raised-button
                    *ngFor="let d of weekdays"
                    [class.active]="isWeekdaySelected(d.value)"
                    (click)="toggleWeekday(d.value)"
                    type="button"
                >
                    {{ d.label }}
                </button>
            </div>
        </ng-container>

        <!-- =======================
           MONTHLY
      ======================= -->
        <ng-container *ngIf="showDayThe">
            <div formGroupName="repeatOn">
                <mat-radio-group formControlName="monthlyMode">
                    <!-- DAY -->
                    <mat-radio-button value="DAY" (change)="selectMonthlyDay()">
                        Day
                        <mat-form-field appearance="outline" (click)="$event.stopPropagation()">
                            <mat-select formControlName="dayOfMonth">
                                <mat-option *ngFor="let d of monthDays" [value]="d">
                                    {{ d }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </mat-radio-button>

                    <!-- THE -->
                    <mat-radio-button value="THE" (change)="selectMonthlyThe()">
                        The
                        <mat-form-field appearance="outline" (click)="$event.stopPropagation()">
                            <mat-select formControlName="weekOfMonth">
                                <mat-option *ngFor="let w of weekOfMonthOptions" [value]="w.value">
                                    {{ w.label }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>

                        <mat-form-field appearance="outline" (click)="$event.stopPropagation()">
                            <mat-select formControlName="weekday">
                                <mat-option *ngFor="let d of weekdayOptions" [value]="d.value">
                                    {{ d.label }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </mat-radio-button>
                </mat-radio-group>
            </div>
        </ng-container>
    </ng-container>

    <!-- =======================
         ENDS
    ======================= -->
    <div formGroupName="end" class="section">
        <label class="section-label">Ends</label>

        <mat-radio-group formControlName="type">
            <div class="row">
                <mat-radio-button value="ON_DATE">On</mat-radio-button>
                <mat-form-field appearance="outline">
                    <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
                    <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                    <mat-datepicker #endPicker></mat-datepicker>
                </mat-form-field>
            </div>

            <mat-radio-button value="NEVER">Never</mat-radio-button>
        </mat-radio-group>
    </div>
</div>
