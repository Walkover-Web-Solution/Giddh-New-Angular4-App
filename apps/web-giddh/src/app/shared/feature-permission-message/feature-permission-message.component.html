<div
    class="feature-permission-message d-flex flex-column align-items-center justify-content-center text-center mx-auto max-w-500"
    role="status"
>
    <div class="feature-permission-message__icon-wrap d-flex align-items-center justify-content-center position-relative mb-3" aria-hidden="true">
        <i [class]="'feature-permission-message__icon text-primary ' + iconClass()"></i>
        @if (showBadge() && badgeIconClass()) {
            <span class="feature-permission-message__badge d-flex align-items-center justify-content-center border-radius-circle">
                <i [class]="badgeIconClass()"></i>
            </span>
        }
    </div>

    <h2 class="feature-permission-message__title font-size-20 font-weight-bold mb-2">
        {{ title() }}
    </h2>

    @if (description()) {
        <p
            class="feature-permission-message__description text-light font-size-14 mb-3"
            [innerHTML]="description()"
        ></p>
    }

    <a
        matButton="filled"
        class="feature-permission-message__cta"
        [routerLink]="primaryButtonLink()"
        [attr.aria-label]="primaryButtonText()"
    >
        {{ primaryButtonText() }}
    </a>

    @if (secondaryLinkText() && secondaryLinkUrl()) {
        <a
            class="feature-permission-message__secondary text-primary font-size-14 mt-3 text-decoration-none"
            [href]="secondaryLinkUrl()"
            target="_blank"
            rel="noopener noreferrer"
        >
            {{ secondaryLinkText() }}
        </a>
    }
</div>
