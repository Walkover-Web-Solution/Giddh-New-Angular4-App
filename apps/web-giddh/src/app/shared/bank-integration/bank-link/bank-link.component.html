<ng-container
    appTranslate
    [file]="'settings/integration'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="modal-header d-flex align-items-center">
        <h3>{{ localeData?.payment?.link_bank }}</h3>
        <i (click)="closeDialog()" aria-label="close icon" class="icon-cross"></i>
    </div>
    <giddh-page-loader [cssClass]="'mt-0 mb-0'" *ngIf="isLoading"></giddh-page-loader>
    <mat-dialog-content class="banklink-dialog-body" *ngIf="!isLoading">
        <div class="w-100 container pd-t15 pd-b15">
            <div class="row">
                <div class="col-12 bank-link">
                    <div class="col-8">
                        <p *ngIf="bankLinks?.length === 0">{{ localeData?.payment?.all_bank_are_linked }}</p>
                        <dropdown-field
                            [name]="'banks'"
                            [autocomplete]="'disabled'"
                            [label]="localeData?.payment?.bank_list"
                            [placeholder]="localeData?.payment?.banks"
                            [options]="bankLinks"
                            (selectedOption)="selectedOption($event)"
                            [defaultValue]="defaultSelectedBank"
                        >
                        </dropdown-field>
                    </div>
                    <div>
                        <button
                            mat-stroked-button
                            class="mr-15"
                            type="submit"
                            (click)="linkBankAccount()"
                            [disabled]="!selectedBank"
                        >
                            {{ localeData?.payment?.link }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </mat-dialog-content>
</ng-container>
