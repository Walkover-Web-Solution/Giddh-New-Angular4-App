<ng-container
    appTranslate
    (commonLocaleData)="commonLocaleData = $event"
>
<div *ngIf="activeCompany && shouldShowMessage()" class="pd-t1">
    <span class="d-flex align-items-center column-gap5">
        {{ commonLocaleData?.app_no_access_limit_module }}
        <button
            mat-stroked-button
            color="primary"
            aria-label="upgrade"
            class="mr-0"
            (click)="onUpgrade()">
            {{ commonLocaleData?.app_upgrade }}
        </button>
    </span>
</div>
</ng-container>
