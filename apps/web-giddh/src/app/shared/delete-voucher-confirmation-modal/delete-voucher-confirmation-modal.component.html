<ng-container
    appTranslate
    [file]="'invoice/confirmation-model'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
    (translationComplete)="translationComplete($event)"
>
    <div *ngIf="translationLoaded">
        <div class="dialog-header theme-bg pd-2 pd-l2 pd-r2 clearfix">
            <span>{{ confirmationMessages[module]?.title }}</span>
            <button mat-icon-button aria-label="close" (click)="onCancel()">
                <i class="icon-cross"></i>
            </button>
        </div>
        <mat-dialog-content class="dialog-body" id="export-body">
            <form name="newRole" novalidate autocomplete="off">
                <div class="modal-wrap mr-b2">
                    <h3>{{ confirmationMessages[module]?.message1 }}</h3>
                    <p class="text-gray font-15 mr-t05">{{ confirmationMessages[module]?.message2 }}</p>
                </div>
                <div class="d-flex justify-content-start">
                    <button mat-raised-button color="primary" type="button" class="mr-r1" (click)="onConfirmation()">
                        {{ commonLocaleData?.app_yes }}
                    </button>
                    <button mat-stroked-button type="button" (click)="onCancel()">
                        {{ commonLocaleData?.app_no }}
                    </button>
                </div>
            </form>
        </mat-dialog-content>
    </div>
</ng-container>
