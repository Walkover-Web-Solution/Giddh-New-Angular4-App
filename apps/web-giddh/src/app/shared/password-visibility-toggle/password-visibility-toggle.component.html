<button
    type="button"
    class="password-visibility-toggle absolute-center-vertical right-8 cursor-pointer text-light"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="visible()"
    (click)="onToggle()"
>
    <i class="fa" [class.fa-eye]="!visible()" [class.fa-eye-slash]="visible()" aria-hidden="true"></i>
</button>
