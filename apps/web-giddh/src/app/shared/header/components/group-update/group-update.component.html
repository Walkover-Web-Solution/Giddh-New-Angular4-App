<form
    class="horizontal-form ng-pristine ng-valid ng-valid-required manage-group-account-form"
    id="groupDetailForm"
    name="groupDetailForm"
    novalidate
    [formGroup]="groupDetailForm"
    (submit)="updateGroup()"
>
    <div class="container-fluid mr-t1">
        <div class="row pd-b2">
            <div class="col-xs-12 col-sm-6">
                <input-field
                    [type]="'text'"
                    [placeholder]="localeData?.group_name_placeholder"
                    [label]="localeData?.group_name_label"
                    [name]="'name'"
                    formControlName="name"
                    [disabled]="groupDetailForm.get('name').disabled"
                >
                </input-field>

            </div>
            <div class="col-xs-12 col-sm-6">
                <input-field
                    [type]="'text'"
                    UniqueNameDirective
                    textCaseChangeDirective
                    [placeholder]="commonLocaleData?.app_unique_name_placeholder"
                    [label]="commonLocaleData?.app_unique_name"
                    [name]="'uniqueName'"
                    formControlName="uniqueName"
                    [disabled]="groupDetailForm.get('uniqueName').disabled"
                >
                </input-field>
            </div>
        </div>

        <div class="row pd-b2">
            <div class="col-xs-12 col-sm-6" *ngIf="!(activeGroup$ | async)?.fixed">
                <div
                    class="input-group width-100"
                    [ngClass]="{ 'clearfix': groupDetailForm.get('closingBalanceTriggerAmount')?.value > 0 }"
                >
                    <input-field
                        [type]="'number'"
                        [label]="localeData?.balance_for_trigger"
                        [name]="'closingBalanceTriggerAmount'"
                        formControlName="closingBalanceTriggerAmount"
                        [min]="0"
                        class="flex-grow-1"
                        [cssClass]="'text-right'"
                        [ngClass]="{ 'w100 remove-right-border-radius': groupDetailForm.get('closingBalanceTriggerAmount')?.value > 0 }"
                        [placeholder]="'0.00'"
                        [allowDigitsOnly]="true"
                    >
                    </input-field>
                    <div
                        class="input-group-addon d-flex align-item-center"
                        (click)="closingBalanceTypeChanged('DEBIT')"
                        [ngClass]="{
                            'active-toggle-btn':
                                groupDetailForm.get('closingBalanceTriggerAmountType')?.value === 'DEBIT',
                            'cp': groupDetailForm.get('closingBalanceTriggerAmount')?.value > 0
                        }"
                        *ngIf="groupDetailForm.get('closingBalanceTriggerAmount')?.value > 0"
                    >
                        {{ commonLocaleData?.app_dr?.toUpperCase() }}
                    </div>
                    <div
                        class="input-group-addon only-right-radius d-flex align-item-center"
                        (click)="closingBalanceTypeChanged('CREDIT')"
                        [ngClass]="{
                            'active-toggle-btn':
                                groupDetailForm.get('closingBalanceTriggerAmountType')?.value === 'CREDIT',
                            'cp': groupDetailForm.get('closingBalanceTriggerAmount')?.value > 0
                        }"
                        *ngIf="groupDetailForm.get('closingBalanceTriggerAmount')?.value > 0"
                    >
                        {{ commonLocaleData?.app_cr?.toUpperCase() }}
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group clearfix">
            <label>{{ localeData?.description_label }}</label>
            <textarea
                maxlength="200"
                rows="5"
                cols="10"
                class="form-control"
                [placeholder]="localeData?.description_placeholder"
                formControlName="description"
            ></textarea>
        </div>

        <div class="text-right">
            <button
                mat-stroked-button
                color="primary"
                *ngIf="(showEditGroup$ | async) && !(activeGroup$ | async)?.fixed"
                (click)="showDeleteGroupModal()"
                aria-label="delete"
                [matTooltip]="commonLocaleData?.app_delete"
                matTooltipPosition="above"
            >
                {{ commonLocaleData?.app_delete }}
            </button>

            <button
                *ngIf="showEditGroup$ | async"
                mat-stroked-button
                color="primary"
                class="mr-l1"
                type="submit"
                aria-label="update"
                [matTooltip]="commonLocaleData?.app_update"
                matTooltipPosition="above"
                [disabled]="(activeGroup$ | async)?.fixed || groupDetailForm.invalid || (isUpdateGroupInProcess$ | async)"
            >
                {{ commonLocaleData?.app_update }}
            </button>
        </div>
    </div>
</form>

<!--move group-->
<div
    class="horizontal-form manage-group-account-form form-group mr-b1 clearfix"
    *ngIf="(activeGroup$ | async) && !(activeGroup$ | async)?.fixed"
>
    <form
        name="moveGroupForm"
        class="col-xs-12 col-sm-12"
        novalidate
        (submit)="moveGroup()"
        [formGroup]="moveGroupForm"
    >
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label>{{ localeData?.move_to_group }}</label>
                    <div class="d-flex justify-content-between align-items-center">
                        <reactive-dropdown-field
                            class="pull-left width-select"
                            [label]="commonLocaleData?.move_to_group"
                            [placeholder]="localeData?.group_name_label"
                            [options]="searchedGroups"
                            formControlName="moveto"
                            [enableDynamicSearch]="true"
                            [isPaginationEnabled]="true"
                            (scrollEnd)="handleGroupScrollEnd()"
                            (dynamicSearchedQuery)="onGroupSearchQueryChanged($event)"
                        >
                        </reactive-dropdown-field>
                        <button
                            mat-stroked-button
                            color="primary"
                            type="submit"
                            [disabled]="moveGroupForm.invalid"
                            aria-label="move"
                        >
                            {{ localeData?.move }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<!--move group-->
<!--taxes  -->

<!-- Taxes collapse -->
<div class="clearfix tax-operation horizontal-form manage-group-account-form" *ngIf="isTaxableGroup$ | async">
    <div class="col-xs-12 col-sm-12">
        <div class="form-group toggle-btn mr-b05">
            <label class="cp" (click)="showTaxes = !showTaxes; taxHierarchy()">
                <i
                    class="cp collapse-icons"
                    aria-hidden="true"
                    [ngClass]="{ 'icon-minus': showTaxes, 'icon-plus': !showTaxes }"
                ></i
                >{{ commonLocaleData?.app_taxes }}
            </label>
        </div>
    </div>
    <!-- taxes container -->
    <ng-container *ngIf="showTaxes">
        <div class="col-xs-12 col-sm-12">
            <form name="taxGroupForm" novalidate [formGroup]="taxGroupForm" (submit)="applyTax()">
                <div class="tax-label">
                    <label>{{ localeData?.all_applicable_taxes_label }}</label>
                </div>
                <div class="d-flex justify-content-between align-items-center form-group">
                    <select-multiple-fields
                        [label]="localeData?.all_applicable_taxes_label"
                        [commonLocaleData]="commonLocaleData"
                        [selectedValues]="defaultTaxLabel"
                        [placeholder]="commonLocaleData?.app_select"
                        [options]="companyTaxDropDown"
                        [chipListUniqueName]="taxGroupForm.get('taxes').value"
                        (selectedOptionUniqueName)="taxesSelected($event)"
                        (selectedOption)="defaultTaxLabel = $event"
                        class="adjusted-content-width select-multiple-chiplist mobile-margin border-bottom"
                    ></select-multiple-fields>
                    <button
                        [disabled]="isTaxesSaveDisable$ | async"
                        type="submit"
                        mat-stroked-button
                        color="primary"
                        aria-label="save"
                        [matTooltip]="commonLocaleData?.app_save"
                        matTooltipPosition="above"
                    >
                        {{ commonLocaleData?.app_save }}
                    </button>
                </div>
            </form>
            <div class="edit-tax-section">
                <div class="form-group">
                    <div class="tax-label">
                        <label>{{ localeData?.all_inherited_taxes }}</label>
                    </div>
                    <div *ngFor="let inTax of (activeGroupTaxHierarchy$ | async)?.inheritedTaxes">
                        <ng-template #popTemplate>
                            <div
                                *ngIf="taxPopOverTemplate"
                                [innerHtml]="taxPopOverTemplate?.replace('@inTax.name', inTax.name)"
                            ></div>
                        </ng-template>
                        <span
                            class="tax-bullet"
                            *ngFor="let inAppTax of inTax.applicableTaxes"
                            [popover]="popTemplate"
                            placement="right"
                            triggers="mouseenter:mouseleave"
                            >{{ inAppTax?.name }}
                        </span>
                    </div>
                    <p *ngIf="!(activeGroupTaxHierarchy$ | async)?.inheritedTaxes?.length">
                        {{ localeData?.no_inherited_taxes }}
                    </p>
                </div>
            </div>
        </div>
    </ng-container>
    <!-- taxes container -->
</div>
<!-- commented for later use isDebtorCreditorGroups -->
<div class="horizontal-form" *ngIf="isDebtorCreditorGroups">
    <div class="mb-2 select-box container-fluid mt-1">
        <div class="form-group">
            <label>{{ localeData?.default_discounts }} <span class="primary-color"></span></label>
            <div class="d-flex justify-content-between align-items-center pd-t1">
                <reactive-dropdown-field
                    class="adjusted-content-width"
                    [label]="localeData?.select_discounts"
                    [placeholder]="commonLocaleData?.app_select"
                    [options]="discountList"
                    [labelValue]="selectedDiscounts?.label ?? ''"
                    (selectedOption)="discountSelected($event)"
                    (onClear)="discountSelected()"
                ></reactive-dropdown-field>
                <button
                    mat-stroked-button
                    color="primary"
                    [disabled]="isDiscountSaveDisable$ | async"
                    (click)="applyDiscounts()"
                    aria-label="apply"
                    [matTooltip]="commonLocaleData?.app_apply"
                    matTooltipPosition="above"
                >
                    {{ commonLocaleData?.app_apply }}
                </button>
            </div>
        </div>
    </div>
    <div class="edit-tax-section container-fluid mt-1">
        <div class="form-group">
            <div class="tax-label">
                <label>{{ localeData?.all_inherited_discounts }}</label>
            </div>
            <div *ngFor="let item of (activeGroup$ | async)?.inheritedDiscounts">
                <ng-template #popTemplate>
                    <div class="popover-content">
                        <label>{{ localeData?.discounts_inherited_from }}:</label>
                        <ul>
                            <li>{{ item?.name }}</li>
                        </ul>
                    </div>
                </ng-template>
                <span
                    class="tax-bullet"
                    *ngFor="let inAppDiscount of item.applicableDiscounts"
                    [popover]="popTemplate"
                    placement="right"
                    triggers="mouseenter:mouseleave"
                    >{{ inAppDiscount.name }}
                </span>
            </div>
            <p *ngIf="!(activeGroup$ | async)?.inheritedDiscounts?.length">{{ localeData?.no_inherited_discounts }}</p>
        </div>
    </div>
</div>
<!--delete Group modal  -->
<ng-template #deleteGroupModal>
    <confirm-modal
        [title]="localeData?.delete_group_title"
        [body]="localeData?.delete_group_content"
        (cancelCallBack)="hideDeleteGroupModal()"
        (successCallBack)="deleteGroup()"
    >
    </confirm-modal>
</ng-template>
