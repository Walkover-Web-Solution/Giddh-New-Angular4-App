<div>
    <div class="modal-header">
        <h3>{{ localeData?.share_account }}</h3>
        <i mat-dialog-close aria-label="close icon" class="icon-cross" (click)="closeModal()"></i>
    </div>
    <mat-dialog-content class="dialog-body">
        <div class="pd-b3">
            <h3 class="pd-b1">{{ localeData?.share_with }}</h3>
            <!--share account from-->
            <form
                name="shareGroupForm"
                #shareAccountForm="ngForm"
                novalidate
                autocomplete="off"
            >
                <div class="row pd-b2">
                    <div class="col-md-6">
                        <input-field
                            [(ngModel)]="email"
                            [placeholder]="commonLocaleData?.app_email_id"
                            [name]="'userEmail'"
                            [required]="true"
                            [disabled]="isUserRestricted"
                            [pattern]="giddhEmailRegex"
                        ></input-field>
                    </div>
                    <div class="col-md-6">
                        <reactive-dropdown-field
                            class="pull-left w-100"
                            [label]="localeData?.permission_role_name"
                            [placeholder]="commonLocaleData?.app_select"
                            [disabled]="isUserRestricted"
                            [readonly]="isUserRestricted"
                            [options]="allPermissions"
                            [name]="selectedPermission"
                            [required]="true"
                            [readonlyInput]="true"
                            (selectedOption)="$event && selectedPermission = $event.value"
                        >
                        </reactive-dropdown-field>
                    </div>
                </div>
                <div class="pull-right">
                    <button
                        mat-stroked-button
                        color="primary"
                        [matTooltip]="commonLocaleData?.app_share"
                        matTooltipPosition="above"
                        [disabled]="shareAccountForm.invalid || isUserRestricted" 
                        (click)="shareAccount()">
                        {{ commonLocaleData?.app_share }}
                    </button>
                </div>
            </form>
        </div>

        <restricted-module-message [restrictedModule]="restrictedModules.Users"
            [isUserRestricted]="isUserRestricted" (onUpgradePlan)="buyPlan($event)">
        </restricted-module-message>

        <!--shared with array-->
        <div class="pd-t1" *ngIf="(activeAccountSharedWith$ | async)?.length">
            <div>
                <ul class="shared-list group-shared-list">
                    <li *ngFor="let val of activeAccountSharedWith$ | async; let i = index">
                        <div class="user-name-email col-md-6">
                            <i class="icon-user-black pd-r1"></i>
                            <span class="user-email">
                                <small *ngIf="val.emailId !== val.userName">{{ val.userName }}</small>
                                <small>{{ val.emailId }}</small>
                            </span>
                        </div>

                        <div class="col-md-6 d-flex align-items-center justify-content-between p-0 pd-l15">
                            <reactive-dropdown-field
                                class="pull-left w-75"
                                [label]="localeData?.permission_role_name"
                                [placeholder]="commonLocaleData?.app_select"
                                [options]="allPermissions"
                                [name]="'selectedPermission' + i"
                                [readonlyInput]="true"
                                [labelValue]="val?.roleName"
                                (selectedOption)="$event && updatePermission(val, $event)"
                            >
                            </reactive-dropdown-field>

                            <button
                                mat-stroked-button
                                color="primary"
                                (click)="unShareAccount(val?.uniqueName, val?.entityUniqueName)"
                                aria-label="delete icon"
                            >
                                <i class="icon-trash delete"></i>
                            </button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </mat-dialog-content>
</div>
