<div>
    <div class="dialog-header">
        <span>{{ localeData?.share_account }}</span>
    </div>
    <mat-dialog-content class="dialog-body">
        <div>
            <p class="pb-2">{{ localeData?.share_with }}</p>
            <!--share account from-->
            <form [formGroup]="shareAccountForm" novalidate autocomplete="off">
                <div class="row pb-4">
                    <div class="col-md-6">
                        <input-field
                            formControlName="email"
                            [placeholder]="commonLocaleData?.app_email_id"
                            [name]="'userEmail'"
                            [required]="true"
                            [disabled]="isUserRestricted"
                            [pattern]="giddhEmailRegex"
                        ></input-field>
                    </div>
                    <div class="col-md-6">
                        <reactive-dropdown-field
                            class="w-100"
                            [label]="localeData?.permission_role_name"
                            [placeholder]="commonLocaleData?.app_select"
                            [disabled]="isUserRestricted"
                            [readonly]="isUserRestricted"
                            [options]="allPermissions"
                            [name]="'selectedPermission'"
                            [required]="true"
                            formControlName="permission"
                            [labelValue]="selectedPermission"
                            (selectedOption)="$event && (selectedPermission = $event.label)"
                        >
                        </reactive-dropdown-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-end column-gap-1">
                            <button
                                matButton="filled"
                                [disabled]="shareAccountForm.invalid || isUserRestricted"
                                (click)="shareAccount()"
                            >
                                {{ commonLocaleData?.app_share }}
                            </button>
                            <button matButton="outlined" type="button" mat-dialog-close (click)="closeModal()">
                                {{ commonLocaleData?.app_cancel }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <restricted-module-message
            [restrictedModule]="restrictedModules.Users"
            [isUserRestricted]="isUserRestricted"
            (onUpgradePlan)="buyPlan($event)"
        >
        </restricted-module-message>

        <!--shared with array-->
        <div class="pt-2" *ngIf="(activeAccountSharedWith$ | async)?.length">
            <mat-list role="list" class="shared-list group-shared-list">
                <ng-container *ngFor="let val of activeAccountSharedWith$ | async; let i = index">
                    <mat-list-item class="p-0 mat-list-item-height">
                        <div class="d-flex pt-2 pb-2">
                            <div class="user-name-email col-md-6">
                                <i class="icon-user-black pr-2"></i>
                                <span class="user-email">
                                    <small *ngIf="val.emailId !== val.userName">{{ val.userName }}</small>
                                    <small>{{ val.emailId }}</small>
                                </span>
                            </div>
                            <div class="col-md-6 d-flex align-items-center justify-content-between pr-0">
                                <reactive-dropdown-field
                                    class="pull-left w-75"
                                    [label]="localeData?.permission_role_name"
                                    [placeholder]="commonLocaleData?.app_select"
                                    [options]="allPermissions"
                                    [name]="'selectedPermission' + i"
                                    [labelValue]="val?.roleName"
                                    (selectedOption)="$event && updatePermission(val, $event)"
                                >
                                </reactive-dropdown-field>

                                <button
                                    matButton="outlined"
                                    (click)="unShareAccount(val?.uniqueName, val?.entityUniqueName)"
                                    aria-label="delete icon"
                                >
                                    <i class="icon-trash text-red"></i>
                                </button>
                            </div>
                        </div>
                    </mat-list-item>
                </ng-container>
            </mat-list>
        </div>
    </mat-dialog-content>
</div>
