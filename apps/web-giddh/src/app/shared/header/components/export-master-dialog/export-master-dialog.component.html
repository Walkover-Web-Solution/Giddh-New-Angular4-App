<div
    appTranslate
    [file]="'accounts'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="dialog-header">
        <span>{{ localeData?.export_group_ledger }}</span>
    </div>
    <mat-dialog-content class="dialog-body">
        <p class="pb-3">
            {{ commonLocaleData?.app_note }} :
            <span [innerHTML]="commonLocaleData.app_export_note">
                {{ localeData?.export_note }}
            </span>
        </p>
        <master-export-option (exportFormMaster)="exportFormValue = $event"></master-export-option>
        <div class="d-flex justify-content-end column-gap-1">
            <button mat-raised-button color="primary" (click)="exportMaster()">
                {{ commonLocaleData?.app_export }}
            </button>
            <button mat-stroked-button aria-label="close" mat-dialog-close type="button">
                {{ commonLocaleData?.app_cancel }}
            </button>
        </div>
    </mat-dialog-content>
</div>
