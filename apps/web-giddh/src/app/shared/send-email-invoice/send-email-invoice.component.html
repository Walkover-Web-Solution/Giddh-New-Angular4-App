<ng-container
    appTranslate
    [file]="'invoice/send-email'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="dialog-header">
        <span mat-dialog-title>{{ localeData?.page_heading }}</span>
        <button mat-icon-button aria-label="close" (click)="cancel()">
            <i class="icon-cross"></i>
        </button>
    </div>

    <mat-dialog-content class="dialog-body">
        <div class="row mr-b1">
            <div class="col-sm-12">
                <input
                    matInput
                    type="text"
                    class="form-control mat-field-border"
                    [placeholder]="localeData?.enter_email_address"
                    [(ngModel)]="emailAddresses"
                />
            </div>
        </div>
        <div
            class="clearfix"
            *ngIf="
                voucherType !== 'proforma' &&
                voucherType !== 'proformas' &&
                voucherType !== 'estimates' &&
                voucherType !== 'estimate' &&
                voucherType !== 'debit note' &&
                voucherType !== 'credit note'
            "
        >
            <h3 class="font-15 mr-b05">{{ localeData?.invoice_copy }}</h3>
            <hr />

            <div class="checkbox" *ngIf="voucherApiVersion === 2">
                <label>
                    <mat-checkbox
                        name="originalCopy"
                        value="Original"
                        color="primary"
                        checked
                        [(ngModel)]="isOriginal"
                        (change)="invoiceTypeChanged($event)"
                    ></mat-checkbox>
                    {{ localeData?.original }}
                </label>
            </div>

            <div class="checkbox">
                <label>
                    <mat-checkbox
                        [(ngModel)]="isTransport"
                        color="primary"
                        (change)="invoiceTypeChanged($event)"
                        value="Transport"
                    >
                    </mat-checkbox>
                    {{ localeData?.transport }}
                </label>
            </div>
            <div class="checkbox">
                <label>
                    <mat-checkbox
                        color="primary"
                        value="Customer"
                        (change)="invoiceTypeChanged($event)"
                        [(ngModel)]="isCustomer"
                    ></mat-checkbox>
                    {{ commonLocaleData?.app_customer }}
                </label>
            </div>
        </div>

        <!-- region buttons -->
        <div class="row mr-t2 mr-b1">
            <div class="col-sm-12">
                <div class="btn-group column-gap15" role="group">
                    <button
                        mat-raised-button
                        color="primary"
                        [disabled]="!emailAddresses || (!isTransport && !isOriginal && !isCustomer)"
                        (click)="sendEmail()"
                    >
                        {{ commonLocaleData?.app_send }}
                    </button>

                    <button mat-stroked-button (click)="cancel()">
                        {{ commonLocaleData?.app_cancel }}
                    </button>
                </div>
            </div>
        </div>
        <!-- endregion -->
    </mat-dialog-content>
</ng-container>
