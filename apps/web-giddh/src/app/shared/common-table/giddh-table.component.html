<div class="table-responsive overflow-visible">
    <table mat-table matSort [dataSource]="tableDataSource" class="giddh-table" [matSortActive]="columnSort.sortBy"
          [matSortDirection]="columnSort.sort" (matSortChange)="sortChange($event)">
    <!-- Header Row 1: Displays total count values for each column when enabled -->
    <ng-container *ngIf="isShowSecondaryHeader">
        <ng-container *ngFor="let column of topHeaderColumns" [matColumnDef]="column">
            <th
                mat-header-cell
                *matHeaderCellDef
                [ngClass]="columnDefinitions?.[trimColumn(column)]?.[2] ?? ''"
            >
                {{ tableSecondaryHeader?.[trimColumn(column)] ?? ' ' }}
            </th>
        </ng-container>
    </ng-container>

    <!-- Dynamically generates columns based on displayedColumns array -->
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <!-- Column Header Row: Displays the main headers for each column -->
        <ng-container *ngIf="isSortOncolumn(column) && !searchOnColumn[column]?.length">
            <th
                mat-header-cell
                mat-sort-header
                *matHeaderCellDef
                [ngClass]="columnDefinitions?.[column]?.[2] ?? ''"
            >
                {{ getHeaderLabel(column) }}
            </th>
        </ng-container>
        <ng-container *ngIf="!isSortOncolumn(column) && !searchOnColumn[column]?.length">
            <th
                mat-header-cell
                *matHeaderCellDef
                [ngClass]="columnDefinitions?.[column]?.[2] ?? ''"
            >
                {{ getHeaderLabel(column) }}-
            </th>
        </ng-container>
        <ng-container *ngIf="!isSortOncolumn(column) && searchOnColumn[column]?.length">
            <th
                mat-header-cell
                *matHeaderCellDef
                [ngClass]="columnDefinitions?.[column]?.[2] ?? ''"
                 #searchRef
                (clickOutside)="handleClickOutside($event, searchRef, 'name')"
            >
            <div (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
                <ng-container
                    *ngTemplateOutlet="
                        searchTemplate;
                        context: {
                            $implicit: true,
                            fieldName: 'name',
                            formControl: getHeaderLabel(column),
                            title: getHeaderLabel(column)
                        }
                    "
                ></ng-container>
              </div>
            </th>
        </ng-container>
        <ng-container *ngIf="isSortOncolumn(column) && searchOnColumn[column]?.length">
            <th
                mat-header-cell
                mat-sort-header
                *matHeaderCellDef
                [ngClass]="columnDefinitions?.[column]?.[2] ?? ''"
            >
                {{ getHeaderLabel(column) }} *
            </th>
        </ng-container>

        <!-- Data Cells: Populates each row with corresponding data -->
        <td mat-cell *matCellDef="let element" [ngClass]="columnDefinitions?.[column]?.[2] ?? ''">
            <span *ngIf="!isClickableColumn(column)">
                <!-- Number field -->
                <amount-field
                    *ngIf="isNumber(element?.[column])"
                    [amount]="element?.[column]"
                    [currencySymbol]="false"
                    [currencyCode]="false"
                ></amount-field>

                <!-- String field -->
                <span *ngIf="!isNumber(element?.[column])">
                    {{ element?.[column] ?? '-' }}
                </span>
            </span>

            <!-- Clickable link for clickable columns -->
            <a *ngIf="isClickableColumn(column)" class="cursor-pointer" (click)="handleClick(element, column)">
                {{ element?.[column] ?? '-' }}
            </a>
        </td>

        <!-- Footer Row: Displays total count values below data rows -->
        <ng-container *ngIf="showFooterRow">
            <td mat-footer-cell *matFooterCellDef class="p-0" [ngClass]="columnDefinitions?.[column]?.[2] ?? ''">
                {{ footerRow?.[column] ?? ' ' }}
            </td>
        </ng-container>
    </ng-container>

    <!-- Renders Header Row 1 (Total Count Row) if isTotalCountAtTop is true -->
    <ng-container *ngIf="isShowSecondaryHeader">
        <tr mat-header-row *matHeaderRowDef="topHeaderColumns"></tr>
    </ng-container>

    <!-- Renders Header Row 2 (Column Names) -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Renders Data Rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <!-- Renders Footer Row (Total Count Row) if isTotalCountAtTop is false -->
    <ng-container *ngIf="showFooterRow">
        <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </ng-container>
    </table>
</div>

<ng-template
  #searchTemplate
  let-show
  let-title="title"
  let-placeholder="placeholder"
  let-fieldName="fieldName"
  let-formControl="formControl"
>
  <div class="align-items-center d-flex column-gap5" [hidden]="show">
      <button
          mat-icon-button
          aria-label="search"
          class="project-search-icon font-16"
      >
          <span class="icon-search"></span>
      </button>
      <span> {{ title }}</span>
  </div>
  <div class="align-items-center d-flex" [hidden]="!show">
      <text-field
          [type]="'text'"
          [placeholder]="title"
          [cssClass]="'form-control search-table'"
          [formControl]="formControl"
          [autoFocus]="show"
      ></text-field>
  </div>
</ng-template>
