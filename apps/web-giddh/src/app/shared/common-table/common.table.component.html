<div>
    <table mat-table [dataSource]="tableData">
        <!-- Header Row 1: Displays total count values for each column when enabled -->
        <ng-container *ngIf="isTotalCountVisible && isTotalCountAtTop">
            <ng-container *ngFor="let column of topHeaderColumns" [matColumnDef]="column">
                <th 
                    mat-header-cell 
                    *matHeaderCellDef 
                    [ngClass]="{'text-right' : !isClickableColumn(trimColumn(column))}"
                > 
                    {{ columnTotalCounts?.[trimColumn(column)] ?? '-' }}
                </th>
            </ng-container>
        </ng-container>

        <!-- Dynamically generates columns based on displayedColumns array -->
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <!-- Column Header Row: Displays the main headers for each column -->
            <th mat-header-cell *matHeaderCellDef class="max-width-150 p-0" [ngClass]="{'text-right' : !isClickableColumn(column)}">
                {{ getHeaderLabel(column) }}
            </th>

            <!-- Data Cells: Populates each row with corresponding data -->
            <td mat-cell *matCellDef="let element" [ngClass]="{'text-right' : !isClickableColumn(column)}">
                <span *ngIf="!isClickableColumn(column)">
                    <!-- Number field -->
                    <amount-field
                        *ngIf="!isString(element?.[column])"
                        [amount]="element?.[column]"
                        [currencySymbol]="false"
                        [currencyCode]="false"
                    ></amount-field>

                    <!-- String field -->
                    <span *ngIf="isString(element?.[column])">
                        {{ element?.[column] ?? '-' }}
                    </span>
                </span>

                <!-- Clickable link for clickable columns -->
                <a *ngIf="isClickableColumn(column)" class="cursor-pointer" (click)="clickOnItem(element, column)">
                    {{ element?.[column] ?? '-' }}
                </a>
            </td>

            <!-- Footer Row: Displays total count values below data rows -->
            <ng-container *ngIf="isTotalCountVisible && !isTotalCountAtTop">
                <td mat-footer-cell *matFooterCellDef class="max-width-150" [ngClass]="{'text-right' : !isClickableColumn(column)}">
                    {{ columnTotalCounts?.[column] ?? '-' }}
                </td>
            </ng-container>
        </ng-container>

        <!-- Renders Header Row 1 (Total Count Row) if isTotalCountAtTop is true -->
        <ng-container *ngIf="isTotalCountVisible && isTotalCountAtTop">
            <tr mat-header-row *matHeaderRowDef="topHeaderColumns"></tr>
        </ng-container>
        
        <!-- Renders Header Row 2 (Column Names) -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <!-- Renders Data Rows -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- Renders Footer Row (Total Count Row) if isTotalCountAtTop is false -->
        <ng-container *ngIf="isTotalCountVisible && !isTotalCountAtTop">
            <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
        </ng-container>
    </table>
</div>
