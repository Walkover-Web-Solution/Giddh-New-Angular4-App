<section class="carousel d-grid position-relative">
    <button
        mat-fab
        color="primary"
        class="navigation-icon navigation-icon-left position-absolute"
        (click)="handleNavigatePrevious()"
        [matTooltip]="'Previous'"
        [disabled]="isPreviousDisabled"
    >
        <i class="icon-left slider-icon"></i>
    </button>
    <button
        mat-fab
        color="primary"
        class="navigation-icon navigation-icon-right position-absolute"
        (click)="handleNavigateNext()"
        [matTooltip]="'Next'"
        [disabled]="isNextDisabled"
    >
        <i class="icon-right slider-icon"></i>
    </button>

    <main class="carousel-content" tabindex="0">
        <ng-container *ngIf="slideTemplate">
            <ng-container *ngTemplateOutlet="slideTemplate"></ng-container>
        </ng-container>
    </main>
</section>
