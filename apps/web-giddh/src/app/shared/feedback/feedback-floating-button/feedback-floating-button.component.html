@if (showFloatingButton()) {
    <div
        #wrapper
        class="feedback-floating-wrapper"
        [class.dragging]="isDragging()"
        [class.positioned]="position() !== null"
        [style.left.px]="position()?.x"
        [style.top.px]="position()?.y"
    >
        <button
            type="button"
            class="feedback-floating-btn d-inline-flex align-items-center column-gap-1"
            (pointerdown)="onPointerDown($event)"
            (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerUp($event)"
            (pointercancel)="onPointerUp($event)"
            (click)="openFeedback()"
            aria-label="Send Feedback"
            matTooltip="Send Feedback (drag to move)"
            matTooltipPosition="left"
            [matTooltipDisabled]="isDragging()"
        >
            <i class="icon-chat2 font-size-18"></i>
            <span class="font-size-14 font-weight-semibold">Feedback</span>
        </button>
    </div>
}
