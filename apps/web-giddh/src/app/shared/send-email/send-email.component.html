<div
    appTranslate
    [file]="'invoice/send-email'"
    (localeData)="localeData = $event"
    (commonLocaleData)="commonLocaleData = $event"
>
    <div class="dialog-header">
        <span>{{ localeData?.page_heading }}</span>
        <button matIconButton aria-label="close" mat-dialog-close>
            <i class="icon-cross"></i>
        </button>
    </div>

    <mat-dialog-content class="dialog-body">
        <div class="row mb-2">
            <div class="col-sm-12">
                <text-field
                    [cssClass]="'form-control border'"
                    [placeholder]="localeData?.enter_email_address"
                    [(ngModel)]="emailAddresses"
                ></text-field>
            </div>
        </div>

        <div class="clear-both" *ngIf="![receiptVoucherType, paymentVoucherType].includes(voucherType)">
            <p class="font-size-15 mb-1">{{ localeData?.invoice_copy }}</p>
            <hr />
            <div class="checkbox">
                <mat-checkbox
                    name="original-copy"
                    color="primary"
                    value="Original"
                    [checked]="downloadCopy.includes('Original')"
                    (change)="selectDownloadOptions($event)"
                    >{{ localeData?.original }}</mat-checkbox
                >
            </div>
            <div class="checkbox">
                <mat-checkbox
                    name="transport-copy"
                    color="primary"
                    value="Transport"
                    [checked]="downloadCopy.includes('Transport')"
                    (change)="selectDownloadOptions($event)"
                    >{{ localeData?.transport }}</mat-checkbox
                >
            </div>
            <div class="checkbox">
                <mat-checkbox
                    name="customer-copy"
                    color="primary"
                    value="Customer"
                    [checked]="downloadCopy.includes('Customer')"
                    (change)="selectDownloadOptions($event)"
                    >{{ commonLocaleData?.app_customer }}</mat-checkbox
                >
            </div>
        </div>

        <!-- region buttons -->
        <div class="row mt-4 mb-2">
            <div class="col-sm-12">
                <div class="btn-group" role="group">
                    <button
                        type="button"
                        matButton="filled"
                        [disabled]="!emailAddresses || !downloadCopy?.length"
                        (click)="sendEmail()"
                        mat-dialog-close
                    >
                        {{ commonLocaleData?.app_send }}
                    </button>

                    <button type="button" matButton="outlined" mat-dialog-close>
                        {{ commonLocaleData?.app_cancel }}
                    </button>
                </div>
            </div>
        </div>
        <!-- endregion -->
    </mat-dialog-content>
</div>
