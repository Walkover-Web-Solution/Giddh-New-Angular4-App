<!DOCTYPE html>
<html lang="en">
    <head>
        <script type="text/javascript">
            // Electron development environment configuration
            window.isElectron = true;
            window.electronEnvironment = {
                isDevelopment: true,
                appUrl: 'http://localhost:4200/',
                apiUrl: 'https://apitest.giddh.com/'
            };
        </script>
        <script type="text/javascript">
            // Add preconnect for domainName extracted from cookie
            window.onload = function () {
                let whiteLabelConfig = JSON.parse(localStorage.getItem("whiteLabel"));
                const logoUrl = "./assets/images/giddh-big-logo.svg";
                const apiDomain = whiteLabelConfig?.body?.giddhWhiteLabel?.apiDomain || "https://apitest.giddh.com";

                if (whiteLabelConfig) {
                    // Remove the h1 tag containing the image
                    const logoContainer = document.querySelector("#main-giddh-loader h1");
                    if (logoContainer) {
                        logoContainer.remove();
                    }
                } else {
                    // If no whiteLabel object, set the logo as usual
                    document.getElementById("dynamic-logo").src = logoUrl;
                }
                // Create a new preconnect link element
                const preconnectLink = document.createElement("link");
                preconnectLink.rel = "preconnect";
                preconnectLink.href = apiDomain;

                // Append the preconnect link to the head
                document.head.appendChild(preconnectLink);
            };
        </script>
        <script defer src="./assets/js/lodash.min.js"></script>
        <script defer src="./assets/js/jquery.min.js"></script>
        <script type="text/javascript">
            window.onerror = function (msg, url, line, col, error) {
                var extra = !col ? "" : "\ncolumn: " + col;
                extra += !error ? "" : "\nerror: " + error;
                console.error("Error: " + msg + "\nurl: " + url + "\nline: " + line + extra);
            };
        </script>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; img-src 'self' data: https:;">
        <title>Giddh ~ Accounting at its Rough! Bookkeeping and Accounting Software</title>
        <meta name="description" content="Giddh ~ Accounting at its Rough! Bookkeeping and Accounting Software" />
        <link rel="icon" href="assets/images/favicons.png" type="image/png" sizes="16x16" />

        <!-- Preload Inter fonts for better performance -->
        <link rel="preload" as="font" href="./assets/fonts/Inter/Inter_Regular.ttf" type="font/ttf" crossorigin="anonymous" />
        <link rel="preload" as="font" href="./assets/fonts/Inter/Inter_RegularItalic.ttf" type="font/ttf" crossorigin="anonymous" />
        <link rel="preload" as="font" href="./assets/fonts/Inter/Inter_Medium.ttf" type="font/ttf" crossorigin="anonymous" />
        <link rel="preload" as="font" href="./assets/fonts/Inter/Inter_SemiBold.ttf" type="font/ttf" crossorigin="anonymous" />
        <link rel="preload" as="font" href="./assets/fonts/Inter/Inter_Bold.ttf" type="font/ttf" crossorigin="anonymous" />

        <link rel="stylesheet" href="./assets/styles/default.css" crossorigin="anonymous" />
        <script type="text/javascript">
            try {
                // Electron-specific jQuery setup - use window.require if available
                if (typeof window.require !== 'undefined') {
                    var jQuery = ($ = window.$ = window.jQuery = window.require("jquery"));
                } else if (typeof require !== 'undefined') {
                    var jQuery = ($ = window.$ = window.jQuery = require("jquery"));
                }
            } catch (error) {
                console.warn('jQuery require failed in Electron:', error);
                // Fallback for cases where require is not available
                // jQuery will be loaded from the bundled assets instead
            }
        </script>
        <link rel="preconnect" href="https://s3-ap-south-1.amazonaws.com" />
    </head>
    <body class="mat-app-background">
        <div id="main-giddh-loader">
            <h1>
                <img id="dynamic-logo" src="./assets/images/giddh-big-logo.svg" width="150" />
            </h1>
            <div class="loading-dots">
                <div class="loading-dots-dot"></div>
                <div class="loading-dots-dot"></div>
                <div class="loading-dots-dot"></div>
                <div class="loading-dots-dot"></div>
                <div class="loading-dots-dot"></div>
            </div>
        </div>
        <app-component></app-component>
    </body>
</html>
