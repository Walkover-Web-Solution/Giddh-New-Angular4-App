<style type="text/css">
    body {
        background-color: #f5f5f5;
        color: #777;
        text-align: center;
        padding-top: 100px;
    }

    h1 {
        margin-bottom: 100px;
    }

    h3 {
        margin-top: 60px;
    }

    .copy-right {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 14px;
    }
</style>
<div class="text-center">
    <div>
        <h1 style="margin-bottom: 40px">Success</h1>
        <h5>You can close this window.</h5>
    </div>

    <div class="copy-right">
        <p id="copyright-text">
            All right are reserved &copy;
            <span id="year"></span>
            <span id="legal-name"></span>
            <a id="domain-link" href="#" target="_blank"></a>
        </p>
    </div>
</div>
<script type="text/javascript">
    function getWhiteLabelData() {
        try {
            const whiteLabelData = JSON.parse(localStorage.getItem('whiteLabel'));
            return whiteLabelData?.body || null;
        } catch (error) {
            return null;
        }
    }

    const whiteLabel = getWhiteLabelData();
    const legalName = whiteLabel?.legalName || 'Walkover Technologies Private Limited.';
    const domainUrl = whiteLabel?.giddhWhiteLabel?.domainName || 'https://books.giddh.com';
    const domainName = whiteLabel?.giddhWhiteLabel?.domainName || 'https://giddh.com';
    const currentYear = new Date().getFullYear();

    // Update DOM elements
    document.getElementById('year').textContent = currentYear;
    document.getElementById('legal-name').textContent = legalName;
    document.getElementById('domain-link').href = domainUrl;
    document.getElementById('domain-link').textContent = domainName;
</script>
