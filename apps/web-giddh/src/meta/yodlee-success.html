<style type="text/css">
    body {
        background-color: #f5f5f5;
        color: #777;
        text-align: center;
        padding-top: 100px;
    }

    h1 {
        margin-bottom: 100px;
    }

    h3 {
        margin-top: 60px;
    }

    .copy-right {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 14px;
    }
</style>
<div class="text-center">
    <div id="success" style="display: none">
        <h1 style="margin-bottom: 40px">Success</h1>
        <h5>You can close this window.</h5>
    </div>

    <div id="failed" style="display: none">
        <h1 style="margin-bottom: 40px">Cancelled</h1>
        <h5>You can close this window.</h5>
    </div>

    <div class="copy-right">
        <p id="copyright-text">
            All right are reserved &copy;
            <span id="year"></span>
            <span id="legal-name"></span>
            <a id="domain-link" href="#" target="_blank"></a>
        </p>
    </div>
</div>

<script src="../assets/js/jquery-3.3.1.min.js"></script>
<script type="text/javascript">
    function getWhiteLabelData() {
        try {
            const whiteLabelData = JSON.parse(localStorage.getItem('whiteLabel'));
            return whiteLabelData?.body || null;
        } catch (error) {
            return null;
        }
    }

    var companyUniqueName = getQueryStringValue('companyUniqueName');
    const whiteLabel = getWhiteLabelData();
    const legalName = whiteLabel?.legalName || 'Walkover Technologies Private Limited.';
    var giddhDomainUrl = `${whiteLabel?.giddhWhiteLabel?.domainName || 'https://books.giddh.com'}/`;
    var domainName = whiteLabel?.giddhWhiteLabel?.domainName || 'Giddh.com';
    const currentYear = new Date().getFullYear();
    var search = '';
    var status = getQueryStringValue('status');
    var JSONcallBackStatus = getQueryStringValue('JSONcallBackStatus');
    if (JSONcallBackStatus) {
        var response = JSON.parse(JSONcallBackStatus);
    }

    function getApi() {
        const whiteLabel = getWhiteLabelData();
        this.giddhDomainUrl = `${whiteLabel?.giddhWhiteLabel?.domainName || 'https://books.giddh.com'}/`;
        if (whiteLabel) {
            apiBaseUrl = `${whiteLabel?.giddhWhiteLabel?.apiDomain}/`;
        } else {
            switch (window.location.hostname) {
                case 'localhost':
                    apiBaseUrl = 'https://apitest.giddh.com/';
                    break;
                case 'test.giddh.com':
                    apiBaseUrl = 'https://apitest.giddh.com/';
                    break;
                case 'stage.giddh.com':
                    apiBaseUrl = 'https://apitest.giddh.com/';
                    break;
                case 'books.giddh.com':
                    apiBaseUrl = 'https://api.giddh.com/';
                    break;
                default:
                    apiBaseUrl = 'https://api.giddh.com/';
            }
        }
        return apiBaseUrl;
    }

    function postCallBackData() {
        var paramToSend = 'JSONcallBackStatus' + window.location.search.split('JSONcallBackStatus')[1];
        $.get(apiBaseUrl + 'company/' + companyUniqueName + '/yodlee/call-back?' + paramToSend, function (data, status) {
            console.log('Account Added Successfully');
        });
    }

    function getQueryStringValue(key) {
        return decodeURIComponent(
            window.location.search.replace(
                new RegExp('^(?:.*[&\\?]' + encodeURIComponent(key).replace(/[\.\+\*]/g, '\\$&') + '(?:\\=([^&]*))?)?.*$', 'i'),
                '$1'
            )
        );
    }

    getApi();

    $(document).ready(function () {
        var apiBaseUrl = '';

        // Update DOM elements with white-label data
        document.getElementById('year').textContent = currentYear;
        document.getElementById('legal-name').textContent = legalName;
        document.getElementById('domain-link').href = giddhDomainUrl;
        document.getElementById('domain-link').textContent = domainName;

        $('#failed').hide();
        $('#success').hide();

        if (!JSONcallBackStatus) {
            $('#failed').show();
            $('#success').hide();
        } else {
            postCallBackData();
            $('#success').show();
            $('#failed').hide();
        }
    });
</script>
