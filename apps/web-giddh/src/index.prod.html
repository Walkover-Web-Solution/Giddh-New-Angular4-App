        <script type="text/javascript">
            // Enhanced white label logo loading with fallback
            window.onload = function () {
                console.log('🔄 Index.prod.html: Starting white label logo initialization...');

                let whiteLabelConfig;
                try {
                    whiteLabelConfig = JSON.parse(localStorage.getItem("whiteLabel"));
                } catch (error) {
                    console.warn('⚠️ Failed to parse whiteLabel from localStorage:', error);
                    whiteLabelConfig = null;
                }

                const logoUrl = "./assets/images/giddh-big-logo.svg";
                const apiDomain = whiteLabelConfig?.body?.giddhWhiteLabel?.apiDomain || "https://api.giddh.com";

                // Set logo with null check (defensive programming)
                const logoElement = document.getElementById("dynamic-logo");
                if (logoElement) {
                    if (whiteLabelConfig?.body?.giddhWhiteLabel?.logo) {
                        logoElement.src = whiteLabelConfig.body.giddhWhiteLabel.logo;
                        console.log('✅ White label logo loaded:', whiteLabelConfig.body.giddhWhiteLabel.logo);
                    } else {
                        logoElement.src = logoUrl;
                        console.log('✅ Default logo loaded:', logoUrl);
                    }
                    logoElement.alt = "Giddh Logo";
                } else {
                    console.warn('⚠️ Logo element not found - build process may have removed id');
                }

                // Create preconnect for API domain
                const preconnectLink = document.createElement("link");
                preconnectLink.rel = "preconnect";
                preconnectLink.href = apiDomain;
                document.head.appendChild(preconnectLink);

                console.log('🎯 Index.prod.html: Logo and preconnect setup completed');
            };
        </script>

        </script>
