<!DOCTYPE html>

    <head>
        <script type="text/javascript">
            // Web environment configuration - PRODUCTION
            window.isElectron = false;
            window.webEnvironment = {
                type: 'production',
                appUrl: 'https://giddh.com/',
                apiUrl: 'https://api.giddh.com/'
            };
        </script>
        <!-- Google Tag Manager -->
        <script>
            (function (w, d, s, l, i) {
                w[l] = w[l] || [];
                w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
                var f = d.getElementsByTagName(s)[0],
                    j = d.createElement(s),
                    dl = l != "dataLayer" ? "&l=" + l : "";
                j.async = true;
                j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
                f.parentNode.insertBefore(j, f);
            })(window, document, "script", "dataLayer", "GTM-K2L9QG");
        </script>
        <!-- End Google Tag Manager -->
        <script type="text/javascript">
            // Add preconnect for domainName extracted from cookie
            window.onload = function () {
                let whiteLabelConfig = JSON.parse(localStorage.getItem("whiteLabel"));
                const logoUrl = "./assets/images/giddh-big-logo.svg";
                const apiDomain = whiteLabelConfig?.body?.giddhWhiteLabel?.apiDomain || "https://api.giddh.com";

                if (whiteLabelConfig) {
                    // Remove the h1 tag containing the image
                    const logoContainer = document.querySelector("#main-giddh-loader h1");
                    if (logoContainer) {
                        logoContainer.remove();
                    }
                } else {
                    // If no whiteLabel object, set the logo as usual
                    const logoElement = document.getElementById("dynamic-logo");
                    if (logoElement) {
                        logoElement.src = logoUrl;
                    }
                }
                // Create a new preconnect link element
                const preconnectLink = document.createElement("link");
                preconnectLink.rel = "preconnect";
                preconnectLink.href = apiDomain;

                // Append the preconnect link to the head
                document.head.appendChild(preconnectLink);
            };
        </script>
         <!-- Removed duplicate window.onerror handler to prevent duplicate error logging -->
        <script defer src="./assets/js/lodash.min.js"></script>
        <script defer src="./assets/js/jquery.min.js"></script>
        <script type="text/javascript">
            if (window.location.hostname.indexOf("www") == 0) {
                window.location = window.location.href.replace("www.", "");
            }
        </script>
