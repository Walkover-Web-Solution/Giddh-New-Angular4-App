# Promote an already-built macOS ZIP/DMG from versioned S3 path to public latest/.
# Use this AFTER preview QA. Do not use "Re-run" on a preview/push run.
name: macOS Promote to Latest

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to promote (test or prod)"
        required: true
        type: choice
        options:
          - test
          - prod
        default: test
      version:
        description: "Version folder to promote (required), e.g. 11.0.5"
        required: true
        type: string

permissions:
  id-token: write

concurrency:
  group: macos-promote-${{ inputs.environment }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote_to_latest:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Validate branch and inputs
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          BUILD_ENV="${{ inputs.environment }}"
          BRANCH="${{ github.ref_name }}"

          if [ -z "$VERSION" ]; then
            echo "::error::version is required (e.g. 11.0.5)"
            exit 1
          fi

          if [ "$BUILD_ENV" = "prod" ]; then
            case "$BRANCH" in
              prod-electron-build-gh-action|books-production) ;;
              *)
                echo "::error::Prod promote must run from prod-electron-build-gh-action or books-production (current: $BRANCH)"
                exit 1
                ;;
            esac
            LATEST_ZIP_NAME="giddh.zip"
            LATEST_DMG_NAME="giddh-setup.dmg"
            VERSIONED_ZIP_NAME="giddh-setup-${VERSION}.zip"
            VERSIONED_DMG_NAME="giddh-setup-${VERSION}.dmg"
          else
            if [ "$BRANCH" != "test-electron-build-gh-action" ]; then
              echo "::error::Test promote must run from test-electron-build-gh-action (current: $BRANCH)"
              exit 1
            fi
            LATEST_ZIP_NAME="giddh-test.zip"
            LATEST_DMG_NAME="giddh-test-setup.dmg"
            VERSIONED_ZIP_NAME="giddh-test-setup-${VERSION}.zip"
            VERSIONED_DMG_NAME="giddh-test-setup-${VERSION}.dmg"
          fi

          {
            echo "BUILD_ENV=$BUILD_ENV"
            echo "S3_PATH_PREFIX=$BUILD_ENV"
            echo "PACKAGE_VERSION=$VERSION"
            echo "LATEST_ZIP_NAME=$LATEST_ZIP_NAME"
            echo "LATEST_DMG_NAME=$LATEST_DMG_NAME"
            echo "VERSIONED_ZIP_NAME=$VERSIONED_ZIP_NAME"
            echo "VERSIONED_DMG_NAME=$VERSIONED_DMG_NAME"
          } >> "$GITHUB_ENV"

          echo "Promoting $BUILD_ENV macOS $VERSION → latest (same binary)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote versioned artifacts to latest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.PACKAGE_VERSION }}"
          BUCKET="${{ env.S3_BUCKET }}"
          PREFIX="${{ env.S3_PATH_PREFIX }}"
          SRC="s3://$BUCKET/$PREFIX/mac/$VERSION"
          DEST="s3://$BUCKET/$PREFIX/mac/latest"

          echo "📥 Copying ZIP and DMG to latest"
          aws s3 cp "$SRC/${{ env.VERSIONED_ZIP_NAME }}" "$DEST/${{ env.LATEST_ZIP_NAME }}" \
            --content-type "application/zip" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$VERSION,platform=macos,arch=universal,signed=true,promoted=true"

          aws s3 cp "$SRC/${{ env.VERSIONED_DMG_NAME }}" "$DEST/${{ env.LATEST_DMG_NAME }}" \
            --content-type "application/x-apple-diskimage" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$VERSION,platform=macos,arch=universal,signed=true,promoted=true"

          echo "📥 Fetching versioned latest-mac.yml for rewrite"
          mkdir -p artifacts/promote
          aws s3 cp "$SRC/latest-mac.yml" artifacts/promote/latest-mac.yml

          YML_CONTENT=$(cat artifacts/promote/latest-mac.yml)
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip/giddh.zip/g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|path: giddh.zip|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|url: giddh.zip|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg/giddh-setup.dmg/g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|path: giddh-setup.dmg|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|url: giddh-setup.dmg|g')
          else
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip/giddh-test.zip/g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|path: giddh-test.zip|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|url: giddh-test.zip|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg/giddh-test-setup.dmg/g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|path: giddh-test-setup.dmg|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|url: giddh-test-setup.dmg|g')
          fi
          printf '%s' "$YML_CONTENT" > artifacts/promote/latest-mac-modified.yml

          aws s3 cp artifacts/promote/latest-mac-modified.yml "$DEST/latest-mac.yml" \
            --content-type "text/yaml" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$VERSION,platform=macos,promoted=true"
          echo "✅ Promoted $PREFIX/mac/$VERSION → $PREFIX/mac/latest"

      - name: Promote Summary
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo "macOS PROMOTE SUMMARY (${{ env.BUILD_ENV }})"
          echo "========================================="
          echo "Version: ${{ env.PACKAGE_VERSION }}"
          echo "Source:"
          echo "  ZIP: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_ZIP_NAME }}"
          echo "  DMG: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_DMG_NAME }}"
          echo "Latest:"
          echo "  ZIP: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/latest/${{ env.LATEST_ZIP_NAME }}"
          echo "  DMG: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/latest/${{ env.LATEST_DMG_NAME }}"
          echo "=========================================="
