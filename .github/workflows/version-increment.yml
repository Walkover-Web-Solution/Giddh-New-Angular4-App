name: Version Increment

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "test-electron-build-gh-action"

permissions:
  contents: write

concurrency:
  group: version-increment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  increment_version:
    runs-on: ubuntu-latest
    
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      version_changed: ${{ steps.version.outputs.version_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auto-increment version
        id: version
        shell: bash
        run: |
          # Read current version from main package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version (assuming semantic versioning x.y.z)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Increment patch version by 1
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          
          # Update main package.json
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "✅ Updated main package.json to version $NEW_VERSION"
          
          # Update electron-giddh package.json
          node -e "const fs = require('fs'); const pkg = require('./apps/electron-giddh/src/package.json'); pkg.version = '$NEW_VERSION'; fs.writeFileSync('apps/electron-giddh/src/package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "✅ Updated electron-giddh package.json to version $NEW_VERSION"
          
          # Set outputs
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_changed=true" >> $GITHUB_OUTPUT
          
          # Also set as environment variable for next steps
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit version bump
        shell: bash
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json apps/electron-giddh/src/package.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          
          git commit -m "Auto-increment version to $NEW_VERSION [skip ci]"
          git push
          
          echo "✅ Committed and pushed version bump to $NEW_VERSION"

      - name: Version Summary
        shell: bash
        run: |
          echo "========================================="
          echo "VERSION INCREMENT COMPLETE"
          echo "========================================="
          echo "New Version: ${{ steps.version.outputs.new_version }}"
          echo "Version Changed: ${{ steps.version.outputs.version_changed }}"
          echo "========================================="
          echo "Next: Windows and macOS builds will use version ${{ steps.version.outputs.new_version }}"
          echo "========================================="
