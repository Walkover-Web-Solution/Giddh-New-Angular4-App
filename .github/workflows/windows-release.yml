# Date: 14th January 2026
name: Windows EXE (build → eSigner sign → S3 upload)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "test-electron-build-gh-action"

permissions:
  contents: read
  id-token: write # needed only if you use AWS OIDC (role-to-assume)

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_sign_upload:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.ref_name }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      UPLOAD_LATEST: "true" # set to "false" if you don't want releases/latest/app.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      # Adjust this to your project scripts.
      # Common options:
      # - npm run build && npm run dist
      # - npx electron-builder --win --x64 --publish never
      - name: Build Electron App (unpacked)
        env:
          ELECTRON_ENV: true
        run: |
          node scripts/clean-old-builds.js
          npm run prepare.electron.giddh
          node scripts/build-env.js prod
          npx ng build electron-giddh --configuration=prod
          node scripts/inject-env-vars.js --electron dist/apps/web-giddh/index.html
          cd dist/apps/web-giddh
          npx electron-builder build --config ./../../../electron-sign/electron-builder.json --win --x64 --dir
          cd ../../../

      - name: Extract version and find unpacked app executable
        shell: pwsh
        run: |
          # Extract version from package.json
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version"

          # Find the unpacked win-unpacked directory
          $unpackedDir = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "win-unpacked" -Directory -Recurse | Select-Object -First 1
          if (-not $unpackedDir) { throw "win-unpacked directory not found. Check electron-builder output." }

          # Find the Electron app executable (not the installer)
          $appExe = Get-ChildItem -Path $unpackedDir.FullName -Filter "*.exe" | Select-Object -First 1
          if (-not $appExe) { throw "No app.exe found in win-unpacked directory." }

          "UNSIGNED_APP_EXE=$($appExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UNPACKED_DIR=$($unpackedDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found app executable: $($appExe.FullName)"

      - name: Create artifacts directory for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/signed" | Out-Null
          Write-Host "Created artifacts/signed directory"

      - name: Sign Electron app executable with SSL.com eSigner
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.UNSIGNED_APP_EXE }}
          output_path: artifacts/signed

      - name: Copy signed executable back to unpacked directory
        shell: pwsh
        run: |
          # Find the signed executable
          $signedExe = Get-ChildItem -Path "artifacts/signed" -Filter "*.exe" | Select-Object -First 1
          if (-not $signedExe) { throw "Signed executable not found in artifacts/signed" }
          
          # Copy it back to the unpacked directory, replacing the unsigned one
          Copy-Item $signedExe.FullName "$env:UNPACKED_DIR\$($signedExe.Name)" -Force
          Write-Host "Copied signed executable to: $env:UNPACKED_DIR\$($signedExe.Name)"

      - name: Verify app executable signature
        shell: pwsh
        run: |
          $appExe = Get-ChildItem -Path "$env:UNPACKED_DIR" -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $appExe.FullName
          Write-Host "App Signature Status: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "App signature verification failed: $($sig.StatusMessage)" }

      - name: Build signed installer from signed app
        shell: pwsh
        run: |
          cd dist/apps/web-giddh
          npx electron-builder build --config ./../../../electron-sign/electron-builder.json --win --x64 --prepackaged "$env:UNPACKED_DIR" --publish never
          cd ../../../
          node scripts/build-success-message.js prod

      - name: Find and prepare installer for upload
        shell: pwsh
        run: |
          # Find the installer EXE
          $installer = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notmatch "blockmap" -and $_.Directory.Name -ne "win-unpacked" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $installer) { throw "No installer found. Check electron-builder output." }

          # Find latest.yml
          $latestYml = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "latest.yml" -Recurse | Select-Object -First 1

          # Create artifacts directory
          New-Item -ItemType Directory -Force -Path "artifacts\final" | Out-Null
          Copy-Item $installer.FullName "artifacts\final\installer.exe" -Force

          if ($latestYml) {
            Copy-Item $latestYml.FullName "artifacts\final\latest.yml" -Force
            "LATEST_YML_PATH=$((Resolve-Path 'artifacts\final\latest.yml').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          "FINAL_INSTALLER=$((Resolve-Path 'artifacts\final\installer.exe').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          # Create final filename
          $finalExeName = "giddh Setup $env:PACKAGE_VERSION.exe"
          "FINAL_EXE_NAME=$finalExeName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Final installer: $finalExeName"

      # --- AWS Auth (using access keys only for now) ---

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload signed EXE and latest.yml to S3 (with local fallback)
        shell: pwsh
        run: |
          $uploadSuccess = $false
          
          # Try S3 upload first
          try {
            if ([string]::IsNullOrEmpty($env:S3_BUCKET)) { 
              Write-Host "S3_BUCKET secret is missing, skipping S3 upload"
            } else {
              aws --version

              # Upload the signed installer with version-based filename
              $dest1 = "s3://$($env:S3_BUCKET)/$($env:FINAL_EXE_NAME)"
              aws s3 cp "$env:FINAL_INSTALLER" "$dest1" --only-show-errors
              Write-Host "Uploaded installer to: $dest1"

              # Upload latest.yml if it exists
              if ($env:LATEST_YML_PATH -and (Test-Path $env:LATEST_YML_PATH)) {
                $dest2 = "s3://$($env:S3_BUCKET)/latest.yml"
                aws s3 cp "$env:LATEST_YML_PATH" "$dest2" --only-show-errors
                Write-Host "Uploaded latest.yml to: $dest2"
              } else {
                Write-Host "Warning: latest.yml not found, skipping upload"
              }
              $uploadSuccess = $true
              Write-Host "✅ S3 upload completed successfully"
            }
          } catch {
            Write-Host "❌ S3 upload failed: $($_.Exception.Message)"
            Write-Host "📁 Falling back to local artifact storage..."
          }
          
          # Fallback: Store artifacts locally in repository
          if (-not $uploadSuccess) {
            # Create test-electron-build directory
            New-Item -ItemType Directory -Force -Path "test-electron-build" | Out-Null
            
            # Copy signed installer with version-based filename
            Copy-Item "$env:FINAL_INSTALLER" "test-electron-build/$env:FINAL_EXE_NAME" -Force
            Write-Host "📁 Copied installer to: test-electron-build/$env:FINAL_EXE_NAME"
            
            # Copy latest.yml if it exists
            if ($env:LATEST_YML_PATH -and (Test-Path $env:LATEST_YML_PATH)) {
              Copy-Item "$env:LATEST_YML_PATH" "test-electron-build/latest.yml" -Force
              Write-Host "📁 Copied latest.yml to: test-electron-build/latest.yml"
            }
            
            Write-Host "✅ Local artifact storage completed"
          }

      - name: Commit artifacts to repository (fallback only)
        if: failure() || env.S3_UPLOAD_FAILED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test-electron-build/ || true
          git commit -m "Add build artifacts: ${{ env.FINAL_EXE_NAME }} and latest.yml" || true
          git push || true

      - name: Done
        shell: pwsh
        run: |
          Write-Host "Uploaded signed EXE for $env:RELEASE_TAG"
