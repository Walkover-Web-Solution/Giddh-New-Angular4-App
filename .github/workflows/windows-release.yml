# Author Name: Divyanshu Shrivastava
# Date: 14th January 2026
# Updated: 28th January 2026 - eSigner cloud signing for installer AND app executable (critical for auto-updates)
# Updated: 29th October 2026 - workflow_dispatch preview + promote (same-binary) without new branches
# Updated: 29th October 2026 - books-production push auto-starts prod preview (does not update latest)
name: Windows EXE (build → eSigner signing → S3 upload)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "test-electron-build-gh-action"
      - "prod-electron-build-gh-action"
      - "books-production"
  workflow_dispatch:
    inputs:
      environment:
        description: "Build environment (test → test-electron branch; prod → prod-electron or books-production)"
        required: true
        type: choice
        options:
          - test
          - prod
      action:
        description: "ONLY for this workflow: choose preview. For promote use workflow 'Windows Promote to Latest' instead."
        required: true
        type: choice
        options:
          - preview
          - promote
        default: preview
      version:
        description: "Only if action=promote here (prefer Windows Promote to Latest). e.g. 11.0.5"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-release-${{ github.ref_name }}-${{ github.event.inputs.action || 'push' }}
  cancel-in-progress: false

jobs:
  show_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Show how this run was started
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref_name }}"
          echo "inputs.action=${{ github.event.inputs.action }}"
          echo "inputs.environment=${{ github.event.inputs.environment }}"
          echo "inputs.version=${{ github.event.inputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "This is a PUSH → preview build only. promote_to_latest is skipped."
            echo "To promote: Actions → 'Windows Promote to Latest' → Run workflow."
          elif [ "${{ github.event.inputs.action }}" = "promote" ]; then
            echo "action=promote → promote_to_latest should run; build_sign_upload skipped."
          else
            echo "action=preview (or empty) → build_sign_upload runs; promote_to_latest skipped."
            echo "To promote: Actions → 'Windows Promote to Latest' → Run workflow."
          fi

  build_sign_upload:
    runs-on: windows-latest
    needs: show_trigger
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'preview') ||
      (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[skip ci]'))

    env:
      RELEASE_TAG: ${{ github.ref_name }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect build environment
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $eventName = "${{ github.event_name }}"
          Write-Host "Branch: $branch"
          Write-Host "Event: $eventName"

          function Set-PreviewMode {
            "WORKFLOW_MODE=preview" | Out-File -FilePath $env:GITHUB_ENV -Append
            "UPLOAD_LATEST=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            "UPLOAD_PREVIEW=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          function Set-ReleaseMode {
            "WORKFLOW_MODE=release" | Out-File -FilePath $env:GITHUB_ENV -Append
            "UPLOAD_LATEST=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            "UPLOAD_PREVIEW=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          # Default for all builds = preview (versioned + preview/).
          # Public latest/ is updated only by workflow_dispatch action=promote.
          if ($eventName -eq "workflow_dispatch") {
            $buildEnv = "${{ github.event.inputs.environment }}"
            $dispatchAction = "${{ github.event.inputs.action }}"
            Set-PreviewMode
            Write-Host "Dispatch action=$dispatchAction for environment: $buildEnv"

            if ($buildEnv -eq "prod") {
              $allowed = @("prod-electron-build-gh-action", "books-production")
            } else {
              $allowed = @("test-electron-build-gh-action")
            }
            if ($allowed -notcontains $branch) {
              throw "Dispatch environment '$buildEnv' must run from branch: $($allowed -join ', ') (current: $branch)"
            }
          } elseif ($branch -eq "books-production" -or $branch -eq "prod-electron-build-gh-action") {
            $buildEnv = "prod"
            Set-PreviewMode
            Write-Host "$branch → prod preview (latest NOT updated; use action=promote)"
          } else {
            # test-electron-build-gh-action, tags, other
            $buildEnv = "test"
            Set-PreviewMode
            Write-Host "$branch → test preview (latest NOT updated; use action=promote)"
          }

          "BUILD_ENV=$buildEnv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "S3_PATH_PREFIX=$buildEnv" | Out-File -FilePath $env:GITHUB_ENV -Append

          if ($buildEnv -eq "prod") {
            "INSTALLER_NAME=giddh-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "✅ Production build"
          } else {
            "INSTALLER_NAME=giddh-test-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "✅ Test build"
          }

      - name: Compute Electron source fingerprint
        shell: pwsh
        run: |
          $fingerprint = "${{ github.sha }}"
          "ELECTRON_SOURCE_FINGERPRINT=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ELECTRON_SOURCE_FINGERPRINT=$fingerprint"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve next app version from S3 feeds
        shell: pwsh
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ELECTRON_SOURCE_FINGERPRINT: ${{ env.ELECTRON_SOURCE_FINGERPRINT }}
          PACKAGE_JSON_PATH: apps/electron-giddh/src/package.json
        run: |
          node scripts/fetch-next-version.js ${{ env.S3_PATH_PREFIX }}
          $version = (Get-Content "apps/electron-giddh/src/package.json" -Raw | ConvertFrom-Json).version
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PACKAGE_VERSION=$version"

      - name: Reserve shared release-meta.json
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          S3_PATH_PREFIX: ${{ env.S3_PATH_PREFIX }}
          ELECTRON_SOURCE_FINGERPRINT: ${{ env.ELECTRON_SOURCE_FINGERPRINT }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/electron-release-meta.js reserve --platform windows --out artifacts/release-meta.json
          aws s3 cp artifacts/release-meta.json "s3://${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/release-meta.json" `
            --content-type "application/json" `
            --metadata "version=${{ env.PACKAGE_VERSION }},platform=windows,status=in_progress"
          Write-Host "✅ Reserved release-meta.json for ${{ env.PACKAGE_VERSION }}"

      - name: Install deps
        run: npm install

      - name: Build Windows Electron App
        env:
          ELECTRON_ENV: true
        run: |
          node scripts/clean-old-builds.js
          npm run prepare.electron.giddh
          node scripts/build-env.js ${{ env.BUILD_ENV }}
          npx ng build electron-giddh --configuration=${{ env.BUILD_ENV }}
          node scripts/inject-env-vars.js --electron dist/apps/web-giddh/index.html
          
          Write-Host "📦 Copying icon files..."
          New-Item -ItemType Directory -Force -Path "dist/apps/web-giddh/resources" | Out-Null
          Copy-Item "apps/electron-giddh/src/resources/icon.ico" "dist/apps/web-giddh/resources/icon.ico" -Force
          Copy-Item "apps/electron-giddh/src/resources/icon.icns" "dist/apps/web-giddh/resources/icon.icns" -Force -ErrorAction SilentlyContinue
          Copy-Item "apps/electron-giddh/src/resources/icon.ico" "dist/apps/web-giddh/icon.ico" -Force
          Write-Host "  ✅ Icon files copied"
          
          Write-Host "📦 Copying tray icons..."
          New-Item -ItemType Directory -Force -Path "dist/apps/web-giddh/build/icons" | Out-Null
          Copy-Item "apps/web-giddh/src/build/icons/*.png" "dist/apps/web-giddh/build/icons/" -Force -ErrorAction SilentlyContinue
          Copy-Item "apps/electron-giddh/src/build/icons/*.png" "dist/apps/web-giddh/build/icons/" -Force -ErrorAction SilentlyContinue
          Write-Host "  ✅ Tray icons copied"
          
          Write-Host "📦 Copying NSIS installer script..."
          Copy-Item "build/installer.nsh" "dist/apps/web-giddh/build/installer.nsh" -Force
          Write-Host "  ✅ Installer script copied"
          
          Write-Host "📦 Setting up Electron app structure..."
          Copy-Item "apps/electron-giddh/src/package.json" "dist/apps/web-giddh/package.json" -Force
          
          Write-Host "📝 Setting product name for ${{ env.BUILD_ENV }} build..."
          $pkgPath = "dist/apps/web-giddh/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          
          if ("${{ env.BUILD_ENV }}" -eq "prod") {
            $pkg.name = "Giddh"
            $pkg.productName = "Giddh"
            Write-Host "  ✅ Set product name: Giddh (production)"
          } else {
            $pkg.name = "Giddh-Test"
            $pkg.productName = "Giddh-Test"
            Write-Host "  ✅ Set product name: Giddh-Test (test)"
          }
          
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding UTF8
          
          Copy-Item "apps/electron-giddh/src/index.js" "dist/apps/web-giddh/index.js" -Force
          Copy-Item "apps/electron-giddh/src/preload.js" "dist/apps/web-giddh/preload.js" -Force
          Get-ChildItem "apps/electron-giddh/src/*.js" | ForEach-Object {
              Copy-Item $_.FullName "dist/apps/web-giddh/$($_.Name)" -Force
          }
          Get-ChildItem "apps/electron-giddh/src/*.js.map" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "dist/apps/web-giddh/$($_.Name)" -Force
          }
          Write-Host "  ✅ Electron files copied"
          
          Write-Host "📦 Installing Electron dependencies..."
          cd dist/apps/web-giddh
          if (!(Test-Path "package.json")) {
              Write-Host "  ❌ ERROR: package.json not found!"
              exit 1
          }
          npm install --production --no-optional
          Write-Host "  ✅ Dependencies installed"
          
          Write-Host "🔍 Verifying icon files..."
          if (!(Test-Path 'icon.ico')) {
            throw "❌ FATAL: icon.ico missing!"
          }
          Write-Host "  ✅ Icon files verified"

          # Shared electron-builder.json references ./notarize.js (mac afterSign).
          # Copy it here so config load succeeds; notarize.js no-ops on Windows.
          Write-Host "📦 Copying Electron afterSign stub..."
          Copy-Item "$env:GITHUB_WORKSPACE/electron-sign/notarize.js" "notarize.js" -Force
          Write-Host "  ✅ notarize.js copied"
          
          Write-Host "📝 Setting artifact name for ${{ env.BUILD_ENV }} build..."
          $configPath = "./../../../electron-sign/electron-builder.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          
          if ("${{ env.BUILD_ENV }}" -eq "prod") {
            $config.win | Add-Member -NotePropertyName "artifactName" -NotePropertyValue "giddh-setup-`${version}.`${ext}" -Force
            Write-Host "  ✅ Set artifact name: giddh-setup-VERSION.ext"
          } else {
            $config.win | Add-Member -NotePropertyName "artifactName" -NotePropertyValue "giddh-test-setup-`${version}.`${ext}" -Force
            Write-Host "  ✅ Set artifact name: giddh-test-setup-VERSION.ext"
          }
          
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding UTF8
          
          Write-Host "🔨 Building Windows app (dir target)..."
          npx electron-builder build --config ./../../../electron-sign/electron-builder.json --win --dir --publish never
          cd ../../../
          
          Write-Host "🔍 Verifying app executable..."
          $exeName = if ("${{ env.BUILD_ENV }}" -eq "prod") { "Giddh.exe" } else { "Giddh-Test.exe" }
          $appExe = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter $exeName -Recurse | Where-Object { $_.Directory.Name -eq "win-unpacked" } | Select-Object -First 1
          if (-not $appExe) {
              $appExe = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "*.exe" -Recurse | Where-Object { $_.Directory.Name -eq "win-unpacked" } | Select-Object -First 1
          }
          if ($appExe) {
              Write-Host "  ✅ App executable found: $($appExe.Name)"
              try {
                  Add-Type -AssemblyName System.Drawing
                  $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($appExe.FullName)
                  if (!$icon) {
                      throw "Icon not embedded"
                  }
                  Write-Host "  ✅ Icon embedded in executable"
                  $icon.Dispose()
              } catch {
                  throw "❌ Icon verification failed: $($_.Exception.Message)"
              }
          } else {
              throw "❌ App executable not found!"
          }

      - name: Find artifacts and prepare for signing
        shell: pwsh
        run: |
          $version = "${{ env.PACKAGE_VERSION }}"
          if (-not $version) {
            $version = (Get-Content "apps/electron-giddh/src/package.json" -Raw | ConvertFrom-Json).version
            "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          Write-Host "Package version: $version"
          
          # Find app executable in win-unpacked (CRITICAL for auto-updates)
          $exeName = if ("${{ env.BUILD_ENV }}" -eq "prod") { "Giddh.exe" } else { "Giddh-Test.exe" }
          $appExe = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter $exeName -Recurse |
            Where-Object { $_.Directory.Name -eq "win-unpacked" } |
            Select-Object -First 1

          if (-not $appExe) {
            $appExe = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "*.exe" -Recurse |
              Where-Object { $_.Directory.Name -eq "win-unpacked" } |
              Select-Object -First 1
          }
          
          if (-not $appExe) {
            throw "App executable not found in win-unpacked. This is required for auto-updates!"
          }
          
          Write-Host "Found unsigned app executable: $($appExe.FullName)"
          "APP_EXE_PATH=$($appExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_EXE_NAME=$($appExe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          

      - name: Create signing output directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/signed-app" | Out-Null
          Write-Host "✅ Created signing output directory"

      - name: Sign app executable with SSL.com eSigner (CRITICAL for auto-updates)
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.APP_EXE_PATH }}
          output_path: artifacts/signed-app
          malware_block: false
          environment_name: PROD
          override: true

      - name: Copy signed EXE back and build installer
        shell: pwsh
        run: |
          $signedAppExe = Get-ChildItem -Path "artifacts/signed-app" -Filter "${{ env.APP_EXE_NAME }}" | Select-Object -First 1
          if (-not $signedAppExe) {
            $signedAppExe = Get-ChildItem -Path "artifacts/signed-app" -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $signedAppExe) {
            throw "Signed app executable not found"
          }
          
          $appSig = Get-AuthenticodeSignature $signedAppExe.FullName
          Write-Host "App executable signature: $($appSig.Status)"
          if ($appSig.Status -ne "Valid") {
            throw "App signature verification failed"
          }
          Write-Host "✅ App executable signed"
          
          Write-Host "🔍 Verifying icon preserved after signing..."
          try {
            Add-Type -AssemblyName System.Drawing
            $iconCheck = [System.Drawing.Icon]::ExtractAssociatedIcon($signedAppExe.FullName)
            if (!$iconCheck) {
              throw "Icon was stripped during signing"
            }
            Write-Host "  ✅ Icon preserved after signing"
          } catch {
            throw "❌ Signed EXE lost icon: $($_.Exception.Message)"
          }
          
          $winUnpackedDir = Split-Path -Parent $env:APP_EXE_PATH
          Copy-Item $signedAppExe.FullName $winUnpackedDir -Force
          Write-Host "✅ Signed executable copied back"
          
          Write-Host "📦 Building NSIS installer..."
          cd dist/apps/web-giddh
          
          Write-Host "📝 Re-setting artifact name for installer build..."
          $configPath = "./../../../electron-sign/electron-builder.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          
          if ("${{ env.BUILD_ENV }}" -eq "prod") {
            $config.win | Add-Member -NotePropertyName "artifactName" -NotePropertyValue "giddh-setup-`${version}.`${ext}" -Force
          } else {
            $config.win | Add-Member -NotePropertyName "artifactName" -NotePropertyValue "giddh-test-setup-`${version}.`${ext}" -Force
          }
          
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding UTF8

          # Ensure afterSign hook file exists for shared config load
          if (!(Test-Path "notarize.js")) {
            Copy-Item "$env:GITHUB_WORKSPACE/electron-sign/notarize.js" "notarize.js" -Force
          }
          
          npx electron-builder build --config ./../../../electron-sign/electron-builder.json --win nsis --publish never
          cd ../../../
          
          $installer = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notmatch "blockmap" -and $_.Directory.Name -ne "win-unpacked" -and $_.Name -notlike "*ia32*" } |
            Select-Object -First 1
          
          if (-not $installer) {
            throw "❌ Installer not found!"
          }
          
          Write-Host "✅ Installer built: $($installer.Name)"
          "UNSIGNED_INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSIONED_EXE_NAME=$(Split-Path -Leaf $installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          $latestYml = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "latest.yml" -Recurse | Select-Object -First 1
          if ($latestYml) {
            "LATEST_YML=$($latestYml.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Sign installer with SSL.com eSigner
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.UNSIGNED_INSTALLER_PATH }}
          output_path: artifacts/signed-installer
          malware_block: false
          environment_name: PROD
          override: true

      - name: Verify installer signature and prepare final artifacts
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path "artifacts/signed-installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $signedInstaller) {
            throw "Signed installer not found"
          }
          
          $installerSig = Get-AuthenticodeSignature $signedInstaller.FullName
          Write-Host "Installer signature: $($installerSig.Status)"
          if ($installerSig.Status -ne "Valid") {
            throw "Installer signature verification failed"
          }
          Write-Host "✅ Installer signed"
          
          New-Item -ItemType Directory -Force -Path "artifacts/final" | Out-Null
          Copy-Item $signedInstaller.FullName "artifacts/final/" -Force
          "FINAL_INSTALLER=artifacts/final/$env:VERSIONED_EXE_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ Signed installer ready"

      - name: Prepare latest.yml for upload
        shell: pwsh
        run: |
          if (Test-Path $env:LATEST_YML) {
            Copy-Item $env:LATEST_YML "artifacts/final/latest.yml" -Force
            Write-Host "✅ latest.yml prepared"
          }

      - name: Recalculate SHA512 and update latest.yml (after signing)
        shell: pwsh
        run: |
          Write-Host "📊 Recalculating SHA512 hash..."
          $signedFile = Get-ChildItem -Path "artifacts/final" -Filter "*.exe" | Select-Object -First 1
          if (-not $signedFile) {
            throw "Signed installer not found"
          }
          
          $hashHex = (Get-FileHash -Path $signedFile.FullName -Algorithm SHA512).Hash
          $byteArray = for ($i = 0; $i -lt $hashHex.Length; $i += 2) { 
            [Convert]::ToByte($hashHex.Substring($i, 2), 16) 
          }
          $base64Hash = [Convert]::ToBase64String($byteArray)
          $newSize = (Get-Item $signedFile.FullName).Length
          
          $ymlPath = "artifacts/final/latest.yml"
          if (Test-Path $ymlPath) {
            $content = Get-Content $ymlPath -Raw
            $content = $content -replace 'sha512:\s*[A-Za-z0-9+/=]+', "sha512: $base64Hash"
            $content = $content -replace 'size:\s*\d+', "size: $newSize"
            Set-Content -Path $ymlPath -Value $content -Encoding UTF8 -NoNewline
            Write-Host "✅ latest.yml updated with new hash"
          } else {
            throw "latest.yml not found"
          }

      - name: Upload installer to S3
        shell: pwsh
        run: |
          $VERSION = "${{ env.PACKAGE_VERSION }}"
          $BUCKET = "${{ env.S3_BUCKET }}"
          $INSTALLER_FILE = "${{ env.FINAL_INSTALLER }}"
          $PREFIX = "${{ env.S3_PATH_PREFIX }}"
          
          Write-Host "📤 Uploading to S3 (${{ env.BUILD_ENV }}, mode=${{ env.WORKFLOW_MODE }})..."
          
          aws s3 cp "$INSTALLER_FILE" "s3://$BUCKET/$PREFIX/windows/$VERSION/${{ env.VERSIONED_EXE_NAME }}" `
            --content-type "application/x-msdownload" `
            --metadata "version=$VERSION,platform=windows,arch=x64"
          Write-Host "✅ Uploaded: $PREFIX/windows/$VERSION/${{ env.VERSIONED_EXE_NAME }}"
          
          if ("${{ env.UPLOAD_LATEST }}" -eq "true") {
            aws s3 cp "$INSTALLER_FILE" "s3://$BUCKET/$PREFIX/windows/latest/${{ env.INSTALLER_NAME }}" `
              --content-type "application/x-msdownload" `
              --metadata "version=$VERSION,platform=windows,arch=x64"
            Write-Host "✅ Uploaded: $PREFIX/windows/latest/${{ env.INSTALLER_NAME }}"
          }

          if ("${{ env.UPLOAD_PREVIEW }}" -eq "true") {
            aws s3 cp "$INSTALLER_FILE" "s3://$BUCKET/$PREFIX/windows/preview/${{ env.INSTALLER_NAME }}" `
              --content-type "application/x-msdownload" `
              --metadata "version=$VERSION,platform=windows,arch=x64,channel=preview"
            Write-Host "✅ Uploaded: $PREFIX/windows/preview/${{ env.INSTALLER_NAME }}"
          }

      - name: Upload latest.yml to S3
        if: env.LATEST_YML != ''
        shell: pwsh
        run: |
          $VERSION = "${{ env.PACKAGE_VERSION }}"
          $BUCKET = "${{ env.S3_BUCKET }}"
          $YML_FILE = "artifacts/final/latest.yml"
          $PREFIX = "${{ env.S3_PATH_PREFIX }}"
          
          if (Test-Path $YML_FILE) {
            Write-Host "📤 Uploading latest.yml..."
            
            aws s3 cp "$YML_FILE" "s3://$BUCKET/$PREFIX/windows/$VERSION/latest.yml" `
              --content-type "text/yaml" `
              --metadata "version=$VERSION,platform=windows"
            Write-Host "✅ Uploaded: $PREFIX/windows/$VERSION/latest.yml"

            $ymlContent = Get-Content $YML_FILE -Raw
            if ("${{ env.BUILD_ENV }}" -eq "prod") {
              $ymlContent = $ymlContent -replace 'giddh-setup-\d+\.\d+\.\d+\.exe', 'giddh-setup.exe'
              $ymlContent = $ymlContent -replace 'path: giddh-setup-\d+\.\d+\.\d+\.exe', 'path: giddh-setup.exe'
              $ymlContent = $ymlContent -replace 'url: giddh-setup-\d+\.\d+\.\d+\.exe', 'url: giddh-setup.exe'
            } else {
              $ymlContent = $ymlContent -replace 'giddh-test-setup-\d+\.\d+\.\d+\.exe', 'giddh-test-setup.exe'
              $ymlContent = $ymlContent -replace 'path: giddh-test-setup-\d+\.\d+\.\d+\.exe', 'path: giddh-test-setup.exe'
              $ymlContent = $ymlContent -replace 'url: giddh-test-setup-\d+\.\d+\.\d+\.exe', 'url: giddh-test-setup.exe'
            }
            $modifiedYml = "artifacts/final/latest-modified.yml"
            $ymlContent | Set-Content $modifiedYml -NoNewline
            
            if ("${{ env.UPLOAD_LATEST }}" -eq "true") {
              aws s3 cp "$modifiedYml" "s3://$BUCKET/$PREFIX/windows/latest/latest.yml" `
                --content-type "text/yaml" `
                --metadata "version=$VERSION,platform=windows"
              Write-Host "✅ Uploaded: $PREFIX/windows/latest/latest.yml"
            }

            if ("${{ env.UPLOAD_PREVIEW }}" -eq "true") {
              aws s3 cp "$modifiedYml" "s3://$BUCKET/$PREFIX/windows/preview/latest.yml" `
                --content-type "text/yaml" `
                --metadata "version=$VERSION,platform=windows,channel=preview"
              Write-Host "✅ Uploaded: $PREFIX/windows/preview/latest.yml"
            }
          }

      - name: Mark Windows platform completed in release-meta.json
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          S3_PATH_PREFIX: ${{ env.S3_PATH_PREFIX }}
          ELECTRON_SOURCE_FINGERPRINT: ${{ env.ELECTRON_SOURCE_FINGERPRINT }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/release-meta.json" artifacts/release-meta.json
          $env:EXISTING_META_PATH = "artifacts/release-meta.json"
          node scripts/electron-release-meta.js complete --platform windows --in artifacts/release-meta.json --out artifacts/release-meta.json
          aws s3 cp artifacts/release-meta.json "s3://${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/release-meta.json" `
            --content-type "application/json" `
            --metadata "version=${{ env.PACKAGE_VERSION }},platform=windows,status=completed"
          Write-Host "✅ Updated release-meta.json (windows completed)"

      - name: Build Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "WINDOWS BUILD SUMMARY (${{ env.BUILD_ENV }})"
          Write-Host "========================================="
          Write-Host "Mode: ${{ env.WORKFLOW_MODE }}"
          Write-Host "Version: ${{ env.PACKAGE_VERSION }}"
          Write-Host "Source fingerprint: ${{ env.ELECTRON_SOURCE_FINGERPRINT }}"
          Write-Host "Environment: ${{ env.BUILD_ENV }}"
          Write-Host "Upload latest: ${{ env.UPLOAD_LATEST }}"
          Write-Host "S3 Path: ${{ env.S3_PATH_PREFIX }}/windows/"
          Write-Host "========================================="
          Write-Host "Versioned (use this for developer QA):"
          Write-Host "  https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/windows/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_EXE_NAME }}"
          if ("${{ env.UPLOAD_PREVIEW }}" -eq "true") {
            Write-Host "Preview (stable QA URL, does not affect public latest):"
            Write-Host "  https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/windows/preview/${{ env.INSTALLER_NAME }}"
          }
          if ("${{ env.UPLOAD_LATEST }}" -eq "true") {
            Write-Host "Latest (public / auto-update):"
            Write-Host "  https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/windows/latest/${{ env.INSTALLER_NAME }}"
          } else {
            Write-Host "Latest: NOT updated (preview mode). Promote with action=promote and version=${{ env.PACKAGE_VERSION }}"
          }
          Write-Host "=========================================="

  promote_to_latest:
    runs-on: ubuntu-latest
    needs: show_trigger
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote'

    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Validate promote inputs
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD_ENV="${{ github.event.inputs.environment }}"
          BRANCH="${{ github.ref_name }}"

          if [ -z "$VERSION" ]; then
            echo "::error::version input is required for promote (e.g. 1.2.3)"
            exit 1
          fi

          if [ "$BUILD_ENV" = "prod" ]; then
            case "$BRANCH" in
              prod-electron-build-gh-action|books-production) ;;
              *)
                echo "::error::Promote environment 'prod' must run from prod-electron-build-gh-action or books-production (current: $BRANCH)"
                exit 1
                ;;
            esac
          else
            if [ "$BRANCH" != "test-electron-build-gh-action" ]; then
              echo "::error::Promote environment 'test' must run from test-electron-build-gh-action (current: $BRANCH)"
              exit 1
            fi
          fi

          if [ "$BUILD_ENV" = "prod" ]; then
            INSTALLER_NAME="giddh-setup.exe"
            VERSIONED_EXE_NAME="giddh-setup-${VERSION}.exe"
          else
            INSTALLER_NAME="giddh-test-setup.exe"
            VERSIONED_EXE_NAME="giddh-test-setup-${VERSION}.exe"
          fi

          {
            echo "BUILD_ENV=$BUILD_ENV"
            echo "S3_PATH_PREFIX=$BUILD_ENV"
            echo "PACKAGE_VERSION=$VERSION"
            echo "INSTALLER_NAME=$INSTALLER_NAME"
            echo "VERSIONED_EXE_NAME=$VERSIONED_EXE_NAME"
          } >> "$GITHUB_ENV"

          echo "Promoting $BUILD_ENV Windows $VERSION → latest (same binary)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote versioned artifacts to latest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.PACKAGE_VERSION }}"
          BUCKET="${{ env.S3_BUCKET }}"
          PREFIX="${{ env.S3_PATH_PREFIX }}"
          INSTALLER_NAME="${{ env.INSTALLER_NAME }}"
          VERSIONED_EXE_NAME="${{ env.VERSIONED_EXE_NAME }}"
          SRC="s3://$BUCKET/$PREFIX/windows/$VERSION"
          DEST="s3://$BUCKET/$PREFIX/windows/latest"

          echo "📥 Copying installer $VERSIONED_EXE_NAME → $INSTALLER_NAME"
          aws s3 cp "$SRC/$VERSIONED_EXE_NAME" "$DEST/$INSTALLER_NAME" \
            --content-type "application/x-msdownload" \
            --metadata "version=$VERSION,platform=windows,arch=x64,promoted=true"

          echo "📥 Fetching versioned latest.yml for rewrite"
          mkdir -p artifacts/promote
          aws s3 cp "$SRC/latest.yml" artifacts/promote/latest.yml

          YML_CONTENT=$(cat artifacts/promote/latest.yml)
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe/giddh-setup.exe/g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe|path: giddh-setup.exe|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe|url: giddh-setup.exe|g')
          else
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe/giddh-test-setup.exe/g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe|path: giddh-test-setup.exe|g')
            YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe|url: giddh-test-setup.exe|g')
          fi
          printf '%s' "$YML_CONTENT" > artifacts/promote/latest-modified.yml

          aws s3 cp artifacts/promote/latest-modified.yml "$DEST/latest.yml" \
            --content-type "text/yaml" \
            --metadata "version=$VERSION,platform=windows,promoted=true"
          echo "✅ Promoted $PREFIX/windows/$VERSION → $PREFIX/windows/latest"

      - name: Promote Summary
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo "WINDOWS PROMOTE SUMMARY (${{ env.BUILD_ENV }})"
          echo "========================================="
          echo "Mode: promote (same binary, no rebuild)"
          echo "Version: ${{ env.PACKAGE_VERSION }}"
          echo "Environment: ${{ env.BUILD_ENV }}"
          echo "Source:"
          echo "  https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/windows/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_EXE_NAME }}"
          echo "Latest (public / auto-update):"
          echo "  https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/windows/latest/${{ env.INSTALLER_NAME }}"
          echo "=========================================="