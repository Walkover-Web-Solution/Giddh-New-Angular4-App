# Author Name: Divyanshu Shrivastava
# Date: 14th January 2026
# Updated: 28th January 2026 - Signing now happens DURING build via custom-sign.js
name: Windows EXE (build with signing → S3 upload)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "test-electron-build-gh-action"

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_sign_upload:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    env:
      RELEASE_TAG: ${{ github.ref_name }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      UPLOAD_LATEST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Build Windows Electron App
        env:
          ELECTRON_ENV: true
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          node scripts/clean-old-builds.js
          npm run prepare.electron.giddh
          node scripts/build-env.js test
          npx ng build electron-giddh --configuration=test
          node scripts/inject-env-vars.js --electron dist/apps/web-giddh/index.html
          
          Write-Host "📦 Copying icon files..."
          $iconSource = "apps/electron-giddh/src/resources/icon.ico"
          
          # Create resources directory in dist
          New-Item -ItemType Directory -Force -Path "dist/apps/web-giddh/resources" | Out-Null
          
          # Copy icon to resources directory (for electron-builder build)
          $iconDest = "dist/apps/web-giddh/resources/icon.ico"
          
          if (Test-Path $iconSource) {
              $iconSize = (Get-Item $iconSource).Length
              Write-Host "  Source icon: $iconSource ($iconSize bytes)"
              Copy-Item $iconSource $iconDest -Force
              Write-Host "  ✅ Copied to: $iconDest"
              
              # Also copy to root for runtime access
              Copy-Item $iconSource "dist/apps/web-giddh/icon.ico" -Force
              Write-Host "  ✅ Copied to: dist/apps/web-giddh/icon.ico"
              
              if (Test-Path $iconDest) {
                  $destSize = (Get-Item $iconDest).Length
                  Write-Host "  ✅ Verified destination: $destSize bytes"
              }
          } else {
              Write-Host "  ❌ ERROR: Source icon not found!"
              exit 1
          }
          
          Write-Host "📦 Copying tray icons..."
          New-Item -ItemType Directory -Force -Path "dist/apps/web-giddh/build/icons" | Out-Null
          Copy-Item "apps/web-giddh/src/build/icons/*.png" "dist/apps/web-giddh/build/icons/" -Force -ErrorAction SilentlyContinue
          Copy-Item "apps/electron-giddh/src/build/icons/*.png" "dist/apps/web-giddh/build/icons/" -Force -ErrorAction SilentlyContinue
          $trayIcons = Get-ChildItem "dist/apps/web-giddh/build/icons/*.png" -ErrorAction SilentlyContinue
          Write-Host "  ✅ Copied $($trayIcons.Count) tray icon files"
          
          Write-Host "📦 Setting up Electron app structure..."
          # Copy ALL compiled Electron files from apps/electron-giddh/src to dist/apps/web-giddh
          Write-Host "  Copying Electron main process files..."
          Copy-Item "apps/electron-giddh/src/package.json" "dist/apps/web-giddh/package.json" -Force
          Copy-Item "apps/electron-giddh/src/index.js" "dist/apps/web-giddh/index.js" -Force
          Copy-Item "apps/electron-giddh/src/preload.js" "dist/apps/web-giddh/preload.js" -Force
          
          # Copy all other compiled JS files (AppUpdater, WindowManager, etc.)
          Get-ChildItem "apps/electron-giddh/src/*.js" | ForEach-Object {
              Copy-Item $_.FullName "dist/apps/web-giddh/$($_.Name)" -Force
          }
          
          # Copy source maps for debugging
          Get-ChildItem "apps/electron-giddh/src/*.js.map" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "dist/apps/web-giddh/$($_.Name)" -Force
          }
          
          Write-Host "  ✅ Copied Electron main process files"
          Write-Host "  Files in dist/apps/web-giddh:"
          Get-ChildItem "dist/apps/web-giddh" -File | Select-Object -First 10 | ForEach-Object { Write-Host "    - $($_.Name)" }
          
          # Install production dependencies for Electron
          Write-Host "📦 Installing Electron production dependencies..."
          cd dist/apps/web-giddh
          
          # Verify package.json exists and has main entry
          if (Test-Path "package.json") {
              $pkg = Get-Content "package.json" | ConvertFrom-Json
              Write-Host "  Package name: $($pkg.name)"
              Write-Host "  Main entry: $($pkg.main)"
              Write-Host "  Version: $($pkg.version)"
          } else {
              Write-Host "  ❌ ERROR: package.json not found!"
              exit 1
          }
          
          npm install --production --no-optional
          Write-Host "  ✅ Installed dependencies"
          Write-Host "  node_modules created: $(Test-Path 'node_modules')"
          
          Write-Host "🔨 Building Windows app with electron-builder..."
          npx electron-builder build --config ./../../../electron-sign/electron-builder.json --win
          cd ../../../
          node scripts/build-success-message.js prod
          
          Write-Host "🔍 Verifying built artifacts..."
          
          # Check installer
          $exePath = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "*.exe" -Recurse | Where-Object { $_.Directory.Name -ne "win-unpacked" } | Select-Object -First 1
          if ($exePath) {
              Write-Host "  ✅ Found installer: $($exePath.FullName)"
              Write-Host "  Size: $($exePath.Length) bytes"
          } else {
              Write-Host "  ⚠️ WARNING: Installer not found in expected location"
          }
          
          # Check app executable in win-unpacked (critical for auto-updates)
          $appExePath = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "Giddh.exe" -Recurse | Where-Object { $_.Directory.Name -eq "win-unpacked" } | Select-Object -First 1
          if ($appExePath) {
              Write-Host "  ✅ Found app executable: $($appExePath.FullName)"
              Write-Host "  Size: $($appExePath.Length) bytes"
              
              # Verify signature of app executable
              $sig = Get-AuthenticodeSignature $appExePath.FullName
              Write-Host "  📝 App Executable Signature Status: $($sig.Status)"
              if ($sig.Status -eq "Valid") {
                  Write-Host "  ✅ App executable is SIGNED (auto-updates will work)"
                  Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
              } else {
                  Write-Host "  ❌ ERROR: App executable is NOT SIGNED!"
                  Write-Host "  This will cause Windows SmartScreen to block auto-updates!"
                  exit 1
              }
          } else {
              Write-Host "  ⚠️ WARNING: App executable not found in win-unpacked"
          }

      - name: Extract version and find installer
        shell: pwsh
        run: |
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version"

          Write-Host "📂 Listing all files in dist/apps/electrongiddh-packages:"
          if (Test-Path "dist/apps/electrongiddh-packages") {
            Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Recurse | ForEach-Object {
              Write-Host "  $($_.FullName) - Directory: $($_.Directory.Name)"
            }
          } else {
            Write-Host "⚠️ Directory dist/apps/electrongiddh-packages does not exist!"
            Write-Host "📂 Listing dist/apps:"
            Get-ChildItem -Path "dist/apps" -Recurse | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }
          }

          $installer = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "blockmap" -and $_.Directory.Name -ne "win-unpacked" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $installer) { 
            Write-Host "❌ No installer found with current filters. Trying without filters..."
            $allExes = Get-ChildItem -Path "dist/apps" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
            Write-Host "Found EXE files:"
            $allExes | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "No installer found. Check electron-builder output." 
          }

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found installer: $($installer.FullName)"
          
          # Check if installer is already signed (from custom-sign.js during build)
          $installerSig = Get-AuthenticodeSignature $installer.FullName
          if ($installerSig.Status -eq "Valid") {
              Write-Host "✅ Installer is already SIGNED during build"
              "INSTALLER_ALREADY_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
              Write-Host "⚠️  Installer is NOT signed, will sign in next step"
              "INSTALLER_ALREADY_SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          
          $latestYml = Get-ChildItem -Path "dist/apps/electrongiddh-packages" -Filter "latest.yml" -Recurse | Select-Object -First 1
          if ($latestYml) {
              "LATEST_YML=$($latestYml.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "Found latest.yml: $($latestYml.FullName)"
          } else {
              Write-Host "⚠️ WARNING: latest.yml not found"
          }
          
          # Get versioned filename from electron-builder (e.g., giddh-test-setup-10.0.9.exe)
          $versionedExeName = Split-Path -Leaf $installer.FullName
          "VERSIONED_EXE_NAME=$versionedExeName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Versioned installer name: $versionedExeName"
          
          # Fixed name for latest folder (for auto-updater) - without version suffix
          $latestExeName = "giddh-test-setup.exe"
          "LATEST_EXE_NAME=$latestExeName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Latest installer name: $latestExeName"

      - name: Create artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/final" | Out-Null
          Write-Host "Created artifacts/final directory"

      - name: Sign installer with SSL.com eSigner (fallback if not signed during build)
        if: env.INSTALLER_ALREADY_SIGNED == 'false'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.INSTALLER_PATH }}
          output_path: artifacts/final
          malware_block: false
          environment_name: PROD
          override: true

      - name: Verify installer signature and prepare for upload
        shell: pwsh
        run: |
          # Determine which installer to use
          if ("${{ env.INSTALLER_ALREADY_SIGNED }}" -eq "true") {
            # Installer was signed during build, copy it to artifacts/final
            Write-Host "📦 Using installer signed during build"
            Copy-Item "${{ env.INSTALLER_PATH }}" "artifacts/final/" -Force
            $signedInstaller = Get-ChildItem -Path "artifacts/final" -Filter "*.exe" | Select-Object -First 1
          } else {
            # Installer was signed after build by eSigner action
            Write-Host "📦 Using installer signed by eSigner action"
            $signedInstaller = Get-ChildItem -Path "artifacts/final" -Filter "*.exe" | Select-Object -First 1
          }
          
          if (-not $signedInstaller) { throw "Signed installer not found in artifacts/final" }
          
          $sig = Get-AuthenticodeSignature $signedInstaller.FullName
          Write-Host "========================================="
          Write-Host "INSTALLER Signature Verification:"
          Write-Host "File: $($signedInstaller.FullName)"
          Write-Host "Status: $($sig.Status)"
          Write-Host "Status Message: $($sig.StatusMessage)"
          Write-Host "Signer Certificate Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Signer Certificate Issuer: $($sig.SignerCertificate.Issuer)"
          Write-Host "Signer Certificate Thumbprint: $($sig.SignerCertificate.Thumbprint)"
          Write-Host "Time Stamper Certificate: $($sig.TimeStamperCertificate.Subject)"
          Write-Host "========================================="
          
          if ($sig.Status -ne "Valid") { 
            Write-Host "ERROR: Installer signature verification failed!"
            throw "Installer signature verification failed: $($sig.StatusMessage)" 
          }
          
          Write-Host "✅ Installer signature is valid!"
          "FINAL_INSTALLER=$($signedInstaller.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare latest.yml for upload
        shell: pwsh
        run: |
          if (Test-Path $env:LATEST_YML) {
            Copy-Item $env:LATEST_YML "artifacts/final/latest.yml" -Force
            Write-Host "✅ Copied latest.yml to artifacts/final/"
          } else {
            Write-Host "⚠️ WARNING: latest.yml not found"
          }

      - name: Recalculate SHA512 and update latest.yml (after signing)
        shell: pwsh
        run: |
          Write-Host "📊 Recalculating SHA512 hash for signed installer..."
          
          # Get the signed installer file
          $signedFile = Get-ChildItem -Path "artifacts/final" -Filter "*.exe" | Select-Object -First 1
          
          if (-not $signedFile) {
            throw "Signed installer not found in artifacts/final/"
          }
          
          Write-Host "  Signed file: $($signedFile.FullName)"
          
          # Calculate SHA512 hash and convert to Base64
          $hashHex = (Get-FileHash -Path $signedFile.FullName -Algorithm SHA512).Hash
          Write-Host "  SHA512 (hex): $hashHex"
          
          # Convert hex string to byte array then to Base64
          $byteArray = for ($i = 0; $i -lt $hashHex.Length; $i += 2) { 
            [Convert]::ToByte($hashHex.Substring($i, 2), 16) 
          }
          $base64Hash = [Convert]::ToBase64String($byteArray)
          Write-Host "  SHA512 (base64): $base64Hash"
          
          # Get new file size (signing changes file size)
          $newSize = (Get-Item $signedFile.FullName).Length
          Write-Host "  File size: $newSize bytes"
          
          # Update latest.yml with new hash and size
          $ymlPath = "artifacts/final/latest.yml"
          if (Test-Path $ymlPath) {
            $content = Get-Content $ymlPath -Raw
            
            # Update all sha512 references
            $content = $content -replace 'sha512:\s*[A-Za-z0-9+/=]+', "sha512: $base64Hash"
            
            # Update all size references
            $content = $content -replace 'size:\s*\d+', "size: $newSize"
            
            # Save updated content
            Set-Content -Path $ymlPath -Value $content -Encoding UTF8 -NoNewline
            
            Write-Host "✅ Updated latest.yml with new SHA512 hash and size"
            Write-Host ""
            Write-Host "Updated latest.yml content:"
            Get-Content $ymlPath | Write-Host
          } else {
            throw "latest.yml not found at $ymlPath"
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload installer to S3
        shell: pwsh
        run: |
          $VERSION = "${{ env.PACKAGE_VERSION }}"
          $BUCKET = "${{ env.S3_BUCKET }}"
          $INSTALLER_FILE = "${{ env.FINAL_INSTALLER }}"
          
          Write-Host "📤 Uploading Windows installer to S3..."
          Write-Host "  Version: $VERSION"
          Write-Host "  Bucket: $BUCKET"
          Write-Host "  Source: $INSTALLER_FILE"
          
          # Upload to versioned folder with versioned filename
          aws s3 cp "$INSTALLER_FILE" "s3://$BUCKET/test/windows/$VERSION/${{ env.VERSIONED_EXE_NAME }}" `
            --content-type "application/x-msdownload" `
            --metadata "version=$VERSION,platform=windows,arch=x64"
          
          Write-Host "✅ Uploaded versioned installer: test/windows/$VERSION/${{ env.VERSIONED_EXE_NAME }}"
          
          # Upload to latest folder with fixed name for auto-updater (without version)
          if ("${{ env.UPLOAD_LATEST }}" -eq "true") {
            aws s3 cp "$INSTALLER_FILE" "s3://$BUCKET/test/windows/latest/${{ env.LATEST_EXE_NAME }}" `
              --content-type "application/x-msdownload" `
              --metadata "version=$VERSION,platform=windows,arch=x64"
            Write-Host "✅ Uploaded to latest: test/windows/latest/${{ env.LATEST_EXE_NAME }}"
          }
          
          Write-Host "✅ URL: https://s3-${{ env.AWS_REGION }}.amazonaws.com/$BUCKET/test/windows/$VERSION/${{ env.VERSIONED_EXE_NAME }}"

      - name: Upload latest.yml to S3
        if: env.LATEST_YML != ''
        shell: pwsh
        run: |
          $VERSION = "${{ env.PACKAGE_VERSION }}"
          $BUCKET = "${{ env.S3_BUCKET }}"
          $YML_FILE = "artifacts/final/latest.yml"
          
          if (Test-Path $YML_FILE) {
            Write-Host "📤 Uploading latest.yml to S3..."
            
            # Upload original latest.yml to versioned folder
            aws s3 cp "$YML_FILE" "s3://$BUCKET/test/windows/$VERSION/latest.yml" `
              --content-type "text/yaml" `
              --metadata "version=$VERSION,platform=windows"
            
            Write-Host "✅ Uploaded latest.yml to versioned folder: test/windows/$VERSION/latest.yml"
            
            # For latest folder, modify latest.yml to reference giddh-test-setup.exe
            if ("${{ env.UPLOAD_LATEST }}" -eq "true") {
              # Read the already-updated latest.yml (SHA512 was recalculated after signing)
              $ymlContent = Get-Content $YML_FILE -Raw
              
              # Replace versioned exe filenames with fixed name (without version suffix)
              # electron-builder generates filenames like "giddh-test-setup-10.0.9.exe"
              $ymlContent = $ymlContent -replace 'giddh-test-setup-\d+\.\d+\.\d+\.exe', 'giddh-test-setup.exe'
              $ymlContent = $ymlContent -replace 'path: giddh-test-setup-\d+\.\d+\.\d+\.exe', 'path: giddh-test-setup.exe'
              $ymlContent = $ymlContent -replace 'url: giddh-test-setup-\d+\.\d+\.\d+\.exe', 'url: giddh-test-setup.exe'
              
              # Save modified content to a new file
              $modifiedYml = "artifacts/final/latest-modified.yml"
              $ymlContent | Set-Content $modifiedYml -NoNewline
              
              Write-Host "📝 Modified latest.yml content:"
              Get-Content $modifiedYml | Write-Host
              
              # Upload modified latest.yml to latest folder
              aws s3 cp "$modifiedYml" "s3://$BUCKET/test/windows/latest/latest.yml" `
                --content-type "text/yaml" `
                --metadata "version=$VERSION,platform=windows"
              Write-Host "✅ Uploaded modified latest.yml to latest folder: test/windows/latest/latest.yml"
            }
            
            Write-Host "✅ URL: https://s3-${{ env.AWS_REGION }}.amazonaws.com/$BUCKET/test/windows/$VERSION/latest.yml"
          } else {
            Write-Host "⚠️ WARNING: latest.yml not found at $YML_FILE"
          }

      - name: Build Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "WINDOWS BUILD SUMMARY"
          Write-Host "========================================="
          Write-Host "Version: ${{ env.PACKAGE_VERSION }}"
          Write-Host "Architecture: x64 + ia32"
          Write-Host "S3 Bucket: ${{ env.S3_BUCKET }}"
          Write-Host "========================================="
          Write-Host "Download URLs (Versioned):"
          Write-Host "  EXE: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/test/windows/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_EXE_NAME }}"
          Write-Host "  YML: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/test/windows/${{ env.PACKAGE_VERSION }}/latest.yml"
          Write-Host ""
          Write-Host "Download URLs (Latest - Auto-updater):"
          Write-Host "  EXE: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/test/windows/latest/${{ env.LATEST_EXE_NAME }}"
          Write-Host "  YML: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/test/windows/latest/latest.yml"
          Write-Host "=========================================="

