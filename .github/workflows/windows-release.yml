# Date: 13th January 2026
name: Windows EXE (build → eSigner sign → S3 upload)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "test-electron-build-gh-action"

permissions:
  contents: read
  id-token: write # needed only if you use AWS OIDC (role-to-assume)

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_sign_upload:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.ref_name }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      UPLOAD_LATEST: "true" # set to "false" if you don't want releases/latest/app.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      # Adjust this to your project scripts.
      # Common options:
      # - npm run build && npm run dist
      # - npx electron-builder --win --x64 --publish never
      - name: Build Windows EXE
        env:
          ELECTRON_ENV: true
        run: |
          node scripts/clean-old-builds.js
          npm run prepare.electron.giddh
          node scripts/build-env.js prod
          npx ng build electron-giddh --configuration=prod
          node scripts/inject-env-vars.js --electron dist/apps/web-giddh/index.html
          cd dist/apps/web-giddh
          npx electron-builder build --config ./../../../electron-sign/electron-builder.json --win --ia32 --x64
          cd ../../../
          node scripts/build-success-message.js prod

      - name: Extract version from package.json and prepare artifacts
        shell: pwsh
        run: |
          # Extract version from package.json
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version"

          if (!(Test-Path "dist")) { throw "dist/ folder not found. Update this workflow to match your electron-builder output dir." }

          # Find the EXE file
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notmatch "blockmap" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) { throw "No .exe found under dist/. Check your electron-builder configuration." }

          # Find the latest.yml file
          $latestYml = Get-ChildItem -Path "dist" -Filter "latest.yml" -Recurse | Select-Object -First 1
          if (-not $latestYml) { Write-Host "Warning: latest.yml not found in dist/" }

          # Create artifacts directory and copy files
          New-Item -ItemType Directory -Force -Path "artifacts\unsigned" | Out-Null
          Copy-Item $exe.FullName "artifacts\unsigned\app.exe" -Force

          if ($latestYml) {
            Copy-Item $latestYml.FullName "artifacts\unsigned\latest.yml" -Force
            "LATEST_YML_PATH=$((Resolve-Path 'artifacts\unsigned\latest.yml').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          "UNSIGNED_EXE=$((Resolve-Path 'artifacts\unsigned\app.exe').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign EXE with SSL.com eSigner (cloud signing)
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.UNSIGNED_EXE }}
          output_path: ${{ github.workspace }}\artifacts\signed
          malware_block: false
          # override: false       # optional

      - name: Set SIGNED_EXE env + verify signature + prepare final filenames
        shell: pwsh
        run: |
          $signed = Join-Path $env:GITHUB_WORKSPACE "artifacts\signed\app.exe"
          if (!(Test-Path $signed)) {
            # Fallback: find any signed exe in output dir
            $fallback = Get-ChildItem -Path "artifacts\signed" -Filter "*.exe" -Recurse | Select-Object -First 1
            if (-not $fallback) { throw "Signed EXE not found in artifacts\\signed. Check signing step output." }
            $signed = $fallback.FullName
            Copy-Item $signed (Join-Path $env:GITHUB_WORKSPACE "artifacts\signed\app.exe") -Force
            $signed = Join-Path $env:GITHUB_WORKSPACE "artifacts\signed\app.exe"
          }

          "SIGNED_EXE=$signed" | Out-File -FilePath $env:GITHUB_ENV -Append

          $sig = Get-AuthenticodeSignature $signed
          Write-Host "Signature Status: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "Signature verification failed: $($sig.StatusMessage)" }

          # Create final filename with version
          $finalExeName = "giddh Setup $env:PACKAGE_VERSION.exe"
          "FINAL_EXE_NAME=$finalExeName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Final EXE name: $finalExeName"

      # --- AWS Auth (using access keys only for now) ---

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload signed EXE and latest.yml to S3 (with local fallback)
        shell: pwsh
        run: |
          $uploadSuccess = $false
          
          # Try S3 upload first
          try {
            if ([string]::IsNullOrEmpty($env:S3_BUCKET)) { 
              Write-Host "S3_BUCKET secret is missing, skipping S3 upload"
            } else {
              aws --version

              # Upload the signed EXE with version-based filename
              $dest1 = "s3://$($env:S3_BUCKET)/$($env:FINAL_EXE_NAME)"
              aws s3 cp "$env:SIGNED_EXE" "$dest1" --only-show-errors
              Write-Host "Uploaded EXE to: $dest1"

              # Upload latest.yml if it exists
              if ($env:LATEST_YML_PATH -and (Test-Path $env:LATEST_YML_PATH)) {
                $dest2 = "s3://$($env:S3_BUCKET)/latest.yml"
                aws s3 cp "$env:LATEST_YML_PATH" "$dest2" --only-show-errors
                Write-Host "Uploaded latest.yml to: $dest2"
              } else {
                Write-Host "Warning: latest.yml not found, skipping upload"
              }
              $uploadSuccess = $true
              Write-Host "✅ S3 upload completed successfully"
            }
          } catch {
            Write-Host "❌ S3 upload failed: $($_.Exception.Message)"
            Write-Host "📁 Falling back to local artifact storage..."
          }
          
          # Fallback: Store artifacts locally in repository
          if (-not $uploadSuccess) {
            # Create test-electron-build directory
            New-Item -ItemType Directory -Force -Path "test-electron-build" | Out-Null
            
            # Copy signed EXE with version-based filename
            Copy-Item "$env:SIGNED_EXE" "test-electron-build/$env:FINAL_EXE_NAME" -Force
            Write-Host "📁 Copied EXE to: test-electron-build/$env:FINAL_EXE_NAME"
            
            # Copy latest.yml if it exists
            if ($env:LATEST_YML_PATH -and (Test-Path $env:LATEST_YML_PATH)) {
              Copy-Item "$env:LATEST_YML_PATH" "test-electron-build/latest.yml" -Force
              Write-Host "📁 Copied latest.yml to: test-electron-build/latest.yml"
            }
            
            Write-Host "✅ Local artifact storage completed"
          }

      - name: Commit artifacts to repository (fallback only)
        if: failure() || env.S3_UPLOAD_FAILED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test-electron-build/ || true
          git commit -m "Add build artifacts: ${{ env.FINAL_EXE_NAME }} and latest.yml" || true
          git push || true

      - name: Done
        shell: pwsh
        run: |
          Write-Host "Uploaded signed EXE for $env:RELEASE_TAG"
