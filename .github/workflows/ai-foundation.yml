name: Agent map and application regression checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Check documentation without application dependencies
        run: npm run check:docs
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run focused regressions
        run: npm run test:focused
      - name: Check application types
        run: npm run check:types
      - name: Build the local web application
        run: npm run build
      - name: Install Chromium for local fixture checks
        run: npx playwright install --with-deps chromium
      - name: Check browser flows with external requests blocked
        run: npm run check:browser
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: dist/browser-checks
          if-no-files-found: ignore
