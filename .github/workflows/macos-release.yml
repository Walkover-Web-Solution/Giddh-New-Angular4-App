# Author Name: Divyanshu Shrivastava
# Date: 16th January 2026
name: macOS DMG (build → unsigned → S3 upload)

on:
  workflow_run:
    workflows: ["Version Increment"]
    types:
      - completed
    branches:
      - "test-electron-build-gh-action"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to push version changes back to repository
  id-token: write # needed only if you use AWS OIDC (role-to-assume)

concurrency:
  group: macos-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_upload:
    runs-on: macos-latest

    env:
      RELEASE_TAG: ${{ github.ref_name }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      UPLOAD_LATEST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Build macOS Universal App
        env:
          ELECTRON_ENV: true
        run: |
          node scripts/clean-old-builds.js
          npm run prepare.electron.giddh
          node scripts/build-env.js prod
          npx ng build electron-giddh --configuration=prod
          node scripts/inject-env-vars.js --electron dist/apps/web-giddh/index.html
          
          # Ensure updated icon is copied to dist folder
          echo "📦 Copying icon files..."
          ICON_SOURCE="apps/electron-giddh/src/resources/icon.png"
          ICON_DEST="dist/apps/web-giddh/resources/icon.png"
          
          if [ -f "$ICON_SOURCE" ]; then
              ICON_SIZE=$(stat -f%z "$ICON_SOURCE")
              echo "  Source icon: $ICON_SOURCE ($ICON_SIZE bytes)"
              cp "$ICON_SOURCE" "$ICON_DEST"
              echo "  ✅ Copied to: $ICON_DEST"
              
              if [ -f "$ICON_DEST" ]; then
                  DEST_SIZE=$(stat -f%z "$ICON_DEST")
                  echo "  ✅ Verified destination: $DEST_SIZE bytes"
              fi
          else
              echo "  ❌ ERROR: Source icon not found!"
              exit 1
          fi
          
          # Copy tray icons for macOS tray functionality
          echo "📦 Copying tray icons..."
          mkdir -p "dist/apps/web-giddh/build/icons"
          cp apps/web-giddh/src/build/icons/*.png "dist/apps/web-giddh/build/icons/" 2>/dev/null || true
          cp apps/electron-giddh/src/build/icons/*.png "dist/apps/web-giddh/build/icons/" 2>/dev/null || true
          TRAY_ICON_COUNT=$(ls -1 dist/apps/web-giddh/build/icons/*.png 2>/dev/null | wc -l)
          echo "  ✅ Copied $TRAY_ICON_COUNT tray icon files"
          
          cd dist/apps/web-giddh
          echo "🔨 Building macOS Universal app with electron-builder..."
          npx electron-builder build --config ./../../../electron-sign/electron-builder-mac-unsigned.json --mac --universal
          cd ../../../
          node scripts/build-success-message.js prod
          
          # Verify the built DMG exists
          echo "🔍 Verifying built DMG..."
          DMG_PATH=$(find dist/apps/electrongiddh-packages -name "*.dmg" -type f | head -n 1)
          if [ -n "$DMG_PATH" ]; then
              echo "  ✅ Found DMG: $DMG_PATH"
              DMG_SIZE=$(stat -f%z "$DMG_PATH")
              echo "  Size: $DMG_SIZE bytes"
          else
              echo "  ⚠️ WARNING: DMG not found in expected location"
          fi

      - name: Extract version and find DMG
        shell: bash
        run: |
          # Extract version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Package version: $PACKAGE_VERSION"

          # Find the DMG file
          DMG_FILE=$(find dist/apps/electrongiddh-packages -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
              echo "❌ ERROR: No DMG found. Check electron-builder output."
              exit 1
          fi

          echo "UNSIGNED_DMG=$DMG_FILE" >> $GITHUB_ENV
          echo "Found unsigned DMG: $DMG_FILE"
          
          # Find the latest-mac.yml file
          LATEST_YML=$(find dist/apps/electrongiddh-packages -name "latest-mac.yml" -type f | head -n 1)
          if [ -n "$LATEST_YML" ]; then
              echo "LATEST_MAC_YML=$LATEST_YML" >> $GITHUB_ENV
              echo "Found latest-mac.yml: $LATEST_YML"
          else
              echo "⚠️ WARNING: latest-mac.yml not found"
          fi
          
          # Create final filename
          FINAL_DMG_NAME="giddh-${PACKAGE_VERSION}.dmg"
          echo "FINAL_DMG_NAME=$FINAL_DMG_NAME" >> $GITHUB_ENV
          echo "Final DMG name will be: $FINAL_DMG_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload DMG to S3
        shell: bash
        run: |
          VERSION="${{ env.PACKAGE_VERSION }}"
          BUCKET="${{ env.S3_BUCKET }}"
          DMG_FILE="${{ env.UNSIGNED_DMG }}"
          FINAL_NAME="${{ env.FINAL_DMG_NAME }}"
          
          echo "📤 Uploading macOS DMG to S3..."
          echo "  Version: $VERSION"
          echo "  Bucket: $BUCKET"
          echo "  Source: $DMG_FILE"
          echo "  Destination: $FINAL_NAME"
          
          # Upload versioned DMG
          aws s3 cp "$DMG_FILE" "s3://$BUCKET/releases/mac/$VERSION/$FINAL_NAME" \
            --content-type "application/x-apple-diskimage" \
            --metadata "version=$VERSION,platform=macos,arch=universal"
          
          echo "✅ Uploaded versioned DMG: releases/mac/$VERSION/$FINAL_NAME"
          
          # Upload to latest if enabled
          if [ "${{ env.UPLOAD_LATEST }}" = "true" ]; then
              aws s3 cp "$DMG_FILE" "s3://$BUCKET/releases/mac/latest/$FINAL_NAME" \
                --content-type "application/x-apple-diskimage" \
                --metadata "version=$VERSION,platform=macos,arch=universal"
              echo "✅ Uploaded to latest: releases/mac/latest/$FINAL_NAME"
          fi

      - name: Upload latest-mac.yml to S3
        if: env.LATEST_MAC_YML != ''
        shell: bash
        run: |
          VERSION="${{ env.PACKAGE_VERSION }}"
          BUCKET="${{ env.S3_BUCKET }}"
          YML_FILE="${{ env.LATEST_MAC_YML }}"
          
          echo "📤 Uploading latest-mac.yml to S3..."
          
          # Upload versioned yml
          aws s3 cp "$YML_FILE" "s3://$BUCKET/releases/mac/$VERSION/latest-mac.yml" \
            --content-type "text/yaml" \
            --metadata "version=$VERSION,platform=macos"
          
          echo "✅ Uploaded versioned yml: releases/mac/$VERSION/latest-mac.yml"
          
          # Upload to latest if enabled
          if [ "${{ env.UPLOAD_LATEST }}" = "true" ]; then
              aws s3 cp "$YML_FILE" "s3://$BUCKET/releases/mac/latest/latest-mac.yml" \
                --content-type "text/yaml" \
                --metadata "version=$VERSION,platform=macos"
              echo "✅ Uploaded to latest: releases/mac/latest/latest-mac.yml"
          fi

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo "macOS BUILD SUMMARY"
          echo "========================================="
          echo "Version: ${{ env.PACKAGE_VERSION }}"
          echo "DMG: ${{ env.FINAL_DMG_NAME }}"
          echo "Architecture: Universal (Intel + Apple Silicon)"
          echo "S3 Bucket: ${{ env.S3_BUCKET }}"
          echo "S3 Path (versioned): releases/mac/${{ env.PACKAGE_VERSION }}/"
          echo "S3 Path (latest): releases/mac/latest/"
          echo "========================================="
          echo "Download URLs:"
          echo "https://${{ env.S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/releases/mac/${{ env.PACKAGE_VERSION }}/${{ env.FINAL_DMG_NAME }}"
          echo "https://${{ env.S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/releases/mac/latest/${{ env.FINAL_DMG_NAME }}"
          echo "========================================="
