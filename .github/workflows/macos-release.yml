# Author Name: Divyanshu Shrivastava
# Date: 16th January 2026
name: macOS DMG (build → signed → notarize → S3 upload)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "test-electron-build-gh-action"
      - "prod-electron-build-gh-action"

permissions:
  contents: write # needed to push version changes back to repository
  id-token: write # needed only if you use AWS OIDC (role-to-assume)

concurrency:
  group: macos-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_upload:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    env:
      RELEASE_TAG: ${{ github.ref_name }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      UPLOAD_LATEST: "true"
      # Angular electron build OOMs on default Node heap (~2GB)
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect build environment from branch
        shell: bash
        run: |
          branch="${{ github.ref_name }}"
          echo "Branch: $branch"
          
          if [ "$branch" = "prod-electron-build-gh-action" ]; then
            echo "BUILD_ENV=prod" >> $GITHUB_ENV
            echo "S3_PATH_PREFIX=prod" >> $GITHUB_ENV
            echo "LATEST_ZIP_NAME=giddh.zip" >> $GITHUB_ENV
            echo "LATEST_DMG_NAME=giddh-setup.dmg" >> $GITHUB_ENV
            echo "✅ Production build"
          else
            echo "BUILD_ENV=test" >> $GITHUB_ENV
            echo "S3_PATH_PREFIX=test" >> $GITHUB_ENV
            echo "LATEST_ZIP_NAME=giddh-test.zip" >> $GITHUB_ENV
            echo "LATEST_DMG_NAME=giddh-test-setup.dmg" >> $GITHUB_ENV
            echo "✅ Test build"
          fi

      # APPLE_CERTIFICATE_BASE64 is a single .p12 containing both
      # Developer ID Application + Developer ID Installer certificates.
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 secret is missing."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/giddh-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "Decoding combined Apple certificate (.p12)..."
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate file is empty."
            exit 1
          fi

          echo "Creating temporary signing keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Importing Application + Installer certificates from single .p12..."
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Identities in signing keychain:"
          security find-identity -v "$KEYCHAIN_PATH"

          # Electron .app / .dmg signing uses Developer ID Application.
          # electron-builder rejects the "Developer ID Application:" prefix — pass name only.
          SIGNING_IDENTITY_FULL=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            awk -F'"' '/Developer ID Application/ {print $2; exit}'
          )

          INSTALLER_IDENTITY=$(
            security find-identity -v "$KEYCHAIN_PATH" |
            awk -F'"' '/Developer ID Installer/ {print $2; exit}'
          )

          if [ -z "$SIGNING_IDENTITY_FULL" ]; then
            echo "::error::Developer ID Application certificate not found in APPLE_CERTIFICATE_BASE64."
            exit 1
          fi

          SIGNING_IDENTITY="${SIGNING_IDENTITY_FULL#Developer ID Application: }"

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "CSC_NAME=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Application Identity (full): $SIGNING_IDENTITY_FULL"
          echo "Application Identity (CSC_NAME): $SIGNING_IDENTITY"
          echo "Installer Identity: ${INSTALLER_IDENTITY:-'(not required for Electron .app/.dmg)'}"

      - name: Install deps
        run: npm install

      - name: Build macOS Universal App (signed + notarized)
        env:
          ELECTRON_ENV: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_BUNDLE_ID: com.giddh.prod
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: |
          set -euo pipefail

          node scripts/clean-old-builds.js
          npm run prepare.electron.giddh
          node scripts/build-env.js ${{ env.BUILD_ENV }}
          npx ng build electron-giddh --configuration=${{ env.BUILD_ENV }}
          node scripts/inject-env-vars.js --electron dist/apps/web-giddh/index.html
          
          echo "📦 Copying icon files..."
          ICON_SOURCE="apps/electron-giddh/src/resources/icon.icns"
          mkdir -p "dist/apps/web-giddh/resources"
          
          if [ -f "$ICON_SOURCE" ]; then
              cp "$ICON_SOURCE" "dist/apps/web-giddh/resources/icon.icns"
              cp "$ICON_SOURCE" "dist/apps/web-giddh/icon.icns"
              echo "  ✅ Icon files copied"
          else
              echo "  ❌ ERROR: Icon not found!"
              exit 1
          fi
          
          echo "📦 Copying tray icons..."
          mkdir -p "dist/apps/web-giddh/build/icons"
          cp apps/web-giddh/src/build/icons/*.png "dist/apps/web-giddh/build/icons/" 2>/dev/null || true
          cp apps/electron-giddh/src/build/icons/*.png "dist/apps/web-giddh/build/icons/" 2>/dev/null || true
          echo "  ✅ Tray icons copied"
          
          echo "📦 Copying preload.js..."
          PRELOAD_SOURCE="apps/electron-giddh/src/preload.js"
          if [ -f "$PRELOAD_SOURCE" ]; then
              cp "$PRELOAD_SOURCE" "dist/apps/web-giddh/preload.js"
              echo "  ✅ Preload.js copied"
          else
              echo "  ❌ ERROR: preload.js not found!"
              exit 1
          fi
          
          echo "📦 Copying package.json..."
          PACKAGE_SOURCE="apps/electron-giddh/src/package.json"
          if [ -f "$PACKAGE_SOURCE" ]; then
              cp "$PACKAGE_SOURCE" "dist/apps/web-giddh/package.json"
              
              echo "📝 Setting product name for ${{ env.BUILD_ENV }} build..."
              PKG_PATH="dist/apps/web-giddh/package.json"
              
              if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
                jq '.name = "Giddh" | .productName = "Giddh"' "$PKG_PATH" > temp.json && mv temp.json "$PKG_PATH"
                echo "  ✅ Set product name: Giddh (production)"
              else
                jq '.name = "Giddh-Test" | .productName = "Giddh-Test"' "$PKG_PATH" > temp.json && mv temp.json "$PKG_PATH"
                echo "  ✅ Set product name: Giddh-Test (test)"
              fi
              
              echo "  ✅ Package.json configured"
          else
              echo "  ❌ ERROR: package.json not found!"
              exit 1
          fi
          
          cd dist/apps/web-giddh

          # afterSign/entitlements must live inside projectDir (electron-builder 26)
          echo "📦 Copying Electron signing files..."
          cp "$GITHUB_WORKSPACE/electron-sign/notarize.js" .
          cp "$GITHUB_WORKSPACE/electron-sign/entitlements.mac.plist" .
          cp "$GITHUB_WORKSPACE/electron-sign/default.entitlements.mas.plist" .
          cp "$GITHUB_WORKSPACE/electron-sign/default.entitlements.mas.inherit.plist" .
          test -f notarize.js
          test -f entitlements.mac.plist
          echo "  ✅ Electron signing files copied"
          
          echo "📝 Setting artifact name for ${{ env.BUILD_ENV }} build..."
          CONFIG_PATH="./../../../electron-sign/electron-builder.json"
          
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            jq --arg identity "${{ env.APPLE_SIGNING_IDENTITY }}" \
              '.mac.artifactName = "giddh-setup-${version}.${ext}" | .mac.identity = $identity | .afterSign = "./notarize.js" | .mac.entitlements = "./entitlements.mac.plist" | .mac.entitlementsInherit = "./entitlements.mac.plist"' \
              "$CONFIG_PATH" > temp.json && mv temp.json "$CONFIG_PATH"
            echo "  ✅ Set artifact name: giddh-setup-VERSION.ext"
          else
            jq --arg identity "${{ env.APPLE_SIGNING_IDENTITY }}" \
              '.mac.artifactName = "giddh-test-setup-${version}.${ext}" | .mac.identity = $identity | .afterSign = "./notarize.js" | .mac.entitlements = "./entitlements.mac.plist" | .mac.entitlementsInherit = "./entitlements.mac.plist"' \
              "$CONFIG_PATH" > temp.json && mv temp.json "$CONFIG_PATH"
            echo "  ✅ Set artifact name: giddh-test-setup-VERSION.ext"
          fi
          
          echo "🔨 Building signed macOS Universal app..."
          npx electron-builder build \
            --config ./../../../electron-sign/electron-builder.json \
            --mac \
            --universal \
            --publish never
          cd ../../../
          node scripts/build-success-message.js prod
          
          echo "🔍 Verifying artifacts..."
          ZIP_PATH=$(find dist/apps/electrongiddh-packages -name "*.zip" -type f | head -n 1)
          DMG_PATH=$(find dist/apps/electrongiddh-packages -name "*.dmg" -type f | head -n 1)
          
          if [ -n "$ZIP_PATH" ] && [ -n "$DMG_PATH" ]; then
              echo "  ✅ Build artifacts created"
          else
              echo "  ❌ ERROR: Build artifacts missing"
              exit 1
          fi

      - name: Extract version and find build artifacts
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/apps/web-giddh/package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Package version: $PACKAGE_VERSION"

          ZIP_FILE=$(find dist/apps/electrongiddh-packages -name "*.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
              echo "❌ ERROR: No ZIP found"
              exit 1
          fi
          echo "UNSIGNED_ZIP=$ZIP_FILE" >> $GITHUB_ENV

          DMG_FILE=$(find dist/apps/electrongiddh-packages -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
              echo "❌ ERROR: No DMG found"
              exit 1
          fi
          echo "UNSIGNED_DMG=$DMG_FILE" >> $GITHUB_ENV
          
          LATEST_YML=$(find dist/apps/electrongiddh-packages -name "latest-mac.yml" -type f | head -n 1)
          if [ -n "$LATEST_YML" ]; then
              echo "LATEST_MAC_YML=$LATEST_YML" >> $GITHUB_ENV
          fi
          
          echo "VERSIONED_ZIP_NAME=$(basename "$ZIP_FILE")" >> $GITHUB_ENV
          echo "VERSIONED_DMG_NAME=$(basename "$DMG_FILE")" >> $GITHUB_ENV
          echo "✅ Artifacts located"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload ZIP and DMG to S3
        shell: bash
        run: |
          VERSION="${{ env.PACKAGE_VERSION }}"
          BUCKET="${{ env.S3_BUCKET }}"
          ZIP_FILE="${{ env.UNSIGNED_ZIP }}"
          DMG_FILE="${{ env.UNSIGNED_DMG }}"
          PREFIX="${{ env.S3_PATH_PREFIX }}"
          
          echo "📤 Uploading to S3 (${{ env.BUILD_ENV }})..."
          
          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$PREFIX/mac/$VERSION/${{ env.VERSIONED_ZIP_NAME }}" \
            --content-type "application/zip" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$VERSION,platform=macos,arch=universal,signed=true"
          echo "✅ Uploaded: $PREFIX/mac/$VERSION/${{ env.VERSIONED_ZIP_NAME }}"
          
          aws s3 cp "$DMG_FILE" "s3://$BUCKET/$PREFIX/mac/$VERSION/${{ env.VERSIONED_DMG_NAME }}" \
            --content-type "application/x-apple-diskimage" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$VERSION,platform=macos,arch=universal,signed=true"
          echo "✅ Uploaded: $PREFIX/mac/$VERSION/${{ env.VERSIONED_DMG_NAME }}"
          
          if [ "${{ env.UPLOAD_LATEST }}" = "true" ]; then
            aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$PREFIX/mac/latest/${{ env.LATEST_ZIP_NAME }}" \
              --content-type "application/zip" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --metadata "version=$VERSION,platform=macos,arch=universal,signed=true"
            echo "✅ Uploaded: $PREFIX/mac/latest/${{ env.LATEST_ZIP_NAME }}"
            
            aws s3 cp "$DMG_FILE" "s3://$BUCKET/$PREFIX/mac/latest/${{ env.LATEST_DMG_NAME }}" \
              --content-type "application/x-apple-diskimage" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --metadata "version=$VERSION,platform=macos,arch=universal,signed=true"
            echo "✅ Uploaded: $PREFIX/mac/latest/${{ env.LATEST_DMG_NAME }}"
          fi

      - name: Upload latest-mac.yml to S3
        if: env.LATEST_MAC_YML != ''
        shell: bash
        run: |
          VERSION="${{ env.PACKAGE_VERSION }}"
          BUCKET="${{ env.S3_BUCKET }}"
          YML_FILE="${{ env.LATEST_MAC_YML }}"
          PREFIX="${{ env.S3_PATH_PREFIX }}"
          
          echo "📤 Uploading latest-mac.yml..."
          
          aws s3 cp "$YML_FILE" "s3://$BUCKET/$PREFIX/mac/$VERSION/latest-mac.yml" \
            --content-type "text/yaml" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata "version=$VERSION,platform=macos"
          echo "✅ Uploaded: $PREFIX/mac/$VERSION/latest-mac.yml"
          
          if [ "${{ env.UPLOAD_LATEST }}" = "true" ]; then
            YML_CONTENT=$(cat "$YML_FILE")
            
            # Replace versioned filenames with environment-specific fixed names
            if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip/giddh.zip/g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|path: giddh.zip|g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|url: giddh.zip|g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg/giddh-setup.dmg/g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|path: giddh-setup.dmg|g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|url: giddh-setup.dmg|g')
            else
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip/giddh-test.zip/g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|path: giddh-test.zip|g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.zip|url: giddh-test.zip|g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's/giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg/giddh-test-setup.dmg/g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|path: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|path: giddh-test-setup.dmg|g')
              YML_CONTENT=$(echo "$YML_CONTENT" | sed -E 's|url: giddh-test-setup-[0-9]+\.[0-9]+\.[0-9]+\.dmg|url: giddh-test-setup.dmg|g')
            fi
            
            MODIFIED_YML="/tmp/latest-mac-modified.yml"
            echo "$YML_CONTENT" > "$MODIFIED_YML"
            
            aws s3 cp "$MODIFIED_YML" "s3://$BUCKET/$PREFIX/mac/latest/latest-mac.yml" \
              --content-type "text/yaml" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --metadata "version=$VERSION,platform=macos"
            echo "✅ Uploaded: $PREFIX/mac/latest/latest-mac.yml"
          fi

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo "macOS BUILD SUMMARY (${{ env.BUILD_ENV }})"
          echo "========================================="
          echo "Version: ${{ env.PACKAGE_VERSION }}"
          echo "Environment: ${{ env.BUILD_ENV }}"
          echo "S3 Path: ${{ env.S3_PATH_PREFIX }}/mac/"
          echo "Architecture: Universal (Intel + Apple Silicon)"
          echo "Signing: Developer ID + Notarization"
          echo "========================================="
          echo "Versioned:"
          echo "  ZIP: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_ZIP_NAME }}"
          echo "  DMG: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/${{ env.PACKAGE_VERSION }}/${{ env.VERSIONED_DMG_NAME }}"
          echo "Latest:"
          echo "  ZIP: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/latest/${{ env.LATEST_ZIP_NAME }}"
          echo "  DMG: https://s3-${{ env.AWS_REGION }}.amazonaws.com/${{ env.S3_BUCKET }}/${{ env.S3_PATH_PREFIX }}/mac/latest/${{ env.LATEST_DMG_NAME }}"
          echo "=========================================="
